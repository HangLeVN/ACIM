 bằng con mắt Nhất thể, từ tình yêu và sự bao dung, để hiểu rằng: mình chưa từng tách rời khỏi Đấng Sáng Tạo, và Ngài cũng chưa từng trừng phạt hay rời bỏ mình.\nHình ảnh có thể giúp bạn dễ hiểu hơn:\nHãy tưởng tượng Đấng Sáng Tạo như một người cha/mẹ vô cùng yêu thương, không giận dữ, không trừng phạt, không ép buộc.\nNgài biết rằng bạn đang tự học qua trải nghiệm, và luôn kiên nhẫn chờ bạn quay về, bất kể bạn đi lạc bao xa, mắc lỗi bao nhiêu lần.\nBài học cuộc đời không phải để bạn thấy mình “tệ” rồi tìm cách sửa, mà là để bạn nhận ra ánh sáng bên trong chưa bao giờ tắt, và chọn quay về lại với chính mình: về Nhà.\nCác bài tập 91-100 nó chỉ mang một thông điệp về Nhất thể, nếu mọi người thấy khó nhớ nội dung, chỉ cần nhớ rằng “mình là Một với tất cả”, những nội dung/câu khẳng định khác chỉ là bổ trợ cho điều này, nên không cần căng thẳng nếu không nhớ nội dung các bạn nhé Sau bài 100 sẽ dễ hơn.\nHƯỚNG DẪN THỰC HÀNH:\nVới bài tập này, câu thực hành của chúng ta là: “Sự cứu rỗi là chức năng duy nhất của tôi tại nơi đây. Đấng Sáng Tạo vẫn ở đó đầy tình yêu thương”.\nLặp lại càng nhiều càng tốt."}, {"n": 100, "t": "Vai trò của tôi là cốt yếu trong kế hoạch cứu rỗi của Đấng sáng tạo.", "s": "My part is essential to God's plan for salvation.", "d": "Bài tập này nối tiếp nội dung của 2 bài tập trước. Bạn đóng vai trò cốt yếu để đưa thế giới thoát khổ - chỉ bằng mỗi lần bạn hoà vào Nhất thể. Ngay khoảnh khắc bạn bình an, thả lỏng, tự nhủ “Tôi là Một với tất cả.” bạn sẽ không thể hình dung được điều này đóng góp lớn lao thế nào cho bình an của cả thế giới.\nThực hành:\nBài tập hôm nay thực hành đơn giản bằng cách: thả lỏng, mỉm cười, bạn có thể nhắm mắt hoặc không, tự nhủ “Tôi là Một với tất cả”. 10-15 phút ngồi tĩnh lặng đầu ngày và nhiều lần thực hành ngắn trong ngày, cảm nhận sự an yên lan toả từ bạn ra bên ngoài nhé."}, {"n": 101, "t": "Hạnh phúc trọn vẹn của tôi là Ý Trời.", "s": "God's Will for me is perfect happiness.", "d": "ACIM dùng từ gốc là “God’s Will” được viết hoa - Tôi có hạnh phúc trọn vẹn chính là Ý Trời/ Ý Chúa/ Ý của Đấng sáng tạo.\nTội lỗi và khổ hạnh không thể đi cùng hạnh phúc trọn vẹn, nhưng chúng ta cứ ám ảnh mãi về những lỗi lầm mình cần trả giá, những đớn đau mình cần chịu đựng… rồi mới có thể hạnh phúc trọn vẹn. Đó là một cách đi sai lầm, chưa có ai đi con đường đó mà thành công.\nNgay bây giờ, ngay khoảnh khắc này, hãy tin rằng bạn không có tội lỗi hay phải chịu bất cứ hình phạt nào. Hạnh phúc trọn vẹn của bạn là Ý Trời.\nĐể thực hành bài tập này, hãy dành 10-15 phút thiền đầu ngày và lặp lại nhiều lần trong ngày với chủ đề của bài tập: “Hạnh phúc trọn vẹn của tôi là Ý Trời.”"}, {"n": 102, "t": "Tôi nương theo Ý Trời để tận hưởng hạnh phúc trọn vẹn.", "s": "", "d": "“I share God's Will for happiness for me.”\nDiễn giải: Hãy tưởng tượng có hai con đường:\nMột con đường ta từng nghĩ là “đúng”: chịu khổ để được yêu, được chấp nhận, để chứng minh mình tốt.\nMột con đường khác: hạnh phúc là con đường bạn nghiễm nhiên được sinh ra để sống.\nNgày hôm nay là một ngã rẽ.\nTa lựa chọn rời khỏi con đường cũ, và chọn một con đường mới:nơi ta không cần đánh đổi gì để được hạnh phúc.\nta  không cần hy sinh, không cần chứng minh, không cần chịu đựng.\nBởi vốn dĩ  Ý Trời đã là vậy rồi.\n“Tôi nương theo Ý Trời để tận hưởng hạnh phúc trọn vẹn” nghĩa là:\nTôi không còn tìm kiếm, kiểm soát hay chống lại nữa. Tôi chọn buông để cho dòng chảy yêu thương đưa tôi về lại Nhà.\nNơi ấy, tôi không phải cố gắng trở thành ai, mà chỉ cần cho phép mình là chính mình: trong an yên và vui tươi.\nThực hành:\nDành thời gian ngồi tĩnh lặng vài phút và nhắc lại nhiều lần trong ngày: “Hạnh phúc trọn vẹn của tôi là Ý Trời. Tôi nương theo Ý Trời để tận hưởng hạnh phúc trọn vẹn.”\nMình đã rẽ vào con đường mới 3-4 năm nay. Và mình xin lấy bản thân làm bằng chứng: 3-4 năm nay mọi thứ quanh mình càng ngày càng trọn vẹn. Tuyệt vời vô cùng ấy."}, {"n": 103, "t": "Đấng sáng tạo, Tình yêu và Hạnh phúc là Một.", "s": "God, being Love, is also happiness.", "d": "Chúng ta luôn lo lắng có một thế lực nào đó trên kia đang đánh giá chúng ta, không hài lòng với chúng ta, bắt chúng ta chịu tội hay trả giá… Nhưng sự thật là Thượng đế/Đấng sáng tạo yêu thương chúng ta vô điều kiện, ở Đấng sáng tạo chỉ có tình yêu. Và Tình yêu và Hạnh phúc là 2 thứ không tách rời.\nHôm nay, hãy ngồi tĩnh lặng dài 10-20 phút đầu ngày và lặp lại nhiều lần trong ngày nội dung: “Đấng sáng tạo, Tình yêu và Hạnh phúc là một. Sợ hãi Thượng đế/ Đấng sáng tạo là sợ hãi niềm vui.”\nLuôn ghi nhớ rằng bạn được “chống lưng” bởi một thế lực rất lớn “trên kia” trong bất kỳ hoàn cảnh nào. Vì vậy hãy yêu và vui sống."}, {"n": 104, "t": "Tôi tìm kiếm những gì thuộc về tôi.", "s": "", "d": "“I seek but what belongs to me in truth.\"\n“Tôi tìm kiếm những gì thuộc về tôi. Niềm vui và bình an là điều tôi được kế thừa từ Đấng sáng tạo.”\n- Đây sẽ là câu bạn lặp lại 5 phút mỗi giờ trong ngày thực hành này khi nhắm mắt và hướng vào bên trong (hoặc ít nhất hãy lặp lại trong mỗi giờ).\nNiềm vui và bình an không ở đâu xa vời, nó ở ngay trong chính bạn và vẫn mãi luôn ở đó. Niềm vui và bình an là món quà Đấng sáng tạo trao cho bạn từ khi bạn được tạo ra. Hôm nay, hãy quay vào bên trong và cảm nhận món quà này.\nTạm dẹp hết sang một bên những vấn đề hay xung đột của thế giới bên ngoài, 5 phút mỗi tiếng, hãy cho phép mình tận hưởng món quà mà bạn đang tìm kiếm bấy lâu."}, {"n": 105, "t": "Bình an và niềm vui của Đấng sáng tạo cũng là của tôi.", "s": "", "d": "\"God’s peace and joy are mine.”\nDiễn giải:\nHôm nay, chúng ta sẽ chấp nhận điều này vì đó là quyền tự nhiên của chúng ta.\nChúng ta cũng sẽ học một điều: những món quà thiêng liêng như bình an và niềm vui càng được trao đi thì càng lớn lên, hoàn toàn khác với các món quà thế gian, vốn thường là kiểu “ai được thì người kia mất”.\nNhững món quà của bản ngã luôn đi kèm điều kiện, mang ý nghĩa như khoản vay có lãi và như vậy không thật sự là “tặng”.\nCòn món quà từ Thượng Đế là vô điều kiện, không mất mát, không ai phải hi sinh để người khác được hưởng.\nMỗi lần bạn thật sự không toan tính mà cho đi bình an và niềm vui, lúc ấy bạn thật sự đang mở cửa nhận lại chúng.\nKhi bạn chúc phúc cho người khác, cũng là lúc đang ban phước cho chính mình (đây là một sự thật hiển nhiên, không có bất kỳ nguyên do, lý giải nào cả, đến lúc đó, tự nhiên bạn sẽ cảm nhận được).\nThực hành:\nCách thực hành hôm nay sẽ khác mọi khi một chút. Hãy bắt đầu bằng việc nhớ đến ai đó hay điều gì đó đã/đang khiến bạn không vui (không cần nhớ quá chi tiết, chỉ cần nhắc đến), với mỗi sự việc, bạn nãy tự nhủ “Bình an và niềm vui của Đấng sáng tạo cũng là của tôi.”\nTrong ngày, mỗi khi bạn có thể, dành 5 phút để tự nhủ nội dung chủ đề này. Hoặc mỗi khi có điều gì hay ai đó khiến bạn không hài lòng, hãy cứ nhớ rằng bình an và niềm vui đã ở bên trong bạn rồi, hãy tự nhủ: “Bình an và niềm vui của Đấng sáng tạo cũng là của tôi.”\nGhi nhớ hôm nay:\nBao dung, tha thứ là chìa khóa giúp bạn mở cửa bình an.\nKhi bạn chúc phúc cho người khác, bạn đang mời bình an và niềm vui đến trong chính mình.\nMỗi lần bạn trao đi điều tốt đẹp một cách không tính toán, chắc chắn Thượng Đế luôn trao lại cho bạn món quà rộng lớn gấp nhiều lần."}, {"n": 106, "t": "Hãy để con tĩnh lặng và lắng nghe Sự Thật.", "s": "", "d": "“Let me be still and listen to the truth\".\nBạn có để ý không?\nThế giới ồn ào không ngừng.\n • Bản ngã cứ thì thầm (hoặc gào lên): “Mày chưa đủ tốt…”, “Phải làm thêm cái này nữa…”, “Phải kiếm cho được cái kia mới xứng đáng…”\nNhưng tiếng nói Sự Thật (tiếng nói của Thượng Đế) thì không bao giờ ầm ĩ như vậy\nNgài thì thầm nhẹ nhàng, và ai tĩnh lặng sẽ nghe được.\nBài học hôm nay mời bạn bước vào sự tĩnh lặng đó, lùi khỏi dòng suy nghĩ không ngừng trong đầu để nghe được điều THẬT SỰ quan trọng nhen.\nHướng dẫn thực hành\nA. Thực hành 5 phút mỗi giờ\n 1. Ngồi yên, tay đặt lên tim, hít thở sâu vài nhịp.\n 2. Lặp lại trong tâm:\n“Hãy để con tĩnh lặng và lắng nghe Sự Thật.”\n 3. Rồi đơn giản là ngồi yên. Không mong đợi gì. Không cần “nghe thấy” điều gì to lớn.\nChỉ đơn giản ngồi yên và biết rằng Sự Thật sẽ tự đến.\nB. Khi cảm thấy hoang mang, sợ hãi, mệt mỏi, mất phương hướng…\n • Hãy đứng yên một lát.\n • Tự nhủ nhẹ nhàng:\n“Con sẽ không cần chạy theo cái gì nữa. Hãy để con tĩnh lặng và lắng nghe Sự Thật.”\nC. Tặng bình an cho người khác\nBài học này không chỉ để bạn lắng nghe mà còn để bạn trở thành kênh truyền tải Sự Thật.\n • Mỗi khi bạn gặp ai đó hôm nay hãy lắng nghe họ bằng trái tim.\n • Và trong tâm, thì thầm:\n“Nguyện bạn cũng lắng nghe được Tiếng Nói Bình An nơi chính bạn.”\nGhi nhớ hôm nay\n • Bạn không cần “cố gắng” nghe chỉ cần tĩnh lặng.\n • Khi bạn yên lặng thật sự, Sự Thật sẽ đến.\n • Lời của bạn hôm nay là đường dẫn của Thượng Đế để mang lại bình an cho người khác.\n • Sự tĩnh lặng là con đường dẫn bạn về Nhà.\nBạn là đường dẫn của Thượng Đế: mỗi lời của bạn nói ra hãy mang thông điệp của Thượng Đế. Là sự thật, mang lại niềm vui và trao tình thương bao dung."}, {"n": 107, "t": "SỰ THẬT SẼ THAY THẾ MỌI HIỂU LẦM TRONG TÂM TRÍ TÔI", "s": "", "d": "“Truth will correct all errors in my mind.”\nTrong bài học hôm nay, chúng ta được nhắc rằng:\n • Mọi sai lầm, lo lắng, tổn thương, nỗi sợ… đều chỉ là ảo tưởng, xuất phát từ niềm tin sai lầm về sự chia tách khỏi Nguồn.\n • Sự thật không đến để tranh cãi với ảo tưởng. Nó chỉ đến và ánh sáng của nó khiến mọi sai lầm tan biến tự nhiên, như mặt trời lên khiến bóng tối biến mất.\n • Bạn không cần cố gắng sửa sai bằng cách tự trừng phạt mình. Bạn chỉ cần lặng lại và để sự thật làm điều đó.\n • Và sự thật không đâu xa, nó đang ở trong bạn, luôn có sẵn, chỉ cần bạn buông xuống tiếng nói sợ hãi, giận dữ, phán xét… và lắng nghe.\nMỗi giờ, hãy thì thầm:\n“Sự thật sẽ thay thế mọi hiểu lầm trong tâm trí tôi.”\n • Nếu bạn gặp ai đó khiến bạn khó chịu, hoặc có suy nghĩ tiêu cực trỗi lên, hãy dừng lại 5 giây và nhắc lại điều này. Đó là bạn đang mở cửa cho ánh sáng bước vào.\nMột nụ cười, một ánh mắt đầy thấu hiểu, một ý nghĩ chúc lành gửi đến ai đó, ngay khi bạn làm điều đó, tâm trí bạn được thanh lọc: và liên tục như thế hệ thần kinh của bạn dần khớp với tần số của bình an, đủ đầy, yêu thương..."}, {"n": 108, "t": "Cho và nhận là Một trong SỰ THẬT.", "s": "", "d": "“To give and to receive are one in truth.”\nDiễn giải: Nếu ta nhìn cuộc sống bằng con mắt Nhị nguyên, mọi thứ đều có 2 mặt đối lập. Nhưng khi đã quay về với Nhất thể, tất cả chỉ là Một mà thôi. Cho đi và Nhận lại cũng vậy. Dưới ánh sáng của Đấng sáng tạo, mọi thứ đều là Một và đều là ánh sáng.\n“Cho và nhận là Một” bởi vì trong thế giới \"THẬT\", nơi không còn chia tách - mọi sự cho đi đều là một hành động nhận lại. Điều này nghe có vẻ nghịch lý theo logic thường, nhưng lại vô cùng rõ ràng khi bạn cảm nhận nó bằng trái tim và cảm nghiệm nội tâm bạn nhé.\n-\n1. Bởi vì thực tế không có khoảng cách giữa “tôi” và “bạn”\nTrong tâm thức nhị nguyên, ta thấy mình tách biệt với người khác: “Tôi cho bạn nhận”. Nhưng trong tâm thức Nhất Thể, không có “tôi riêng lẻ,  không có “bạn ở ngoài kia”: chỉ có Một Ý thức đang biểu hiện trong nhiều hình hài.\n→ Vì thế, mỗi khi tôi cho bạn một điều tốt đẹp, chính siêu thức của tôi đang cảm nhận điều ấy trong mình.\n2. Bởi vì trạng thái nội tâm của bạn khi cho đi chính là phần thưởng bạn nhận được\nKhi bạn thật sự trao đi một lời chúc lành, một sự tha thứ, một cái ôm chân thành…\n• Bạn mở lòng ra và chính trong khoảnh khắc ấy, bạn được bao phủ bởi bình an và ĐỦ ĐẦY.\n• Bạn trao sự chữa lành và bạn cảm nhận mình cũng đang được chữa lành.\n→ Đó là sự đón nhận tức thì, không cần đợi người khác hồi đáp.\n3. Bởi vì bạn chỉ có thể cho đi điều bạn đã có sẵn\n• Bạn không thể cho đi tình yêu nếu bên trong bạn không có tình yêu.\n• Khi bạn thật sự cho đi sự dịu dàng không toan tính, là vì bạn đã kết nối được với phần dịu dàng bên trong chính mình.\n• Khi bạn thật sự cho đi vật chất vô điều kiện, là khi bạn tin sâu sắc mình có dư dả.\n→ Khi cho đi, tiềm thức bạn cũng đang được nhắc nhớ và khắc sâu “Tôi vốn đã đủ đầy.”\n4. Vì theo luật Vũ Trụ năng lượng bạn trao đi luôn quay trở lại\nĐây là luật của Tâm thức:\n“Bạn nhận được đúng năng lượng mà bạn phát ra là ngay trong giây phút bạn phát đi.”\nMình đã từng lấy ví dụ 2 chiếc lá và 1 bông hoa trên cây cổ thụ để thử diễn giải Nhất Thể 1 cách dễ hình dung. bạn có thể liên tưởng ở đây\nKHI BẠN ĐANG CHO ĐI ĐIỀU GÌ ĐÓ VÔ ĐIỀU KIỆN. TỨC LÀ BẠN ĐANG KHẮC SÂU VỚI TIỀM THỨC: TÔI VỐN ĐANG CÓ ĐỦ ĐIỀU NÀY.\nTiềm thức mạnh thế nào, chắc các bạn cũng từng nghe qua...\nHƯỚNG DẪN THỰC HÀNH\nThực hành sâu (2-3 lần/ngày, mỗi lần 5-10 phút)\n1. Bắt đầu bằng cách lặp lại câu khẳng định:\" Ban cho và đón nhận là MỘT trong Sự Thật toàn vẹn.\nTôi đang đón nhận điều tôi đang ban tặng ngay lúc này.”\n2. Nhắm mắt lại, hít thở sâu. Hình dung bạn đang lan tỏa:\n• Sự bình yên đến mọi người xung quanh.\n• Lòng dịu dàng cho một người cụ thể.\n• Lòng biết ơn đến những người bạn từng oán trách.\n• Năng lượng chúc lành may mắn, sức khoẻ, thịnh vượng...\n3. Sau mỗi điều bạn “cho đi”, hãy dừng lại và cho phép mình cảm nhận sự bình an trở lại trong bạn.\n“Tôi đang nhận lại đúng điều tôi vừa ban đi.”\nThực hành ngắn trong ngày:\n• Bất cứ lúc nào bạn cảm thấy bất an, hãy thầm nói: \"Ban cho và đón nhận là MỘT trong Sự Thật toàn vẹn.\"\n• Khi ai đó làm bạn khó chịu: “Tôi ban tặng bạn lời chúc bình an, để chính tôi được bình an.”\n• Trước một quyết định, hãy nghĩ: “Tôi trao đi sự rõ ràng, để nhận về sự rõ ràng.”\nHôm nay, hãy làm phép thử:\nTrao đi sự dịu dàng, chúc lành… và nhìn xem điều gì quay lại nhé"}, {"n": 109, "t": "Tôi nương tựa nơi Đấng sáng tạo.", "s": "I rest in God.", "d": "Hôm nay, chúng ta để mình nghỉ ngơi và tĩnh lặng, không bị lay chuyển bởi thế giới bên ngoài, không bị tác động bởi những hỗn mang hay xung đột.\n“Tôi nương tựa nơi Đấng sáng tạo.”\nĐây là thực hành đưa bạn trở về với Nguồn: nơi mà không gian, thời gian, bão tố, mất mát hay tổn thương đều dừng lại. Ở nơi đây, không có đau đớn nào mà không thể chữa lành, không có vấn đề nào mà không thể giải quyết.\nHôm nay là ngày bạn thực hành nghỉ ngơi, cứ để kệ thế giới bất ổn, bởi bạn mới là phần còn lại của sự thật, sự thật về Nhất thể. Mỗi giờ hãy dành ra ít nhất 5 phút, đơn giản là nghỉ ngơi, nhắm mắt lại, hít thở “Tôi nương tựa nơi Đấng sáng tạo.”\nĐồng thời, mỗi lần bạn thực hành nghỉ ngơi, hãy khởi lên một lời mời trong tâm rằng: “Tôi ngỏ lời mời tất cả những người tôi biết và tôi chưa biết, tất cả mọi người trên thế giới này cùng nghỉ ngơi với tôi.”\nHãy cảm nhận sự bình an, cảm nhận bạn được sạc đầy sức sống và tình yêu với mỗi lần nghỉ ngơi của bạn."}, {"n": 110, "t": "Tôi trọn vẹn như khi Đấng sáng tạo sinh ra tôi.", "s": "I am as God created me", "d": "Một lần nữa thông điệp này được nhắc lại: Bạn vẫn trọn vẹn như vậy, linh hồn bạn vẫn trọn vẹn như vậy, như khi bạn được Đấng sáng tạo sinh ra.\nTrái với những gì chúng ta vẫn tin rằng mình đầy tổn thương, tội lỗi, kém cỏi như hình ảnh tâm trí phóng chiếu, bản chất của chúng ta vẫn trọn vẹn. Bài tập hôm nay nhắc chúng ta hãy nhớ lại sự trọn vẹn đó.\nĐây là Là câu thần chú mạnh mẽ nhất trong mọi bài học.\nNếu bạn thực sự tin điều này là sự thật:\n • Bạn sẽ không còn sợ hãi.\n • Bạn sẽ không thấy mình “thiếu sót, hư hỏng hay cần phải sửa chữa.”\n • Bạn sẽ không còn cần phải gồng lên để “trở thành ai đó tốt hơn.”\nBởi vì:\nBạn vốn dĩ đã luôn đủ đầy, trọn vẹn, thiêng liêng, từ khoảnh khắc đầu tiên mà Đấng Tạo Hóa \"tạo nên\" bạn.\nNgồi tĩnh tâm 10-20 phút đầu ngày và nhắc lại nhiều lần trong ngày câu chủ đề của bài tập: “Tôi trọn vẹn như khi Đấng sáng tạo sinh ra tôi.”"}, {"n": 111, "t": "Ôn tập bài 91-92", "s": "", "d": "91. Những điều kỳ diệu sẽ được nhìn thấy khi có ánh sáng.\n92. Những điều kỳ diệu sẽ được nhìn thấy khi có ánh sáng, và ánh sáng với sức mạnh là một.\nTrước hết, chúng ta hãy quay lại tin nhắn cũ để nghe phần giải thích về 2 bài tập này.\nPhần thực hành kết hợp của 2 bài tập này: Hình dung bạn là ánh sáng và người khác cũng vậy (có thể hình tượng hoá: chúng ta và những người khác là những quả cầu ánh sáng). Bạn không nhất thiết phải nhìn thấy ánh sáng này bởi nó không nhìn bằng mắt thường, bạn chỉ cần biết vậy và tin vậy là được.\nĐầu ngày hãy ngồi tĩnh lặng 10-20 phút và trong ngày lặp lại nhiều lần:\n“Tôi không chỉ giới hạn trong cơ thể này, tôi lớn lao hơn thế.\nTôi là một phần của Đấng sáng tạo và đồng sáng tạo nên thế giới này.\nTôi không yếu đuối, tôi đầy quyền năng.\nTôi không bị giới hạn, tôi là vô hạn.\nTôi không nghi ngờ, tôi chắc chắn.\nTôi không phải là một ảo ảnh, tôi là sự thật.\nTôi không ở trong bóng tối, tôi là ánh sáng.”\nNguyện cho tôi thấy được ánh sáng trong tôi và bạn cũng vậy.”"}, {"n": 112, "t": "Ôn tập bài 93-94", "s": "", "d": "93. Ánh sáng, niềm vui và bình an ngụ tại nơi tôi.\n94. Tôi vẫn là thế, như khi Đấng sáng tạo sinh ra tôi."}, {"n": 113, "t": "Ôn tập bài 95-96", "s": "", "d": "95. Tôi là Nhất thể, tôi hợp nhất với Đấng sáng tạo.\n96. Sự cứu rỗi đến từ Nhất thể.\nTôi là một với tất cả.\nTôi là một với cái... này\nTôi là một với [người này]\n..."}, {"n": 114, "t": "Ôn tập bài 97-98", "s": "", "d": "97.Tôi là Thần Trí Thiêng Liêng.\n“I am Spirit.”\n98. Tôi chấp nhận vai trò của mình trong kế hoạch cứu rỗi của Đấng sáng tạo.\n“I will accept my part in God’s plan for salvation”"}, {"n": 115, "t": "Ôn tập bài 99-100", "s": "Salvation is my only function here\":", "d": "99. Sự cứu rỗi là chức năng duy nhất của tôi tại nơi đây.\n100. Vai trò của tôi là cốt yếu trong kế hoạch cứu rỗi của Đấng sáng tạo.\n\"My part is essential to God's plan for salvation.\""}, {"n": 116, "t": "Ôn tập bài 101-102", "s": "", "d": "101. Hạnh phúc trọn vẹn của tôi là Ý Trời.\n102. Tôi nương theo Ý Trời để tận hưởng hạnh phúc trọn vẹn."}, {"n": 117, "t": "Ôn tập bài 103-104", "s": "God, being Love, is also happiness.", "d": "103.  Đấng sáng tạo, Tình yêu và Hạnh phúc là Một.\n104. Tôi tìm kiếm những gì thuộc về tôi.\n“I seek but what belongs to me in truth.\""}, {"n": 118, "t": "Ôn tập bài 105-106", "s": "", "d": "105. Bình an và niềm vui của Đấng sáng tạo cũng là của tôi.\n106. Hãy để con tĩnh lặng để lắng nghe Sự thật."}, {"n": 119, "t": "Ôn tập bài 107-108", "s": "", "d": "107. Sự thật sẽ thay thế những hiểu lầm trong tâm trí tôi.\n108. Cho và nhận là Một trong sự thật."}, {"n": 120, "t": "Ôn tập bài 109-110", "s": "", "d": "109. Tôi nương tựa nơi Đấng sáng tạo.\n110. Tôi trọn vẹn như khi Đấng sáng tạo sinh ra tôi."}, {"n": 121, "t": "Bao dung là chìa khoá của hạnh phúc", "s": "", "d": "“Forgiveness is the key to happiness”\nDiễn giải:\nchắc bạn đã từng nghe câu này: \"Giận dữ giống như việc bạn uống thuốc độc và mong người kia sẽ chết.\"\nĐây là 1 câu diễn giải rất thú vị nội dung bài tập hôm nay.\nKhi ta vẫn không bao dung, ta trách móc oán giận 1 người, thì chính ta sẽ bị thuốc độc cảm xúc đầu độc mình đầu tiên.\n=> đây không phải lời doạ suông, đây là khoa học.\nẨn dưới lớp hành vi không dễ thương của ai đó thực ra là một thông điệp của 1 người đang khổ sở, đang khao khát được yêu, được để tâm.\nBao dung là ánh sáng giúp bạn nhìn xuyên qua “cái tôi tổn thương” và thấy phần linh hồn đẹp đẽ và thiêng liêng trong mỗi con người.\n=> Đây chính là chìa khoá để bạn có hạnh phúc.\nĐôi khi ta lầm tưởng khi ta có tiền bạc, sắc đẹp, danh vọng, địa vị... thì ta sẽ hạnh phúc nhưng không đâu các bạn ạ.\nChúng chỉ là công cụ để con đường hạnh phúc có thể (có thể) sẽ trơn tru hơn chút thôi. Chúng không phải đích đến đâu.\nThậm chí nếu bạn lầm tưởng coi chúng là đích đến thì dần dần bạn bị nó nuốt chửng hồi nào không hay.\nBao dung: là tha thứ cho ai đó. Bao dung cũng là dung chứa sự khác biệt.\nĐây là chìa khoá của hạnh phúc.\nHướng dẫn thực hành:\nBao dung – chìa khóa của hạnh phúc\nBước 1: Gọi tên người cần bạn thực hành cùng\nHôm nay, hãy nghĩ về một người khiến bạn khó chịu – dù chỉ một chút.\nĐó có thể là người bạn vừa tiếp xúc, hoặc một người bất chợt hiện lên trong tâm trí.\nCường độ cảm xúc không quan trọng. Một khi họ xuất hiện trong ý nghĩ, đó chính là cơ hội để bạn thực hành bao dung.\nĐôi khi, người ấy lại chính là người bạn yêu thương – nhưng có khía cạnh nào đó bạn chưa thể chấp nhận.\nĐừng phán xét. Chỉ cần nhận diện và sẵn sàng thực hành.\nBước 2 - Hình dung\nNhắm mắt lại.\nHình dung người đó đang hiện diện trước mặt bạn.\nHãy tưởng tượng một luồng ánh sáng nhẹ nhàng đang bao phủ họ – có thể mờ nhạt lúc đầu, nhưng dần trở nên rõ ràng hơn.\nGiờ hãy để ánh sáng từ trái tim bạn lan tỏa sang họ.\nHãy tưởng tượng ánh sáng hai người giao thoa, hòa quyện – như thể cả hai đang được gột rửa và soi sáng cùng nhau.\nBước 3 Lặp lại lời nhắn sâu sắc này trong tâm trí:\n“Tôi với bạn là Một.\nChúng ta đều từng vô tình làm tổn thương nhau theo cách nào đó.\nGiờ đây, tôi tha thứ cho bạn  và cũng là tha thứ cho chính tôi.\nTôi bao dung với bạn  và cũng là bao dung với chính tôi.\nBởi chúng ta là Một.”\nBạn có thể thực hành với cùng một người trong nhiều ngày, hoặc thay đổi người mỗi lần.\nKhông cần cố thay đổi mối quan hệ , chỉ cần quan sát sự thay đổi trong chính bạn khi bạn thực hành là đủ.\nTrong ngày, bất cứ khi nào bạn thấy mình phản ứng, khó chịu hay rơi vào trạng thái tách biệt, hãy thầm nhắc:\n“Bao dung là chìa khóa của hạnh phúc.Tôi bao dung với thế giới và cũng là bao dung với chính mình.”"}, {"n": 122, "t": "Lòng bao dung mang đến mọi điều tôi mong muốn.", "s": "Forgiveness offers everything I want.", "d": "Bài này mình sẽ ghi âm diễn giải nha\nHướng dẫn thực hành:\nMỗi tiếng 1 lần (hoặc nhiều hơn 1 lần càng tốt) tự nhủ hoặc chat vào group lớp:\n\"Sự bao dung mang đến mọi điều tôi khao khát.\nHôm nay tôi đã nhận những món quà thiêng liêng ấy.\"\nBài tập nâng cao:\nCó thể hơi khó với 1 vài bạn nhưng hãy làm nhé. Yên tâm. Có mình và lớp ở đây để hỗ trợ bạn:\nB1: Lưu vào điện thoại của bạn 1 tấm ảnh của người mà bạn đang có khúc mắc không vui/giận/hận... hoặc người mà bạn thấy mối quan hệ chưa thực sự đủ tốt đẹp như bạn mong muốn.\n(nếu lưu hình mà khó quá thì viết tên họ lên 1 tờ giấy rồi chụp lưu vào máy).\nB2: Viết ra những khúc mắc, những trách hờn... và những điều khác biệt khiến bạn cảm thấy mối quan hệ chưa đủ tốt đẹp như bạn mong muốn.\nHôm nay là phần 1. mai sẽ có phần 2 nha."}, {"n": 123, "t": "Tôi biết ơn vì những món quà Đấng Sáng Tạo đã trao cho tôi", "s": "", "d": "Diễn giải:\n- Bài tập hôm nay là thực hành biết ơn cho chặng đường ACIM của bạn.\nĐầu tiên hãy biết ơn bản thân, chính bạn đã khởi lên mong muốn được hạnh phúc và hài hoà hơn với cuộc sống, yêu thương và bao dung hơn, vì rung động đó mà bạn và ACIM đã gặp nhau.\n-Biết ơn vì vũ trụ sắp đặt để bạn có cuốn sách này, những chỉ dẫn này. Biết ơn vì bạn đã bắt đầu có những kết nối và lắng nghe thấy thông điệp của Đấng sáng tạo (về Nhất thể thông qua ACIM).\n- Biết ơn vì giờ đây bạn đã biết rằng: bao dung chính là chìa khoá của hạnh phúc, bình an và đạt được mọi ước muốn trong đời.\n- Biết ơn vì chính mình đã bền bỉ thực hành, cả những lúc hoang mang, nghi ngờ hay có những điều diễn ra chưa như ý.\nBiết ơn vì bạn đã bao dung hơn với bản thân.\n…\nBạn có thể viết xuống thật nhiều điều bạn thấy biết ơn trong hành trình ACIM từ đầu đến ngày hôm nay.\n-  Trong ngày, hãy sống trong trạng thái biết ơn tất cả.\nNếu có thêm thời gian, bạn hãy ghi nhận những cố gắng và nỗ lực của bản thân trên hành trình phát triển tâm thức của bạn.\nThực hành đơn giản:\nMỗi tiếng ít nhất 1 lần: đặt tay lên trái tim và tự nhủ: Biết ơn bản thân vì đã chọn hành trình này.\nPhần bài tập tiếp nối ngày hôm qua - Nếu ai chưa làm bài hôm qua thì có thể chọn một người mà mình đang không vui để thực hành cũng được.\nBước 1: Viết 3 điều tốt đẹp và đáng ghi nhận gần đây nhất của người bạn chọn ở bài tập ngày hôm qua.\nBước 2: Thực hành bài tập Yêu Thương và Cũng Như Mình Mà Thôi (Theo sách \"Search Inside Your Self\"\nHướng dẫn:\nĐọc các hướng dẫn của bài tập Yêu Thương và Cũng Như Mình Mà Thôi\nthật chậm rãi và ngưng lại những khoảng thật lâu.\nCŨNG NHƯ MÌNH MÀ THÔI VÀ THIỀN YÊU THƯƠNG\nChuẩn bị: Ngồi trong tư thế thoải mái cho phép bạn vừa cảnh giác vừa thư giãn trong cùng một lúc. Bắt đầu với việc để tâm trí nghỉ ngơi trên hơi thở trong hai phút.\nNghĩ về người đó. Hình dung ra người đó. Nếu muốn, bạn có thể sử dụng một tấm hình hoặc một đoạn video về người đó.\nCũng Như Mình Mà Thôi\nGiờ hãy đọc thật chậm rãi hướng dẫn dưới đây cho chính mình nghe, cứ hết một câu lại ngưng lại để suy ngẫm:\nNgười này có một cơ thể và một tâm trí, cũng như mình mà thôi.\nNgười này có các cảm giác, cảm xúc, và suy nghĩ, cũng như mình mà thôi.\nNgười này, vào một lúc nào đó trong cuộc đời, đã từng buồn bã, thất vọng, giận dữ, đau đớn, hay hoang mang, cũng như mình mà thôi.\nNgười này, trong cuộc đời, đã từng trải qua những nỗi đau về thể xác và tinh thần, cũng như mình mà thôi.Người này muốn thoát khỏi đau đớn và khốn khổ, cũng như mình mà thôi.\nNgười này muốn khỏe mạnh và được yêu thương, muốn có những mối quan hệ trọn vẹn, cũng như mình mà thôi.Người này muốn hạnh phúc, cũng như mình mà thôi.\nTôi chúc người này có sức mạnh, có nguồn lực, có sự hỗ trợ về mặt cảm xúc cũng như mặt xã hội để vượt qua những khó khăn trong cuộc đời.Tôi chúc người này được thoát khỏi khổ đau.\nTôi chúc người này hạnh phúc. Vì người này là một con người, cũng như mình mà thôi.\n(Ngưng lại) Giờ tôi chúc tất cả mọi người hạnh phúc. Tôi nguyện cho tất cả đều hạnh phúc.\n(Ngưng dài)\nKết thúc bằng việc để tâm trí nghỉ ngơi trong một phút."}, {"n": 124, "t": "Nguyện cho tôi luôn nhớ rằng: Tôi là Một với Đấng sáng tạo.", "s": "", "d": "“Let me remember I am one with God”\nDiễn giải:\nHôm nay, bài học không chỉ là một câu khẳng định.\nĐó là một lời nhắc sâu sắc:\nTa không hề tách biệt. Ta là Một với Đấng đã tạo nên bạn và với mọi linh hồn ta gặp trong đời.\nKhi cảm thấy cô đơn, lo sợ, gồng lên để kiểm soát – ta đang sống như thể mình là \"một cái tôi tách rời\", là lúc ta quên mất điều này.\nNhưng thực ra, mọi điều ta chạm đến đều được kết nối bằng một dòng ánh sáng thiêng liêng.\nHôm nay, hãy thực hành ghi nhớ điều đó:\nTôi không đơn độc.\nTôi là hiện thân của ánh sáng, của tình yêu, của lòng bao dung.\nHướng dẫn thực hành:\nBài tập hôm nay không mới, nhưng vẫn rất cần thiết cho đến khi chúng ta thực sự tin và cảm nhận được Nhất thể.\n“Nguyện cho tôi luôn nhớ rằng: Tôi là Một với Đấng sáng tạo.\nNguyện cho tôi luôn nhớ rằng: Tôi là Một với thế giới.\nNguyện cho tôi luôn nhớ rằng: Tôi là Một với [một hay nhiều người nào đó].”\nMột cách thực hành khác bạn cũng có thể áp dụng thay thế: “(Nguyện cho tôi luôn nhớ rằng:) Tôi chính là [người đó] và [người đó] chính là tôi.”"}, {"n": 125, "t": "Khi tĩnh lặng, tôi nghe thấy thông điệp của Đấng sáng tạo.", "s": "", "d": "In quiet I receive God’s Word today.\nDiễn giải\nHôm nay, bạn không cần làm thêm điều gì cả. Không cần học thêm điều gì. Không cần hiểu thêm điều gì.\nBạn chỉ cần ngừng lại một chút. Ngừng chạy. Ngừng cố. Vì khi tâm trí bạn tĩnh lặng: Bạn sẽ nghe thấy Lời của Đấng Sáng Tạo.\nVà đó sẽ là điều bạn luôn tìm kiếm.\nBài thực hành hôm nay:\n- Hãy dành ra 3 khoảng thời gian trong ngày, mỗi lần 10 phút, đơn giản là tĩnh lặng. Bạn không cần tìm kiếm thông điệp hay tiếng nói nào, nhắm mắt hay mở mắt tuỳ bạn, hãy cứ thả mình vào sự tĩnh lặng.\nNếu bạn cảm thấy sự nhẹ nhõm, bình an trong lúc thực hành.. là đang đúng đường.\nMỗi giờ trôi qua, dành thêm 1 vài phút tĩnh lặng tuỳ theo hoạt động trong ngày của bạn.\n- Khi bắt đầu thời gian tĩnh lặng mình khuyến khích các bạn gửi tn vào group lớp trước khi bắt đầu: \"Giờ là thời gian tĩnh lặng.\"\nĐây sẽ giống như một lời mời cộng hưởng năng lượng.\n=> những người khác có thể thực hành cùng bằng cách gửi lại tin nhắn đó.\n=> Nếu bạn ko thể thực hành ngay cùng lúc thì gửi niệm lành cho người gửi bằng câu niệm: Thank you I love you."}, {"n": 126, "t": "Những gì tôi trao đi cũng là trao cho chính mình.", "s": "All that I give is given to myself.", "d": "Diễn giải:\nTrạng thái bạn nuôi dưỡng bên trong sẽ định hình thế giới bạn sống:\nMỗi khi bạn trao đi điều gì – không phải người khác là người nhận đầu tiên, mà chính là bạn đang nuôi dưỡng điều đó trong chính bạn.\nTrao đi giận dữ – bạn là người đầu tiên căng thẳng.\nTrao đi sự hiểu nhầm – bạn là người đầu tiên thấy bức bối.\nTrao đi yêu thương – bạn là người đầu tiên cảm thấy bình an.\nVà bạn không thể cho điều gì mà mình không có\nMọi thứ bạn \"cho đi\" đều phải được sinh ra từ bên trong bạn trước:\nBạn không thể trao niềm tin nếu trong lòng mình đầy hoài nghi.\nBạn không thể trao sự tử tế nếu trong bạn chỉ có kháng cự.\nNgược lại, khi bạn trao được, nghĩa là bạn đã có – và đã chọn kích hoạt nó.\nNhư vậy, hành động cho đi chính là hành động tự khẳng định lại bản thể vốn dĩ đủ đầy và thịnh vượng ngay chính bên trong bạn\nTự nhiên mình nhớ tới câu Kinh Thánh rất nổi tiếng: \"Vì phàm ai đã có, thì được cho thêm và sẽ có dư thừa; còn ai không có, thì ngay cái đang có, cũng sẽ bị lấy đi.\""}, {"n": 127, "t": "Không có tình yêu nào ngoài tình yêu của Đấng sáng tạo.", "s": "", "d": "There is no love but God’s.\nDiễn giải:\nChúng ta thường nghĩ sẽ có nhiều kiểu tình yêu, nhiều cấp độ yêu và tình yêu có thể thay đổi tuỳ đối tượng, tuỳ hoàn cảnh, tuỳ thời gian… Nhưng theo ACIM, đó không phải là tình yêu đích thực, đó chỉ là cách chúng ta thoả mãn bản ngã với sự sợ hãi, ích kỷ, lòng tham sở hữu…\nTheo ACIM tình yêu đích thực chỉ có thể có khi chúng ta biết đến Nhất Thể, biết mình là Một với tất cả.\nBởi khi đó, tình yêu không có sự phán xét, so sánh; tình yêu đồng nhất, trọn vẹn và không bao giờ thay đổi. Và tình yêu đó vẫn luôn sẵn có trong bạn.\nHướng dẫn thực hành:\nỞ bài tập trước chúng ta nói rằng trao đi cũng là trao cho chính mình, ở bài tập hôm nay, chúng ta nói rằng yêu người cũng là yêu chính mình. Bởi tất cả là Một.\nDẹp bỏ bất cứ điều gì đã diễn ra trong quá khứ, hôm nay chúng ta thực hành trao đi tình yêu.\nHãy hướng về người mà bạn đang yêu mến, tự nhủ: “Tôi nguyện những điều tốt đẹp nhất dành cho bạn bằng tình yêu của Đấng sáng tạo. Tôi đã học được bài học rằng: không có tình yêu nào ngoài tình yêu của Đấng sáng tạo, cũng là tình yêu của bạn, của tôi và của tất cả mọi người.”\nHướng về người mà bạn cho rằng bạn đã từng yêu và giờ không còn yêu nữa, tự nhủ: “Tôi nguyện những điều tốt đẹp nhất dành cho bạn bằng tình yêu của Đấng sáng tạo. Tôi đã học được bài học rằng: không có tình yêu nào ngoài tình yêu của Đấng sáng tạo, cũng là tình yêu của bạn, của tôi và của tất cả mọi người.”\nCâu thần chú lặp lại trong ngày và gửi nhóm để mời gọi cùng thực hành:\n\"Hôm nay tôi gửi đến bạn mọi điều tốt đẹp bằng tình yêu của Đấng Sáng Tạo.\""}, {"n": 128, "t": "Thế giới tôi đang thấy không có thứ mà tôi muốn.", "s": "The world I see holds nothing that I want.", "d": "Theo ACIM, thế giới bên ngoài là tấm gương phóng chiếu từ tâm trí: nhưng là tâm trí ta đã quên mình là ai.\nKhi ta tin rằng mình thiếu thốn → ta nhìn thế giới đầy cạnh tranh.\nKhi ta tin rằng mình không xứng đáng → ta nhìn đâu cũng thấy bị phán xét.\nKhi ta tin rằng tình yêu phải điều kiện → ta chỉ thấy sự đổi chác trong các mối quan hệ.\nNhư vậy ta đang không thấy thế giới như nó là mà ta thấy nó như tâm trí ta tin là thật.\nThế nên, mọi điều bạn muốn nếu tìm trong thế giới này đều sẽ khiến ta thất vọng.Vì nó chỉ là cái bóng của tâm trí, không phải điều thật.\nNhững điều \"có vẻ như\" đáng giá đều là xiềng xích vô hình\n- Hễ ta càng nghĩ một điều gì \"rất quan trọng\" – ta càng sợ mất nó.\n- Hễ ta càng trân quý điều gì thuộc về thân – ta càng lo lắng thân thể này sẽ bị tổn thương.\n- Hễ ta càng định nghĩa giá trị bản thân bằng điều bên ngoài – ta càng sống trong lo âu, so sánh, căng thẳng và thiếu tự do.\nnếu ta cứ đi tìm mãi thì… chẳng bao giờ thấy đủ cả.\nTrong khi sự thật là thứ ta thật sự muốn đã có sẵn trong ta.\nTa không cần \"kiếm\" bình an, ta chỉ cần nhớ lại rằng mình vốn là bình an.\nTa không cần \"tìm\" tình yêu ta chỉ cần tháo bỏ những lớp hiểu lầm, phòng vệ đã ngăn mình yêu và được yêu.\nThế giới bên ngoài không thể cho ta điều đã luôn ở bên trong.\nMọi con đường dẫn đến tình yêu thật sự  đều quay về bên trong ta.\nTA LÀ CHỦ NHÂN CỦA CUỘC ĐỜI MÌNH\nThực hành ngồi tĩnh lặng 2 lần đầu và cuối ngày, mỗi lần 10-20 phút, và lặp lại nhiều lần trong ngày\n“Thế giới tôi đang thấy (bằng mắt thường) không có thứ mà tôi muốn. Tôi sẽ không để những thứ mà tôi thấy trì hoãn bản thân tôi hướng về Sự thật/ hướng về Nhất thể.”\nDiễn giải:\nNhững gì ta thấy bằng mắt là vật chất hữu hình. Ta hay nhầm tưởng thứ ta muốn là những thứ hữu hình đó. Nhưng như những gì ta đã nói rất sâu trong bài trước đó: Vốn dĩ thứ ta muốn không phải là các vật chất đó mà là gì nào? Hãy kéo lên để đọc lại tin nhắn nha.\nBạn có thể thực hành ngay trong đời sống thường ngày, bằng những cách rất nhẹ nhàng:\n • Khi nhìn một ai đó, hãy tạm quên câu chuyện của họ và chỉ đơn giản tự nhủ:\n“Mình và họ là Một. Trong chúng ta cùng có ánh sáng.”\n • Khi gặp một tình huống khiến bạn khó chịu, hãy tự hỏi:\n“Nếu mình nhìn điều này bằng tình yêu thì sao? Nếu mình tin rằng mọi sự đang xảy ra để giúp mình nhớ lại Bản thể thiêng liêng thì sao?”\n • Khi cảm thấy chưa đủ bình an, hãy quay về với câu khẳng định:\n“Tôi là Một với tất cả. Tôi muốn nhìn thế giới bằng Nhận thức hợp nhất.”"}, {"n": 129, "t": "Vượt trên thế giới này là thế giới mà tôi muốn.", "s": "", "d": "“Beyond this world there is a world I want”\nDiễn giải:\nHôm qua ta đã biết: thế giới mà tôi đang thấy không có thứ mà tôi muốn.\nHôm nay, chúng ta được mời gọi nhìn thế giới không phải bằng đôi mắt thường, mà bằng nhận thức về Nhất thể.\nĐôi mắt thường chỉ cho bạn thấy:\n • Sự tách biệt giữa “tôi” và “bạn”\n • Giữa đúng - sai, hơn - kém, tốt - xâu..\n • Giữa yêu thương và những điều “không đáng để yêu”\nNhưng “thế giới bạn thật sự mong muốn” không thể được nhìn thấy bằng kiểu nhìn như vậy.\nBạn cần một tầng nhận thức khác.\nMột cái nhìn không dựa vào phán xét, mà dựa vào sự hợp nhất sâu thẳm giữa mọi linh hồn.\nVì thế giới bạn thật sự muốn không ở đâu xa mà ở ngay đây, khi bạn nhìn bằng lòng biết ơn và bao dung\nKhông cần cố “vượt ra khỏi thế giới này”.\nChỉ cần tháo lớp kính phán xét, và thế giới bạn thật sự muốn sẽ hiện ra ngay trong thế giới bạn đang ở.\n-Một ánh mắt bạn nhìn với hiểu biết sâu hơn.\n- Một lời nói bạn thốt ra không để sửa người, mà để ôm lấy.\n- Một khoảnh khắc bạn buông xuôi phòng thủ và nhận ra:\n“Chúng ta chưa bao giờ là đối nghịch. Mình và bạn là Một.”\nGợi ý thực hành trong ngày:\n • Mỗi giờ, hãy dừng lại vài giây và tự hỏi:\n“Mình đang nhìn thế giới bằng đôi mắt \"thường\" hay bằng ánh sáng của Nhất thể?”\n • Khi tâm xao động, hãy nhắm mắt lại 1 phút và thầm nói:\n“Tôi là Một với tất cả.\nVượt trên thế giới này là thế giới mà tôi thật sự muốn.\nVà tôi chọn thấy điều đó ngay trong lúc này.”\n Câu bạn có thể nhắc mình cả ngày:\n\"Thế giới tôi thấy không có điều gì tôi thật sự mong muốn.\nNhưng vượt trên nó là một thế giới tôi đã luôn mang trong tim.\nVà hôm nay, tôi chọn nhìn bằng ánh sáng của Nhất thể để thấy thế giới ấy dần hiện ra.\""}, {"n": 130, "t": "Nhìn thấy cả hai thế giới là không thể", "s": "It is impossible to see two worlds.", "d": "Diễn giải:\nChúng ta từng nói về thế giới Nhị Nguyên: nơi mà chúng ta phân biệt cái này thì tốt, cái kia thì xấu; cái này thì đúng/cái kia thì sai. Và đó là nơi mà ta nhìn mọi thứ bằng \"đôi mắt thường\" nên ta thấy mọi thứ tách rời khỏi nhau\nVà chúng ta đang học về thế giới Nhất Thể: nơi mọi thứ là một, nơi mà mọi sự đều có sự liên quan kết nối với nhau;\nnơi mà ta tin tưởng rằng mọi điều xảy ra kể cả dù có vẻ tốt, dù có vẻ xấu thì đều là đang hỗ trợ cho ta theo một cách nào đó mà đôi mắt thường này có thể không nhìn thấy được.\nACIM nói rằng: chúng ta sẽ không thể nhìn lấy hai thế giới này cùng lúc\nHãy chọn 6 thời điểm trong ngày (sáng – trưa – chiều – tối – trước bữa ăn – trước khi ngủ).\nDừng lại. Nhắm mắt. Tĩnh lặng.\nVà lặp lại câu khẳng định này như một lời cam kết từ linh hồn:\n“Nhìn thấy cả hai thế giới là không thể. Tôi quyết định ngừng lại sự nửa vời.\nTôi chọn thế giới của Nhất thể: thế giới của tình yêu, sự hợp nhất và ánh sáng.\nNguyện cho tôi đủ sức mạnh để đi trọn con đường mình đã chọn.”"}, {"n": 131, "t": "Khi một người khởi nguyện được nhìn thấy Sự thật, người đó không thể thất bại", "s": "No one can fail who seeks to reach the truth.", "d": "Hôm nay, chúng ta được mời gọi làm một điều tưởng chừng đơn giản nhưng đầy quyền năng: Khởi tâm nguyện được nhìn thấy Sự thật.\nBạn không thể tìm thấy ánh sáng ở trong bóng tối, nhưng chúng ta vẫn làm như vậy, vẫn muốn tìm kiếm hạnh phúc trong thế giới Nhị nguyên rồi mãi loay hoay, bởi điều này là không thể.\nÁnh sáng đã ở đây, Thiên Đường đã ở đây rồi, chỉ cần bạn đưa tâm thức của mình vượt lên khỏi thế giới Nhị nguyên để trở về Nhất thể bạn sẽ thấy.\nVà một khi bạn đã khởi lên tâm nguyện được nhìn thấy sự thật (Nhất thể), bạn không thể thất bại.\nTHỰC HÀNH – 3 LẦN MỖI NGÀY | MỖI LẦN 5-10 PHÚT\n- Tìm một nơi yên tĩnh, ngồi hoặc nằm thư giãn.\n- Đặt tay lên tim nếu bạn muốn tạo kết nối sâu hơn.\n- Thầm nhắc – như một lời nguyện đơn giản nhưng mạnh mẽ:\n“Nguyện cho tôi được nhìn thấy Sự thật.\nNguyện cho tôi hoà vào Nhất thể.\nMột khi tôi đã khởi nguyện nhìn thấy Sự thật. Tôi chắc chắn thành công.\""}, {"n": 132, "t": "Tôi giải phóng thế giới khỏi tất cả những gì tôi từng nghĩ về nó", "s": "I loose the world from all I thought it was.", "d": "Diễn giải:\nThế giới bạn từng tin là thật với đầy chia cắt, bất công, xung đột và sợ hãi;\nchỉ là kết quả của những niềm tin sai lầm mà bạn vô tình giữ lại trong tâm trí.\nVà giờ đây, cùng với hành trình thực hành ACIM, thế giới đó đang dần “mờ đi” cùng với những tổn thương quá khứ, lo âu tương lai.\nBạn đang bắt đầu nhìn thế giới bằng một lăng kính mới, lăng kính của Nhất thể, của Tình yêu, và Sự thật.\nSự thật hôm nay bạn được nhắc nhớ:\nKhông có thế giới nào ngoài những gì bạn tin là có.\nMọi hình ảnh bạn từng thấy đều được tạo ra từ bên trong.\nNhững niềm tin sai lầm có thể được buông bỏ.\nVà khi bạn buông, bạn không chỉ giải phóng mình, mà còn giải phóng thế giới.\nBước 1: Tự soi chiếu & viết xuống:\nNhững niềm tin nào bạn từng mang về thế giới này, đã giới hạn bạn và giữ bạn trong cảm giác sợ hãi, chia cách?\nVí dụ:\nTôi từng tin thế giới này không công bằng\nTôi từng tin con người chỉ tốt với nhau khi có lợi\nTôi từng tin kẻ mạnh luôn thắng, kẻ yếu luôn bị chèn ép\nTôi từng tin tình yêu luôn đi kèm tổn thương\nTôi từng tin rằng mình phải gồng lên để sống sót ở đây\n...\nBước 2: Dùng bút gạch ngang từng niềm tin đó\nvừa gạch vừa thì thầm tự khẳng định :\n“Tôi giải phóng thế giới khỏi những niềm tin rằng: [đọc các niềm tin bạn đã viết].\nTôi lựa chọn nhìn thấy thực tại về một thế giới hoà hợp, bình an và đầy yêu thương.”"}, {"n": 133, "t": "Tôi sẽ không bám chấp vào những thứ vô thường", "s": "", "d": "“I will not value what is valueless”\nHôm nay, ta quay về để nhắc mình một sự thật quan trọng:\nBất kỳ điều gì không trường tồn đều không phải điều ta thật sự cần bám chấp.\nTheo ACIM, mọi điều không vĩnh cửu  đều là vô giá trị. Nó đến và đi.\nVà chính việc bám chấp vào những điều sẽ rời đi chính là gốc rễ của đau khổ.\nVậy điều gì là trường tồn?\nChỉ có Nhất thể nơi bạn và mọi sự là Một,nơi tình yêu không điều kiện hiện diện,nơi bình an không bị lay chuyển bởi thời gian hay hoàn cảnh mới là điều còn mãi.\nĐó là nơi bạn vốn thuộc về.\nLà điều mà linh hồn bạn luôn khao khát,\ndù trong thế giới này nó thường bị lãng quên.\nCòn vật chất, danh vọng, thành tựu, hình ảnh cá nhân?\nChúng ta không sai khi muốn trải nghiệm, nhưng những điều đó không thể trở thành chỗ dựa.\nNhiều người thấy ACIM là lý thuyết “quá bay” hay xa rời thực tế.\nNhưng chính những thứ vật chất đổi thay từng giờ mới là điều không thực tế,\nvì bạn không thể giữ được chúng dù có cố đến đâu.\nSự thật là: khi ta neo vào Bình an\nmọi thứ khác sẽ tự khắc theo ta. Không phải ngược lại.\nCái tôi tách biệt cũng là một “thứ vô thường”\nNhu cầu “được công nhận”, “được hơn người khác” dù khi mới trải nghiệm nó ta thấy khá thú vị nhưng chỉ càng đưa bạn xa khỏi sự hợp nhất. Càng rời xa Nhất thể.\nMỗi khi ta chọn “tôi là riêng biệt”. Ta lại quên mất rằng “Tôi là Một với tất cả.”\nHôm nay nhẹ nhàng nhắc bản thân:\n“Tôi sẽ không bám chấp vào những thứ vô thường. Những điều trường tồn mới thật sự dành cho tôi.”"}, {"n": 134, "t": "Nguyện cho tôi đón nhận sự bao dung như nó vốn là.", "s": "Let me perceive forgiveness as it is.", "d": "Chúng ta thường hiểu lầm rằng lòng bao dung đòi hỏi sự hy sinh, nhưng thực tế, chúng ta bao dung vì sự bình an của chính mình chứ không vì ai khác.\nTội lỗi và sự chia cắt chỉ là ảo ảnh, còn lòng bao dung sẽ xoá nhoà đi ảo ảnh đó, đưa chúng ta quay trở về với sự thật rằng chúng ta là Một. Khi bao dung với người, với đời, bạn đang bao dung với chính mình.\nHôm nay, một lần nữa chúng ta thực hành sự bao dung và nhấn mạnh rằng đây không phải một sự hy sinh, hay hạ mình, hay nỗ lực… Bao dung rất tự nhiên và nó đã có sẵn trong bạn.\nDành ra 2 khoảng thời gian, mỗi lần 15 phút.\nChọn 1 người (hoặc nhiều hơn nếu bạn muốn) mà bạn thấy mình đang thiếu bao dung với họ, ghi xuống những điều khiến bạn chưa thể bao dung…\nBạn có nhớ bài tập 132 khi chúng ta nói rằng “Tôi giải phóng thế giới khỏi những niềm tin sai lầm của tôi”?\nVới bài tập này, chúng ta sẽ tự nhủ rằng: “Nguyện cho [người này] được giải phóng khỏi những suy nghĩ thiếu bao dung của tôi.”\nTrong ngày, hãy lặp lại câu chủ đề: “Nguyện cho tôi đón nhận sự bao dung như nó vốn là.”"}, {"n": 135, "t": "Nếu tôi phòng thủ, tôi đang bị tấn công", "s": "If I defend myself, I am attacked.", "d": "Diễn giải:\n1. Nghĩ mà xem: tại sao ta cần phòng thủ?\nLà vì, TA TIN LÀ CÓ GÌ ĐÓ ĐANG CHỰC CHỜ TẤN CÔNG TA? đúng chứ?\n👉 Và ai ở đây cũng đều biết, mình tin gì mình sẽ có đó!\nVậy việc liên tục phòng thủ, có nghĩa ta đang liên tục nuôi dưỡng niềm tin: CHẮC CHẮN ĐIỀU ĐÓ SẼ TẤN CÔNG MÌNH.\n2. Khi ta phòng thủ, ta sẽ tự tiêu hao 1 lượng năng lượng lớn để chú ý liên tục đến những điều tiêu cực (nguy cơ).\n👉 Việc này là ta đang tự mình vô thức đánh mất năng lượng của mình\nNgược lại nếu ta TIN là ta an toàn, ta TIN là ta hoà hợp với tất cả, ta TIN là mọi thứ đến với ta đều đang để giúp cho ta thì ta đâu cần phòng thủ để làm gì. Đúng không nào?\nVậy đâu là lối ra?\n💗Tin vui là… bạn không cần cố buông phòng thủ :B .\nBạn chỉ cần nuôi dưỡng lòng biết ơn và bao dung. Khi tâm bạn mềm lại, khi trái tim bạn rộng hơn, tự nhiên rào chắn sẽ hạ xuống.\nKhông gượng ép. Không nỗ lực. Chỉ là… tự nhiên như thế thôi.\nHƯỚNG DẪN THỰC HÀNH\n2 lần/ngày – mỗi lần 15 phút (sáng và tối)\n • Ngồi yên\n • Nhắm mắt\n • Đặt tay lên tim\n • Và bắt đầu bằng câu khẳng định:\n“Nếu tôi phòng thủ, tôi đang bị tấn công.\nNếu tôi buông sự phòng thủ, tôi trở nên mạnh mẽ.\nTôi khởi lên câu hỏi:\nSự phòng thủ của tôi đang ẩn giấu điều gì nhỉ?\nVà tôi đang sẵn lòng lắng nghe câu trả lời.”\n💗Câu trả lời có thể không đến ngay,\nnhưng nó sẽ đến vào lúc phù hợp. Kệ nó thôi.\nHãy lặp lại câu chủ đề nhiều lần trong ngày.\nMình thực sự thích bài tập này. Nó như một sự khai sáng với mình.\nNhờ bài tập này mình buông được sự đề phòng với bất kỳ ai. Giờ thấy dễ tin người hơn, nhưng càng CHỦ ĐỘNG CHỌN tin người thì lại càng tinh tường nhé, ai mà có năng lượng không chân thành là nhận ra ngay - nhưng không vạch trần, cũng không cần vạch trần.\nNếu nghiêm trọng thì giảm kết nối là được.\nVà đặc biệt càng ở tâm thế chủ động chọn tin người kiểu này thì càng gặp người tuyệt vời."}, {"n": 136, "t": "Bệnh tật là biểu hiện của sự phòng thủ trước Sự thật.", "s": "Sickness is a defense against the truth.", "d": "Đây không phải là một khẳng định y học, mà là một cái nhìn từ tầng sâu của tâm thức: nơi thân và tâm không hề tách rời, và mọi biểu hiện vật lý bên ngoài đều có gốc rễ từ trong tinh thần.\nTrước hết: Sự thật mà ACIM nhắc đến chính là:\nBạn là một phần trọn vẹn của Nhất Thể: không tội lỗi, không thiếu sót, không tách biệt, không cần phải tự vệ.\nBạn là sự mở rộng của Tình yêu của Thượng Đế.\nBạn được tạo ra trong ánh sáng và vẫn ở trong ánh sáng ấy.\nKhông cần sợ hãi. Không cần gồng mình. Không cần phòng thủ với bất kỳ điều gì\nVà theo y học: Bệnh tật có phải là khi mà một bộ phận nào đó đang đi chệnh hướng với bộ máy chung?\nNghĩa là khi đó có 1 bộ phận nào đó đang tự tách mình khỏi dòng chảy hoà hợp.\nViệc ta quên rằng ta là một phần trong Nhất Thể gây ra việc ta thấy ta không an toàn, ta phải gồng lên phòng thủ.\nCũng tương tự như ta đang tục tách mình ra khỏi dòng chảy hoà hợp.\ntheo cách khoa học hiện đại thì:\nPhòng thủ về mặt tâm lý => tạo ra căng thẳng nội tâm => kích hoạt phản ứng sinh tồn của cơ thể => dẫn đến sự tiết cortisol => gây ra bệnh tật\nCortisol là hormone chính của stress\nNó giúp cơ thể “chuẩn bị chạy trốn hoặc chiến đấu”\nNếu trong thời gian ngắn, điều này có lợi.\nNhưng nếu phòng thủ trở thành thói quen sống, cortisol sẽ luôn cao dẫn đến:\n- Mất ngủ\n- Giảm miễn dịch\n- Tăng huyết áp\n- Mệt mỏi mãn tính\n- Ổ viêm ngầm trong cơ thể\nVà thậm chí là nhiều bệnh khác\nVà điều đẹp đẽ:\nKhi ta buông phòng thủ, mềm lại, chọn tin tưởng và kết nối, hệ thần kinh chuyển sang trạng thái an toàn, phục hồi (rest & restore).\nHormone bình an như oxytocin và serotonin tăng lên, cơ thể bắt đầu… tự chữa lành các bạn ạ.\nHướng dẫn thực hành:\nHôm nay, hãy lặp lại câu sau:\n“Bệnh tật là biểu hiện của sự phòng thủ trước Sự thật.\nTôi đón nhận Sự thật rằng tôi là ai và để bản thân được chữa lành một cách trọn vẹn.”"}, {"n": 137, "t": "Khi tôi được chữa lành, không chỉ mình tôi được chữa lành", "s": "When I am healed I am not healed alone.", "d": "Diễn giải:\nChúng ta không tách biệt, chúng ta là một phần của tổng thể. Chúng ta là sự kế thừa của các thế hệ tổ tiên, ông bà và cũng sẽ nuôi dưỡng 1 thế hệ con cháu phía sau.\nKhi chúng ta chữa lành thì năng lượng đó tự nhiên lan toả cho những người khác, những thế hệ khác.\nCó một khái niệm được các nhà khoa học nghiên cứu gọi là \"Trường ý thức tập thể\" (tiếng Anh: collective consciousness hoặc collective field of awareness)\nlà một khái niệm chỉ làn sóng năng lượng tinh thần, cảm xúc, niềm tin, trải nghiệm được chia sẻ trong một cộng đồng, một thế hệ, hoặc toàn bộ nhân loại.\nVí dụ: Khi có một đám đông hoảng loạn, ta sẽ thấy tim mình đập nhanh dù không có lý do cụ thể\n=> Vì ta đang kết nối với trường năng lượng sợ hãi.\nKhi ở cạnh một người rất an yên, ta thấy mình cũng thở chậm lại, nhẹ hơn\n=> Vì ta đang cộng hưởng với trường ý thức tĩnh lặng mà họ đang giữ.\nKhi một quốc gia đang trong không khí ăn mừng chiến thắng, ta cũng thấy hân hoan dù trước đó ta chẳng liên quan lắm.\n=> Đó là ý thức tập thể đang lan rộng trong không gian sống.\nVà khi ta chủ động chữa lành, không chỉ vì đau thương của riêng ta mà vì ta biết rằng mỗi sự chuyển hoá bên trong mình là một sự đóng góp thầm lặng lan toả cho toàn thế giới này.\nHướng dẫn thực hành:\nHôm nay hãy thường xuyên nhắc bản thân:\n“Khi tôi được chữa lành, không chỉ mình tôi được chữa lành.\nTôi nguyện san sẻ sự chữa lành của mình cho cả thế giới.”"}, {"n": 138, "t": "Thiên đường là quyết định mà tôi phải đưa ra", "s": "Heaven is the decision I must make.", "d": "Khi nhắc đến Thiên đường, ta thường mặc định nghĩ ngay đến đối lập của nó: Địa ngục.\nVà rồi tâm trí rơi vào trò chơi lựa chọn:\n“Liệu mình có đủ tốt để được vào Thiên đường không?”\n“Nếu không đủ, liệu Địa ngục có chờ đợi mình không?”\n“Phải làm gì, hy sinh điều gì, để được xứng đáng với ánh sáng ấy?”\nChúng ta nghĩ rằng Đấng sáng tạo tạo ra Thiên đường để khen thưởng và tạo ra Địa ngục để trừng phạt.\nNhưng điều này không đúng, Đấng sáng tạo chỉ có tình yêu, lòng bao dung, là Một với tất cả, không thể tạo ra một nơi tồn tại dựa trên nỗi sợ và trừng phạt.\nVì thế Địa ngục chỉ là ảo ảnh được phóng chiếu từ những tâm trí đã quên mất Nhất thể.\nCâu \"Thiên đường là quyết định mà tôi phải đưa ra\" thực sự là một tuyên bố rất sâu sắc về tự do lựa chọn tâm thức, về trách nhiệm cá nhân, và về quyền năng thật sự mà bạn luôn có nhưng bạn thường quên mất.\nThiên đường không phải nơi chốn mà là trạng thái của tâm thức\nTrong ACIM, Thiên đường không phải là một nơi “trên trời cao” nơi chỉ vài người đủ đạo hạnh mới được bước vào.\nMà nó là: Trạng thái hợp nhất, không còn phán xét, bình an sâu sắc – không phụ thuộc hoàn cảnh, nhớ lại rằng mình là một phần của Tình yêu\nTức là: Thiên đường không phải nơi ta đến mà là nơi ta trở lại bên trong mình.\nThiên đường là quyết định mà ta phải đưa ra vì ta là người duy nhất có thể lựa chọn trong tâm thức của mình.\nKhông ai có thể sống giùm ta.\nKhông ai có thể thức tỉnh giùm ta.\nKhông ai có thể trao Thiên đường cho ta như một phần thưởng.\nMà chỉ có ta mới có khả năng bước vào nó bất cứ lúc nào chỉ bằng một quyết định:\nChọn Tình yêu, chọn Bao dung, chọn Hợp nhất, chọn Bình an – thay vì nỗi sợ, phán xét, phòng vệ, cô lập...\nThực hành nhắc lại nhiều lần trong ngày:\n“Thiên đường là quyết định mà tôi phải đưa ra.\nTôi quyết định ngay ở đây, ngay lúc này và không thay đổi.\nBởi đây là điều duy nhất mà tôi muốn.”"}, {"n": 139, "t": "Tôi chấp nhận sự Sám hối của bản thân mình", "s": "", "d": "“I will accept Atonement for myself”\nDiễn giải:\nTrong tinh thần của ACIM: Sám hối không mang nghĩa là tự trách hay tự trừng phạt như cách ta thường hiểu về “sám hối” trong tôn giáo truyền thống.\nMà ngược lại: Đây là một hành động sâu sắc của lòng bao dung chấp nhận mọi điều ở chính mình dù hoàn hảo hay chưa.\nLựa chọn bao dung và yêu thương không khó, chỉ là nó khác với cách mà chúng ta vẫn hay làm nên ta không quen thôi. Lựa chọn nhìn thấy vạn vật Nhất thể không khó, chỉ là nó khác với cách mà chúng ta quen nghĩ mà thôi.\nACIM một lần nữa cổ vũ bạn hãy đưa ra cam kết, đưa ra quyết định rằng ngay ở đây, ngay bây giờ phải là Thiên đường của bạn.\nQuyết định rằng bạn là Một với Đấng sáng tạo, không quên Nguồn của mình, không quên Sự thật rằng bạn có quyền năng như thế nào khi ở trong bản thể đích thực của bạn.\nBài tập này yêu cầu bạn chấp nhận sự Chuộc lỗi/Sám hối (Atonement) của mình.\n=> Điều này là để bạn bao dung với bản thân cho sự “quên mất” chính mình trong suốt thời gian qua và chấp nhận rằng bạn vẫn vẹn nguyên như khi được sinh ra.\nHôm nay hãy nhắc nhở bản thân thường xuyên: “Tôi chấp nhận sự Sám hối của bản thân mình.\nTôi vẫn vẹn nguyên như khi Đấng sáng tạo sinh ra tôi.”"}, {"n": 140, "t": "Chỉ có sự cứu rỗi mới thật sự được gọi là chữa lành.", "s": "Only salvation can be said to cure.", "d": "Bài hôm nay đề cập trực tiếp đến một điều mà ai trong chúng ta cũng từng lo lắng: bệnh tật trên thân.\nACIM nhắc lại rằng:\nBệnh cũng như mọi xung đột trong thế giới Nhị nguyên chỉ là ảo ảnh.\nNó giống như bạn mơ một giấc mơ bạn mắc một (vài) căn bệnh, và trong giấc mơ đó, bạn tìm cách cữu chữa làm cho sức khoẻ của bạn tốt hơn. Mọi thứ không phải bản chất.\nVì khi bạn tách rời khỏi Nhất thể, tách rời khỏi sự hoà hợp, bệnh tật không thể không diễn ra và mọi sự cứu chữa sẽ chỉ là tạm thời, nên chữa được bệnh chỗ này thì sẽ phát sinh bệnh chỗ khác.\nChỉ có sự hoà hợp về tâm mới thực sự mang lại sự hoà hợp về thân.\nNói như vậy không phải là chúng ta sẽ không cần tập thể thao, không cần ăn uống lành mạnh hay uống thuốc, hay đi bệnh viện nếu cần, mà việc hoà hợp trong tâm cần được thực hành song song và lâu dài.\nCũng có thể khi có sự hoà hợp vào bao dung trong tâm, phương thuốc phù hợp sẽ tìm đến bạn.\nHôm nay hãy ngồi tĩnh lặng và lặp lại câu chủ đề: “Chỉ quay về Nhất thể mới có thể được chữa lành. Nguyện cho tất cả chúng ta đều được chữa lành.”\nChúng ta quy ước tháng 06 là THÁNG THỊNH VƯỢNG. các bạn tự đọc lại chuỗi câu khẳng định này nha\n\"Tôi có diễm phúc là Con của Đấng Sáng Tạo. Tôi có bình an trong tâm, có sức khỏe trên thân, có thịnh vượng trong tài chính...\"\n\"Tôi có diễm phúc là Con của Đấng Sáng Tạo. Tôi có bình an trong tâm, có sức khỏe trên thân, có thịnh vượng trong tài chính, có hạnh phúc trong MQH...\nmuốn gì thì khẳng định đó"}, {"n": 141, "t": "Ôn tập bài 121-122", "s": "", "d": "121. Bao dung là chìa khoá của hạnh phúc.\n122. Sự bao dung mang đến mọi điều tôi muốn.\nTrước hết, hãy đọc lại tin nhắn của 2 bài tập trên.\nTrong suốt ngày hôm nay, hãy thực hành bằng cách nhìn đời, nhìn người và cả chính bản thân trong sự dịu dàng và trân quý.\nDành ra 2 khoảng thời gian, mỗi lần 15 phút, nghĩ về 1 người mà bạn chưa thực sự bao dung với họ. Nhắm mắt và hình dung về người đó, tự nhủ “Tôi với bạn là Một. Chúng ta đều đã làm tổn thương nhau theo một cách nào đó. Giờ đây tôi tha thứ cho bạn và cũng là tha thứ cho chính tôi. Tôi bao dung với bạn và cũng là bao dung với chính tôi. Bởi chúng ta là Một”.\nBạn có thể hình dung ánh sáng bao phủ lên người đó và bao phủ lên bạn, ánh sáng của 2 người hoà vào nhau."}, {"n": 142, "t": "Ôn tập bài 123-124", "s": "", "d": "123. Tôi biết ơn vì những món quà Đấng sáng tạo đã trao cho tôi.\n124. Nguyện cho tôi luôn nhớ rằng: Tôi là Một với Đấng sáng tạo.\nĐọc lại tin nhắn của 2 bài tập trên.\nDành thời gian để biết ơn chặng đường ACIM của bạn, khuyến khích tĩnh lặng và viết xuống nếu bạn muốn.\nTrong ngày hãy thực hanh nhiều lần lời nguyện:\n“Nguyện cho tôi luôn nhớ rằng: Tôi là Một với Đấng sáng tạo.\nNguyện cho tôi luôn nhớ rằng: Tôi là Một với thế giới.\nNguyện cho tôi luôn nhớ rằng: Tôi là Một với [một hay nhiều người nào đó].”\nMột cách thực hành khác bạn cũng có thể áp dụng thay thế: “(Nguyện cho tôi luôn nhớ rằng:) Tôi chính là [người đó] và [người đó] chính là tôi.”"}, {"n": 143, "t": "Ôn tập bài 125-126", "s": "", "d": "125. Khi tĩnh lặng, tôi nghe thấy thông điệp của Đấng sáng tạo.\n126. Những gì tôi trao đi cũng là trao cho chính mình.\nHôm nay chúng ta thực hành tĩnh lặng và trao đi.\nCùng đọc lại tin nhắn cũ của 2 bài tập trên và luyện tập lắng nghe bản thân, kết nối với chính mình và cuộc sống nhé.\n💗📌💗Bài tập khuyến khích:\ntrong 2 ngày tới hãy thực hành trao đi bằng cách tìm ít nhất một người lạ để biếu tiền họ.\nVd: mua 1 tấm vé số 10k - trả họ hơn 10k không cần thối lại.\nVd: Chuyển khoản cho shiper nhiều hơn số tiền hàng\nVd: Mua rau hết 10k trả nhiều hơn 10k.\nVà sau đó cảm nhận cảm giác mình đủ đầy trù phú thịnh vượng khi là người cho đi."}, {"n": 144, "t": "Ôn tập bài 127-128", "s": "", "d": "127. Không có tình yêu nào ngoài tình yêu của Đấng sáng tạo.\n128. Thế giới tôi đang thấy không có thứ mà tôi muốn.\nChỉ có tình yêu đích thực khi ta biết mình là Một với đối tượng mình yêu.\nHãy hướng về người mà bạn đang yêu, tự nhủ: “Tôi nguyện những điều tốt đẹp nhất dành cho bạn bằng tình yêu của Đấng sáng tạo. Tôi đã học được bài học rằng: không có tình yêu nào ngoài tình yêu của Đấng sáng tạo, cũng là tình yêu của bạn, của tôi và của tất cả mọi người.”\nHướng về người mà bạn cho rằng bạn đã từng yêu và giờ không còn yêu nữa, tự nhủ: “Tôi nguyện những điều tốt đẹp nhất dành cho bạn bằng tình yêu của Đấng sáng tạo. Tôi đã học được bài học rằng: không có tình yêu nào ngoài tình yêu của Đấng sáng tạo, cũng là tình yêu của bạn, của tôi và của tất cả mọi người.”\nVà một lần nữa hướng về Nhất thể, bởi một thế giới hoà hợp, một cuộc sống hoà hợp mới là điều bạn thực sự mong muốn. Hãy tự nhủ: “Thế giới tôi đang thấy (bằng mắt thường) không có thứ mà tôi muốn. Tôi sẽ không để những thứ mà tôi thấy trì hoãn bản thân tôi hướng về Sự thật/ hướng về Nhất thể.”"}, {"n": 145, "t": "Ôn tập bài 129-130", "s": "", "d": "129. Vượt trên thế giới này là thế giới mà tôi muốn.\n130. Nhìn thấy cả 2 thế giới là không thể.\nAlbert Einstein có một câu nói rằng “’Chúng ta không thể giải quyết vấn đề ở cùng một cấp độ tư duy đã tạo ra nó.”\nNhị nguyên gây ra đau khổ và mâu thuẫn, vì thế chúng ta không thể ở lại Nhị nguyên mà mong thoát khổ. Chỉ có nâng tầm nhận thức của bạn vượt trên Nhị Nguyên và hướng về Nhất thể, điều kỳ diệu mới có thể xảy ra."}, {"n": 146, "t": "Ôn tập bài 131-132", "s": "", "d": "131. Khi một người khởi nguyện được nhìn thấy sự thật, người đó không thể thất bại.\n132. Tôi giải phóng thế giới khỏi những niềm tin sai lầm trước đây của tôi về nó.\nMột lần nữa chúng ta thực hành giải phóng thế giới khỏi những niềm tin sai lầm trước đây của chúng ta về nó. Hãy viết xuống những niềm tin sai lầm của bạn, có thể bạn sẽ thấy danh sách này đã biến mất 1 số gạch đầu dòng mà bạn đã thực hành trước đây, cũng có thể xuất hiện thêm những niềm tin mới. Quan sát xem lần thực hành này có gì khác nữa không nhé."}, {"n": 147, "t": "Ôn tập bài 133-134", "s": "", "d": "133. Tôi sẽ không bám chấp vào những thứ vô thường.\n134. Nguyện cho tôi đón nhận sự bao dung như nó vốn là.\nChúng ta đau khổ khi bán chấp vào những điều mà bản chất của nó là đến rồi đi. Khi ý thức được điều này, chúng ta hướng đến những điều trường tồn, chính là Nhất thể, tình yêu và sự bao dung.\nBao dung không đòi hỏi sự hy sinh nào từ chúng ta, bao dung đã tự nhiên có sẵn trong chúng ta rồi.\nMở rộng dung lượng trái tim thì tác dụng \"phụ\" là sẽ mở rộng luôn sức chứa dòng tiền chảy qua đó các bạn ơi\nbạn càng chứa đựng được nhiều sự khác biệt, bạn càng đón nhận được nhiều điều mà trước đến giờ bạn khó đón nhận...\nThì dòng chảy tiền càng thông suốt"}, {"n": 148, "t": "Ôn tập bài 135-136", "s": "", "d": "135. Nếu tôi phòng thủ, tôi đang bị tấn công.\n136. Bệnh tật là biểu hiện của sự phòng thủ trước Sự thật.\nNgay khi bạn có suy nghĩ phòng thủ, tức là đồng thời bạn cũng phát đi ý nghĩ rằng bạn đang bị tấn công hoặc có nguy cơ bị tấn công, và điều này vô hình chung phóng chiếu ra một thế giới đầy nguy hiểm và bệnh tật do thiếu sự hoà hợp."}, {"n": 149, "t": "Ôn tập bài 137-138", "s": "", "d": "137. Khi tôi được chữa lành, không chỉ mình tôi được chữa lành.\n138. Thiên đường là quyết định mà tôi phải đưa ra.\nGiống như khi 1 bộ phận trên cơ thể được chữa lành thì không chỉ bộ phận đấy được lành, mà cả cơ thể cũng lành theo. Hãy lựa chọn Nhất thể - thiên đường ngay ở đây và bây giờ để bạn và thế giới được chữa lành!"}, {"n": 150, "t": "Ôn tập bài 139-140", "s": "", "d": "139. Tôi chấp nhận sự Sám hối của bản thân mình.\n140. Chỉ quay về Nhất thể mới có thể được chữa lành.\nLựa chọn bao dung và yêu thương không khó, chỉ là nó khác với cách mà chúng ta vẫn hay làm. Lựa chọn Nhất thể không khó, chỉ là nó khác với cách mà chúng ta hay nghĩ mà thôi."}, {"n": 151, "t": "Vạn vật là tiếng vọng từ Lời của Đấng Sáng Tạo", "s": "All things are echoes of the Voice of God.", "d": "Lời của Đấng Sáng Tạo là gì?\nĐó không phải là một giọng nói cụ thể, mà là sự thật tuyệt đối toàn vẹn về bạn:\nBạn là linh hồn thuần khiết.\nBạn được tạo ra từ tình yêu, cho tình yêu, và để sống như tình yêu.\nBạn chưa từng có lỗi gì, chưa từng thiếu sót gì.\nNhưng vấn đề là ta thường quên mất điều đó.\nVà không chỉ chính ta. Mà bất kỳ ai cũng là linh hồn thuần khiết.\nCũng được tạo ra từ tình yêu, cho tình yêu, và để sống như tình yêu.\nCũng chưa từng có lỗi gì, chưa từng thiếu sót gì.\nVà vấn đề là ta cũng đã quên mất điều đó.\nTrong cuộc sống hàng ngày, rất tự nhiên khi ta nhìn ai đó/ hay một tình huống nào đó ta thường lập tức hình thành một dự đoán hoặc phán xét: “Người này đúng/ người kia sai”, “Cái này tốt/ cái kia tệ”, “Tôi chắc chắn là thế”.\nNhưng sự thật là: Ta chỉ đang thấy 1 phần sự thật.\nVà không ai có thể phán xét một điều gì khi chỉ thấy một phần sự thật.\nTất cả những gì bạn thấy, nghe, cảm nhận bằng giác quan… đều rất giới hạn và thường xuyên sai lệch.\n chính sự sai lệch ấy tạo nên một lớp sương mù khiến bạn tưởng mình đang thấy rõ trong khi thực chất, bạn đang lắng nghe một \"tiếng vọng\" từ cái tôi đầy hoài nghi.\nPhán xét: chính là một lớp phòng vệ của nỗi sợ\nBài học hôm nay không khuyên bạn “đừng phán xét” bằng cách kiềm chế hay tỏ ra dửng dưng.\nMà là một lời nhắc rất nhẹ:\n“Nếu tôi thực sự nhìn thấy sự thật toàn vẹn như Lời của Đấng Sáng Tạo tôi sẽ không phán xét điều này.”\n“Tôi đang không có đủ dữ kiện nên tôi giao lại quyền phán xét cho Đấng Sáng Tạo.”\nHãy ghi nhớ:\nKhi bạn buông phán xét, không có nghĩa bạn trở nên yếu đuối.\nMà là bạn đang lựa chọn sự khiêm nhường nội tâm một trạng thái vững vàng và đầy bình an.\nKhi bạn học cách buông bỏ mọi phán xét, buông mọi giọng nói đầy sợ hãi trong tâm trí, quay về lắng nghe tiếng nói bên trong:\n giọng nói của tình yêu, của lòng biết ơn, của tha thứ và chấp nhận…\n… Thì thế giới bạn nhìn thấy cũng sẽ dần trở nên dịu dàng hơn, sáng hơn, thánh thiện hơn.\nThế giới không đến từ bên ngoài. Thế giới là tiếng vọng của những gì bạn đang tin là thật.\nVà khi bạn chọn lắng nghe Lời của Đấng Sáng Tạo trong mình, bạn sẽ bắt đầu nhìn thấy sự thật ấy vang vọng ra khắp mọi nơi.\nThực hành:\nTrong ngày hôm nay, bất cứ khi nào bạn thấy tâm trí bắt đầu phán xét ai đó (hoặc chính mình), hãy dừng lại trong 3s và thì thầm một trong hai câu sau:\n • “Tôi để sự phán xét lại cho Đấng Sáng Tạo.”\n • “Tôi không chắc sự thật có đúng như điều tôi đang thấy.”\nBạn có thể gộp cả hai nếu muốn, hoặc chỉ chọn một câu phù hợp với cảm nhận nhé"}, {"n": 152, "t": "QUYỀN NĂNG RA QUYẾT ĐỊNH THUỘC VỀ TÔI", "s": "The power of decision is my own.", "d": "Diễn Giải:\nTheo A Course in Miracles,\nKhông ai đánh mất điều gì… trừ khi họ đã chọn điều đó.\nKhông ai đau khổ, bệnh tật, thậm chí rời khỏi cuộc đời này… nếu sâu bên trong, họ không đồng thuận điều đó xảy ra.\nNghe thì có vẻ khó chấp nhận, nhưng sự thật là bạn không thể chọn chỉ một nửa kiểu: muốn thoát khổ, mà lại không muốn tin rằng mình từng vô thức chọn khổ đau.\nVà đó là lý do: chỉ khi bạn nhận trách nhiệm rằng mình từng chọn khổ, mình mới đủ quyền năng để chọn bình an ngay bây giờ.\nRất nhiều lần, chúng ta thấy mình như người bị động:\n • “Tôi không muốn điều đó xảy ra.”\n • “Tôi đã cố gắng hết sức rồi.”\n • “Tôi không hiểu vì sao lại đau đến thế.”\nNhưng hãy thử nghĩ mà xem có phải:\n📌 Có một phần trong ta từng tin rằng mình không xứng đáng hạnh phúc.\n📌 Một phần khác tin rằng mình cần chịu đựng để được yêu thương.\n📌 Hay một niềm tin rất cũ kỹ rằng: yêu là hy sinh.\nVà chính những “quyết định bên trong” tiềm thức đó, là thứ đã tạo nên thực tại bạn đang sống, dù bạn không hề cố tình.\n(Điều này cũng khớp với nội dung cuốn Sức Mạnh Tiềm Thức, đúng không).\nHôm nay, một lần nữa chúng ta nhắc lại điều này không phải để trách mình hay trách người.\nChỉ nhẹ nhàng nhận ra rằng:\nTâm trí mình còn quá nhỏ để hiểu hết cách vũ trụ vận hành.\nVì vậy mình không thể/không cần phải lý giải, hay cố gắng kiểm soát mọi thứ “phải đúng ý\" mới được.\nSự khiêm nhường cũng chính là sự phó thác ở mức độ cao nhất.\nChỉ cần từng bước, mỗi ngày một chút thực hành Hoà vào Nhất Thể. Mọi thứ tự nhiên sẽ tốt đẹp\nThực hành đơn giản:\n💗Thường xuyên tự nhủ trong ngày: “Quyền năng ra quyết định thuộc về tôi, ngay từ khi tôi được Đấng sáng tạo sinh ra.”"}, {"n": 153, "t": "Khi tôi ngừng phòng thủ, tôi an toàn.", "s": "In my defenselessness my safety lies.", "d": "Ở bài 135, chúng ta đã từng chạm đến ý niệm này: buông xuống sự phòng thủ là con đường dẫn đến bình an. Và hôm nay, ta lại được nhấn mạnh lại bài học ấy\nVới bản ngã, ý tưởng “không phòng thủ” là điều vô lý. Làm sao có thể không tự vệ trong một thế giới đầy rủi ro, tổn thương, chia tach và phản bội?\nNhưng ta đã biết, thế giới bên ngoài chỉ là phản chiếu của thế giới nội tâm. Người khiến ta tổn thương, tình huống làm ta hoảng sợ, sự bất công khiến ta nổi giận tất cả đều là hình ảnh phản chiếu từ bên trong mà thôi\nTa không cần phòng thủ nếu bạn nhớ rằng mình không thể bị tổn hại, trừ khi chính mình cho phép. Khi ta thôi chống lại, thôi đổ lỗi, thôi cần “bảo vệ bản thân”, ta sẽ thấy: không có gì thực sự đe doạ ta cả.\nVà rồi ta sẽ an toàn. Không phải vì thế giới thay đổi, mà vì ta đã chọn trở về với sự tin tưởng và phó thác: trạng thái tự nhiên của linh hồn.\nTrong sự không phòng thủ ấy, ta không yếu đi ta mạnh hơn bao giờ hết.\nThực hành trong ngày hôm nay:\n • Dành thời gian ngồi tĩnh lặng 2 lần, vào đầu ngày và cuối ngày, để thấm nhuần bài học này.\n • Trong ngày, hãy nhiều lần nhắc thầm:\n“Khi tôi ngừng phòng thủ, tôi an toàn.”\nHít sâu. Thở ra. Thả lỏng tâm trí.\nVà tin rằng ta đang được dẫn dắt bởi một năng lương yêu thương luôn hiện diện sẵn có quanh ta."}, {"n": 154, "t": "Tôi là sứ giả của Đấng Sáng Tạo", "s": "I am among the ministers of God.", "d": "Diễn giải:\nTa là một trong những sứ giả của Đấng Sáng Tạo. Và thông điệp của Người đang được truyền đi qua chính đời sống của ta.\nTa không cần cố gắng để trở thành một ai đó.\nChỉ cần nhớ lại: ta vốn là một phần của Đấng Sáng Tạo, là sự hợp nhất với tất cả, là tình yêu thuần khiết, lòng từ bi sâu rộng và năng lực sáng tạo vô hạn.\nViệc nhớ lại này, không nên chỉ diễn ra trong tâm trí; mà còn cần được gắn chặt với từng lựa chọn, từng hành vi, từng hơi thở của ta mỗi phút giây.\nKhi ta sống mỗi phút giây như một phần của Sự Thật, chính ta trở thành thông điệp đó!\nVà thông điệp ấy: về tình yêu, về nhất thể, về sự tự do nội tâm sẽ được lan tỏa một cách tự nhiên đến những người xung quanh.\nĐây cũng là minh chứng cho rất nhiều case: mình thay đổi thì dường như tất cả mọi người xung quanh cũng tự thay đổi theo mình. Trong khi ta không hề cố gắng để lan toả điều gì cả.\nTa không cần gượng ép mình vào một vai trò bào đó. Cũng không cần quyết định mình phải làm điều gì to tát.\nChỉ cần xác định thật rõ ràng: mình sẽ đón nhận thông điệp trước đã. Cho chính mình trước đã.\nVà rồi, bằng sự đồng thuận sâu thẳm, tự nhiên từ bên trong ta sẽ biết đâu là lúc, đâu là nơi, và với ai để những năng lượng ấy được tiếp tục lan toả tự nhiên.\nChỉ cần \"say yes\" về vinh dự được là Sứ giá của Đấng Sáng Tạo là được.\nCòn phải làm gì, lúc nào. Tự khắc Đấng Sáng Tạo sẽ có dẫn dắt từ trong nội tâm ta sau đó.\nLời khẳng định tự nhắc nhiều lần trong ngày:\n\"Tôi là sứ giả của Đấng Sáng Tạo. Và tôi biết ơn vì điều đó.\""}, {"n": 155, "t": "Tôi lùi lại một bước để Đấng Sáng Tạo dẫn đường.", "s": "I will step back and let Him lead the way.", "d": "Diễn giải:\nTa chọn lùi lại một bước để ĐST dẫn đường không phải vì ta yếu đuối.\nMà vì ta chọn tin vào một Sức mạnh yêu thương lớn lao hơn cả những gì mà tâm trí ta hiểu được.\nCâu hỏi đặt ra là: Đấng Sáng Tạo dẫn ta đi đâu?\nKhông phải đến một điểm đến ngoài kia. Không phải là một cột mốc nào đó mà bản ngã ta thấy phải đạt được nó mới đủ.\nMà là dẫn ta trở về với Nhất Thể, với sự hợp nhất.\nTrở về với chính mình phiên bản vốn dĩ đã nguyên vẹn, đầy yêu thương và bình an.\nHướng dẫn thực hành:\nTiếp tục, hướng về Nhất thể, là Một với tất cả, và trong ngày hãy tự nhủ:\n“Tôi lùi lại một bước để Đấng sáng tạo dẫn đường. Bởi con đường của tôi chính là con đường hoà làm Một với Đấng sáng tạo.”"}, {"n": 156, "t": "Tôi hướng về Đấng sáng tạo trong sự thánh thiện hoàn hảo.", "s": "I walk with God in perfect holiness.", "d": "Bài tập này là một lời khẳng định đơn giản nhưng vững vàng: cho dù bất cứ chuyện gì đã xảy ra, ta (linh hồn của ta) trọn vẹn hoàn hảo, thánh thiện hoàn hảo.\nÁnh sáng ở bên trong ta không bao giờ tắt hay bị lu mờ bởi bất kỳ điều gì. Ánh sáng đó luôn có thể cứu rỗi ta và cả thế giới của ta. Ta trong sáng và thuần khiết, không có tội lỗi nào cũng như không cần sự chuộc lỗi nào cần phải diễn ra.\nThực hành:\nHôm nay, hãy luôn tự nhủ: “Tôi hướng về Đấng sáng tạo trong sự thánh thiện hoàn hảo. Tôi nguyện thắp sáng tâm trí tôi, thắp sáng mọi tâm trí là Một với tôi và toàn thể thế giới này.”"}, {"n": 157, "t": "Tôi hoà mình vào sự Hiện diện của Đấng Sáng Tạo ngay lúc này.", "s": "Into His Presence would I enter now.", "d": "Hôm nay là một ngày đặc biệt. Không phải vì điều gì xảy ra bên ngoài, mà vì bên trong bạn, một điều gì đó đang hé mở.\nBạn không cần hiểu, cũng không cần cố gắng đạt được điều gì.\nChỉ cần lùi lại, yên lặng, và cho phép chính mình được chạm vào sự Hiện diện ấy, nơi không còn những câu hỏi, không còn sự cố gắng, chỉ có tình yêu thuần khiết đang mời gọi bạn về nhà.\nKhi ta thôi chạy đi tìm, sự Hiện diện ấy liền có mặt Ở ĐÂY - BÂY GIỜ. Khi ta ngừng phán xét, ngừng phòng thủ, ngừng tự tách mình khỏi sự sống,\nta sẽ thấy: ta chưa từng đơn độc. Ta chưa từng rời khỏi ánh sáng.\nHôm nay, mỗi khi nhớ ra bài tập chỉ cần mở lòng ra, và thì thầm:\n“Ngay lúc này, tôi hoà mình vào sự Hiện diện của Đấng Sáng Tạo.”\nKhông có gì phải làm thêm cả,\nChỉ là được hiện hữu trong ánh sáng, trong sự bình an, trong sự nhớ lại:\nta là ai và ta đã luôn được yêu.”"}, {"n": 158, "t": "Hôm nay tôi học cách trao đi những gì tôi được nhận.", "s": "Today I learn to give as I receive.", "d": "Cụ thể trong bài tập này, “những gì được nhận” được nhắc đến ở phần tiêu đề chính là:\n- Sự nhận thức về Nhất thể\",\n-  Nhận thức rằng ai vốn dĩ cũng luôn toàn vẹn, thánh thiện hoàn hảo\n- Nhận thức rằng ai cũng có quyền năng của Đấng sáng tạo…\n=> Bạn đã được nhận những kiến thức này và đã đến lúc bạn bắt đầu nghĩ về việc lan toả nó cho những người khác.\nNhưng bằng cách nào?\nCách thức thực hành:\nVẫn là bằng SUY NGHĨ - LỜI NÓI - VIỆC LÀM.\nVí dụ:\n1, Suy nghĩ: Mỗi khi thấy ai đó hãy niệm: Nguyện cho bạn nhận ra Nhất Thể, Nguyện cho bạn nhận ra bạn vốn dĩ toàn vẹn, thánh thiện, hoàn hảo. Nguyện cho bạn nhận ra bạn có quyền năng của ĐST.\n2, Lời nói/viết: Hãy chia sẻ bằng lời hoặc bài viết một điều gì đó về tư duy Nhất Thể; Hãy truyển tải thông điệp: Người đó cũng vốn dĩ rất đẹp đẽ rồi. Người đó vốn luôn có quyền năng sáng tạo nên cuộc đời mình.\n3, Làm: Mỗi lần thấy ai đang làm gì đó, hãy thử niệm: Người đó là chính tôi đang trải nghiệm việc đó. Tôi sẽ giúp họ một chút."}, {"n": 159, "t": "Tôi trao đi điều kỳ diệu mà tôi đã nhận được.", "s": "I give the miracles I have received.", "d": "Diễn giải:\nĐiều kỳ diệu mà chúng ta nhắc đến ở đây là được sống trong tình yêu thương, đủ đầy, thịnh vượng và đầy bao dung.\nChúng ta đã từng nói đến \"cho là nhận\" là bởi cho là khi ta kích hoạt dòng chảy năng lượng.\nBài tập hôm nay mở ra một ý niệm mới: Khi ta cho đi, là khi ta khẳng định: TA VỐN DĨ ĐÃ CÓ NÓ RỒI.\n(Có thể hiểu đây là một cách manifest, một cách khẳng định rằng ta vốn dĩ đang đầy yêu thương, dư dả, thịnh vượng và được bao dung...)\nBởi đâu ai có thể cho đi trong khi ta chưa có bất kỳ cái gì đúng không?\nHôm nay, hãy thực hành trao đi. Có thể là bất cứ điều gì: nụ cười, ánh mắt dịu dàng, ái ngữ, sự bao dung… và dành thêm một chút thời gian để cảm nhận điều đó đã có sẵn trong bạn.\nMở rộng: Nếu bạn đang muốn có thêm điều gì, hãy thực hành cho đi điều đó trước.\n- Muốn có thêm hạnh phúc: hãy trao hạnh phúc\n- Muốn có thêm tiền: hãy trao tiền cho người cần\n- Muốn có thêm sự quan tâm: hãy trao đi sự quan tâm...\n- Muốn có thêm thời gian: hãy trao đi thời gian.\nVD: muốn có thời gian nghỉ ngơi thư giãn cho chính mình, hãy tìm một người đang rất bận rộn, vd 1 mẹ bỉm: trông con giúp họ 1 lúc.\nNhớ: 1 hạt giống bé nhỏ có thể mọc thành 1 cây cổ thụ trĩu quả.\nNếu bạn thắc mắc tại sao Muốn có thêm thời gian: hãy trao đi thời gian. Vô lý. thì nhớ rằng\nViệc của người nông dân là: Gieo hạt và chăm bón.\nNgười nông dân chưa từng nghiên cứu nguyên lý tại sao 1 hạt thóc giống lại trổ ra hẳn 4-5 bông lúa trĩu hạt.\nVì người nông dân coi đó là sự thật hiển nhiên"}, {"n": 160, "t": "Tôi an trú tại ngôi nhà nội tâm. Nỗi sợ chỉ là người khách lạ.", "s": "I am at home. Fear is the stranger here.", "d": "Nỗi sợ chỉ là một người lạ trên con đường của tình yêu. Cũng giống như bản ngã là một người lạ với bản thể đích thực của bạn. Lạ ở đây là rất xa lạ với sự thật.\nTrong ngôi nhà nội tâm của bạn, nỗi sợ chỉ là người khách lạ ghé đến rồi đi, chứ không thể ở lại. Người lạ hẳn sẽ không thể hiểu bạn, dễ dàng phán xét bạn, đưa cho bạn những lời khuyên hay chỉ dẫn sai lầm, người lạ chẳng thể hiểu gì về ngôi nhà. Bạn chỉ cần biết vậy và để họ đi qua.\nHôm nay, hãy ngồi tĩnh lặng và tự nhủ nhiều lần: “Tôi an trú tại ngôi nhà nội tâm. Nỗi sợ chỉ là người khách lạ.”"}, {"n": 161, "t": "Hãy trao cho tôi những phước lành của bạn, hỡi Thánh tử của Thượng Đế!", "s": "Give me your blessing, holy Son of God.", "d": "Hôm nay tôi chọn nhìn thấy ánh sáng thiêng liêng nơi từng người tôi gặp hôm nay.\nHôm nay tôi mời gọi ánh sáng thiêng liêng ở từng người tôi gặp hôm nay.\nMỗi người tôi gặp không phải là sự tình cờ, mỗi cuộc gặp hôm nay đều là cơ hội để tôi nhìn thấy Thượng Đế.\nTôi nhìn thấy tính Thượng Đế/Phật tính trong bạn.\nCâu này là dành cho bạn, người đang đọc bài tập này trong group lớp Oneness\nTôi mời gọi phần cao nhất trong mỗi người xuất hiện, và tôi đón nhận phước lành họ mang đến."}, {"n": 162, "t": "Tôi trọn vẹn như khi Đấng sáng tạo sinh ra tôi.", "s": "I am as God created me.", "d": "Chủ đề bài tập này đã được lặp lại từ bài tập 94 và 110. Hôm nay chúng ta lại khẳng định nó một lần nữa thật mạnh mẽ.\n“Tôi trọn vẹn như khi Đấng sáng tạo sinh ra tôi.”\nHãy để câu nói này xua tan mọi tự ti, mặc cảm và tội lỗi trong bạn.\nHãy để câu nói này phá vỡ mọi giới hạn và nghi ngờ trong bạn.\nHãy để câu nói này đưa bạn “về nhà” và cảm nhận Nhất thể.\nBạn trọn vẹn như khi Đấng sáng tạo sinh ra bạn, và mọi người khác cũng thế, luôn được yêu thương và nâng đỡ trọn vẹn từ Đấng sáng tạo.\nHãy khẳng định câu này nhiều lần trong ngày."}, {"n": 163, "t": "Cái chết không tồn tại. Những đứa con của Đấng Sáng Tạo luôn tự do.", "s": "There is no death. The Son of God is free.", "d": "Chúng ta thường cho rằng: không gì là chắc chắn trên đời, ngoài cái chết.\nCái chết giống như một dấu chấm hết, là kết cục mà mọi sinh vật phải đối mặt.\nVà thế là, nỗi sợ chết len lỏi vào hầu hết mọi nỗi sợ khác, sợ mất mát, sợ đau đớn, sợ chia ly, sợ không đủ, sợ lỡ dở…\nNhưng theo A Course in Miracles, cái chết chỉ là một ảo tưởng, là kết quả của việc đồng nhất bản thân với cơ thể vật lý.\nThực chất, bạn không phải là cơ thể này.\nBạn là linh hồn, là sự sống không hình tướng, là phần nối dài của Thượng Đế.\nVà sự sống đó không thể chết, không thể mất đi, chỉ có thể chuyển dạng.\nHôm nay, hãy cho phép niềm tin cũ được tan rã.\nBạn không cần sống trong nỗi lo cái chết đang rình rập.\nBạn có thể sống trong sự an nhiên, trong sự sống vĩnh hằng, trong Tình yêu lớn hơn bất kỳ giới hạn nào.\nLời tự nhủ trong ngày:\n“Cái chết không tồn tại. Tôi - một phần thiêng liêng của Đấng Sáng Tạo - luôn tự do.”"}, {"n": 164, "t": "Ngay bây giờ, tôi là Một với Nguồn.", "s": "", "d": "Chúng ta là người kiến tạo nên thực tại của mình, nhưng chúng ta lại lựa chọn kiến tạo nó mỗi giây phút dựa trên quá khứ: thế giới vẫn tàn nhẫn thế, sếp tôi vẫn khó tính thế, tôi vẫn ốm yếu thế…\nBạn có quyền năng viết một câu chuyện mới, đặt bộ lọc sợ hãi và quá khứ sang một bên, hãy sử dụng quyền năng ấy mỗi giây mỗi phút, kiến tạo một thực tại mới, từ con số 0. Không định kiến, không giới hạn, không sợ hãi.\nNgay bây giờ, bạn là Một với Nguồn. Hãy luôn nhớ điều đó.\nTÔI LÀ MỘT VỚI NGUỒN, TÔI CÓ QUYỀN NĂNG KIẾN TẠO NÊN THỰC TẠI"}, {"n": 165, "t": "Nguyện cho tâm trí tôi ngừng gạt đi những ý nghĩ của Đấng Sáng Tạo.", "s": "Let not my mind deny the Thought of God.", "d": "Tâm trí của ta quá quen với việc bám lấy nỗi sợ, lo lắng, thiếu thốn. Nó thường từ chối sự bình an, niềm vui và tình yêu vốn luôn hiện hữu chỉ vì ta chưa tin rằng mình xứng đáng với tất cả những điều đó.\nChúng ta không thiếu điều gì chỉ là đã vô thức quay lưng với phần linh thiêng trong mình mà thôi.\nÝ nghĩ của Thượng Đế chưa bao giờ rời khỏi ta. Và cũng chưa từng thôi bảo vệ, yêu thương, chữa lành ta trong thầm lặng.\nHôm nay, chỉ cần ta không từ chối Thiên đường của bình an hạnh phúc, ta sẽ cảm nhận được nó.\nTa không cần phải chắc chắn, chỉ cần mong muốn. Và khi nhận được rồi, ta sẽ biết: đây chính là kho báu mình luôn tìm kiếm.\nHãy tự nhủ nhẹ nhàng nhiều lần trong ngày:\n“Nguyện cho tâm trí tôi ngừng gạt đi những ý nghĩ của Đấng Sáng tạo.”"}, {"n": 166, "t": "Tôi được giao phó với những món quà từ Đấng Sáng Tạo.", "s": "I am entrusted with the gifts of God.", "d": "Mỗi ngày, chúng ta đứng trước hai lựa chọn:\n1. Một là tiếp tục tạo dựng thế giới từ những niềm tin cũ: rằng đây là nơi bất an, thiếu thốn, xung đột và đầy sợ hãi.\n2. Hai là chọn nhìn thế giới bằng con mắt mới: nơi luôn có tình yêu, sự bình an, và khả năng sáng tạo vô tận đang chờ được kích hoạt từ bên trong.\nSự thật là:\nĐấng Sáng Tạo đã đặt vào ta những món quà linh thiêng, ta được giao phó với quyền năng kiến tạo, với tình yêu, với sự sáng suốt, và hạnh phúc trọn vẹn.\nKhông điều gì thiếu nơi ta. Mọi “nguyên liệu” đã sẵn có.\nViệc của chúng ta không phải là cố “xứng đáng hơn” để nhận, mà là can đảm tin tưởng, nhìn thấy và sử dụng những nguyên liệu đó.\nCó thể bạn chưa quen với cách sống này: một cuộc sống không bị chi phối bởi nỗi sợ hay cảm giác thiếu. Nhưng đó chính là lý do chúng ta cần thực hành, ngay hôm nay những điều đơn giản sau:\nHiện diện từng khoảnh khắc với nhận thức rằng bạn đang đã có sẵn món quà linh thiêng từ Đấng Sáng Tạo. Luôn nhắc nhở bản thân niềm tin rằng: Tôi vốn dĩ đã đủ đầy, tôi vốn dĩ đã trọn vẹn, tôi vốn dĩ đã hạnh phúc, Tôi chỉ cần nhận lấy nó thì nó sẽ tự toả ra từ bên trong.\nHoặc như điều đơn giản mình đã nhắc nhớ lớp nhiều lần:\n- Nếu có 1 cảm xúc tiêu cực đến, ta NHẬN RA nó đang đến là được, rồi kệ nó. Không cố dập tắt nó, không cố phán xét nó là xấu, càng không cố làm gì đó theo sự thúc đẩy của nó.\n- Đơn giản là: Tôi chấp nhận cảm xúc này - ngay bây giờ.\nThực hành nhắc bản thân nhiều lần trong ngày:\n“Tôi được giao phó với những món quà từ Đấng Sáng Tạo.”"}, {"n": 167, "t": "Chỉ có một cuộc đời, và tôi chia sẻ nó cùng Đấng sáng tạo.", "s": "There is one life, and that I share with God.", "d": "Khi nhắc đến “một cuộc đời”, chúng ta sẽ nghĩ nó bắt đầu từ lúc chúng ta sinh ra và kết thúc khi chung ta chết đi. Nhưng theo ACIM, đó chỉ là một giấc mộng.\nCuộc sống bạn đang thấy là một giấc mơ, một ảo ảnh phát sinh từ tâm trí bạn. Cuộc đời thực sự của bạn không có cái chết, không có tổn thương - chỉ một cuộc đời duy nhất và cuộc đời ấy trường tồn.\nToàn bộ vũ trụ khởi nguồn bằng một ý niệm và ý niệm đó không bao giờ mất đi. Bạn cũng sinh ra ngay từ lúc xuất hiện ý niệm đó và sẽ luôn tồn tại cùng nó. Đó là lý do câu chủ đề của bài này nói rằng: “Chỉ có một cuộc đời, và tôi chia sẻ nó cùng Đấng sáng tạo.”\nHoà nhập vào Nhất thể và bạn sẽ sống mãi với nó. Khi đó, mọi đau khổ, xung đột biến mất, bạn sẽ biết cái gì là thực, cái gì là ảo. Đó là lúc bạn sống trọn vẹn và đủ đầy."}, {"n": 168, "t": "Ân sủng đã được ban và tôi đón nhận ngay bây giờ", "s": "Your grace is given me. I claim it now.", "d": "Đấng Sáng Tạo luôn hiện diện và lặng lẽ trò chuyện cùng ta. Không qua lời nói, mà bằng sự tĩnh lặng đầy yêu thương. Ngài chưa từng xa cách, chưa từng che giấu bản thân. Nhưng trong vô thức, chính ta đã quay lưng đi, chọn sống giữa những giấc mơ đầy sợ hãi và chia cách.\nDù vậy, dòng yêu thương ấy vẫn chảy về phía ta, vẹn nguyên như thuở đầu. Nếu ta thực sự cảm nhận được tình yêu này, sẽ không còn điều gì khiến ta phải hy vọng hay tuyệt vọng nữa.\nBởi mọi thứ ta cần để hạnh phúc đã luôn sẵn có, chỉ là bị che khuất bởi những làn sương mù của quên lãng.\nHôm nay, hãy dành một khoảnh khắc để trò chuyện với Đấng Sáng Tạo.\nKhông cần nghi lễ, chỉ cần một lời nhẹ nhàng nguyện trong lòng: “Xin cho con được thức tỉnh khỏi giấc mơ cũ. Xin soi sáng để con thấy rõ niềm vui, sự vững vàng, và ánh sáng tình yêu vốn đã ở đây.”\nKhi ta thành tâm yêu cầu, đồng nghĩa với việc ta đã sẵn sàng đón nhận.\nLời tự nhắc bản thân trong ngày:\nÂn sủng đã được ban và tôi đón nhận ngay bây giờ."}, {"n": 169, "t": "Nhờ ân sủng mà tôi sống. Nhờ ân sủng mà tôi được giải thoát.", "s": "By grace I live. By grace I am released.", "d": "Ân sủng là một dạng tình yêu thuần khiết (vô điều kiện) mà Đấng Sáng Tạo dành cho ta không vì ta xứng đáng hay không, mà chỉ vì ta là con của Ngài. Và tình yêu đó luôn hiện diện.\nTrong bài học này, ACIM mời gọi chúng ta tin rằng: mình luôn được ưu ái như một đứa trẻ có thể thoải mái yêu cầu, nũng nịu, thậm chí “làm quá” một chút mà vẫn được yêu.\nVì vậy, đừng ngại yêu cầu điều bạn mong muốn từ Vũ trụ, từ Đấng Sáng Tạo. Không phải vì bạn đang xin xỏ, mà vì bạn đang mở lòng để đón nhận.\nPam Grout (tác giả người Mỹ) từng ví von rất hay rằng: năng lượng của Vũ trụ là vô hạn, nhưng ta giống như một chiếc điện trở,\nchính chúng ta với nỗi sợ và niềm tin hạn hẹp đã thu hẹp dòng năng lượng ấy lại, chỉ cho phép nó chảy qua một cách nhỏ giọt.\nHôm nay, thay vì tiếp tục thu nhỏ dòng chảy dư dả của mình, hãy cho phép bản thân mở ra.\nHãy nhớ rằng bạn thuộc về Nhất thể. Và dòng chảy ân sủng không chỉ dành cho ai đó “giác ngộ hơn” mà dành cho bạn ngay lúc này.\nCâu khẳng định thực hành hôm nay:\n“Nhờ ân sủng mà tôi sống. Nhờ ân sủng mà tôi được giải thoát.”\nCâu thầm niệm bạn có thể dùng: Thượng Đ
