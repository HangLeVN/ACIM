</main><script>
const L=[{"n": 1, "t": "Không có gì tôi nhìn thấy có ý nghĩa.", "s": "Nothing I see in this room means anything", "d": "Hướng dẫn thực hành:\nHãy NHÌN vào các vật xung quanh, bắt gặp bất cứ thứ gì đều thì thầm trong đầu hoặc thành tiếng ý: Thứ đó chẳng có ý nghĩa gì cả.\nDù là vật nhỏ hay lớn, có hình thù hay không có hình thù, không cần phân biệt.\nNếu có một sự kháng cự, thì kệ sự kháng cứ. Cứ lặp lại câu trên là được. Không cần phải thấy đúng. (hãy cứ vô tri thực hành thôi nhé.\nCó thể bạn sẽ thấy hơi buồn cười mà kệ nha. Vũ Trụ dẫn dắt đều có lý do cả đấy.\nLặp lại nhiều lần mỗi khi bạn nhớ đến bài tập. Tối thiểu 4-5 lần/ngày. Mỗi lần 2-3 phút (Hoặc 5-7 thứ).\nVí dụ: Khi bạn nhìn thấy một cái ghế, hãy nói:\n\"Cái ghế này không có ý nghĩa gì cả.\"\nHoặc “Cơn gió này chẳng có ý nghĩa gì cả”.\n“Cái xe này chẳng có ý nghĩa gì cả”. “Anh người yêu này chẳng có ý nghĩa gì cả”. “Bài tập này chẳng có ý nghĩa gì cả."}, {"n": 2, "t": "Tôi đã gán ý nghĩa cho mọi thứ tôi thấy (để phù hợp với tôi)", "s": "I have given everything I see all the meaning that it has for me.", "d": "Hướng dẫn thực hành:\nHãy NHÌN vào các vật xung quanh, bắt gặp bất cứ thứ gì đều thì thầm trong đầu hoặc thành tiếng ý: Tôi gán ý nghĩa cho cái này để phù hợp với tôi.\n- Dù là vật nhỏ hay lớn, có hình thù hay không có hình thù, không cần phân biệt.\n- Nếu có một sự kháng cự, thì kệ sự kháng cự. Cứ lặp lại câu trên là được. Không cần phải thấy đúng. (hãy cứ vô tri thả lỏng thực hành thôi nhé).\n- Lặp lại nhiều lần mỗi khi bạn nhớ đến bài tập. Tối thiểu 4-5 lần/ngày. Mỗi lần 2-3 phút (Hoặc 5-7 thứ).\nVí dụ: Khi bạn nhìn thấy một cái ghế, hãy nói: \"Tôi gán ý nghĩa cho cái ghế này để phù hợp với tôi\" Hoặc “Tôi gán ý nghĩa cho cái bút này để phù hợp với tôi”.\n“Tôi gán ý nghĩa cho cái đồng hồ này để phù hợp với tôi”.“Tôi gán ý nghĩa cho anh người yêu này để phù hợp với tôi”. “Tôi gán ý nghĩa cho bài tập này để phù hợp với tôi”."}, {"n": 3, "t": "Tôi không hiểu bất cứ điều gì tôi nhìn thấy.", "s": "I do not understand anything I see.", "d": "Hướng dẫn thực hành:\nHãy NHÌN vào các vật/người/hiện tượng xung quanh, bắt gặp bất cứ thứ gì đều thì thầm trong đầu hoặc thành tiếng ý: Tôi không hiểu cái … này.\nDù là vật nhỏ hay lớn, có hình thù hay không có hình thù, không cần phân biệt.\nNếu có một sự kháng cự, thì kệ sự kháng cự. Cứ lặp lại câu trên là được. Không cần phải thấy đúng. (hãy cứ vô tri thả lỏng thực hành thôi nhé).\n- Lặp lại nhiều lần mỗi khi bạn nhớ đến bài tập. Tối thiểu 4-5 lần/ngày. Mỗi lần 2-3 phút (Hoặc 5-7 thứ).\n-Không cần cố gắng giải thích tại sao bạn không hiểu. Hãy thực hành với tâm trí thoải mái, không phán xét\nVí dụ: Khi bạn nhìn thấy một cái ghế, hãy nói: \"Tôi không hiểu cái ghế này\" Hoặc “Tôi không hiểu cái bút này”. “Tôi không hiểu cái đồng hồ này”. “Tôi không hiểu người này”. “Tôi không hiểu bài tập này”. \"Tôi không hiểu cái tủ lạnh này\"."}, {"n": 4, "t": "Những suy nghĩ này không có ý nghĩa gì. Chúng giống như những thứ tôi nhìn thấy trong căn phòng này [trên con phố này, qua cửa sổ này, ở nơi này].", "s": "These thoughts do not mean anything. They are like the things I see in this room.", "d": "Hướng dẫn thực hành:\n- Bài tập này sẽ khác 3 bài tập đầu tiên. Nếu như trong 3 bài đầu tiên, bạn sẽ lựa chọn những thứ mà bạn NHÌN thấy, thì ở bài 4 này, bạn sẽ cần dành 1 PHÚT yên tĩnh quan sát những suy nghĩ đang diễn ra trong tâm trí bạn hoặc lướt qua tâm trí bạn.\n- Khoảng 3-4 lần mỗi ngày.\n- Bạn có thể nhắm mắt để “bắt lấy” suy nghĩ (nếu cần), hoặc bạn hoàn toàn có thể mở mắt.\n- Khi nhận ra một suy nghĩ bất kỳ, hãy áp dụng câu chủ đề: \"Suy nghĩ về [sự việc] này không có ý nghĩa gì. Cũng như những gì tôi đang thấy trong [nơi} này\"\nNếu bạn nhận ra mình có những suy nghĩ buồn phiền, hãy dùng chúng cho bài tập này. Tuy nhiên, đừng chỉ tập trung vào các suy nghĩ \"tiêu cực.\" Mà cứ thực tập với cả những suy nghĩ “tích cực”. Hãy để ý rằng suy nghĩ của bạn thường là một hỗn hợp, không thực sự \"tốt\" hay \"xấu.\" Đây là lý do tại sao chúng không có ý nghĩa gì.\nNhư là: Suy nghĩ \"Tôi thật giỏi khi hoàn thành dự án này\" cũng không có ý nghĩa thực sự. Kể cả suy nghĩ \"Tôi không đủ tốt để làm điều đó\" cũng không có giá trị gì.\nVí dụ thực hành:\n- \"Suy nghĩ này về việc làm việc nhà không có ý nghĩa gì. Cũng như những thứ tôi nhìn thấy trong căn phòng này.\"\n\"Suy nghĩ về mình giỏi giang không có ý nghĩa gì. Nó giống như những thứ tôi nhìn thấy trên con đường này.\"\n\"Suy nghĩ này về việc người yêu sao không nhắn tin cho tôi không có ý nghĩa gì. Nó giống như những thứ tôi nhìn thấy từ cửa sổ này.\""}, {"n": 5, "t": "Tôi “buồn phiền” không phải vì lý do mà tôi nghĩ.", "s": "I am never upset for the reason I think.", "d": "Hướng dẫn thực hành:\n- Quan sát nội tâm, khi có một cảm xúc tiêu cực như sợ hãi, lo lắng, chán nản, tức giận, ganh tị hay bất kỳ cảm xúc nào khác nổi lên hãy tự nhủ hoặc nói thầm: Tôi cảm thấy [cảm xúc tiêu cực] không phải vì lý do là [....] như tôi đang nghĩ.\nVí dụ 1: Khi bạn thấy bực mình vì có anh A huỷ hẹn sát giờ.\nThì hãy tự nhủ: Tôi thấy bực mình không phải vì anh A huỷ hẹn sát giờ như tôi đang nghĩ.\nVí dụ 2: Khi bạn cảm thấy cô đơn vì không có người yêu.\nThì hãy tự nhủ: Tôi cảm thấy cô đơn không phải vì không có người yêu như tôi đang nghĩ.\nVí dụ 3: Khi bạn cảm thấy đau bụng và bạn nghĩ là do đau bao tử.\nThì hãy tự nhủ: Tôi cảm thấy đau bụng không phải vì tôi đau bao tử như tôi đâng nghĩ\nVí dụ 4: Khi bạn cảm thấy bản thân thật tệ vì bạn không giữ được giới hạn cá nhân khiến người A bắt nạt bạn.\nThì hãy tự nhủ: Tôi cảm thấy tệ về chính mình không phải vì tôi không giữ được giới hạn cá nhân như tôi đang nghĩ.\nHOẶC 1 CÁCH VÔ CÙNG ĐƠN GIẢN: tôi đang có cảm xúc không tích cực này không phải vi lý do mà tôi đang nghĩ. (cách này áp dụng với mọi cảm xúc - mọi suy nghĩ không tích cực).\nDiễn giải:\nNhận thức rằng mọi cảm xúc tiêu cực đến từ các nguyên nhân sâu xa hơn bạn tưởng tượng. Tâm trí chúng ta sẽ thường tìm 1 nguyên nhân nào đó bên ngoài để làm “thủ phạm” cho một cảm xúc tiêu cực của mình.\nNhưng đó chỉ là những suy nghĩ chủ quan, thực chất không hoàn toàn là thế. Nguyên nhân vốn dĩ sâu xa hơn nhiều. Thậm chí cứ nghĩ theo lối mòn cũ còn khiến tiêu cực bên trong ngày càng nặng nề thêm.\nHơn nữa theo Nhất thể thì: Thế giới bên ngoài phóng chiếu nội tâm ta. Và bài tập này một lần nữa tách ta ra khỏi lối mòn suy nghĩ thông thường. Chuẩn bị cho những tư duy mới trong những bài tập sau.\nDặn dò thêm:\n- Không có cảm xúc nào là \"nhỏ\" hay \"lớn.\" Mỗi cảm xúc khó chịu, dù nhỏ đến đâu, đều ảnh hưởng đến sự bình an trong tâm trí bạn.\n- Nếu bạn thấy khó áp dụng ý tưởng này cho một số cảm xúc nhất định, hãy nhắc nhở bản thân: \"Không có cảm xúc buồn bực nào là nhỏ nhặt. Tất cả đều gây xáo trộn tâm trí tôi.\"\n- Bạn có thể cảm thấy không sẵn sàng áp dụng ý tưởng này cho một số cảm xúc hoặc tình huống nhất định. Trong trường hợp đó, hãy tự nhắc nhở: \"Tôi không thể giữ lại cảm xúc buồn bực này mà bỏ qua những cảm xúc khác. Đối với bài tập này, tôi sẽ coi tất cả cảm xúc buồn bực đều như nhau.\"\n- Lý do thật khiến bạn buồn phiền là gì thì bạn chưa cần kiếm câu trả lời vội, hãy cứ biết thế thôi nhé.\n- Mỗi lần thực hành, bạn chỉ cần thực hành với một điều khiến bạn buồn phiền, khó chịu… Hãy thoải mái thay từ “buồn phiền” bằng các từ mô tả cảm xúc linh hoạt phù hợp với bạn, như: sợ hãi, lo lắng, phát điên, ghen tị…\n-Thực hành 3- 4 lần trong ngày. Có thể làm nhiều hơn ở mức độ ổn với bạn."}, {"n": 6, "t": "Tôi buồn phiền bởi điều gì đó mà tôi không thấy.", "s": "I am upset because I see something that is not there.", "d": "Bài này chỉ tốn của bạn mỗi lần 1 phút thôi. 3-4 lần là đủ. dễ lắm nha cả lớp\nHướng dẫn thực hành:\nĐây là bài tập nối tiếp với bài học 05: Bài 5 nói rằng \"bạn không buồn phiền vì lý do bạn nghĩ\". Bài tập này đi sâu hơn, giải thích rằng\" cảm xúc buồn phiền xuất phát từ việc bạn thấy một điều không có thật, củng cố nhận thức về sự sai lệch của bản ngã.\"\n1. Quan sát tâm trí để tìm những cảm xúc khó chịu (tiêu cực) như tức giận, sợ hãi, lo lắng, hay chán nản, buồn, bất an... rồi áp dụng câu chủ đề.\n2. Ví dụ:\n\"Tôi tức giận với [ai đó] vì tôi thấy một điều gì đó không thấy.\"\n\"Tôi lo lắng về [một sự kiện] vì tôi thấy một điều gì đó không thấy.\"\n3. Thực hành 3- 4 lần trong ngày. Mỗi lần 1 cảm xúc là được. Có thể làm nhiều hơn ở mức độ ổn với bạn.\n4. Hoặc thậm chí bạn chỉ cần chép lại câu chủ đề với 1 vài cảm xúc “tiêu cực” cũng là đã hoàn thành rồi.\n5. Nếu thoải mái thì hôm nay ta sẽ thử ngẫm xem: Ta không buồn phiền vì lý do mà ta tưởng, ta buồn phiền vì 1 điều gì đó ta không nhìn thấy: Vậy thực ra ta buồn phiền vì điều gì nhỉ? :)\nCứ suy ngẫm rồi kệ đã thôi nhé."}, {"n": 7, "t": "Tâm trí tôi chỉ quẩn quanh với những suy nghĩ thuộc về quá khứ.", "s": "My mind is preoccupied with past thoughts.", "d": "Hướng dẫn thực hành:\nHãy nhắm mắt và bắt lấy một suy nghĩ bất kỳ. Và tự nhủ hoặc tự thì thầm:\n“Có vẻ như tôi ĐANG nghĩ về…[người/sự vật/sự việc/trạng thái…], nhưng tâm trí tôi chỉ quẩn quanh với quá khứ.”\nThực hành 4-5 lần trong ngày, mỗi lần chỉ cần thực hành với 1 suy nghĩ. Nếu có những cảm xúc hay kháng cự nào nổi lên bên trong bạn, hãy cứ để chúng sang một bên và tiếp tục thực hành, hoặc nếu có thể, dùng chính những kháng cự làm đối tượng thực hành.\nHãy nhớ bạn không cần phải đồng ý hay tin vào bài tập để có thể thực hành.\nVí dụ: Có vẻ như tôi đang nghĩ về cảm giác khó chịu của mình nhưng tâm trí tôi chỉ đang quẩn quanh với quá khứ."}, {"n": 8, "t": "Tâm trí tôi quẩn quanh với những suy nghĩ trong quá khứ.", "s": "", "d": "Hướng dẫn thực hành:\nỞ bài trước chúng ta đã khẳng định rằng: mình chỉ nhìn thấy quá khứ. Thì ở bài này, chúng ta sẽ nhấn mạnh hơn vào ý đó khi quan sát các suy nghĩ của mình.\nĐây là bài tập đầu tiên bạn nên nhắm mắt khi thực hành. Bạn sẽ bắt lấy một suy nghĩ trong đầu bạn và tự nhủ: “Có vẻ như tôi ĐANG nghĩ về…[người/sự vật/sự việc/trạng thái…], nhưng tâm trí tôi chỉ quẩn quanh với quá khứ.”\nVí dụ:\n- Có vẻ như tôi đang nghĩ về cái điện thoại này, nhưng tâm trí tôi chỉ quẩn quanh với quá khứ.\n- Có vẻ như tôi đang nghĩ về công việc này, nhưng tâm trí tôi chỉ quẩn quanh với quá khứ…\nThực hành 4-5 lần trong ngày, mỗi lần chỉ cần thực hành với 1 suy nghĩ.\nNếu có những cảm xúc hay kháng cự nào nổi lên bên trong bạn, hãy cứ để chúng sang một bên và tiếp tục thực hành, hoặc nếu có thể, dùng chính những kháng cự làm đối tượng thực hành.\nHãy nhớ bạn không cần phải đồng ý hay tin vào bài tập để có thể thực hành.\nBạn nên chép lại bài học theo cách của bạn."}, {"n": 9, "t": "Tôi không nhìn thấy bất cứ điều gì như nó đang là ở hiện tại.", "s": "I see nothing as it is now.", "d": "Hướng dẫn thực hành:\nChọn bất kỳ sự vật nào trong tầm mắt, bắt đầu từ những vật gần nhất và dần mở rộng phạm vi ra xa hơn. Thực hành câu chủ đề.\nVí dụ: \"Tôi không nhìn thấy chiếc máy tính này như nó đang là ở hiện tại.\"\n\"Tôi không nhìn thấy khuôn mặt này như nó đang là ở hiện tại.\"\nThực hành 3-4 lần trong ngày, mỗi lần kéo dài 3-5 phút.\nKhông loại trừ hoặc tập trung quá mức vào bất kỳ vật nào. Cứ nhìn lướt qua và thì thầm trong đầu hoặc thành tiếng.\nLiên kết với 8 bài tập trước:\nBài tập 1-3:\nTa nhận ra rằng sự vật không có ý nghĩa, ý nghĩa đó do ta gán, và ta không thực sự hiểu chúng. Bài tập 9 tiếp tục nhấn mạnh rằng ta không nhìn thấy sự vật như chúng đang là ở hiện tại.\nBài tập 4:\n\"Những suy nghĩ này không có ý nghĩa gì.\"\nTâm trí ta bị lấp đầy bởi những suy nghĩ không thực, ngăn cản ta nhìn thấy sự vật như chúng thực sự là.\nBài tập 5-6:\nTa không buồn phiền vì lý do ta nghĩ, mà vì ta thấy những điều không có thật. Bài tập 9 mở rộng: Ta không thể thấy sự thật vì tâm trí ta bị bóp méo bởi quá khứ.\nBài tập 7-8:\n\"Tôi chỉ nhìn thấy quá khứ.\"\n\"Tâm trí tôi đang quẩn quanh với những suy nghĩ thuộc về quá khứ.\"\nBài tập 9 nối tiếp bằng cách khẳng định rằng ta không nhìn thấy bất cứ điều gì đúng như nó là vì tâm trí ta đang chìm trong quá khứ."}, {"n": 10, "t": "Những suy nghĩ của tôi không có ý nghĩa gì cả.", "s": "My thoughts do not mean anything.", "d": "Hướng dẫn thực hành:\nBước 1: Nhắm mắt và lặp lại câu chủ đề thật chậm:\n\"Những suy nghĩ của tôi không có ý nghĩa gì. Ý tưởng này sẽ giúp tôi giải phóng khỏi tất cả những gì chưa toàn vẹn mà tôi hiện đang tin tưởng.\"\nBước 2: Dành khoảng một phút (4-5 lần/ngày) để quan sát các suy nghĩ xuất hiện trong tâm trí bạn. Không phán xét hay phân loại chúng. Hãy xem các suy nghĩ như một dòng người kỳ lạ đi ngang qua, không có ý nghĩa cá nhân nào với bạn.\nKhi nhìn ra một suy nghĩ tích cực hoặc kể cả tiêu cực nổi lên, đều hãy nhủ thầm hoặc thành tiếng: \"Suy nghĩ này về [nội dung] không có ý nghĩa gì cả.\" \"Suy nghĩ kia về [nội dung] không có ý nghĩa gì cả.\"\nVí dụ:\n\"Suy nghĩ này về công việc không có ý nghĩa gì cả.\"\n\"Suy nghĩ kia về cảm giác lo lắng không có ý nghĩa gì cả.\"\nBước 3: Sau 1 phút thực hành hãy tiếp tục tự nhủ: “Ý tưởng này sẽ giúp tôi giải phóng khỏi tất cả những gì chưa toàn vẹn mà tôi hiện đang tin tưởng”."}, {"n": 11, "t": "Những suy nghĩ vô nghĩa của tôi đang cho tôi thấy một thế giới vô nghĩa.", "s": "My meaningless thoughts are showing me a meaningless world.", "d": "Hướng dẫn thực hành:\nB1: Bắt đầu với mắt nhắm:\nNhắm mắt và lặp lại câu chủ đề thật chậm:\n\"Những suy nghĩ vô nghĩa của tôi đang cho tôi thấy một thế giới vô nghĩa.\"\nB2: Mở mắt và quan sát xung quanh:\nMở mắt ra và nhìn quanh, có thể nhìn gần, nhìn xa, nhìn lên, nhìn xuống, bất cứ nơi nào.\nTrong khoảng một phút, lặp lại câu chủ đề trong đầu một cách chậm rãi, không vội vã, không áp lực.\nB3: Di chuyển ánh mắt liên tục:\nHãy di chuyển ánh mắt từ vật này sang vật khác một cách nhanh chóng, nhưng không cần tập trung lâu vào bất kỳ vật gì.\nTrong khi đó, lặp lại câu chủ đề với một phong thái thư thả, thoải mái.\nB4: Kết thúc bài tập:\nKhi hoàn thành bài tập, hãy nhắm mắt lại và lặp lại câu chủ đề một lần nữa, thật chậm và từ tốn.\nTần suất thực hành:\nThực hiện bài tập này 3 lần mỗi ngày, nhưng nếu bạn cảm thấy thoải mái và muốn làm thêm, có thể thực hành tối đa 5 lần. Tuy nhiên, không nên làm nhiều hơn.\nLiên kết với 10 bài tập trước:\nBài tập 1-4: Bạn đã nhận ra rằng thế giới không có ý nghĩa thực sự, suy nghĩ của bạn không mang ý nghĩa, và bạn không hiểu gì về thế giới. Bài tập 11 củng cố rằng chính suy nghĩ vô nghĩa của bạn tạo nên một thế giới vô nghĩa.\nBài tập 5-6: Bạn không buồn phiền vì lý do bạn nghĩ, và bạn thấy những điều không thực sự tồn tại. Bài tập 11 mở rộng điều này: toàn bộ thế giới bạn thấy là sản phẩm của những suy nghĩ vô nghĩa.\nBài tập 7-9: Tâm trí bạn bị chi phối bởi quá khứ, ngăn cản bạn nhìn thấy sự vật đúng như chúng đang là. Bài tập 11 cho thấy rằng chính những suy nghĩ vô nghĩa gắn với quá khứ tạo nên nhận thức sai lệch của bạn."}, {"n": 12, "t": "Tôi phiền muộn vì tôi thấy một thế giới vô nghĩa.", "s": "I am upset because I see a meaningless world.", "d": "Hướng dẫn thực hành:\nB1: Mở mắt và quan sát xung quanh:\nNhìn xung quanh một cách chậm rãi, giữ nhịp độ đều đặn khi chuyển ánh mắt từ vật này sang vật khác.\nVừa quan sát vừa nhủ thầm hoặc thành tiếng: \"Tôi nghĩ rằng tôi nhìn thấy một thế giới đáng sợ, một thế giới nguy hiểm, một thế giới buồn bã…\"\nHãy sử dụng bất kỳ từ nào xuất hiện trong tâm trí, kể cả những từ tích cực như \"một thế giới tốt đẹp\" hoặc \"một thế giới khiến tôi hài lòng.\"\nB2: Kết thúc bằng câu chủ đề:\nSau khi hoàn thành quan sát, tự nhủ hoặc thành tiếng thêm: \"Nhưng tôi phiền muộn vì tôi nhìn thấy một thế giới vô nghĩa.\"\nTần suất thực hành:Thực hành 3-4 lần mỗi ngày, không quá một phút mỗi lần. Nếu bạn cảm thấy áp lực, có thể dừng bài tập ngay."}, {"n": 13, "t": "Một thế giới vô nghĩa tạo ra những nỗi sợ.", "s": "A meaningless world engenders fear.", "d": "Hướng dẫn thực hành:\nB1: Bắt đầu với mắt nhắm:\nNhắm mắt và lặp lại câu chủ đề thật chậm:\n\"Một thế giới vô nghĩa tạo ra nỗi sợ hãi.\"\nB2: Mở mắt ra và nhìn xung quanh:\nQuan sát mọi thứ xung quanh bạn một cách chậm rãi, với nhịp độ đều đặn. Khi nhìn, hãy nói với chính mình:\n\"Tôi đang nhìn thấy một thế giới vô nghĩa.\"\nB3: Nhắm mắt lại và kết luận:\nSau khi hoàn thành quan sát, kết luận bằng câu:\n\"Một thế giới vô nghĩa tạo ra nỗi sợ bởi vì tôi nghĩ rằng mình đang đấu tranh với Đấng Sáng Tạo.\"\nTần suất thực hành:Thực hành 3-4 lần mỗi ngày, không quá một phút mỗi lần. Nếu bạn cảm thấy áp lực, có thể dừng bài tập ngay."}, {"n": 14, "t": "Đấng Sáng Tạo không tạo ra một thế giới vô nghĩa.", "s": "God did not create a meaningless world.", "d": "Hướng dẫn thực hành:\nB1: Nhắm mắt lại khoảng 30-60s:\nTập trung vào các hình ảnh hoặc suy nghĩ về những thảm hoạ đang hiện ra trong tâm trí bạn.\nB2: Vẫn nhắm mắt phủ nhận sự thật của chúng bằng câu:\n\"Đấng Sáng Tạo không tạo ra [tình huống cụ thể], vì vậy nó không có thực.\"\nVí dụ: \"Đấng Sáng Tạo không tạo ra lũ lụt ở khắp Việt Nam vì vậy nó không có thực.\"\nVí dụ: \"Đấng Sáng Tạo không tạo ra các cơn bão, vì vậy nó không có thực.\"\nB3: Vẫn nhắm mắt kết thúc bằng câu chủ đề:\n\"Đấng Sáng Tạo không tạo ra một thế giới vô nghĩa.\"\nThực hành khoảng 3 lần mỗi ngày:\nMỗi lần kéo dài không quá một phút. Nếu bạn cảm thấy thoải mái, có thể thực hành thêm mở rộng ra những thứ vụn vặt trong đời sống của bạn:\nVí dụ: \"Đấng Sáng Tạo không tạo ra cục mụn trên mặt tôi, vì vậy nó không có thực.\"\nVí dụ: \"Đấng Sáng Tạo không tạo ra trục trặc trong công việc của tôi, vì vậy nó không có thực.\""}, {"n": 15, "t": "Những suy nghĩ của tôi là hình ảnh mà tôi đã tạo ra.", "s": "My thoughts are images which I have made.", "d": "Hướng dẫn thực hành:\nBài tập này cực đơn giản: Hãy chọn và nhìn vào 1 đồ vật trong tầm mắt và tự nhủ hoặc nói thầm: (Cái này) là hình ảnh mà tôi tạo ra.\nVí dụ: Dòng chữ này là hình ảnh do tôi tạo ra; Cái điện thoại này là hình ảnh do tôi tạo ra; Anh người yêu này là hình ảnh do tôi tạo ra.\nHá há, gõ tới đây mình phì cười ha ha. Ủa, hông lẽ thật? Vậy muốn đổi chồng dễ òm nhề :') :') :')  Nếu bạn quá khó để thực hành với 1 người thì chỉ cần thực hành với các đồ vật nha.\nChọn 1 đồ vật và nhìn vào nó khoảng một phút.\nThực hành 3 lần mỗi ngày, mỗi lần kéo dài dưới một phút nếu cảm thấy không thoải mái.\nVẫn là lời nhắc nhở: Cứ vô tri đi thôi."}, {"n": 16, "t": "Tôi không có suy nghĩ trung lập.", "s": "I have no neutral thoughts.", "d": "Hướng dẫn thực hành:\nNhắm mắt lại và quan sát suy nghĩ của mình:\nKhi thấy một suy nghĩ xuất hiện, hãy tự nhủ hoặc thì thầm:\n\"Suy nghĩ của tôi về/rằng_____ không phải là một suy nghĩ trung lập, vì không có suy nghĩ nào của tôi trung lập.\"\nVí dụ: Suy nghĩ của tôi về việc chị A đang ghét tôi không phải là một suy nghĩ trung lập, vì không có suy nghĩ nào của tôi trung lập.\nVí dụ: Suy nghĩ của tôi về thời tiết ngày mai không phải là một suy nghĩ trung lập, vì không có suy nghĩ nào của tôi trung lập.\nVí dụ: Suy nghĩ của tôi rằng anh người yêu tôi đang bớt yêu tôi không phải là một suy nghĩ trung lập, vì không có suy nghĩ nào của tôi trung lập.\nThực hành 3-5 lần mỗi ngày, mỗi lần khoảng một phút. Mỗi lần chỉ lần thực hành với 1 suy nghĩ cụ thể. Có thể làm nhiều hơn nếu bạn thấy ổn."}, {"n": 17, "t": "Không có gì tôi nhìn thấy là trung lập.", "s": "I see no neutral things.", "d": "Hướng dẫn thực hành:\nMở mắt ra NHÌN các đồ vật xung quanh và tự nhủ hoặc thì thầm:\n\"Tôi không nhìn thấy một _____ trung lập, vì suy nghĩ của tôi về _____ là không trung lập.\"\nVí dụ: \"Tôi không nhìn thấy một cái áo trung lập, vì suy nghĩ của tôi về cái áo là không trung lập.\"\nVí dụ: “Tôi không nhìn thấy mẹ chồng tôi trung lập, vì suy nghĩ của tôi về mẹ chồng là không trung lập”.\nVí dụ: “Tôi không nhìn thấy cục mụn trung lập, vì suy nghĩ của tôi về cục mụn là không trung lập”.\nĐừng phân biệt giữa đồ vật sống hay không sống, dễ chịu hay khó chịu. Tất cả đều phản ánh suy nghĩ của bạn.\nThực hành 3-5 lần mỗi ngày, mỗi lần khoảng một phút. Mỗi lần chỉ lần thực hành với 1 suy nghĩ cụ thể. Có thể làm nhiều hơn nếu bạn thấy ổn.\nLiên kết với 16 bài tập trước:\nBài tập 1-10:\nBạn học cách nhận ra thế giới không có ý nghĩa tự thân, và suy nghĩ của bạn cũng không mang ý nghĩa đúng với sự thật TOÀN VẸN.\nBài tập 11-16:\nBạn hiểu rằng suy nghĩ tạo ra hình ảnh và thế giới bạn thấy là kết quả của những suy nghĩ đó.\nBài tập 17 mở rộng: Những gì bạn nhìn thấy không trung lập, bởi vì suy nghĩ của bạn không trung lập."}, {"n": 18, "t": "Không chỉ mình tôi chịu tác động bởi cách tôi nhìn.", "s": "I am not alone in experiencing the effects of my seeing.", "d": "Hướng dẫn thực hành:\nChọn 1 đồ vật/người… xung quanh nhìn khoảng 20-30s rồi tự nhủ hoặc thì thầm:\n\"Không chỉ mình tôi chịu tác động bởi cách tôi nhìn [tên đồ vật] này\"\nVí dụ:\nKhông chỉ mình tôi chịu tác động bởi cách tôi nhìn bài tập này.\nKhông chỉ mình tôi chịu tác động bởi cách tôi nhìn bức tường này.\nKhông chỉ mình tôi chịu tác động bởi cách tôi nhìn chiếc body mờ lem này.\nKết thúc bằng câu chủ đề tổng quát:\nKhông chỉ mình tôi chịu tác động bởi cách tôi nhìn.\nThời gian thực hành:\nThực hiện khoảng 3-4 lần mỗi ngày, mỗi lần khoảng 1 phút."}, {"n": 19, "t": "Không chỉ mình tôi chịu tác động bởi suy nghĩ của tôi.", "s": "I am not alone in experiencing the effects of my thoughts.", "d": "Hướng dẫn thực hành:\nNhắm mắt lại và quan sát suy nghĩ của mình:\nKhi thấy một suy nghĩ xuất hiện, hãy bắt lấy suy nghĩ đó và tự nhủ hoặc thì thầm:\nKhông chỉ mình tôi chịu tác động bởi cách tôi nghĩ về _____.\nVí dụ: Không chỉ mình tôi chịu tác động bởi cách tôi nghĩ về bài tập này.\nVí dụ: Không chỉ mình tôi chịu tác động bởi cách tôi nghĩ về nỗi buồn này.\nVí dụ: Không chỉ mình tôi chịu tác động bởi cách tôi nghĩ về niềm vui này.\nVí dụ: Không chỉ mình tôi chịu tác động bởi suy nghĩ về việc giảm eo mặc đẹp đón tết. hihi.\nKết thúc mỗi buổi thực hành, nhắc lại ý tưởng tổng quát:\n\"Không chỉ mình tôi chịu tác động bởi suy nghĩ của tôi”.\nThực hành 3-5 lần mỗi ngày, mỗi lần khoảng một phút. Mỗi lần chỉ lần thực hành với 1 suy nghĩ cụ thể. Có thể làm nhiều hơn nếu bạn thấy ổn.\nMục đích bài tập:\nNhận ra sức mạnh của suy nghĩ:\nHiểu rằng suy nghĩ của ta không chỉ ảnh hưởng đến ta, mà còn ảnh hưởng đến toàn bộ tâm trí được kết nối.\nThấy rõ sự kết nối tâm trí:\nMọi suy nghĩ của ta đều để lại dấu ấn trong mạng lưới tâm trí chung – không có suy nghĩ nào là \"riêng tư.\"\nChịu trách nhiệm với suy nghĩ của mình:\nHiểu rằng suy nghĩ không phải là thứ ta có thể giữ riêng cho bản thân, mà chúng có sức lan tỏa và tác động đến mọi người xung quanh.\nMở đường cho sự thay đổi:\nKhi ta nhận ra sự kết nối tâm trí, ta cũng hiểu rằng sự thay đổi trong suy nghĩ của ta có thể mang lại hòa bình và chữa lành cho toàn bộ mạng lưới tâm trí mà ta có sự kết nối. Từ đó củng cố niềm tin tuyệt đối: Đời thay đổi khi ta thay đổi.\nHôm nay mỗi khi soi gương hãy tự nhủ: không chỉ mình tôi chịu tác động bởi cách tôi nghĩ về khuôn mặt xinh đẹp này :-* :-*\nMỗi lần bạn chăm sóc cơ thể, sức khoẻ, học tập, phát triển bản thân hãy hiểu rằng không chỉ mình bạn chịu tác động bởi sự chăm chỉ này. Và ta thực hành ko chỉ vì một mình mình. Mà 1 người sẽ ảnh hưởng cả 1 tập thể."}, {"n": 20, "t": "Tôi quyết tâm nhìn thấy.", "s": "I am determined to see.", "d": "Hướng dẫn thực hành:\nỞ các bài tập trước, chúng ta đã thực hành để hiểu rằng tâm trí chúng ta chỉ đang nhìn thấy và nghĩ về một thế giới không đúng như \"sự thật toàn vẹn\". Vậy bài tập này đơn giản là gieo một ý định liên tục: “TÔI QUYẾT TÂM NHÌN THẤY”.\nHãy nói câu này càng nhiều lần càng tốt. Tần suất khuyến khích là khoảng 30p một lần.\nKhuyến khích các bạn lâu lâu nhớ ra thì GÕ lại câu chủ đề nhắn tin vào group lớp: “TÔI QUYẾT TÂM NHÌN THẤY”. Vừa tự mình thực hành, vừa gieo hạt giống giúp các bạn khác cũng vô thức nhẩm đọc.\nSuốt cả ngày, nhắc nhở bản thân rằng bạn quyết tâm \"thấy\", và việc này cũng là ngầm thừa nhận rằng bạn hiện tại chưa thực sự \"thấy\". Khoan vội suy nghĩ là THẤY CÁI GÌ, chỉ cần gieo một ý định vậy thôi nhé. Các bài tập sau sẽ dần hé mở thêm từng chút một.\nLưu ý: nói bằng câu khẳng định - nhấn mạnh khi nhẩm đọc ở thì hiện tại. Không chèn thêm từ “sẽ” ở đây.\nCó một vài cách dịch khác tương tự, bạn hãy dùng câu nào khiến bạn cảm nhận chạm đến quyết tâm cao nhất trong tim mình ví dụ: “Tôi nhất định nhìn thấy”, “Tôi quả quyết nhìn thấy”"}, {"n": 21, "t": "Tôi nhất định/quyết tâm nhìn mọi thứ khác đi.", "s": "I am determined to see things differently.", "d": "Hướng dẫn thực hành:\nBài tập hôm nay là sự mở rộng của bài tập 20 nhưng với mức độ cụ thể hơn cho môt từng tình huống/con người/thuộc tính cụ thể khiến bạn không thoải mái như khó chịu, tức giận…\nB1: Bắt đầu với câu chủ đề: Nhắm mắt và tự nhủ hoặc thành tiếng: \"Tôi nhất định nhìn mọi thứ khác đi.\"\nB2: Tìm trong tâm trí những tình huống hoặc con người mà bạn cảm thấy tức giận, khó chịu, hoặc không thoải mái và chúng ta sẽ dùng câu khẳng định: “Tôi nhất định nhìn … khác đi” khi nghĩ về những điều đó.\nVí dụ: Tôi nhất định nhìn công việc khác đi.\nVí dụ: Tôi nhất định nhìn tổn thương tuổi thơ của tôi khác đi. (có thể gọi tên tổn thương).\nVí dụ: Tôi nhất định nhìn cách làm việc của anh A khác đi.\nVí dụ: Tôi nhất định nhìn vấn đề trên cơ thể của tôi khác đi. (Có thể gọi tên vấn đề).\nB3: Kết thúc với câu chủ đề: Nhắm mắt và tự nhủ hoặc thành tiếng: \"Tôi nhất định nhìn mọi thứ khác đi.\"\nKhông vội phải biết khác đi là như thế nào là tốt hơn hay xấu hơn, cũng không cần tìm câu trả lời, cũng không phải bạn đang cố phủ định hay bao biện cho người đó, tình huống đó. Đơn giản là khẳng định nhìn khác đi là được nhé.\nThực hành 5 lần mỗi lần khoảng 1 phút. Thỉnh thoảng bạn có thể tự nhẩm câu chủ đề. Khuyến khích bạn nhắn vào lớp để các bạn khác cũng được nhắc bài."}, {"n": 22, "t": "Những gì tôi thấy là một dạng của sự thù địch.", "s": "What I see is a form of vengeance.", "d": "Bạn cũng có thể thay thế bằng: “Những gì tôi thấy đều biểu hiện cho nỗi sợ”.\nDiễn giải: Thực ra thì từ thời tiền sử đến nay, bản năng tâm trí của loài người không vận hành theo cách để chúng ta hạnh phúc, mà nó vận hành để chúng ta sinh tồn. Vì vậy khi nhìn vào mọi thứ ta có xu hướng nhìn thấy các nguy cơ của sự hao mòn, mất mát, lão hoá, đổ vỡ, khó khăn, áp lực, khiển trách, phán xét… Bài tập này đang giúp chúng ta nhận ra bản năng đã ảnh hưởng rất lớn đến cách chúng ta nghĩ về mọi vấn đề từ đó dần điều chỉnh tâm trí tin vào sự an toàn, trọn vẹn, trường tồn và dư dả mọi mặt.\nHướng dẫn thực hành:\nQuan sát thế giới xung quanh:\nCách 1: Mở mắt nhìn xung quanh một cách chậm rãi từ vật này sang vật khác, từ người này sang người khác và tự nhủ hoặc thì thầm thành tiếng 4 ý sau:\n1. \"Bấy lâu nay tâm trí tôi chỉ thấy những thứ có nguy cơ sẽ già cỗi, sẽ hư hao, sẽ mất đi, sẽ vỡ vụn, sẽ rạn nứt, sẽ cạnh tranh… (có thể thay cách mô tả khác mà bạn thấy phù hợp khi quan sát).\n2. \"Tôi không thấy gì là vĩnh cửu.\"\n3. \"Những gì tôi thấy không có thật.\"\n4. \"Những gì tôi thấy là một dạng của sự thù địch”\nDừng 1 chút và kết thúc bằng câu tự hỏi bản thân:\n\"Đây có phải là thế giới mà tôi thực sự muốn thấy?\"\nChỉ cần 5 lần mỗi lần một phút, nhưng hãy chú ý đến từng đối tượng và lặp lại bài tập một cách chậm rãi.\nCách 2 (Làm cả 2 càng tốt): Chọn một điều (trực tiếp hay gián tiếp tác động đến bạn) từ thế giới bên ngoài khiến gợi lên trong bạn cảm giác không ổn. Bạn gọi điều đó ra và tự nhủ: “Tôi buồn phiền vì cho rằng điều đó đang chống lại/tấn công mình. Điều đó không thật. Những gì tôi thấy là một dạng của sự thù địch.\nDừng 1 chút và kết thúc bằng câu tự hỏi bản thân:\n\"Đây có phải là thế giới mà tôi thực sự muốn thấy?\"\nVí dụ 1:\nBạn đang bị mắc kẹt trong một đoạn đường kẹt xe. Âm thanh còi xe và sự chen lấn khiến bạn khó chịu, bực bội, và cảm thấy mọi thứ đang \"chống lại\" mình.\nThực hành:\n\"Tôi buồn phiền vì cho rằng đoạn đường kẹt xe này đang chống lại mình.\"\n\"Điều đó không thật. Những gì tôi thấy là một dạng của sự thù địch.\"\nDừng lại vài giây, rồi tự hỏi:\n\"Đây có phải là thế giới mà tôi thực sự muốn thấy?\"\nVí dụ 2:\nMột đồng nghiệp phê bình bạn trước mặt mọi người trong buổi họp. Bạn cảm thấy bị tổn thương, xấu hổ và tức giận, như thể đồng nghiệp đang cố tình \"tấn công\" bạn.\nThực hành:\n\"Tôi buồn phiền vì cho rằng lời phê bình của đồng nghiệp đang tấn công mình. \"Điều đó không thật. Những gì tôi thấy là một dạng của sự thù địch.\"\nDừng lại một chút, rồi tự hỏi:\n\"Đây có phải là thế giới mà tôi thực sự muốn thấy?\"\nVí dụ 3. Bạn giao tiếp với mẹ bạn nhưng bà nói được vài câu đã khiến bạn cáu. Bạn nói: “Tôi cáu khi nói chuyện với mẹ tôi. Tôi cáu vì cho rằng mẹ đang cố làm tôi tổn thương. Điều này không thật. Những gì tôi thấy là một dạng của sự thù địch.\nDừng 1 chút và kết thúc bằng câu tự hỏi bản thân:\n\"Đây có phải là thế giới mà tôi thực sự muốn thấy?\"\nThực hành 5 lần trong ngày, mỗi lần khoảng 1 phút chỉ cần với 1 tình huống là được."}, {"n": 23, "t": "Tôi có thể thoát khỏi thế giới tôi đang thấy bằng cách dừng các ý nghĩ tấn công.", "s": "I can escape from the world I see by giving up attack thoughts.", "d": "Diễn giải: Suy nghĩ tấn công ở đây có thể là những phán xét, nghĩ không tốt về ai đó, hả hê khi người đó gặp điều không may, hay bức xúc bởi một việc nào đó do ai đó gây ra…\nLưu ý: Thực hành cả ý nghĩ rằng mình bị ai đó tấn công: Hãy coi các ý nghĩ tấn công và bị tấn công là giống nhau, ngay cả khi bạn chưa hoàn toàn hiểu tại sao lại như thế.\nHướng dẫn thực hành: Trong ngày hãy sử dụng câu chủ đề mỗi khi bạn cảm thấy cần thay đổi cách nhìn nhận thế giới.\nThực hành chủ động khoảng 5 lần:\nBước 1: Nhìn xung quanh, lặp lại câu chủ đề:\n\"Tôi có thể thoát khỏi thế giới tôi đang thấy bằng cách dừng các ý nghĩ tấn công.\"\nBước 2: Dành một phút để nhắm mắt tìm kiếm những ý nghĩ tấn công hoặc cảm giác mình bị tấn công.\nKhi nhận diện được ý nghĩ, hãy tự nhủ hoặc thì thầm thành tiếng:\n\"Tôi có thể thoát khỏi thế giới bằng cách dừng ý nghĩ tấn công về ___.\"\nHoặc \"Tôi có thể thoát khỏi thế giới bằng cách dừng ý nghĩ bị [nguời nào đó]___ tấn công”."}, {"n": 24, "t": "Tôi không nhận thức được những điều tốt nhất cho bản thân mình.", "s": "I do not perceive my own best interests.", "d": "Diễn giải: Trong những nội dung trước ta đã nhận ra tâm trí chúng ta chỉ trí mình chỉ nhìn thấy một phần của sự thật toàn vẹn và bị chi phối bởi chương trình ký ức, vì vậy “nó” cũng không nhận thức được đâu là điều tốt nhất trong từng tình huống.\nThông thường khi nhận được câu hỏi tình huống của học viên các lớp Hẹn Hò/Tình Yêu/ Đồng Hành cá nhân… mình thường hỏi các bạn: Trong tình huống này em đang cảm thấy sao và em đang muốn thế nào?\n- Đa số ban đầu các bạn khá luẩn quẩn không có câu trả lời đúng trọng tâm. Có những bạn mình phải đặt thêm dăm/bảy/chục câu hỏi nữa bạn mới tự khám phá “ồ ra là em đang muốn thế”.\n- Thậm chí tâm trí đôi khi còn muốn những mục đích A, B, C trong 1 tình huống và các mong muốn này mâu thuẫn nhau, hoặc những mong muốn này mâu thuẫn với mong muốn khác trong cuộc đời.\nHướng dẫn thực hành: Thực hành 5 lần mỗi ngày. Mỗi lần dành khoảng 2 phút để tìm kiếm các tình huống chưa được giải quyết.\nB1: Bắt đầu bằng câu chủ đề:\nNhắm mắt lại và nhắc nhở bản thân:\n\"Tôi không nhận thức được những điều tốt nhất cho bản thân mình.\"\nB2: Xem xét tình huống:\nNghĩ đến và chọn một tình huống bạn đang quan tâm hoặc chưa giải quyết, chẳng hạn:\nMột cuộc tranh cãi.\nMột quyết định quan trọng.\nMột vấn đề trong công việc.\n...\nB3: Liệt kê mục tiêu mong muốn:\nVới mỗi tình huống, ghi nhận các mục tiêu mà bạn muốn đạt được:\n\"Trong tình huống liên quan đến ___, tôi muốn ___ xảy ra, và ___xảy ra, và cả ….. xảy ra..\"\nCố gắng liệt kê tất cả các mục tiêu, ngay cả những mục tiêu khác trong cuộc sống có vẻ không liên quan trực tiếp đến tình huống.\nB4: Dừng lại 1 chút (30s)  suy ngẫm để nhận ra mâu thuẫn:\nKhi liệt kê, bạn sẽ nhận ra rằng nhiều mục tiêu của bạn mâu thuẫn hoặc không liên quan đến tình huống.\nĐiều này cho thấy bạn thực sự không biết điều gì là tốt nhất cho mình.\nB5: Kết thúc bằng câu chủ đề:\nSau khi xem xét từng tình huống, tự nhủ:\n\"Tôi không nhận thức được điều gì là tốt nhất cho mình trong tình huống này.\"\nVí dụ: Tình huống: Bạn đang cân nhắc nhận một công việc mới với mức lương cao hơn nhưng áp lực hơn. Bạn nghĩ rằng tiền lương cao sẽ làm bạn hạnh phúc.\nỞ bước 3, đây có thể là 1 số mục tiêu sẽ nảy ra khi bạn suy ngẫm:\n\"Trong tình huống này, tôi muốn có mức lương cao hơn.\"\n\"Tôi muốn có sự ổn định tài chính.\"\n\"Tôi muốn công việc này giúp tôi tự hào hơn.\"\n“Tôi cũng muốn thảnh thơi hơn, không áp lực”.\n\"Tôi muốn hạnh phúc\".\n“Tôi muốn có một ngôi nhà ở vùng quê”.  (Không liên quan, nhưng tâm trí nó vẫn nảy ra)\n“Thậm chí tôi cũng muốn có một thân hình quyến rũ” (Không liên quan, nhưng tâm trí nó vẫn nảy ra)\n..\nCứ liệt kê ra hết, bạn sẽ thấy tâm trí của bạn đang bị xoay mòng mòng giữa mớ bòng bong đủ thứ loại mong muốn ra sao.\nMục đích bài tập:\nNhận ra giới hạn của nhận thức cá nhân: Bạn nhận ra tâm trí mình không thực sự hiểu điều gì sẽ làm mình hạnh phúc hoặc điều gì tốt nhất cho mình. Bạn cũng nhận ra sự nỗ lực trong vô vọng, bất lực của tâm trí để yêu thương và giúp đỡ bạn ra sao.\nBuông bỏ sự kiểm soát sai lầm: Bài tập khuyến khích bạn buông bỏ niềm tin rằng tâm trí bạn biết rõ mọi thứ và mở lòng để học hỏi, để được hướng dẫn.\nHiểu rõ các mâu thuẫn trong tâm trí: Bạn nhận thức rằng các mục tiêu và kỳ vọng của bạn thường không thống nhất và gây ra thất vọng, tiêu cực không rõ lý do. Dù thực tế chẳng cần phải vội thất vọng gì cả, chuyện đâu còn có đó.\nĐặt nền tảng cho sự học hỏi: Đây là giai đoạn unlearn của hành trình, việc ta nhận ra mình không biết, ta sẽ sẵn sàng hơn để thay đổi cách nhìn nhận và được hướng dẫn đến những điều thực sự tốt đẹp."}, {"n": 25, "t": "Tôi không biết mọi thứ để làm gì.", "s": "I do not know what anything is for.", "d": "Diễn giải: Thông thường khi nhìn vào 1 vật nào đó, ta sẽ nghĩ ngay đến một lợi ích bề mặt nào đó khi sử dụng nó. Vd: Chiếc điện thoại này là để vào facebook. Nhưng đó chỉ là lợi ích bề mặt mà bản ngã ta sơ sài gắn vào. Còn thực tế mục đích ẩn sâu hơn nữa của việc vào facebook là để làm gì? - Giả dụ là để học hỏi. Vậy học hỏi để làm gì?...\nNếu bạn liên tục lặp lại câu hỏi: để làm gì… Dần dần bạn sẽ nhận thấy: Tôi thực sự chẳng biết tôi dùng điện thoại vào facebook là để làm gì cả.\nTóm lại bài tập 25 giúp ta nhận ra rằng ta đã hiểu sai mục đích của mọi thứ trong cuộc sống do những mục tiêu cá nhân sai lệch. Khi ta khẳng định câu này, thì ta khẳng định với chính mình về sự giới hạn và sai lầm của tâm trí, từ đó ta mở ra khả năng nhìn thấy mục đích thật sự sẽ dần rõ ràng hơn trong chuỗi các bài tập sau này.\nHướng dẫn thực hành:\nThực hành 6 lần mỗi ngày:\nDành 2 phút cho mỗi lần thực hành, nhìn xung quanh và tập trung vào các vật thể hoặc bộ phận cơ thể.\nBắt đầu bằng câu chủ đề:\nLặp lại chậm rãi:\n\"Tôi không biết bất cứ điều gì để làm gì.\"\nQuan sát và nói:\nNhìn vào một đối tượng (gần hoặc xa, quan trọng hoặc không quan trọng), dừng ánh mắt ở đó, và nói:\n\"Tôi không biết [tên đối tượng] để làm gì.\"\nVí dụ:\n\"Tôi không biết chiếc ghế này để làm gì.\"\n\"Tôi không biết cây bút này để làm gì.\"\n\"Tôi không biết bàn tay này để làm gì.\"\nDi chuyển sang đối tượng tiếp theo:\nSau khi nói xong, di chuyển ánh mắt sang đối tượng khác và lặp lại bài tập.\nNhận thức:\nBài tập không yêu cầu bạn tìm ra câu trả lời. Mục đích là giúp bạn nhận ra rằng bạn đã gán mục đích sai cho mọi thứ và mở lòng để hiểu mục đích thật sự."}, {"n": 26, "t": "Những ý nghĩ tấn công của tôi đang tấn công sự bất khả xâm phạm của tôi.", "s": "My attack thoughts are attacking my invulnerability.", "d": "Diễn giải: \"Những ý nghĩ tấn công\" trong bối cảnh của A Course in Miracles (ACIM) không phải là hành động tấn công vật lý, mà là bất kỳ suy nghĩ nào mang tính tiêu cực, chia rẽ, phán xét, chê bai, trách móc hoặc phản kháng. Chúng là những suy nghĩ xuất phát từ nỗi sợ hãi, bản ngã, và mong muốn kiểm soát hoặc phán xét..\nKhi bạn có ý nghĩ tấn công, dù nhắm vào người khác hay bản thân, bạn đều cảm thấy lo lắng, sợ hãi hoặc tức giận. Những cảm xúc này trước khi gây ra tổn hại cho người khác thì đã “kéo tụt” RĐNL của bạn xuống thấp. Khi RĐNL thấp bạn suy yếu và trở nên dễ tổn thương.\nVí dụ: Khi ta đang thất vọng về bản thân trong công việc, chỉ cần 1 câu nói không khéo léo của người thân cũng có thể khiến ra oà khóc vì tủi thân.\nỞ đây: thất vọng về bản thân là ý nghĩ phán xét, chê bai chính mình -> Ý nghĩ tấn công.\nKhi tâm trí bạn đầy ý nghĩ tấn công, bạn sẽ nhìn thế giới qua lăng kính của sự thù địch, chia rẽ, và luôn phải đề phòng các nguy cơ. Điều này khiến bạn cảm thấy thế giới đầy rẫy nguy hiểm và không an toàn.\nTrong khi bản chất thực sự thì thế giới này vô cùng an toàn. Và mọi chuyện diễn ra là để hỗ trợ chúng ta trải nghiệm hành trình mà LINH HỒN MÌNH CHỌN TRẢI NGHIỆM.\nTóm lại là: Khi ta khởi lên 1 ý nghĩ tấn công chính mình hoặc người khác, ta vô tình đưa bản thân vào trạng thái RĐNL thấp, điều này khiến ta trở nên suy yếu và dễ bị xâm phạm.\nBài tập này là một câu thủ thỉ tâm tình với “tâm trí” để “nó” dần hiểu ra bản chất những suy nghĩ tiêu cực, từ đó dần từ bỏ góc nhìn tiêu cực để lựa chọn góc nhìn tích cực mang RĐNL cao.\nNhớ rằng: Vốn dĩ bản thân bạn thực sự bất khả xâm phạm, bình an và mạnh mẽ.\nHướng dẫn thực hành:\nThực hành 6 lần. Mỗi lần chọn 1 tình huống thực hành khoảng 2 phút.\nB1: Bắt đầu bằng câu chủ đề:\nNhắm mắt lại, lặp lại chậm rãi:\n\"Những ý nghĩ tấn công của tôi đang tấn công sự bất khả xâm phạm của tôi.\"\nB2: Nghĩ đến MỘT tình huống chưa giải quyết khiến bạn cảm thấy tiêu cực như: lo lắng, tức giận, sợ hãi, hoặc bận tâm…, như một cuộc tranh cãi, một vấn đề tài chính, hoặc một nỗi sợ tương lai. Tự nói: Tôi đang  ___ về  ___\nVí dụ: Tôi đang lo lắng về bản báo cáo công việc.\nB3: Với mỗi tình huống, liệt kê cụ thể các kết quả mà bạn lo lắng:\n\"Tôi sợ rằng ___ sẽ xảy ra.\"\nVí dụ:\n\"Tôi sợ rằng tôi sẽ không hoàn thành kịp deadline”\n\"Tôi sợ rằng tôi sẽ mất công việc này.\"\n\"Tôi sợ rằng tôi sẽ bị phán xét.\"\nB4: Sau khi liệt kê từng kết quả sợ hãi, tự nhủ:\n\"Ý nghĩ đó là một sự tấn công vào chính tôi.\"\nB5: Kết thúc bằng câu chủ đề:\n\"Những ý nghĩ tấn công của tôi đang tấn công sự bất khả xâm phạm của tôi.\""}, {"n": 27, "t": "Trên tất cả, tôi muốn được nhìn thấy.", "s": "Above all else I want to see.", "d": "Diễn giải:\n1. “Nhìn thấy” ở đây có thể hiểu là nhìn thấy mọi thứ bằng “con mắt của Thượng Đế”. Con mắt của Thượng Đế là góc nhìn đầy niềm tin, đầy thấu hiểu, bao dung, yêu thương mọi sự trên nền tảng của một “nội tâm” vững chãi và đủ đầy.\n2. Cũng có thể hiểu: “Nhìn thấy” ở đây là nhìn thấy Thượng Đế “ngự trị” mọi sự. Thượng đến chính là niềm tin, là tình yêu thương, là bao dung, hỗ trợ, nâng đỡ…\n- Bài tập này một lần nữa là một câu khẳng định nhấn mạnh thêm bài tập 21,22.\n- Lưu ý rằng: Việc bạn nhìn thấy bằng “con mắt của Thượng Đế” hoặc nhìn thấy Thượng Đế trong mọi sự sẽ không khiến bạn hay ai đó phải đánh đổi hay hi sinh bất kỳ điều gì, mọi sự sẽ đến một cách nhẹ nhõm và tự nhiên. Việc “nhìn thấy” này chỉ mang lại phước lành cho tất cả mà thôi.\nHướng dẫn thực hành:\nThực hành suốt cả ngày:\nLặp lại câu chủ đề mỗi nửa giờ một lần (NÓI ĐÚNG 1 LẦN CÂU CHỦ ĐỀ LÀ ĐƯỢC), hoặc lý tưởng nhất là mỗi 15-20 phút.\nBạn có thể lặp lại thầm trong đầu, ngay cả khi đang trò chuyện hoặc bận rộn.\nKhuyến khích các bạn nhắn tin vào group lớp câu chủ đề để chính mình thực hành và cũng gieo hạt nhắc bài cho các bạn khác <3 .\nThêm lời nhắc nếu cần:\nNếu bạn cảm thấy lo lắng về việc \"thấy\" có thể đòi hỏi sự đánh đổi, lo lắng rằng phải nỗ lực… hãy tự nhủ:\n\"Việc thấy này không gây tổn hại đến bất kỳ ai.\"\n\"Việc thấy này chỉ mang lại phước lành.\"\nChú trọng vào sự chân thành:\nTrong khi lặp lại, hãy cố gắng cảm nhận sự chân thành trong mong muốn \"được nhìn thấy.\"\nNếu bạn cảm nhận được điều này chỉ một lần trong ngày, đó đã là một bước tiến lớn rồi, chứ không áp lực bản thân “phải thấy” mọi lúc mọi nơi.\nKhông cần lo lắng nếu quên:\nNếu bạn bỏ lỡ một số lần thực hành, đừng tự trách mình. Hãy tiếp tục ngay khi bạn nhớ ra không sao cả.\nCũng không cần lo lắng nếu chưa nhìn thấy. Chỉ cần khởi lên 1 ý định, vậy là đủ.\nVí dụ: khi thấy một cây kẹo hãy nói: Trên tất cả tôi muốn được nhìn thấy.\nVí dụ: khi thấy mẹ mình hãy nói thầm: Trên tất cả tôi muốn được nhìn thấy.\n(Hãy tự ngẫm: Tôi muốn được nhìn thấy Thượng Đế trong hình hài mẹ tôi/ hoặc: Tôi muốn được nhìn thấy mẹ tôi bằng con mắt của Thượng Đế).\nVí dụ: Khi nghĩ đến một niềm vui hãy nói: Trên tất cả tôi muốn được nhìn thấy.\nVí dụ: Khi nghĩ đến một nỗi lo hãy nói: Trên tất cả tôi muốn được nhìn thấy."}, {"n": 28, "t": "Trên tất cả, tôi muốn nhìn mọi thứ khác đi.", "s": "Above all else I want to see things differently.", "d": "Nối tiếp bài tập 27, bài tập này tiếp tục là một câu khẳng định về MỘT Ý ĐỊNH.\nHướng dẫn thực hành:\n- Thực hành 6 lần/ngày, mỗi lần 2 phút.\nChọn những đối tượng ngẫu nhiên và nói:\n\"Trên tất cả, tôi muốn nhìn [đối tượng] này khác đi\".\nVd: \"Trên tất cả, tôi muốn nhìn đôi mắt này khác đi\".\nVd: \"Trên tất cả, tôi muốn nhìn chiếc điện thoại này khác đi\"."}, {"n": 29, "t": "Đấng Sáng Tạo hiện diện trong mọi thứ tôi nhìn thấy.", "s": "God is in everything I see.", "d": "Diễn giải: Trước khi thực hành bài 29 các bạn đọc và nghe lại hướng dẫn bài tập 27 nhé, bài 27 chúng ta đã được thực hành “Trên tất cả, tôi muốn được nhìn thấy”. Thì bài này là một lời khẳng định cụ thể và trực diện hơn: \"Đấng Sáng Tạo hiện diện trong mọi thứ tôi nhìn thấy.\"\n-Chúng ta sẽ học cách nhìn thấy sự thiêng liêng trong mọi sự bất kể đó là thứ gì, bất kể đó là người nào.\n- Bạn cũng có thể dùng “Thượng Đế/Chúa/Buddha/Phật Tính/Nguồn/Đấng Toàn Năng/Thần Tính…” thay cho Đấng Sáng Tạo, miễn điều đó phù hợp với bạn.\nHướng dẫn thực hành:\n- Thực hành 6 lần mỗi lần 2 phút.\n- Chậm rãi nhìn quanh và dừng lại bất kỳ đồ vật/người nào và nói:\nĐấng Sáng Tạo hiện diện trong [...] này. Đừng cố gắng tìm \"vật quan trọng hơn\" để áp dụng bài tập.\nHãy để mắt bạn dừng lại một cách ngẫu nhiên và áp dụng ý tưởng vào bất kỳ thứ gì.\nVí dụ 1: \"Đấng Sáng Tạo hiện diện trong chiếc điện thoại này.\"\nBạn nhận ra: Nó không chỉ là một thiết bị – nó là một phương tiện kết nối, là một phần của sự sáng tạo.\nVí dụ 2: \"Đấng Sáng Tạo hiện diện trong con người này.\"\nBạn nhận ra: Họ cũng có ánh sáng thiêng liêng, dù bạn chưa từng biết về họ.\nVí dụ 3: \"Đấng Sáng Tạo hiện diện trong cái thùng rác này.\"\nBạn nhận ra: Không có gì thực sự bị bỏ đi, mọi thứ đều có giá trị theo một cách nào đó.\nMục đích bài tập:\nNhận ra rằng tất cả mọi thứ đều thiêng liêng: Không có gì là \"tầm thường\" hay \"không quan trọng\".\nTập nhìn mọi thứ với sự tôn trọng và yêu thương: Mọi vật thể, con người, và hoàn cảnh đều có sự hiện diện của Đấng Sáng Tạo.\nLoại bỏ sự chia rẽ giữa \"thần thánh\" và \"trần tục\": Nếu Đấng Sáng Tạo có mặt trong mọi thứ, thì không có gì thực sự thấp kém hay vô giá trị. Không có gì tách biệt khỏi Đấng Sáng Tạo\nHọc cách nhìn bằng trực giác thay vì phán xét: Ta đang dần chuyển từ việc dán nhãn sang việc mở lòng để thấy sự thật toàn vẹn."}, {"n": 30, "t": "Thượng Đế hiện diện trong mọi thứ tôi thấy, vì Thượng Đế ở trong tâm tôi.", "s": "God is in everything I see, because God is in my mind.", "d": "Diễn giải:\nTất cả chúng ta là một, bạn hay mình đều là 1 phân mảnh linh hồn của Thượng Đế đang trải nghiệm cuộc đời này. Thượng Đế luôn sẵn có bên trong bạn rồi, chỉ chờ bạn xoá tan mây mù để “Ngài” hiển lộ mà thôi.\nChúng ta từng nhiều lần nói rằng: “Thế giới là tấm gương soi chiếu nội tâm chính ta”. Bài tập lần này là câu khẳng định cho điều đó và đồng thời mời gọi “Thượng Đế Tính” trong chính ta hiển lộ.\nHướng dẫn thực hành:\n- Bài tập ngày hôm nay khuyến khích lặp lại nhiều nhất có thể trong ngày với lòng biết ơn, tình yêu thương và một tâm hồn rộng mở. Nhìn mọi thứ chậm rãi và tự nhù: “Thượng đế hiện diện trong… vì Thượng đế hiện diện trong tâm tôi.”\n- Áp dụng với mọi thứ mà bạn thấy bằng mắt hoặc “thấy” trong suy nghĩ. Không phân biệt cái thấy hình hài vật lý hay cái “thấy” trong tâm tưởng.\n- Khuyến khích các bạn gửi câu chủ đề vào group chat của lớp để cùng nhau thực hành."}, {"n": 31, "t": "Tôi không phải là nạn nhân của thế giới mà tôi thấy.", "s": "I am not the victim of the world I see.", "d": "Diễn giải: Đây là 1 tuyên bố về tự do của chính bạn!\nTa không phải là nạn nhân của thế giới bên ngoài:\nThế giới không có quyền lực làm tổn thương ta trừ khi ta cho phép.\nMọi thứ ta trải nghiệm đều xuất phát từ cách ta nhìn nhận chúng.\nNếu ta tin rằng mình là nạn nhân, ta sẽ nhìn thấy bằng chứng cho điều đó ở khắp nơi.\nTừ bỏ tư duy nạn nhân:\nBài tập này giúp ta nhận ra rằng ta có quyền năng quyết định cách ta phản ứng với thế giới.\nKhông phải thế giới đang chống lại ta, mà là ta đang chiếu những suy nghĩ sợ hãi lên thế giới.\nTầm nhìn thực sự giúp ta thấy sự thật:\nKhi ta ngừng đổ lỗi cho thế giới, ta sẽ nhận ra ta có sức mạnh để thay đổi trải nghiệm của mình.\nTừ nay ta không còn là nạn nhân, mà là người sáng tạo của chính trải nghiệm của chính mình.\nHướng dẫn thực hành:\nThực hành 4- 5 lần trong ngày, Mỗi lần 2 phút, hãy nhẩm lại câu chủ đề chậm rãi. Cảm nhận ý nghĩa của nó trong nội tâm.\nMở rộng: Bạn có thể nghĩ về một tình huống mà bạn cảm thấy mình là nạn nhân, ví dụ: Bị ai đó đối xử bất công, bị từ chối, cảm thấy cuộc sống quá khó khăn.\nNgẫm nghĩ và nhận thức rằng những suy nghĩ của bạn đang khiến bạn cảm thấy như một nạn nhân. Hãy tự nhắc mình rằng cảm giác nạn nhân chỉ là một lựa chọn. Có hơn 100 góc nhìn cho 1 tình huống, ta hoàn toàn có thể nhìn thấy tình huống theo cách khác – với sự bình tĩnh và nhận trách nhiệm về mình.\n=>Vừa nghĩ về tình huống đó vừa tự nhủ: \"Tôi không phải là nạn nhân của thế giới mà tôi thấy.\"\nMục đích bài tập:\nChấm dứt cảm giác bị thế giới kiểm soát:\nTa không còn đổ lỗi cho hoàn cảnh bên ngoài.\nTa nhận ra sức mạnh của chính mình trong việc thay đổi cách ta nhìn nhận.\nChuyển từ nạn nhân sang người sáng tạo:\nTa không bị mắc kẹt trong hoàn cảnh của mình.\nTa có thể chọn cách suy nghĩ khác và thay đổi thực tế của mình.\nTạo nền tảng cho sự tự do nội tâm:\nKhi ta không còn cảm thấy là nạn nhân, ta sẽ cảm thấy bình yên hơn với cuộc sống.\nNHỚ RẰNG: Bạn không bị kiểm soát bởi thế giới – bạn là người quyết định cách bạn trải nghiệm thế giới!"}, {"n": 32, "t": "Tôi kiến tạo ra thế giới mà tôi thấy.", "s": "I have invented the world I see.", "d": "Diễn giải: Bài tập này là phần tiếp nối bài tập 31. Bạn nào đã đọc kỹ 2 cuốn Không giới hạn và Trở về không sẽ nắm rõ tư duy tôi chịu mọi trách nhiệm cho mọi thứ tôi thấy.\n- Đúng vậy. Chính ta đã tạo nên cuộc sống hiện tại của mình. Điều này có thể khiến ai đó cảm giác phản kháng rằng: không đời nào tôi lại tạo nên một cuộc sống tệ hại như thế này, tôi đâu có muốn những chuyện xui xẻo này đâu kia chứ?\n- Nhưng khoan vội để tâm trí chạy theo những suy nghĩ đó. Có hơn 100 góc nhìn cho 1 sự việc mà. Hãy xoay qua 1 góc nhìn khác: “Dù không biết bằng cách nào nhưng tôi đã vô thức tạo nên thực tại này. Và thật may mắn, vì tôi đã tạo nên nó nên tôi nhất định có cách thay đổi nó”!\n- Và: Dù chưa biết phải thay đổi thực tại thế nào để mọi thứ trở nên ấm áp, hạnh phúc, khoẻ mạnh, thuận lợi, hanh thông, may mắn, đủ đầy, dư dả… nhưng TÔI TIN CHẮC LÀ CÓ THỂ!\nNhư những gì tôi biết về Vật lý lượng tử. Mọi thứ có thể thay đổi chỉ trong khoảnh khắc.\n- Thực tế thì: Mặc dù tâm trí cho ta cảm giác rằng thế giới bên ngoài mà ta nhìn thấy và thế giới bên trong mà ta nghĩ về là hai thực thể khác nhau, thực chất chúng là 2 mặt phản chiếu như tấm gương mà thôi.\nBạn có thể hình dung các vấn đề, các tình huống “trông có vẻ thuộc về bên ngoài” mà ta đang nhìn thấy chính là ảnh phản chiếu của nội tâm ta. Nếu khó hình dung quá, bạn có thể tạm bỏ qua ý này cũng không sao nha.\nHướng dẫn thực hành:\nHai lần thực hành chính: 3-5 phút vào buổi sáng và buổi tối.\n- Trước hết dùng 1 vài phút chậm rãi nhìn ra xung quanh (bên ngoài) và lặp lại câu chủ đề trong khoảng: \"Tôi kiến tạo ra thế giới mà tôi thấy.\"\n- Sau đó nhắm mắt nghĩ về cuộc sống của mình, bất kể hình ảnh nào hiện ra thì cũng chậm rãi lặp lại câu chủ đề vài ba lần hoặc hơn tuỳ ý.\nThực hành ngắn trong ngày:\nLặp lại câu chủ đề bất cứ khi nào có thể, dù đang nhìn thế giới bên ngoài hay thế giới bên trong."}, {"n": 33, "t": "Có cách khác để nhìn thế giới.", "s": "There is another way of looking at the world.", "d": "Diễn giải: Những gì ta thấy không phải là sự thật toàn vẹn – chúng chỉ là một phiên bản do ta tạo ra. Mấy hôm nay chúng ta thường nói rằng có hơn 100 góc nhìn cho một sự việc/tình huống nào đó. Và ta có đủ mọi quyền lực để quyết định lựa chọn góc nhìn của một người chủ động/kiến tạo/người quan sát… thay vì góc nhìn nạn nhân/đổ lỗi/phán xét…\nVậy bài tập hôm này thêm một bước khẳng định về việc: “Có cách khác để nhìn thế giới”.\nHướng dẫn thực hành:\nHai lần thực hành chính: 3-5 phút vào buổi sáng và buổi tối.\n- Trước hết dùng 1 vài phút chậm rãi nhìn ra xung quanh (bên ngoài) và lặp lại câu chủ đề trong khoảng: \"Có cách khác để nhìn thế giới.\"\n- Sau đó nhắm mắt nghĩ về cuộc sống của mình, bất kể hình ảnh nào hiện ra thì cũng chậm rãi lặp lại câu chủ đề vài ba lần hoặc hơn tuỳ ý.\nThực hành ngắn trong ngày: Lặp lại câu chủ đề bất cứ khi nào có tình huống/suy nghĩ nào đó nổi lên. Nếu cảm thấy căng thẳng/khó chịu, có thể ngồi yên một phút, nhắm mắt và nhắc lại câu chủ đề.\nChủ đề bạn chọn cũng có thể là chính bạn, chính những suy nghĩ, cảm xúc hay câu chuyện trong nội tâm của bạn.\nLưu ý, bài tập không yêu cầu bạn phải chọn những chủ đề “tiêu cực” rồi cố gắng phân tích hay nhìn mọi thứ “tích cực” hơn nhé, đơn giản là khẳng định: Có cách khác để nhìn điều này”. Còn khác thế nào? Kệ!\nBài tập này có thể được xem là 1 câu thần chú để điều hoà cảm xúc \"tiêu cực\" đó các bạn.\n- Khi tình huống bất như ý nổi lên, bao nhiêu suy diễn, suy đoán trong đầu thi nhau nhao nhao lên phán xét, trách móc, tức giận, dỗi hờn... có thể đều im ắng ngoan ngoan khi TA (higher self) lên tiếng: \"chắc chắn có cách khác để nhìn về vấn đề này\".\n-> Có thể bên trong sẽ nổi lên câu hỏi: - \"Vậy đó là cách nào?\".\n-> Higher self sẽ trả lời: - \"Ta chưa biết đó là cách nào. Ta chỉ mở rộng cửa để Thượng Đế chảy tràn qua ta, \"cách khác\" đó sẽ tự nhiên từ từ hiển lộ\"."}, {"n": 34, "t": "Tôi có thể nhìn thấy sự bình an thay vì điều này.", "s": "I could see peace instead of this.", "d": "Diễn giải:\nBình an là một trạng thái nội tâm, không đến từ bên ngoài: Nếu ta muốn thấy một thế giới hòa bình, ta phải bắt đầu từ chính suy nghĩ của mình. Bình an nội tâm sẽ tạo ra một nhận thức bình an về thế giới.\nBài tập này giúp ta chuyển hướng nhận thức từ tiêu cực sang bình an. Khi ta thực hành điều này, ta sẽ nhận ra rằng sự bình an luôn sẵn có – chỉ cần ta chọn nhìn thấy nó.\n👉 Ta không bị thế giới kiểm soát – ta hoàn có thể chọn bình an trong mọi tình huống.\nTrích đoạn 1 bài mình đã viết ngày 02/08/2024:\nHiểu đúng về bình an nội tâm:\n- Bình an nội tâm không phải là sự vắng mặt của các cảm xúc tiêu cực, mà là khả năng đối diện và quản lý chúng một cách hiệu quả. Điều này có nghĩa là bạn vẫn có thể cảm thấy lo lắng, bất an, hay sợ hãi, nhưng bạn không để những cảm xúc này kiểm soát hoặc áp đảo bạn.\n- Chấp nhận và đối diện: Phật giáo và nhiều trường phái tâm lý học hiện đại đều nhấn mạnh tầm quan trọng của việc chấp nhận và đối diện với các cảm xúc thay vì phủ nhận hoặc tránh né chúng. Sự chấp nhận này giúp tạo ra một trạng thái bình an sâu sắc và bền vững hơn\nHƯỚNG DẪN THỰC HÀNH:\nChúng ta sẽ có 3 lần thực hành chính:\nMột lần vào buổi sáng, một lần vào buổi tối, và một lần vào thời điểm phù hợp trong nggày.\nNhắm mắt lại, tập trung vào \"thế giới bên trong\" của bạn.\nTìm kiếm trong tâm trí những suy nghĩ gây lo lắng, sợ hãi, bất an hoặc không yêu thương, không tích cực.\nNhận ra chúng, nhẩm câu chủ đề, rồi mặc kệ để chúng qua đi.\nThực hành suốt cả ngày khi gặp tình huống làm mất đi sự bình an:\nKhi bạn cảm thấy tức giận, lo lắng hoặc buồn bã, hãy nhắc nhở mình:\n\"Tôi có thể nhìn thấy sự bình an trong tình huống này thay vì những gì tôi đang thấy.\"\nNếu cảm xúc tiêu cực chung chung như lo âu hay khó chịu xuất hiện, hãy lặp lại câu chủ đề ở dạng gốc: \"Tôi có thể nhìn thấy sự bình an thay vì điều này.\"\nNếu cần, hãy dành vài phút nhẩm lại câu chủ đề đến khi cảm thấy nhẹ nhõm hơn (có thể kết hợp đặt tay lên trái tim để có cảm giác chạm sâu hơn)."}, {"n": 35, "t": "Tâm trí tôi là một phần của Đấng Sáng Tạo. Tôi đầy tính thánh linh.", "s": "My mind is part of God's. I am very holy.", "d": "Diễn giải:\n- Bài tập này mô tả con người thật của ta – chứ không phải cách ta thấy chính mình bây giờ: Bạn có thể không tin rằng mình đầy tính thánh linh, nhưng đó là vì bạn đã tự đồng hóa mình với một hình ảnh mà bản ngã tạo ra. Khi bạn còn tin rằng mình là một cá thể tách biệt trong thế giới này, bạn sẽ thấy mình nhỏ bé, yếu đuối hoặc đầy lỗi lầm.\n- Đa số thời gian ta vẫn đang nhìn bản thân qua con mắt của hình ảnh mà bản ngã tạo ra: Ta không nhìn thấy con người thật của mình. Ta chỉ thấy một hình ảnh mà ta đã tự tạo ra để phù hợp với niềm tin giới hạn của mình. Hình ảnh đó có thể tiêu cực (tôi là người thất bại) hoặc tích cực (tôi là người đạo đức, tôi là người giỏi giang), nhưng dù thế nào thì nó cũng không phản ánh sự thật.\n- Ta cần nhận ra rằng tất cả những hình ảnh ta có về bản thân đều không có thật: Khi ta tin vào một hình ảnh cụ thể, vào một “căn tính” cụ thể về mình, ta đang giới hạn chính mình. Nhưng nếu ta chấp nhận rằng ta là một phần của Đấng Sáng Tạo, ta sẽ bắt đầu thấy chính mình theo một cách hoàn toàn khác.\nLưu ý: Bất kỳ ai cũng có tính thánh linh. Bất kỳ ai cũng tốt đẹp như nhau.\nHướng dẫn thực hành:\n1- Ba lần thực hành chính (mỗi lần 5 phút):\nNhắm mắt lại, nhẩm câu chủ đề. Quan sát những suy nghĩ của bạn về chính bản thân, cả tích cực lẫn tiêu cực.\nMỗi khi một suy nghĩ xuất hiện, hãy nhận diện nó rồi lặp lại câu chủ đề:\nVí dụ: \"Tôi thấy mình là người thất bại. Nhưng tâm trí tôi là một phần của Đấng Sáng Tạo. Tôi đầy tính thánh linh.\"\nVí dụ: \"Tôi thấy mình là người tốt bụng. Nhưng tâm trí tôi là một phần của Đấng Sáng Tạo. Tôi đầy tính thánh linh.\"\n2 - Thực hành ngắn suốt cả ngày:\nBất cứ khi nào bạn nghĩ về bản thân theo một cách nào đó, hãy áp dụng câu chủ đề.\nNếu không có suy nghĩ cụ thể nào xuất hiện, chỉ cần nhắm mắt lại và lặp lại câu chủ đề vài lần."}, {"n": 36, "t": "Tính thánh linh của tôi bao trùm mọi thứ tôi thấy.", "s": "My holiness envelops everything I see.", "d": "Diễn giải: Ta không chỉ đầy tính thánh linh, mà cách ta nhìn thế giới cũng mang tính thánh linh.\nNhờ có “cái nhìn” của ta mà mọi thứ đều trở nên sinh động và có hồn.\nTa cảm nhận thế giới bằng 5 giác quan.\nKhi nhìn một bông hoa hãy thầm nhủ: Nếu không có tôi thì bông hoa này không có mùi/màu sắc/sự mềm mại…\nMọi nơi mà tôi “quét” qua, tức là tôi đang kiến tạo, đang sáng tạo và biến đổi nó.\nNhư thể rắc bụi tiên cho mọi vật vậy. Và vì thế cách nhìn của ta có thể biến đổi mọi thứ từ tiêu cực thành tích cực, từ sợ hãi thành yêu thương. Ta hoàn toàn có thể!\nNhớ rằng: Không có gì tách rời, mọi thứ đều bao gồm trong tính thánh linh và sự thiêng liêng của chính ta.\nHướng dẫn thực hành:\nBốn lần thực hành chính (3-5 phút mỗi lần):\nBước 1: Nhắm mắt lại, lặp lại câu chủ đề vài lần.\nBước 2: Mở mắt, nhìn xung quanh và áp dụng câu chủ đề vào từng vật bạn thấy.\nBước 3: Nhắm mắt lại lần nữa, lặp lại câu chủ đề một lần nữa.\nThực hành ngắn suốt cả ngày:\nNhắm mắt, nhẩm câu chủ đề.\nMở mắt, nhìn xung quanh và lặp lại câu chủ đề với bất cứ thứ gì bạn thấy.\nNhắm mắt lại lần nữa, nhẩm lại câu chủ đề.\nKhuyến khích các bạn thỉnh thoảng nhắn câu chủ đề vào group lớp để các bạn khác cũng được nhắc nhở thực hành."}, {"n": 37, "t": "Tính thánh linh của tôi mang phúc lành cho thế giới.", "s": "My holiness blesses the world.", "d": "Diễn giải: Theo ACIM ta không chỉ có tính thánh linh bên trong, mà khi ta khẳng định về tính thánh linh của mình ta có thể lan tỏa phước lành đến tất cả mọi thứ. Nhớ rằng ta không cần phải làm gì để ban phước lành cho thế giới mà đơn giản chỉ cần nhận ra và khẳng định về nó, thì mặc nhiên phước lành đã được trao cho cả họ và cả chính ta rồi.\nTừ nay thay vì đánh giá hay phán xét, ta chọn gửi đi phước lành và tình yêu thương. Ta với là một với tất, khi ta phán xét và \"tấn công\" một ai đó thì cũng là lúc ta tự tấn công một phần khác của chính mình.\nHƯỚNG DẪN THỰC HÀNH\n🌿 Bốn lần thực hành chính (mỗi lần 3-5 phút):\nBước 1: Nhắm mắt, nhẩm câu chủ đề vài lần một cách chậm rãi.\nBước 2: Mở mắt, nhìn xung quanh và áp dụng câu chủ đề vào từng vật/người bạn thấy. Ví dụ:\n\"Tính thánh linh của tôi mang phước lành cho chiếc ghế này.\"\n\"Tính thánh linh của tôi mang phước lành cho cửa sổ này.\"\n\"Tính thánh linh của tôi mang phước lành cho cơ thể này.\"\nBước 3: Nhắm mắt lại, nghĩ đến một người cụ thể, nhẩm câu chủ đề kèm theo tên họ:\n\"Tính thánh linh của tôi mang phước lành cho ...[tên].\"\nBước 4: Tiếp tục thực hành tương tự với mắt nhắm hoặc mở, tùy theo sự thoải mái của bạn.\nBước 5: Kết thúc bài tập bằng cách nhẩm lại câu chủ đề một lần với mắt nhắm, sau đó một lần với mắt mở.\n🌿 Thực hành ngắn suốt cả ngày:\nNhẩm lại câu chủ đề càng thường xuyên càng tốt.\nKhi gặp ai đó, hãy thầm gửi đến họ lời chúc lành bằng cách nhẩm câu chủ đề với tên họ.\nNếu ai đó làm bạn khó chịu, hãy ngay lập tức gửi phước lành cho họ thay vì phản ứng tiêu cực. Ví dụ: \"Chị A thật tốt đẹp, chị A thật tuyệt vời, nguyện cho mọi điều tốt đẹp đến với chị A. Tính thánh linh của tôi mang phước lành đến với chị A\".\nMột lần nữa lưu ý: Bất kỳ ai cũng có tính thánh linh. Bất kỳ ai cũng tốt đẹp như nhau. Đừng vô tình coi mình hơn người khi thực hành bài tập này nha."}, {"n": 38, "t": "Không có điều gì mà tính Thánh linh trong tôi không thể làm", "s": "There is nothing my holiness cannot do.", "d": "Theo ACIM, tính Thánh linh trong mỗi người không vận hành theo quy luật của thế giới này.\nNó vượt lên trên thời gian, không gian, hoàn cảnh, và mọi giới hạn: hữu hình lẫn vô hình.\nBởi vì: Ta không tách rời khỏi Đấng Sáng Tạo\nvà tính Thánh linh trong ta đồng nhất với Nguồn. Thông qua tính Thánh linh này, quyền năng của Đấng Sáng Tạo được biểu lộ và trở nên khả dụng.\nVì vậy, không có điều gì mà quyền năng ấy không thể làm được. Từ điểm nhìn này:\n- mọi đau khổ có thể được chấm dứt.\n- mọi vấn đề đều có thể được tái sắp xếp\n- và ý định khởi lên đều có thể hiển lộ.\nĐiều này đúng với ta và đúng với bất kỳ ai, không có sự phân biệt nào ở đây cả.\nHƯỚNG DẪN THỰC HÀNH\nTrong bài tập này, bạn không cần “giải quyết vấn đề”, mà chỉ cần đặt vấn đề đó vào tay tính Thánh linh trong bạn.\nHãy nghĩ đến: một khó khăn, một nỗi đau, một bế tắc, của chính bạn, hoặc của người khác đều được.\nRồi nhẹ nhàng khẳng định: (Trong tình huống … này,) không có điều gì mà tính Thánh linh trong tôi không thể làm.\nBạn có thể dùng linh hoạt các mẫu sau:\n- Trong tình huống … mà tôi đang trải nghiệm, không có điều gì mà tính Thánh linh trong tôi không thể làm.\n- Trong tình huống … mà người … đang trải nghiệm, không có điều gì mà tính Thánh linh trong tôi không thể làm.\nKhông cần biết: bằng cách nào, khi nào, kết quả ra sao. Việc của bạn chỉ là trao vấn đề đó cho phần sâu nhất trong mình.\nVà tin tuyệt đối rằng:  Mọi chuyện đều sẽ đc giải quyết trong quyền lợi cao nhất thuộc về bạn.\nThực hành 4 lần trong ngày. Mỗi lần ít nhất 5 phút."}, {"n": 39, "t": "Tính Thánh Linh là sự cứu rỗi của tôi.", "s": "My holiness is my salvation.", "d": "Diễn giải:\nTrong ACIM, sự cứu rỗi (salvation) không có nghĩa là một sự giải thoát theo nghĩa tôn giáo truyền thống, nơi một thế lực bên ngoài đến để cứu chúng ta khỏi tội lỗi hay hình phạt. Thay vào đó, sự cứu rỗi là trạng thái của tâm trí khi nó thoát khỏi ảo tưởng của bản ngã và quay về với sự thật – nhận ra tính thánh linh, bình an và tình yêu vốn có của chính mình.\nVậy sự cứu rỗi là:\nSự giải phóng khỏi cảm giác tội lỗi và sợ hãi. Khi ta nhận ra tính thánh linh của chính mình, ta sẽ hiểu rằng không có gì thực sự có thể làm tổn thương được ta. Mọi nỗi đau, nỗi sợ, sự dằn vặt và cảm giác tội lỗi đều chỉ là ảo tưởng của bản ngã. Khi ta buông bỏ những ảo tưởng đó, bạn được \"cứu rỗi\".\nSự tỉnh thức để nhận ra sự thật. Sự cứu rỗi không phải là \"được tha thứ\", vì trên thực tế, bạn chưa bao giờ thực sự phạm lỗi. Bạn không cần được cứu rỗi khỏi tội lỗi, mà là khỏi niềm tin sai lầm rằng bạn có tội.\nSự trở về với bình an, tình yêu và sự hợp nhất với Đấng Sáng Tạo. Khi bạn nhận ra rằng tính thánh linh của bạn không thể bị tổn hại, bạn sẽ thoát khỏi mọi sự lo lắng, bất an và khổ đau. Bạn sẽ không còn nhìn thế giới với sự sợ hãi, mà với sự chấp nhận và yêu thương.\nNhớ rằng: Bạn không cần \"cố gắng\" để được ai đó cứu rỗi – bạn chỉ cần nhận biết rằng tính thánh linh của bạn đã giải phóng bạn ngay từ lúc này.\nNỗi sợ không có thật, bạn hoàn toàn đủ mọi điều kiện để bình an hạnh phúc đủ đầy ngay giây phút này.\nMục đích bài tập này:\nBạn không phải là được tha thứ, mà là nhận ra rằng bạn chưa bao giờ có lỗi.\nBạn không phải là tìm kiếm sự giải thoát từ bên ngoài, mà là nhận ra rằng bạn luôn có sẵn sự giải thoát bên trong.\nBạn không phải là \"sửa chữa\" hay \"hoàn thiện\" bản thân, mà là nhận ra rằng bạn đã luôn hoàn hảo trong tính thánh linh/sự thiêng liêng rồi.\n(Điều này không có nghĩa là bạn buộc phải mãi dậm chân tại chỗ mà hãy hiểu rằng bạn hoàn toàn có thể ĐẦY HỨNG KHỞI lựa chọn phát triển kể cả khi bạn vốn đã hoàn hảo sẵn rồi).\nHướng dẫn thực hành\n🌿 Bốn lần thực hành chính (mỗi lần 5 phút hoặc hơn):\nBước 1: Nhắm mắt, nhẩm câu chủ đề vài lần một cách chậm rãi.\nBước 2: Quan sát những suy nghĩ không yêu thương trong tâm trí bạn:\nCảm giác khó chịu, buồn bã, giận dữ, sợ hãi, lo lắng, oán trách, bất an…\nDù chúng có ở hình thức nào, dù là về bản thân hay về người khác, chúng đều là những suy nghĩ không yêu thương và do đó chúng khiến bạn cảm thấy sợ hãi.\nBước 3: Xác định các tình huống, con người hoặc sự kiện đang liên kết với những suy nghĩ này.\nBước 4: Áp dụng câu chủ đề theo mẫu sau:\n\"Những suy nghĩ không yêu thương của tôi về [tình huống/người] đang giữ tôi trong địa ngục. Tính Thánh Linh của tôi là sự cứu rỗi của tôi.\"\nBước 5: Trong quá trình thực hành, bạn có thể xen kẽ những khoảnh khắc thư giãn, chỉ đơn giản là lặp lại câu chủ đề mà không tập trung vào một suy nghĩ nào cụ thể.\n🌿 Thực hành ngắn suốt cả ngày:\nLặp lại câu chủ đề khoảng 3-4 lần mỗi giờ hoặc nhiều hơn nếu có thể. Khuyến khích lớp nhắn tin câu thực hành vào group thực hành.\nKhi bạn cảm thấy bị thu hút bởi một suy nghĩ tiêu cực, hãy sử dụng phiên bản này:\n\"Tính Thánh Linh của tôi là sự cứu rỗi của tôi khỏi điều này.\"\nBạn cũng có thể đặt câu hỏi nhắc nhở:\n\"Nếu nỗi sợ, bất an, phán xét, tiêu cực… là địa ngục, thì điều ngược lại của nó là gì?\"\nDiễn giải ý 1 từ \"địa ngục\":\nĐịa ngục không phải là một nơi nào đó sau khi chết.\nĐịa ngục là trạng thái tâm trí bị mắc kẹt trong sự tội lỗi, sợ hãi và đau khổ.\nKhi bạn tin rằng mình có tội, bạn cảm thấy không xứng đáng với tình yêu, không xứng đáng với bình an, không xứng đáng với hạnh phúc."}, {"n": 40, "t": "Tôi có diễm phúc làm con của Đấng sáng tạo/Thượng đế.", "s": "I am blessed as a Son of God.", "d": "Bài tập hôm nay đơn giản là khẳng định lại những điều tốt đẹp mà chúng ta nghiễm nhiên có sẵn và được thừa hưởng, đó là: hạnh phúc, viên mãn, bình an, từ ai, tự tin, sáng tạo…\nMẫu câu thực hành: “Tôi có diễm phúc làm con của Đấng sáng tạo/Thượng đế. Tôi bình an, hạnh phúc…” liệt kê những tính từ bạn muốn, không cần liệt kê hết 1 lần bởi chúng ta sẽ thực hành câu này nhiều lần trong ngày.\nBạn có thể thực hành trong bất cứ tình huống nào, thực hành càng nhiều càng tốt (10 phút/lần cũng không quá nhiều) Thực hành với sự vui vẻ, tự nhiên, thả lỏng…"}, {"n": 41, "t": "Đấng Sáng Tạo luôn hiện diện bên tôi (dù tôi ở bất cứ nơi đâu).", "s": "God goes with me wherever I go.", "d": "Hướng dẫn thực hành:\nBài tập này chỉ bắt buộc thực hành 1 lần duy nhất khoảng 3-5 phút: Tĩnh lặng suy ngẫm, hướng vào bên trong cảm nhận sự hiện diện của Thượng Đế trong mọi sự xung quanh ta, và tự nhủ câu chủ đề. Vừa tự nhủ vừa để cho mọi tế bào bên trong cảm nhận sự hiện diện của Thượng Đế là được.\nNgoài ra trong ngày nếu bạn muốn thì bạn cũng có thể lặp lại câu chủ đề nếu muốn. Khuyến khích các bạn nhắn vào lớp nhé."}, {"n": 42, "t": "Đấng Sáng Tạo là sức mạnh của tôi. Nhãn quan là một món quà của Người.", "s": "God is my strength. Vision is His gift.", "d": "Diễn giải: Nhãn quan (vision) trong ACIM là khả năng nhìn thấu “nhân sinh” là cách nhìn nhận thế giới bằng tâm trí đúng đắn, thay vì bằng những suy nghĩ bóp méo của định kiến, nỗi sợ, hay những suy nghĩ phán xét của bản ngã.\nĐó là khả năng nhìn thấy sự thật, sự kết nối, và tình yêu trong mọi thứ, không bị giới hạn bởi những niềm tin cũ hay phán xét cá nhân.\nNhãn quan không đến từ mắt vật lý, mà đến từ tâm trí được soi sáng bởi sự thật toàn vẹn.\nNhãn quan không dựa trên những gì ta nghĩ ta biết, mà là một sự nhận biết vượt trên suy nghĩ cá nhân. Hay như cách mình từng nói: Tầm nhìn của Thượng Đế rộng lớn và xa hơn tầm nhìn của tâm trí nhỏ bé chúng ta.\nBài tập này là một bước để ta dần đón nhận một tầm nhìn rộng lớn hơn cả những gì ta vẫn đang nhìn với góc nhìn của “người trần mắt thịt”. Thừa nhận khả năng nhìn thấu mọi sự bằng nhãn quan. Và sẵn sàng đón nhận tầm nhìn đó như 1 món quà của Thượng Đế.\nHướng dẫn thực hành:\n🌿 Thực hành 2 lần sáng tối:\nNgay khi thức dậy, và trước khi đi ngủ dành 3-5 phút tĩnh lặng và lặp lại câu chủ đề.\nNhìn xung quanh và ý thức rằng sức mạnh của bạn đến từ Đấng Sáng Tạo, và nhãn quan là món quà Ngài ban.\n🌿 Trong ngày:\nCố gắng nhắc nhở bản thân nhiều lần về câu chủ đề. Khuyến khích nhắn vào lớp câu chủ đề.\nNếu gặp một tình huống khó khăn hoặc bối rối, hãy nhắm mắt lại và lặp lại:\n\"Đấng Sáng Tạo là sức mạnh của tôi. Nhãn quan là món quà của Ngài.\""}, {"n": 43, "t": "Đấng Sáng Tạo là nguồn cội của tôi. Tôi không thấy điều gì tách rời khỏi Nguồn.", "s": "God is my Source. I cannot see apart from Him.", "d": "Diễn giải:\nỞ bài tập trước chúng ta đã được biết rằng: ta có nhãn quan. Nhờ có nhãn quan nên ta nhìn thấy sự thật toàn vẹn. Và sự thật toàn vẹn là không có điều gì tách biệt: Tất cả chúng ta là một. Bài tập này tiếp tục khẳng định về điều này.\nHướng dẫn thực hành:\nMở mắt nhìn xung quanh, chọn từng thứ và nói: “Đấng sáng tạo là Nguồn cội của tôi. Tôi không thấy … này tách rời khỏi Nguồn.”\nThực hành 3 lần mỗi lần 3-5p: 1 lần lúc thức dậy, 1 lần lúc chuẩn bị đi ngủ, 1 lần bất kỳ trong ngày."}, {"n": 44, "t": "Tôi tư duy với tâm trí của Đấng Sáng Tạo.", "s": "God is the Mind with which I think.", "d": "Diễn giải: Bài tập này thú vị nha. Mình sẽ có cách đơn giản để tiến thêm 1 bước để tiến gần hơn với trạng thái Nhất Thể: Ta là một với Đấng Sáng Tạo.\nTâm trí ta nó luôn cố định nghĩa mình là ai nên bảo nó rằng: Ta là Đấng Sáng Tạo nó sẽ giãy lên vì nó thấy Đấng Sáng Tạo xa vời lắm.\nBài tập này là một gợi ý để mình thử đặt mình vào vị trí của Đấng Sáng Tạo để NGHĨ. Như khi ở trong 1 tình huống nào đó, bạn có thể tự hỏi: \"Nếu là Đấng Sáng Tạo thì người nghĩ thế nào trong tình huống này?\"\nNhưng câu hỏi là: Tâm trí của Đấng Sáng Tạo là trạng thái nào?\nACIM nói rằng: Tâm trí của Đấng Sáng Tạo là trạng thái Yêu thương - Bao Dung - Tin Tưởng và Bình An.\nNhư thế thì bạn có thể dùng phiên bản câu hỏi: \"Nếu là phiên bản Yêu thương - Bao Dung - Tin Tưởng và Bình An mình sẽ nghĩ thế nào trong tình huống này?\"\n💡 Ví dụ 1: Suy nghĩ của bản ngã: \"Tôi không đủ giỏi, tôi sẽ thất bại.\"\nSuy nghĩ theo cách Đấng Sáng Tạo nghĩ: \"Tôi được tạo ra từ sự hoàn hảo và trọn vẹn. Không có thất bại, chỉ có trải nghiệm và sự trưởng thành.\"\n💡 Ví dụ2 :\nSuy nghĩ của bản ngã: \"Người kia đối xử tệ với tôi, tôi không thể tha thứ.\"\nSuy nghĩ theo cách Đấng Sáng Tạo nghĩ: \"Tôi và người kia là một phần của sự hợp nhất. Khi tôi tha thứ cho họ, tôi cũng giải phóng chính mình.\"\n💡 Ví dụ 3:\nSuy nghĩ của bản ngã: \"Tôi không có đủ tiền, tôi sẽ không hạnh phúc.\"\nSuy nghĩ theo cách Đấng Sáng Tạo nghĩ: \"Sự giàu có thật sự không đến từ vật chất, mà từ sự bình an nội tâm. Tôi luôn có đủ những gì mình cần.\"\n💡 Ví dụ 4:\nSuy nghĩ của bản ngã: \"Người kia đã làm sai, tôi phải chứng minh tôi đúng.\"\nSuy nghĩ theo cách Đấng Sáng Tạo nghĩ: \"Hòa bình quan trọng hơn việc thắng thua. Tôi chọn sự bình an thay vì xung đột.\"\n💡 Ví dụ 5:\nSuy nghĩ của bản ngã: \"Tôi không bao giờ quên người đó đã làm tổn thương tôi.\"\nSuy nghĩ theo cách Đấng Sáng Tạo nghĩ: \"Tôi tha thứ vì tôi hiểu rằng không ai thực sự có thể làm hại tôi ngoài những suy nghĩ của chính tôi.\"\n💡 Ví dụ 6:\nSuy nghĩ của bản ngã: \"Cuộc sống của tôi thật bất công, tôi đáng lẽ phải có nhiều hơn.\"Suy nghĩ theo cách Đấng Sáng Tạo nghĩ: \"Tôi biết ơn tất cả những gì đang có, vì mọi thứ đều đang phù hợp nhất cho mọi sự.\"\nHướng dẫn thực hành\n🌟 Buổi sáng:\nNhắm mắt, lặp lại câu chủ đề. Cảm nhận cảm giác mình hoàn toàn có thể nghĩ về mọi thứ băng một trạng thái Rung động năng lượng cao hơn. Bằng Yêu thương - Bao Dung - Tin Tưởng và Bình An.\n🌟 Trong ngày:\nKhi nhận thấy mình đang suy nghĩ tiêu cực, hãy tự nhủ:\n\"Tôi tư duy với tâm trí của Đấng Sáng Tạo”.\nCó thể tự hỏi: \"Nếu là Đấng Sáng Tạo thì người nghĩ thế nào trong tình huống này?\" hoặc \"Nếu là phiên bản Yêu thương - Bao Dung - Tin Tưởng và Bình An mình sẽ nghĩ thế nào trong tình huống này?\"\n🌟 Buổi tối:\nTrước khi ngủ, nhắm mắt, lặp lại câu chủ đề, Cảm nhận trạng thái an vui, nếu đc thì cứ lăpk lại cho đến khi chìm vào giấc ngủ.\nCó thể đặt tay lên trái tim và gửi năng lượng biết ơn Đấng Sáng Tạo vì những suy nghĩ Ngài đang suy nghĩ cùng bạn."}, {"n": 45, "t": "Tôi tư duy với tâm trí vĩ đại của Đấng sáng tạo.", "s": "God is the Mind with which I think.", "d": "Diễn giải:\nỞ những nội dung trước, chúng ta đã nói về việc tâm trí có những giới hạn của nó, nhưng không có nghĩa chúng ta loại bỏ tâm trí.\nTâm trí khi kết nối, hợp nhất với Nguồn, thì nó trở thành công cụ để ta chữa lành, phát triển và tỉnh thức.\nTâm trí cần được huấn luyện để ta sử dụng tâm trí, chứ không để tâm trí sử dụng ta.\nKhi kết nối với Nguồn,\ntâm trí có 3 trạng thái rung động cao là: bao dung - trân trọng biết ơn - và an vui.\nNếu điều gì đó khiến ta muộn phiền, hãy bao dung;\nnếu không có muộn phiền, hãy luôn trân trọng biết ơn;\nvới điều ta chưa hiểu, chưa biết xử lý nằm ngoài khả năng khiểm soát của bạn, hãy đơn giản: \"à, thì biết thế” và trở về với sự an vui.\nNhững trạng thái này có sẵn trong ta rồi, chỉ cần gọi nó đến.\nThực hành:\nDành 3 lần thực hành, mỗi lần 5 phút để nhắc nhở bạn về điều này. “Tôi tư duy với tâm trí vĩ đại của Đấng sáng tạo.” Trong ngày, ta cũng có thể nhắc nhở điều này với bản thân nhiều lần.\nTóm lại: Tư duy theo cách của Đấng Sáng Tạo,\nnghĩa là nhìn mọi thứ qua lăng kính của sự thật toàn vẹn, tình yêu thương và bao dung,\nChứ không bị điều khiển bởi nỗi sợ hãi, phán xét hay giới hạn của bản ngã (ego).\nĐó là một cách suy nghĩ thuần khiết, rộng mở và hợp nhất, thay vì tách biệt, giới hạn và phân biệt.\nTối nay giao thừa hãy khởi lên 1 tâm ý: Tôi chọn mang bình an - bao dung - yêu thương để bước vào năm mới."}, {"n": 46, "t": "Đấng sáng tạo trao tình yêu để tôi tha thứ/bao dung.", "s": "THANK YOU, I LOVE YOU!", "d": "“God is the Love in which I forgive”.\nDiễn giải: Theo ACIM Đấng Sáng Tạo không tha thứ, bởi vì Ngài chưa bao giờ kết tội ai. Và phải có sự kết tội thì mới có nhu cầu tha thứ.\nTuy nhiên tha thứ là điều mà thế giới này rất cần, bởi vì chúng ta đang ở trong tâm thức tập thể của một thế giới của ảo tưởng đầy nỗi sợ và sự chia cắt.\nNhưng tất cả chúng ta là một. Vì vậy: khi bạn phán xét sự khác biệt của ai đó, hoặc khi bạn ghét bỏ, kết tội hoặc không chấp nhận một ai đó. Thì lúc đó bạn cũng đang phán xét, ghét bỏ, không chấp nhận MỘT PHẦN CỦA CHÍNH MÌNH.\nĐiều này khiến bạn rơi vào vòng luẩn quẩn của khổ đau mà mãi chẳng có lối thoát. Bởi khi bạn kết tội, bạn chỉ đang kết tội một phần của chính mình, và khi bạn tha thứ, bạn cũng là đang tha thứ cho chính mình.\nBài tập này mời gọi/khuyến khích bạn tha thứ cho ai đó khiến bạn cho rằng họ làm tổn thương bạn; bài tập này cũng mời gọi bạn bao dung cho ai đó khác biệt với bạn.\nĐể tha thứ, để bao dung thì TÌNH YÊU THƯƠNG là chìa khoá. Nỗi sợ dẫn đến sự kết tội, còn tình yêu thì tha thứ/bao dung.\nHướng dẫn thực hành:\nThực hành 3 lần mỗi lần 5 phút, hướng đến những điều bạn chưa, hoặc chưa thực sự tha thứ/bao dung, có thể là với chính mình hay ai đó, hay điều gì đó. Sử dụng câu “Đấng sáng tạo trao tình yêu để tôi tha thứ/bao dung cho…”\nMột quy tắc đơn giản là: bất cứ ai bạn không thích đều là một đối tượng phù hợp. Hãy nhắc tên từng người một và nói:\n“Đấng sáng tạo trao tình yêu để tôi tha thứ/bao dung cho…”\nMục đích của bài tập:\n- Giúp bạn nhận ra rằng tha thứ là cách duy nhất để giải phóng chính mình khỏi những ảo tưởng của nỗi sợ và tự ti.\n- Nhận thức rằng tha thứ không phải là sự ban phát cho người khác, mà là hành động để bạn tự giải thoát khỏi những gánh nặng trong tâm trí.\n🌿 Hãy thực hành bài tập này và cảm nhận sự giải phóng trong tâm trí bạn nhé! 🌿"}, {"n": 47, "t": "Đấng sáng tạo là sức mạnh để tôi vững tin.", "s": "", "d": "“God is the Strength in which I trust.”\nHướng dẫn thực hành:\nBài tập hôm nay vẫn trong chuỗi bài khẳng định khả năng của chúng ta khi kết nối với Nguồn.\nThực hành hành 4 lần mỗi lần 5 phút, và càng nhiều càng tốt những lần thực hành ngắn trong ngày. Đơn giản là lặp lại câu “Đấng sáng tạo là sức mạnh để tôi vững tin.”\nKhuyến khích các bạn gõ câu chủ đề gửi vào lớp để thực hành cùng nhau.\nHãy thực hành với sự thong thả, thư giãn và biết ơn nhé.\nThực hành trong cuộc sống – Khi gặp một vấn đề lớn khiến tôi lo lắng, tôi có thể nhắc nhở mình:\nTôi không cần tự mình giải quyết tất cả.\nTôi có thể lùi lại, lắng nghe sự hướng dẫn bên trong thay vì hoảng sợ.\nTôi có thể tin rằng có một trật tự cao hơn đang vận hành mọi thứ theo cách tốt đẹp nhất mà đôi khi con mắt giới hạn của tôi không nhìn thấy.\nVí dụ thực tế:\nTrong công việc: Nếu đang lo lắng về tương lai sự nghiệp của mình, thay vì hoảng sợ, có thể nhắc nhở bản thân rằng tôi không đơn độc, rằng có một trí tuệ cao hơn đang hướng dẫn tôi đến con đường phù hợp nhất.\nTrong mối quan hệ: Khi cảm thấy bị tổn thương hoặc thất vọng, có thể nhớ rằng tình yêu thực sự không đến từ bên ngoài mà từ sự kết nối với Đấng Sáng Tạo, nơi tôi luôn được yêu thương và chấp nhận.\nKhi đối diện với khó khăn: Nếu gặp thử thách tài chính, sức khỏe hay tinh thần, có thể nhắc nhở mình rằng tôi không phải tự chống chọi một mình – có một sức mạnh vô tận luôn hỗ trợ tôi."}, {"n": 48, "t": "Không có gì đáng sợ cả.", "s": "", "d": "“There is nothing to fear.”\nDiễn giải: Chúng ta thường sợ hãi vì tin rằng có mối đe dọa thực sự đối với sự tồn tại, an toàn hoặc hạnh phúc của mình. Nhưng nếu nhìn sâu hơn, ta sẽ thấy nỗi sợ chỉ là một sản phẩm của tâm trí, một ảo tưởng được tạo ra bởi chính những niềm tin sai lầm.\nDưới đây là những lý do tại sao thật sự không có gì phải sợ:\n1. Nỗi sợ là do tâm trí tạo ra, không phải sự thật khách quan\n🔥 Ví dụ: Khi bạn đi qua một con hẻm tối, bạn cảm thấy lo sợ vì nghĩ rằng có ai đó đang theo dõi mình. Nhưng thực tế có thể không có ai cả – chỉ là sự tưởng tượng của bạn khiến bạn hoảng sợ.\n💡 Điều này cho thấy: Nỗi sợ không đến từ thực tế, mà đến từ những suy nghĩ mà bạn tin là thật.\n2. Những gì bạn sợ không có thực, chỉ là ảo tưởng\n🔥 Ví dụ: Bạn lo lắng về việc thất bại trong công việc, nhưng sự thật là bạn chưa thất bại. Nỗi sợ chỉ tồn tại trong tâm trí, vì bạn đang tưởng tượng ra một kết quả tồi tệ thay vì tập trung vào hiện tại.\n💡 Điều này cho thấy: Chúng ta không sợ những gì đang xảy ra, mà sợ những gì ta tưởng tượng có thể xảy ra.\n3. Sợ hãi đến từ niềm tin sai lầm về sự mất mát\n🔥 Ví dụ: Bạn sợ mất tiền, mất danh dự, mất người thân. Nhưng thực tế, mọi thứ trong thế giới này đều thay đổi theo tự nhiên. Không có gì thực sự thuộc về bạn mãi mãi.\n💡 Điều này cho thấy: Khi bạn chấp nhận rằng bạn không kiểm soát được mọi thứ, bạn sẽ không còn sợ mất mát.\n4. Khi bạn dựa vào sức mạnh của Đấng Sáng Tạo, không có gì có thể làm hại bạn\n🔥 Ví dụ: Một đứa trẻ cảm thấy an toàn khi ở bên cha mẹ, vì nó biết rằng cha mẹ sẽ bảo vệ nó. Nếu bạn tin rằng bạn được Đấng Sáng Tạo bảo vệ, vậy thì bạn còn gì để sợ?\n💡 Điều này cho thấy: Nỗi sợ xuất hiện khi bạn nghĩ rằng bạn phải tự mình chống chọi với cuộc sống. Nhưng khi bạn tin tưởng vào sự dẫn dắt của Đấng Sáng Tạo, bạn sẽ không còn thấy sợ hãi nữa.\n5. Hiện tại là nơi duy nhất mà bạn thực sự sống – nhưng nỗi sợ luôn ở tương lai\n🔥 Ví dụ: Nếu bạn tập trung vào giây phút hiện tại, bạn sẽ nhận ra rằng bạn vẫn đang thở, vẫn an toàn, vẫn bình yên.\n💡 Điều này cho thấy: Nỗi sợ chỉ tồn tại khi bạn nghĩ về tương lai, nhưng tương lai chưa xảy ra. Nếu bạn ở trong hiện tại, bạn không thể sợ hãi.\n6. Bạn mạnh mẽ hơn những gì bạn nghĩ\n🔥 Ví dụ: Nhiều lần trong quá khứ, bạn nghĩ rằng mình sẽ không vượt qua được một khó khăn nào đó, nhưng cuối cùng bạn vẫn làm được. Điều này chứng minh rằng nỗi sợ không có thực, chỉ là một rào cản tâm lý.\n💡 Điều này cho thấy: Bạn luôn có đủ sức mạnh để đối mặt với mọi tình huống.\n💡 Kết luận: Không có gì đáng sợ vì...\n✅ Nỗi sợ chỉ là ảo tưởng của tâm trí, không phải sự thật.\n✅ Những gì bạn sợ chưa thực sự xảy ra.\n✅ Mất mát là một phần tự nhiên của cuộc sống, không phải điều đáng sợ.\n✅ Khi bạn tin vào Đấng Sáng Tạo, bạn không còn đơn độc.\n✅ Hiện tại là nơi bạn đang sống, và không có gì đáng sợ ở hiện tại.\n✅ Bạn mạnh mẽ hơn những gì bạn nghĩ.\nHướng dẫn thực hành:\nLặp lại câu \"Không có gì đáng sợ cả.\" càng nhiều lần càng tốt trong ngày. Khuyến khích các bạn gửi câu chủ đề vào lớp nhé.\nBạn có thể thực hành bất cứ lúc nào, với mắt mở hoặc mắt nhắm.\nKhi có điều gì đó khiến bạn bất an, lo lắng hay sợ hãi, hãy ngay lập tức nhắm mắt lại và nói với bản thân thật chậm rãi:\n\"Không có gì đáng sợ cả.\" hoặc \"Không việc gì phải sợ cả\".\nCảm nhận sự bình an khi bạn nhớ rằng nỗi sợ chỉ là ảo tưởng, và bạn không cần phải tự mình đối diện với mọi thứ.\ncó thể bổ sung một vài câu khẳng định:\n👉 \"Không có gì đáng sợ cả.\"\n👉 \"Tôi không phải tự mình làm tất cả. Tôi luôn được hướng dẫn. Tôi luôn được hỗ trợ.\"\n👉 \"Mọi thứ xảy ra đều vì lợi ích cao nhất của tôi theo cách tốt nhất mà Vũ Trụ sắp đặt.\"\n📌 Hãy thử áp
