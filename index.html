 từng thất bại kia...\"\nTrong bài học này, ACIM mời gọi ta buông bỏ tất cả những lớp kính đó với lời khẳng định:\nTôi không muốn tiếp tục giữ lại quá khứ của họ. Tôi muốn thấy họ như Thượng Đế thấy họ:\nVẫn nguyên vẹn, thuần khiết, không có tội lỗi, không mang lỗi lầm nào cả.\nViệc quên đi quá khứ của người khác giúp lại là cách để ta buông được những định kiến và nỗi sợ trong chính ta. Từ đó ta trở về trạng thái Nhất Thể.\nLưu ý: Quên ở đây không phải là phủ nhận ký ức, mà là buông sự phán xét bằng những ký ức vốn mang tính chủ quan góc nhìn cá nhân."}, {"n": 289, "t": "Quá khứ đã qua. Nó không thể còn chạm được vào tôi.", "s": "The past is over. It can touch me not.", "d": "Diễn giải\nQuá khứ thật ra chỉ là những ảo ảnh được lưu lại trong tâm trí, chúng không phải là sự thật nhưng việc suy ngẫm lặp đi lặp lại bằng tâm trí khiến chúng ta bị dính mắc vào chúng.\nVà vì còn dính mắc, ta không thể nhìn thấy sự thật toàn vẹn như nó đang là. Lăng kính của ta đang bị vẩn đục bởi những thứ không còn là sự thật đúng đắn ngay hiện tại.\nViệc mang theo lăng kính vẩn đục bởi quá khứ là một lớp phòng vệ. Và chúng ta sẽ chỉ phòng vệ khi tự nhận bản thân còn yếu đuối, còn không an toàn.\nMà khi ta nghĩ như thế thì ta sẽ vô thức thu hút tình huống \"tiêu cực\" đến để ta thấy đúng là ta yếu đuối, ta không an toàn.\nMuốn chạm vào phiên bản đủ đầy, tốt đẹp an toàn vốn sẵn có, ta cần tự nhắc bản thân về điều này:\nQuá khứ đã qua. Nguyện cho tôi không còn dính mắc vào quá khứ."}, {"n": 290, "t": "Hạnh phúc ở khoảnh khắc hiện tại là tất cả những gì tôi nhìn thấy.", "s": "My present happiness is all I see", "d": "Khi ta không còn để tâm trí \"đánh lạc hướng\" mình bằng những ảo ảnh cũ, khi ta buông bỏ quá khứ và từ chối tin rằng giấc mơ mình từng tạo ra là thật,\nthì niềm hạnh phúc trong hiện tại là tất cả những gì ta có thể nhìn thấy.\nVới quyết tâm ấy, ta quay về cùng Thượng Đế, ta trao mình cho sự dẫn dắt thiêng liêng, và để Ý muốn của Thượng Đế trở thành điều ta cũng mong muốn.\nNgay tại đây, ta nhớ lại:\nMình không bị tách rời.\nMình không bị bỏ quên.\nTa và Đấng Sáng Tạo là Một.\nVà từ sự hợp nhất ấy, quyền năng sáng tạo đích thực trong ta bắt đầu hiển lộ bắt đầu từ dòng chảy của hạnh phúc hiện diện, không cần kiểm soát.\n## Chương 8: Thế giới thật.\nTheo ACIM, thế giới chia tách, đấu tranh, sợ hãi mà chúng ta đang nhìn thấy không phải là thế giới thật.\nThế giới thật chỉ có thể được nhìn thấy bằng đôi mắt của sự tha thứ và bao dung: khi ta không còn dính mắc vào quá khứ hay sự phòng vệ.\nTrong thế giới thật, ta không còn thấy đau khổ, đấu tranh, chia rẽ hay sợ hãi nữa.\nThay vào đó là sự tĩnh lặng, nhẹ nhàng và yêu thương.\nKhông còn điều gì nằm ngoài sự tha thứ và bao dung. Và chỉ khi ta bao dung cho chính mình, ta mới có thể thấy một thế giới như vậy.\nMột tâm trí đã bình an không còn tìm cái sai ở người khác.\nNó không còn thấy tội lỗi, không còn nhu cầu lên án. Nó chỉ thấy xung quanh mình là tình yêu, sự an toàn và niềm vui. Vì nó đã chọn nhìn bằng sự tử tế bên trong chính mình."}, {"n": 291, "t": "Hôm nay là ngày của tĩnh lặng, ngày của bình an.", "s": "This is a day of stillness and of peace.", "d": "Hôm nay tôi vẫn làm mọi thứ như thường ngày, nhưng với một nhận thức khác, một cái nhìn khác.\nTôi thấy mọi thứ đều đẹp đẽ và đáng yêu, mọi người xung quanh đều thánh thiện và đầy ánh sáng.\nMọi hành động của tôi đều chứa đựng sự an lành.\nTôi đang dần nhìn thấy thế giới đúng như nó là: là tình yêu và ánh sáng."}, {"n": 292, "t": "Kết quả hạnh phúc cho mọi sự là điều chắc chắn.", "s": "A happy outcome to all things is sure.", "d": "Lời hứa của Đấng Sáng Tạo không có ngoại lệ. Dù chuyện gì xảy ra, chỉ hạnh phúc và niềm vui mới là kết quả sau cùng của tất cả.\nThời gian ta cần để nhận ra điều đó phụ thuộc vào việc ta còn kháng cự Ý chí của Người mức độ nào.\nKhi ta thôi kháng cự, khi ta thôi tin rằng mình phải tự xoay xở một mình: mọi điều sẽ bắt đầu xoay chuyển nhanh hơn về phía kết quả hoàn mỹ.\nHôm nay, tôi quyết định không còn trì hoãn việc hòa vào Nhất thể nữa. Bởi tôi biết: kết cục có hậu là một lời hứa chắc chắn."}, {"n": 293, "t": "Mọi nỗi sợ đều đã qua, chỉ còn lại Tình yêu ở khoảnh khắc hiện tại.", "s": "", "d": "Nguồn gốc của nỗi sợ là những gì tôi gạn lọc và lưu lại từ quá khứ. Tất cả nỗi sợ đều tan biến khi tôi nhận ra rằng những ký ức về quá khứ không phải là sự thật toàn vẹn.\nTôi nguyện buông ký ức, phán xét và tổn thương cũ, để tâm trí bắt đầu an trú trở lại trong hiện tại, nơi chỉ có Tình yêu là thực.\nTình yêu không còn là điều tôi phải cố gắng tìm kiếm, mà trở nên hiển nhiên, rõ ràng, dễ thấy, như ánh sáng vẫn luôn ở đó, chỉ chờ tôi mở mắt ra nhìn.\nTrong ánh sáng đó, mọi sự vật đều trở nên thuần khiết, nhẹ nhàng, và đáng yêu.\nThượng Đế kính yêu,\nxin cho con đừng quên mất thế giới bình an mà Người đã đặt trong tim con.\nXin cho con đủ tĩnh lặng để nghe được những thanh âm biết ơn và yêu thương đang ngân vang dưới lớp ồn ào của sợ hãi.\nCon biết, có một thế giới thật sự, nơi hiện tại là chiếc nôi an toàn, ôm trọn con khỏi mọi vết thương quá khứ.\nHôm nay, xin cho mắt con chỉ nhìn thấy thế giới ấy, thế giới mà Tình yêu đang sống động ở khắp nơi."}, {"n": 294, "t": "Cơ thể tôi là một công cụ trung tính", "s": "My body is a wholly neutral thing.", "d": "Tôi không phải là cơ thể này, tôi lớn lao hơn thế rất nhiều. Tôi là con của Thượng Đế: thuần khiết, vĩnh cửu và không giới hạn.\nCơ thể chỉ là một phương tiện tạm thời, được trao cho tôi để phục vụ hành trình tỉnh thức, yêu thương và tha thứ.\nKhi tôi dùng nó đúng mục đích, nó sẽ hỗ trợ tôi.\nKhi không còn cần thiết, nó sẽ được bỏ xuống nhẹ nhàng: không đau đớn, không sợ hãi.\nCơ thể của tôi chỉ mang bệnh tật khi tôi đưa vào nó gánh nặng của những lo lắng và sợ hãi do tâm trí tạo ra. Giờ đây tôi đưa vào cơ thể lòng biết ơn, sự bình an và yêu thương, sự phục hồi sẽ diễn ra nhanh chóng.\nHôm nay, tôi nguyện nhớ rằng: Tôi không chỉ là cơ thể này, tôi rộng mở và lớn lao hơn thế.\nHôm nay tôi nguyện đưa vào lòng biết ơn, sự bình an và yêu thương và từng bộ phận trên cơ thể này."}, {"n": 295, "t": "Sự thánh thiện thông qua cái nhìn của tôi đến với thế giới.", "s": "The Holy Spirit looks through me today.", "d": "Hôm nay, Thượng Đế sẽ nhìn thế giới thông qua đôi mắt của tôi.\nKhi Người nhìn thế giới bằng đôi mắt thánh thiện, Người đang chữa lành cho thế giới và cho chính tôi. Những nỗi sợ và ảo tưởng chia cắt dần biến mất. Sự cứu rỗi được diễn ra đồng thời, tôi được cứu rỗi và thế giới cũng được cứu rỗi, tất cả phải diễn ra cùng một lúc. Chỉ cần tôi cho phép bản thân nhìn mọi thứ bằng nhận thức nguyên bản, thuần khiết của Thượng Đế vốn sẵn có trong tôi.\nHôm nay, ánh nhìn của tôi là đường dẫn giúp chữa lành mọi thứ tôi nhìn thấy.\nThượng Đế kính yêu,\nXin giúp con nhìn đời qua đôi mắt thánh thiện, đong đầy yêu thương của Người,\nđể tình yêu, tha thứ từ Đấng Thiêng Liêng có thể ban phước lành lên tất cả những gì con nhìn thấy,\nvà tình yêu ấy cũng ngự trị trong chính con."}, {"n": 296, "t": "Sự thánh thiện thông qua lời nói của tôi đến với thế giới", "s": "The Holy Spirit speaks through me today.", "d": "Hôm nay, Thượng Đế sẽ lên tiếng thông qua lời nói của tôi.\nKhi tôi cất lời bằng tình yêu, tha thứ và sự hiệp nhất, thế giới được chữa lành và tôi cũng được chữa lành. Những lời nói ấy không chỉ là ngôn từ, mà là năng lượng dẫn truyền của Thánh Linh, giúp đưa thế giới trở về với sự thật và tình yêu nguyên bản.\nTôi nguyện buông bỏ những lời chỉ trích, đổ lỗi, oán giận hay chia cách vì mỗi lời ấy đều đang kéo thế giới vào ảo mộng sợ hãi.\nTôi chọn dùng tiếng nói của mình để yêu thương, nâng đỡ, khơi mở và làm hiển lộ ánh sáng của Thượng Đế đang sẵn có trong tôi.\nHôm nay, lời nói của tôi là nhịp cầu đưa tình yêu của Thượng Đế chạm đến mọi tâm hồn.\nThượng Đế kính yêu,\nXin dùng con như một đường dẫn của Lời thiêng.\nXin nói qua con, bằng những lời yêu thương, bình an và chữa lành,\nđể thế giới lắng nghe được Tiếng của Người,\nvà để chính con cũng nhớ lại Sự Thật bất biến bên trong mình.\n**Ghi chú:**"}, {"n": 297, "t": "Bao dung là món quà duy nhất tôi trao đi", "s": "Forgiveness is the only gift I give", "d": "Tôi chọn bao dung hôm nay, bởi đó là món quà duy nhất tôi thật sự muốn nhận.\nMỗi khi tôi bao dung cho ai đó, tôi đang tự trao cho mình bình an và tự do.\nSự cứu rỗi thật đơn giản: Khi ta trao đi điều gì, ta cũng đang nhận lại điều đó.\nTôi chọn bao dung cho người, cho đời, cho chính mình.\nVà đó là lúc tôi hoà vào Nhất Thể.\nLời nguyện:\nThượng Đế kính yêu,\nHôm nay con chọn tha thứ vì con muốn bình an, thịnh vượng và hạnh phúc.\nXin giúp con trao đi điều con muốn nhận lại: sự tha thứ, bao dung, yêu thương và tự do.\nXin biết ơn Người vì bản thể trọn vẹn luôn có sẵn trong con."}, {"n": 298, "t": "Tôi yêu Thượng Đế, yêu chính mình, và yêu tất cả những ai là con của Người.", "s": "", "d": "Khi tôi biết ơn, tôi dễ dàng mở lòng đón nhận tình yêu, không còn lo sợ hay dè dặt.\nTình yêu giúp tôi nhớ lại mình là ai: một con người trọn vẹn, đủ đầy và bình yên.\nBất cứ điều gì xâm phạm vào sự thánh thiện tôi dành cho cuộc đời, lòng bao dung sẽ làm chúng tan biến..\nTôi đang dần tỉnh dậy khỏi giấc mơ hỗn loạn của riêng mình.\nTôi chọn buông bỏ con đường cũ của sự cố gắng kiểm soát, và đón nhận những điều Thượng Đế đã thiết kế cho tôi.\nLời nguyện:\nThượng Đế kính yêu,\nCon xin buông mọi lo âu và kiểm soát, để tình yêu của Người chảy qua con,\nchữa lành con, và lan toả đến mọi người con gặp hôm nay.\nXin nhắc con nhớ rằng, con được sinh ra từ tình yêu và tình yêu ấy vẫn luôn hiện diện trong con."}, {"n": 299, "t": "Sự thánh thiện vĩnh cửu luôn ở trong tôi", "s": "Eternal holiness abides in me.", "d": "Sự thánh thiện trong tôi là món quà thiêng liêng Thượng Đế đã đặt sẵn từ khi tôi được tạo thành.\nSự thánh thiện của tôi vượt quá khả năng hiểu biết của tôi. Không gì có thể che khuất hay làm mờ đi ánh sáng của sự thánh thiện đó, nó trường tồn và luôn hoàn hảo.\nDù có lúc tôi quên mất điều đó, vẫn luôn có một phần thuần khiết và nguyên vẹn bên trong tôi ,chờ tôi nhận ra.\nTôi không cần phải trở thành điều gì khác, chỉ cần chấp nhận sự thật rằng mình đã đủ đầy và trọn vẹn.\nMỗi lần tôi nhớ lại điều này, tôi đang chữa lành, cho chính mình và cả thế giới tôi nhìn thấy.\nLời nguyện:\nThượng Đế kính yêu\nXin nhắc con nhớ rằng con được tạo ra từ sự thánh thiện của Người. Không điều gì có thể lấy đi ánh sáng ấy bên trong con.\nXin giúp con buông những ảo tưởng, để con nhận ra bản thân mình đã luôn vẹn nguyên, và được sinh ra là để soi sáng, chữa lành, và yêu thương."}],$=x=>document.getElementById(x);let cur,on=false;
function render(){const c=$('c');$('bd').className=on?'on':'';c.style.display=on?'block':'none';c.textContent=cur.d||'Bài này chưa có diễn giải.'}
function show(x){cur=x;on=false;$('n').textContent='BÀI '+x.n;$('t').textContent=x.t;$('s').textContent=x.s;render()}
$('bd').onclick=()=>{on=!on;render()};
function today(){const d=new Date(),k=d.getFullYear()*10000+(d.getMonth()+1)*100+d.getDate();
 return L[(k*2654435761>>>0)%L.length]} // cùng ngày → cùng bài
$('g').onclick=()=>{const x=L.find(y=>y.n==$('i').value);x?show(x):alert('Chưa có bài '+$('i').value)};
$('d').onclick=()=>show(today());show(today());
</script></body></html>
