ế kính yêu, con chọn tin vào dòng chảy dư dả vô tận của Vũ Trụ,\ncon chọn mở rộng tấm lòng, sống yêu thương, bao dung và cho đi\nđể khơi nguồn dòng chảy tuyệt vời đó chảy đến con.\nXin Người nâng đỡ để con làm được điều đó."}, {"n": 170, "t": "Không có cái ác nơi Đấng Sáng Tạo và nơi tôi.", "s": "There is no cruelty in God and none in me.", "d": "Trong thế giới nhị nguyên nơi cái thiện và cái ác luôn song hành, nơi yêu thương và sợ hãi tồn tại song song việc tổn thương dường như là điều không thể tránh khỏi.\nKhi bạn sống trong thế giới đó, bạn buộc phải chọn: hoặc làm tổn thương người khác để tự vệ, hoặc làm tổn thương chính mình bằng cách co mình lại, chịu đựng, né tránh, phủ nhận bản thân.\nTấn công hay phòng thủ đều xuất phát từ nỗi sợ. Và nỗi sợ chỉ sinh ra khi ta tin rằng mình tách biệt với tình yêu, tách biệt với Thượng Đế.\nNhưng sự thật là: chúng ta chưa từng tách biệt.\nThế giới của cái ác, của sự tấn công thật ra chỉ là ảo ảnh do tâm trí sợ hãi tạo ra. Khi tâm trí ấy được chữa lành, khi ta thôi chống lại, thôi phòng thủ ta sẽ thấy rõ:\nKhông có cái ác nơi Đấng Sáng Tạo. Nơi tôi hay nơi bất kỳ ai cũng vậy.\nTôi không còn cần phải làm tổn thương hay bảo vệ điều gì nữa.\nTôi không còn cần phải phân chia ai đúng ai sai.\nTôi được mời gọi trở về với tình yêu thuần khiết không điều kiện nơi không có chỗ cho sự tàn nhẫn, và mọi vết thương đều được ôm ấp bằng ánh sáng.\nHôm nay, hãy dừng lại nhiều lần và nhắc nhẹ nhàng trong tâm trí mình:\n\"Không có cái ác nơi Đấng Sáng Tạo và nơi tôi.\"\nVà trong từng hơi thở bình yên ấy, ta đang giải phóng cả thế giới khỏi nỗi sợ trong ta mà thôi."}, {"n": 171, "t": "Ôn tập bài 151-152", "s": "", "d": "151. Vạn vật là tiếng vọng từ lời của Đấng sáng tạo.\n152. Quyền năng ra quyết định thuộc về tôi.\nKhi tâm trí bạn phán xét như thói quen tự nhiên của nó, dừng lại trong giây lát và tự nhủ “Sự thật đầy đủ chưa chắc đã như tôi thấy vậy hay cho là vậy, tôi để sự phán xét cho Đấng sáng tạo”.\nKhông ai có thể trải qua sự mất mát, tổn thương, bệnh tật, thậm chí cả cái chết… trừ khi đó là quyết định của chính người đó. Nhưng cũng chính vì mọi sự đều xuất phát từ quyết định của bạn, vậy nên thoát khổ cũng chỉ có thể do bạn quyết định."}, {"n": 172, "t": "Ôn tập bài 153-154", "s": "", "d": "153. Khi tôi ngừng phòng thủ, tôi an toàn.\n154. Tôi là sứ giả của Đấng sáng tạo.\nChúng ta một lần nữa thực hành thả lỏng và buông sự phòng thủ. Ngay khi bạn có cảm giác ấm áp và an toàn, bạn đang lan toả thông điệp của Nhất thể."}, {"n": 173, "t": "Ôn tập bài 155-156", "s": "", "d": "155. Tôi lùi lại một bước để Đấng sáng tạo dẫn đường.\n156. Tôi hướng về Đấng sáng tạo trong sự thánh thiện hoàn hảo.\nCho dù bất cứ chuyện gì đã xảy ra, bạn (linh hồn của bạn) cũng trọn vẹn hoàn hảo, thánh thiện hoàn hảo. Ánh sáng ở bên trong bạn không bao giờ tắt hay bị lu mờ bởi bất kỳ điều gì. Ánh sáng đó luôn có thể cứu rỗi bạn và cả thế giới của bạn. Bạn trong sáng và thuần khiết, không có tội lỗi nào cũng như không cần sự chuộc lỗi nào cần phải diễn ra.\nHãy lùi lại một bước để Đấng sáng tạo dẫn đường, bởi con đường của bạn, không gì khác, là con đường của sự hoà hợp, con đường của tình yêu, bình an, sáng tạo… chính là những gì mà Đấng sáng tạo đại diện. Vậy còn người dẫn đường nào phù hợp hơn như vậy?"}, {"n": 174, "t": "Ôn tập bài 157-158", "s": "", "d": "157. Tôi hoà mình vào sự hiện diện của Đấng sáng tạo.\n158. Hôm nay tôi học cách trao đi những gì tôi được nhận.\nBạn là sứ giả của Đấng sáng tạo, bạn lui lại một bước để được dẫn dắt và khi hướng về Người, bạn thánh thiện hoàn hảo. Hôm nay hãy giữ nguyên mọi thứ như vậy, không cần làm gì khác ngoài tận hưởng trong sự hiện diện của Đấng sáng tạo. Cũng bằng cách đó, bạn đang lan toả thông điệp về Nhất thể."}, {"n": 175, "t": "Ôn tập bài 159-160", "s": "", "d": "159. Tôi trao đi điều kỳ diệu mà tôi đã được nhận.\n160. Tôi an trú tại ngôi nhà nội tâm. Nỗi sợ chỉ là người khách lạ.\nKhi bạn bao dung, sự bao dung đã ở trong bạn. Khi bạn mang sự dịu dàng tới người khác, sự dịu dàng đã ở trong bạn. Khi bạn yêu, tình yêu đã ở trong bạn. Với bất kỳ món quà nào bạn trao đi, bạn đã có món quà đó. Và cứ như thế, bạn chính là sứ giả của Đấng sáng tạo.\nKhi an trú tại ngôi nhà nội tâm, không có nỗi sợ hay sự bất an nào bạn có thể trao cho người khác và thế giới.\nCùng thực hành lại việc an trú và trao đi với 2 bài tập này nhé."}, {"n": 176, "t": "Ôn tập bài 161-162", "s": "", "d": "161. Hãy trao cho tôi những phước lành của bạn!\n162. Tôi trọn vẹn như khi Đấng sáng tạo sinh ra tôi.\nBạn có thể yêu cầu bất cứ ai trao cho bạn phước lành, việc này không hề lấy đi phước lành của họ, đơn giản bạn và họ là Một. Và để làm được điều đó, luôn nhớ rằng bạn và người ấy đều trọn vẹn."}, {"n": 177, "t": "Ôn tập bài 163-164", "s": "", "d": "163. Cái chết không tồn tại. Những đứa con của Đấng sáng tạo luôn tự do.\n164. Ngay bây giờ, tôi là Một với Nguồn.\nHành trình sự sống là không hồi kết, vì vậy mỗi giây phút bạn đều đang kiến tạo nên thực tại mới. Mỗi khoảnh khắc ý thức rằng bạn là Một với Nguồn, bạn đang kiến tạo nên một thế giới tốt đẹp hơn."}, {"n": 178, "t": "Ôn tập bài 165-166", "s": "", "d": "165. Nguyện cho tâm tôi ngừng gạt đi những ý nghĩ của Đấng Sáng tạo.\n166. Tôi được giao phó với những món quà từ Đấng sáng tạo.\nKhi tâm trí tĩnh lặng, bạn nghe thấy thông điệp của tình yêu và sự bình an từ Đấng sáng tạo, đồng thời nhận lấy nguồn khả năng sáng tạo và kiến tạo, hãy mang món quà đó đến với thế giới này bởi bạn là sứ giả của Đấng sáng tạo."}, {"n": 179, "t": "Ôn tập bài 167-168", "s": "", "d": "167. Chỉ có một cuộc đời, và tôi chia sẻ nó cùng Đấng sáng tạo.\n168. Ân sủng đã được ban và tôi nhận lấy ngay bây giờ!\nToàn bộ vũ trụ khởi nguồn bằng một ý niệm và ý niệm đó không bao giờ mất đi. Bạn cũng sinh ra ngay từ lúc xuất hiện ý niệm đó và sẽ luôn tồn tại cùng nó. Hoà nhập vào Nhất thể và bạn sẽ sống mãi với nó.\nChúng ta luôn được Đấng sáng tạo ưu ái. Vì vậy, đừng ngại đưa ra yêu cầu cho Vũ trụ, cho Đấng sáng tạo."}, {"n": 180, "t": "Ôn tập bài 169-170", "s": "", "d": "169. Nhờ sự ân sủng mà tôi sống. Nhờ sự ân sủng mà tôi được giải thoát.\n170. Không có cái ác nơi Đấng sáng tạo và nơi tôi.\nNhờ sự ân sủng mà chúng ta sống. Nhờ sự ân sủng mà chúng ta được giải thoát. Bởi thế giới thực sự không phải thế giới Nhị nguyên mà là Nhất thể, nơi không có xung đột, chia cắt, chỉ có tình yêu và sự bao dung."}, {"n": 181, "t": "Tôi tin tưởng những người anh em của tôi những người là Một với tôi.", "s": "", "d": "Tất cả chúng ta đều là Một trong Đấng Sáng Tạo.\nVì vậy, cách ta nhìn người khác thực chất là cách ta đang nhìn chính mình.\nMỗi khi ta phán xét một ai đó, tức là ta đang vô tình khẳng định một hình ảnh giới hạn cho chính mình.\nVà ngược lại, khi ta có thể nhìn người khác bằng ánh mắt yêu thương, bao dung, ta cũng đang mở rộng trái tim để thấy sự thánh khiết trong chính ta.\nHôm nay, hãy để bài thực hành này trở thành nhịp thở nhẹ nhàng trong suốt cả ngày.\nBất cứ khi nào ta gặp một ai đó ngoài đời, qua mạng, hay chỉ trong tâm trí hãy dừng lại một chút và thầm nhủ:\n“Tôi tin tưởng.. [người đó]. [Người đó].. là Một với tôi.”\nDù chưa thể thật sự cảm thấy như vậy, chỉ cần lặp lại điều này trái tim ta sẽ dần được dẫn trở về với sự thật.\nTa sẽ bắt đầu thấy người khác nhẹ nhàng hơn, thế giới dịu dàng hơn, và chính ta cũng được giải phóng khỏi những lớp phòng vệ cũ kỹ.\nBởi vì…\nTin tưởng người khác chính là chọn tin vào bản chất vô tội, thuần khiết và nguyên lành vốn đã có sẵn trong tất cả chúng ta.\nVà khi ta có thể thấy điều đó trong người khác, ta đang từng bước nhìn thấy điều đó trong chính mình.\nĐó là cách thế giới bên ngoài dần phản ánh sự chữa lành bên trong một cách tự nhiên và sâu sắc."}, {"n": 182, "t": "Tôi tĩnh lặng trong một khoảnh khắc và “trở về nhà”.", "s": "", "d": "Rất nhiều khi chúng ta có cảm giác xa lạ và lạc lõng trong chính thế giới này. Điều này là dễ hiểu, bởi đây không phải là nhà của chúng ta. Ngôi nhà đích thực là nơi chúng ta cảm thấy an toàn, được yêu thương vô điều kiện, được là chính mình và vun đắp, tạo ra những trải nghiệm tuyệt vời. Có bao giờ bạn bỗng có cảm giác như là đang “nhớ nhà” đó? Bởi sâu thẳm bên trong, linh hồn của bạn luôn nhớ ngôi nhà thực sự của bạn.\nĐôi khi chúng ta ở đây, lang thang trong cuộc tìm kiếm tưởng chừng như vô tận, vật lộn trong bóng tối của những xung đột, mà không biết rằng chúng ta có thể “quay trở về nhà” bất cứ lúc nào.\nDừng lại một giây, hít thở, hiện diện ngay tại đây, bây giờ và tự nhủ:\n\"TÔI TĨNH LẶNG VÀ TÔI VỀ NHÀ\"\nRồi nhắm mắt ngồi yên như thế hình dung về cảm giác bình an yêu thương đang ngập tràn quanh mình, ít nhất 1 phút hoặc lâu hơn càng tốt.\nXong đó, bạn có thể nhắn cho Group lớp \"TÔI TĨNH LẶNG VÀ TÔI VỀ NHÀ\".\nNhư một hạt giống lành gửi đến mọi người\nHÔM NAY, CHÚNG TA CÙNG DÀNH NHỮNG KHOẢNH KHẮC TĨNH LẶNG để VỀ NHÀ."}, {"n": 183, "t": "Tôi hướng đến Nguồn, cũng là hướng đến chính tôi", "s": "I call upon God's Name and on my own.", "d": "Bài tập hôm nay là một lời mời nhẹ nhàng để quay về bên trong về với Nguồn, về với chính ta.\nKhi ta gọi tên Đấng Sáng Tạo, cũng là lúc ta đang gọi tên chính mình phần sâu thẳm nhất, sáng trong nhất ở bên trong.\nGiữa thế giới ồn ã, ta đã quen hướng ra ngoài, cố gắng kiểm soát, đối phó, gồng mình để được an toàn. Nhưng càng đi xa khỏi mình, ta càng thấy bất an, hoang mang và mệt mỏi.\nHãy dừng lại một chút. Hít một hơi thật sâu. Và gọi thầm Danh Ngài như một tín hiệu để trở về với nơi chốn thiêng liêng trong tim.\nBất cứ khi nào thấy mình bị cuốn theo cảm xúc, bị những cái tên ngoài kia định nghĩa hãy nhắc lại:\n“Tôi hướng đến Nguồn, cũng là hướng đến chính tôi.”\nCâu nói ấy sẽ nhắc ta rằng:\nMọi điều ta đi tìm bên ngoài sự an toàn, tình yêu, sự nâng đỡ đều đang có sẵn ở bên trong."}, {"n": 184, "t": "Danh xưng của Đấng Sáng Tạo là gia tài tôi kế thừa.", "s": "The Name of God is my inheritance.", "d": "Chúng ta lớn lên trong một thế giới được đặt tên cho mọi điều từ đồ vật, con người, cho đến từng trải nghiệm. Những cái tên giúp ta phân biệt và sử dụng, nhưng cũng chính chúng khiến ta quên mất: tất cả vốn dĩ là Một.\nMỗi khi ta gọi tên một ai đó, một điều gì đó, ta thường quên mất bản chất thiêng liêng đằng sau rằng mọi thứ đều bắt nguồn từ cùng một Nguồn, đều chia sẻ một Danh duy nhất, đều là biểu hiện khác nhau của cùng một Sự Sống.\nHôm nay, trong từng lời gọi tên, ta nhắc mình nhớ:\n“Mọi điều ta thấy đều thuộc về Nguồn.\nMọi người tôi gặp đều là tôi trong hình hài khác.”\nDanh xưng của Đấng Sáng Tạo chính là Danh xưng của tôi.\nĐó là gia tài sâu thẳm, là bản chất chung, là nơi ta thuộc về trong sự hợp nhất toàn vẹn."}, {"n": 185, "t": "Tôi nguyện có được sự bình an của Đấng Sáng Tạo", "s": "I want the peace of God.", "d": "Hôm nay, chúng ta hãy chọn sống trong bình an trong từng suy nghĩ, lời nói và hành động nhỏ bé.\nKhi đi bộ, quét nhà, nấu ăn…\nHãy làm mọi việc trong sự hiện diện nhẹ nhàng của bình an.\nKhi nhìn người khác, đọc tin tức, trò chuyện… hãy vẫn giữ sự bình an như một không gian nội tâm vững vàng.\nDành vài phút chỉ để ở lại với hơi thở, để ở bên chính mình và cảm nhận sự bình an đang nở hoa từ bên trong.\nMỗi lần ta nhớ ra và trở về với bình an,\nchính là ta đang dần chạm vào sự bình an vĩnh cửu của Đấng Sáng Tạo.\nHãy thực hành bất cứ khi nào có thể.\nĐơn giản là dịu dàng nhắc mình quay về, và thong thả bước tiếp, trong sự bao dung."}, {"n": 186, "t": "Sự cứu rỗi của thế giới phụ thuộc vào tôi", "s": "Salvation of the world depends on me.", "d": "Chúng ta vẫn thường nghĩ:\n“Nếu chỉ mình tôi bình an, còn thế giới ngoài kia vẫn xáo trộn thì liệu có ích gì?”\n“Mình muốn sống thảnh thơi, nhưng cuộc đời cứ xô đẩy thì làm sao giữ được?”\nNhưng A Course in Miracles lại nói điều ngược lại:\nThế giới này thực sự được chữa lành từ bên trong từng con người.\nVà ta với tâm trí sáng rõ, bình an, bao dung chính là cánh cổng để điều kỳ diệu đó xảy ra.\nSự bình an của thế giới phụ thuộc vào ta.\nKhông phải để ta kiêu ngạo hay ảo tưởng sức mạnh.\nMà để ta nhớ lại vai trò thật của mình, vai trò đã được giao từ nơi thiêng liêng nhất.\nRằng: Mỗi hành động, mỗi ánh nhìn của ta đều có thể là một phép màu.\nHôm nay, hãy nhắc thầm:\n“Sự cứu rỗi của thế giới phụ thuộc vào tôi.”\nVà rồi, ý thức trong từng lựa chọn:\n- Tôi sẽ nhìn cuộc đời bằng con mắt bao dung hay phán xét?\n- Tôi sẽ gieo một sự hiện diện ấm áp hay một nỗi hoài nghi?\n- Tôi sẽ sống như một mắt xích của Ánh sáng, hay tiếp tục bám vào giấc mộng sợ hãi?\nThay đổi sẽ đến có thể âm thầm , nhưng sâu sắc.\nVà rồi, ta sẽ nhận ra: khi ta trở về với sự thật bên trong mình, thế giới cũng bắt đầu trở về."}, {"n": 187, "t": "Tôi nguyện phước lành cho thế giới và cũng là cho chính tôi.", "s": "I bless the world because I bless myself.", "d": "Hãy nhớ rằng bạn là Một với Đấng Sáng Tạo, và bạn hoàn toàn có thể mang phước lành đến thế giới bằng chính tình yêu, sự bao dung và bình an từ bên trong bạn.\nĐừng nghĩ rằng yêu thương hay bao dung là điều gì to tát.\nChúng ta thường lầm tưởng rằng để yêu, để tha thứ, để bình an phải hy sinh, phải chịu đựng, phải trở thành một ai đó thật vĩ đại.\nNhưng bình an thực sự bắt đầu từ những điều rất nhỏ.\nĐó là lúc bạn mỉm cười khi thấy một đám mây trôi, thấy lòng dịu lại khi chạm vào một tán lá, cảm thấy bình yên khi nhìn mặt hồ phẳng lặng…\nChính là lúc ấy bạn đang ở trong tần số thuần khiết nhất của tình yêu.\nVà chính rung động ấy, lại có sức lay động cả thế giới.\nHãy mang sự rung động đó vào từng điều bạn làm, vào từng lời bạn nói, vào sự hiện diện mỗi khi bạn bước vào một không gian.\nVì mỗi lần bạn chọn yêu bạn đang chúc phúc cho thế giới, và đồng thời cũng đang chúc phúc cho chính mình.\n“Tôi nguyện phước lành cho thế giới và cũng là cho chính tôi.”"}, {"n": 188, "t": "Bình an nơi Đấng sáng tạo đang chiếu rọi tôi ngay khoảnh khắc này.", "s": "The peace of God is shining in me now.", "d": "Không phải tìm kiếm ánh sáng hay hướng về ánh sáng, ánh sáng luôn ở trong bạn và toả ra từ bạn, chỉ cần bạn nhận ra nó.\nÁnh sáng này có thể chưa được nhìn thấy bằng mắt thường, nhưng chắc chắn bạn sẽ dần cảm nhận được nó. Luôn ý thức về ánh sáng từ bạn, bao quanh bạn và lan toả ra xung quanh, ở đó, bạn được bảo vệ, yêu thương và bình an.\nHãy tự nhủ: “Bình an nơi Đấng sáng tạo đang chiếu rọi tôi ngay khoảnh khắc này.”\nCon chọn tĩnh lặng, mở lòng và đón nhận Tình Yêu của Ngài vốn luôn hiện diện trong con.\nXin giúp con buông xuống những phán xét, sợ hãi và cả những câu chuyện cũ trong tâm trí, để con có thể nhìn chính mình và thế giới bằng ánh mắt của Ngài.\nĐôi khi không chưa con đường trở về, nhưng con tin Ngài sẽ luôn biết đường đến với con.\nHôm nay, con xin mở cửa tâm trí nhỏ bé này. Xin cho Tình Yêu của Ngài soi sáng tâm trí con và qua con, soi sáng thế giới.\""}, {"n": 189, "t": "Tôi cảm nhận Tình Yêu của Đấng Sáng Tạo đang ở trong tôi, ngay lúc này.", "s": "I feel the Love of God within me now.", "d": "Trong ta luôn sẵn có ánh sáng đẹp đẽ mà thế giới bên ngoài không thể nhìn thấy bằng mắt thường. Ánh sáng ấy luôn luôn ở đó, chỉ là đôi khi ta bị những lo lắng, phán xét và câu chuyện cũ che mất nên không còn nhận ra nó.\nLời tự nhủ:\nHôm nay, tôi không cố gắng để tạo thêm tình yêu, cũng không bắt mình phải trở nên tốt hơn rồi mới được yêu. Tôi chọn dừng lại, mở lòng và cho phép mình cảm nhận Tình Yêu vốn luôn hiện diện.\nGiống như một đứa trẻ không cần cố dễ thương hơn để được ôm vào lòng, tôi cũng không cần chứng minh giá trị của mình để được Thượng Đế yêu thương. Tình Yêu ấy đã có sẵn trước tất cả mọi nỗ lực, mọi thành tựu và cả những sai lầm của tôi. Phần việc của tôi chỉ là ngừng chống lại và cho phép mình được đón nhận Tình Yêu dồi dào dư dả và vô điều kiện từ Ngài.\nKhi cảm nhận được Tình Yêu ấy trong lòng, cách chúng ta nhìn thế giới cũng thay đổi. Ta sẽ không còn chỉ thấy nguy hiểm, thiếu thốn hay những điều cần đề phòng. Ta sẽ bắt đầu nhận ra sự tử tế đẹp đẽ của cuộc đời vốn luôn hiện diện.\nBởi thế giới ta nhìn thấy bên ngoài đều là đang phản chiếu trạng thái bên trong mình. Khi lòng tôi đầy sợ hãi, ta sẽ nhìn đâu cũng thấy đe dọa, nguy cơ. Khi lòng ta được tưới mát bởi Tình Yêu lớn lao, ta sẽ nhìn thấy một thế giới dịu dàng hơn, bao dung hơn và đáng tin cậy hơn.\nHôm nay, tôi không cần tìm một con đường phức tạp để trở về. Tôi chọn tĩnh lặng, buông những điều mình tưởng đã biết, và đến với Đấng Sáng Tạo bằng tâm thế của 1 ly nước rỗng, không phán tích, phán xét, chỉ đơn thuần là đón nhận ý niệm này vô điều kiện.\nTôi biết, tôi không cần chỉ cho Ngài cách phải đến với tôi. Bởi, chắc chắn Ngài biết đường đến trái tim tôi. Tôi chỉ cần mở lòng đón nhận vô điều kiện.\nVà khi trái tim mở ra, Tình Yêu của Ngài tự tìm khắc \"chiếu rọi\" tới tôi.\nÁnh sáng trong tôi được đánh thức. Thế giới trước mắt tôi cũng trở về sự đẹp đẽ như nó vốn là.\nLời nguyện\nThượng Đế kính yêu, hôm nay con sẽ không cố gắng tạo ra tình yêu bằng sức riêng của mình."}, {"n": 190, "t": "Tôi lựa chọn niềm vui của Đấng sáng tạo thay vì nỗi đau.", "s": "I choose the joy of God instead of pain.", "d": "Khi ACIM nói rằng: nỗi đau hay tổn thương chỉ là ảo ảnh, tâm trí có thể lập tức phản kháng. Tâm trí nói rằng tôi đã trải qua chuyện đó, cảm nhận chuyện đó, sự đau đơn hiển hiện này chắc chắn là thật. Tâm trí có thể nói rằng phủ định nỗi đau là sự tích cực độc hại.\nVấn đề của tâm trí là nó gán ý nghĩa và bảo vệ chúng ta bằng cách khiến chúng ta PHẢI nhớ lấy những tổn thương. Tâm trí sống trong quá khứ và luôn thấy sự chia cách. Nó không biết rằng chúng ta có khả năng tự phục hồi và luôn luôn trọn vẹn. Khi chúng ta ý thức được mình là Một với tất cả, nhận ra chúng ta không chỉ là cơ thể này, hiện diện ở hiện tại, mọi tổn thương đều dần tan biến.\nHôm nay bạn hãy thực hành: “Tôi lựa chọn niềm vui của Đấng sáng tạo thay vì nỗi đau.”"}, {"n": 191, "t": "Tôi là Thánh Tử của Thượng Đế.", "s": "I am the holy Son of God Himself.", "d": "Có bao giờ bạn cảm thấy mình quá nhỏ bé giữa thế gian rộng lớn?\nRằng bạn phải gồng lên chống chọi với mọi thứ với nỗi sợ, tổn thương, thiếu thốn, áp lực?\nRằng bạn đang cố “trở thành ai đó”, nhưng càng cố thì lại càng thấy mình… chưa đủ?\nHôm nay, xin mượn hình ảnh mà cô Pam Grout từng dùng:\nChúng ta giống như Superman đang hoá thân thành một anh chàng nhân viên văn phòng nhút nhát mang kính cận: Clark Kent.\nGiống như Harry Potter từng sống co ro dưới gầm cầu thang, hoàn toàn không nhớ gì về sức mạnh phép thuật của mình.\nHay như chú sư tử Simba lưu lạc nơi rừng hoang, quên mất rằng mình vốn sinh ra để trở thành vị vua đầy ánh sáng của muôn loài.\nVà rồi, cuộc đời sẽ luôn dẫn ta quay về.\nQuay về để nhớ lại mình là ai.\nQuay về để thức tỉnh khỏi giấc mộng mình là kẻ yếu đuối, sai lỗi, cần phải cố gắng để đủ tốt.\nQuay về để thấy rõ bản thể đích thực: rằng ta là Thánh Tử của Thượng Đế.\nSự thật là:\n- Ta không yếu đuối.\n- Ta không cần sợ hãi.\n- Ta không phải đi xin yêu thương hay chạy đua để chứng minh mình xứng đáng.\n- Ta không thể mất đi điều gì, vì ta chưa bao giờ bị tách rời khỏi Đấng đã tạo ra mình.\nBài học hôm nay là một cánh cửa sáng rực mở ra giữa bóng tối:\n“Tôi là Thánh Tử của Thượng Đế.”\n“Tôi không thể đau khổ, không thể mất mát, không thể thất bại.”\nKhi bạn lặp lại câu này mọi điều bạn nhìn thấy sẽ đổi khác.\nMột phép màu sẽ thắp sáng những góc tối sâu nhất trong tâm trí bạn, nơi bạn từng tin rằng mình “sinh ra để chịu đựng”.\nVà bạn sẽ bắt đầu nhìn thế giới bằng con mắt mới đôi mắt của sự bao dung, bình an, và đón nhận.\n Và khi bạn nhớ mình là ai cả thế giới được tự do.\nVì thế giới này chỉ phản chiếu điều bạn tin là chính mình.\nNếu bạn thấy mình đáng trách, thế giới sẽ là nơi trừng phạt.\nNếu bạn thấy mình thiêng liêng, thế giới sẽ là nơi để yêu thương và chữa lành.\nHôm nay, hãy nhắm mắt lại.\nThì thầm nhẹ nhàng:\n“Tôi là Thánh Tử của Thượng Đế.”\n“Tôi được ban cho mọi quyền năng để yêu thương, để tha thứ, để hồi sinh.”\nVà nếu bạn quên, hãy nhớ lời của Timon và Pumbaa khi đồng hành cùng Simba: Hakuna matata “Không có gì khó khăn cả.”\nVì ánh sáng luôn ở trong bạn."}, {"n": 192, "t": "Tôi có một chức năng mà Đấng sáng tạo trao cho.", "s": "I have a function God would have me fill", "d": "Hôm nay chúng ta một lần nữa được nhắc nhở về sự bao dung. Đó là một chức năng mà Đấng sáng tạo trao cho chúng ta để hướng tới một thế giới nội tâm bình an từ đó phản chiếu một thế giới bên ngoài bình an.\nBao dung không phải là hy sinh, cũng không phải là cho qua, dung túng. Bao dung là con đường giải thoát chính bạn và đưa bạn đến tự do.\nHãy luôn nhớ cần bao dung cho bản thân trước tiên, như vậy bạn mới có thể bao dung cho người khác và thế giới.\nHãy cứ thực hành chậm rãi và thong thả. Đặt sự bao dung trong mọi lời nói, hành động và ý định trong ngày của bạn.\nCâu tự nhắc bản thân:\nBao dung là bản chất vốn có của tôi.\nHôm nay tôi nguyện thực hiện chức năng ấy.\nForgiverness: Bao dung\nVốn là 1 chức năng thanh tẩy\nI am sorry Please forgiver me Thank you I love you.\nBạn là Thánh Tử của Thượng Đế.\nBạn được thanh tẩy khỏi mọi lỗi lầm.\nBạn cũng có quyền năng gửi năng lượng thanh tẩy cho bất kỳ ai bạn muốn.\nCó nhiều người nhầm lẫn: Bao Dung = tôi hơn bạn nhưng tôi không chấp nhặt mà tôi chấp nhận điều mà tôi ko thấy thoả đáng lắm. Tức là vẫn đặt mình ở vị trí HƠN NGƯỜI, ví trí phía trên cao BAN ƠN tha thứ, chấp nhận kẻ dưới.\nĐây là cách hiểu SAI về Chức năng Bao Dung này nhé các bạn\nBao dung đơn giản là: ĐÓN NHẬN MỌI SỰ KHÁC BIỆT.\nLà trạng thái: Tôi ghi nhận rằng tôi đúng bạn cũng đúng, chúng ta đều đang đúng ở một góc độ nào đó. Tất cả đều đúng và tốt nhất cho chúng ta\nĐiều đặc biệt là bạn càng bao dung với bên ngoài thì sức chứa thịnh vượng, hạnh phúc bên trong bạn càng lớn.\nSẽ không quá nếu nói: chỉ cần sống với lòng bao dung, bạn sẽ có tất cả mọi điều tốt đẹp nhất.\nMình muốn nhấn mạnh thêm: bao dung tức là trạng thái không coi mình hơn ai, không coi ai hơn mình;\ncũng không có nhu cầu phân biệt tốt - xấu; đúng - sai; hơn - thiệt...\nTa cũng sẽ không còn đồng nhất con người với lỗi lầm của họ.\nNghĩa là: Hành vi đó của họ có thể chưa đúng; Quyết định của họ có thể khiến ai đó tổn thương; Nhưng bản thể của họ vẫn rất đẹp đẽ - chỉ là họ đang vô tình để nỗi sợ che mờ nên hành vi chưa thật đẹp.\nLúc đó ta vẫn có thể nói ko, có thể đặt ranh giới, thậm chí rời khỏi họ.\nnhưng trong lòng ta không còn nhu cầu kết án họ là người xấu nữa.\nNhẹ nhõm và bình an."}, {"n": 193, "t": "Tất cả là bài học mà Đấng Sáng Tạo muốn tôi học.", "s": "All things are lessons God would have me learn.", "d": "“Bao dung và tôi sẽ thấy mọi thứ khác đi.\nBao dung và điều này sẽ tan biến.”\nĐây là hai câu thần chú chúng ta thực hành trong bài học hôm nay. Lặp lại nhẹ nhàng trong lòng, mỗi khi bạn thấy điều gì đó khiến mình khó chịu, tổn thương hay muốn phán xét.\nBài học hôm nay không nói về việc bạn phải làm gì, mà mời gọi bạn nhìn lại cách bạn đang nhìn.\nMỗi tình huống trong đời dù tích cực hay tiêu cực đều là một lời mời nhẹ nhàng từ Vũ trụ:\n“Có điều gì bạn sẵn sàng nhìn khác đi không?”\nVà bạn sẽ không thể thấy được sự thật toàn vẹn phía sau mọi chuyện nếu không có lòng bao dung.\nBao dung không phải là thỏa hiệp, cũng không phải chịu đựng. Đó là một trạng thái vượt lên trên đúng sai, nơi bạn thôi không phán xét nữa, mà bắt đầu mở lòng đón nhận.\nNhững bài học bạn từng học như dũng cảm hơn, tự tin hơn, yêu thương hơn cuối cùng đều dẫn bạn đến một điểm: Lòng bao dung - sự mở rộng của nhận thức.\nKhi bạn sống trong bao dung, bạn hoà làm Một với mọi sự.\nKhi đó, chẳng còn điều gì cần “học” nữa.\nChỉ còn sự mở rộng, sáng tạo và kiến tạo vô tận từ một tâm trí được tự do."}, {"n": 194, "t": "Tôi đặt tương lai của mình vào tay Đấng Sáng Tạo.", "s": "I place the future in the hands of God.", "d": "Đặt tương lai vào tay Đấng Sáng Tạo không phải là buông xuôi, phó mặc hay từ bỏ quyền lựa chọn.\nMà là trao tương lai ấy về lại với Tình yêu, với Lòng bao dung và sự Nhất thể.\nMà:\nLà không còn lập kế hoạch từ sợ hãi.\nLà không còn phòng thủ vì vết thương cũ.\nLà tin rằng có một Trí tuệ vượt ngoài cái tôi đang dẫn đường.\nBạn hướng về đâu, thế giới bạn cũng đổi theo hướng đó.\nVà từ hôm nay, ta chọn một hướng đi khác hướng về Ánh sáng.\nHướng về một tương lai được đặt nền móng bằng sự tin tưởng, chứ không phải lo âu.\nBằng sự tha thứ, chứ không phải kết tội.\nBằng hiện tại tỉnh thức, thay vì quá khứ ràng buộc.\nTrước kia, ta đã xây dựng tương lai từ đổ vỡ, từ ký ức chia cách và nỗi sợ phải chịu tổn thương thêm lần nữa.\nNhưng giờ đây, ta có thể chọn lại. Và sự chọn lại ấy bắt đầu bằng một lời thì thầm :\n“Tôi đặt tương lai của mình vào tay Đấng Sáng Tạo.”\nHãy nhắc lại điều này xuyên suốt hôm nay nhé."}, {"n": 195, "t": "Tình yêu là cách tôi bước đi với lòng biết ơn.", "s": "Love is the way I walk in gratitude.", "d": "Biết ơn không phải là một bài học dễ và nó cũng thường được hiểu không đầy đủ.\nChúng ta thường biết ơn vì mình hơn người khác một cái gì đó, hay biết ơn vì nhiều người kém hơn ta một cái gì đó.\nKiểu biết ơn này không phải là không có tác dụng, nhưng nó không bản chất. Sâu dưới sự biết ơn kiểu này vẫn là tâm phân biệt và tách rời: tôi biết ơn tôi có nhà để ở (bởi nhiều người khác thì không, thật tội nghiệp họ),\ntôi biết ơn tôi có tiền tiêu (bởi nhiều người khác thì không, thật tội nghiệp họ).\n👉Tức là, dù rất vi tế, nó vẫn phản chiếu sự phân biệt và tách rời.\nMục tiêu của chúng ta luôn là hướng tới Nhất thể. Vậy ta có thể thay đổi như thế nào trong cách thực hành lòng biết ơn của mình?\nHãy biết ơn vì tất cả chúng ta đều được Đấng sáng tạo yêu như nhau.\nBiết ơn vì người a, b, c tồn tại, vật x, y, z tồn tại.\nBiết ơn vì chúng ta luôn có kết nối với vạn vật và cuộc sống.\nBiết ơn vì tất cả đều đang được chăm sóc, đều có ánh sáng bên trong, đều có thể đạt tới sự đủ đầy, trù phú…\nBiết ơn vì mọi chuyện dù như ý hay bất như ý đều xảy ra là để hỗ trợ cho ta.\nChỉ một thay đổi nhỏ trong cách thực hành, nhận thức của bạn thay đổi, thế giới của bạn thay đổi.\nHãy thực hành theo cách này từ hôm nay nhé.\nVí dụ: tôi biết ơn đám mây kia, chẳng vì lý do gì cả\nTôi biết ơn [người A] chẳng vì lý do gì cả.\n(Khuyến khích các bạn thực hành với người/vật/việc mà bạn đang không ưa mấy).\nĐây chính là biết ơn vô điều kiện.\nCó 1 bài thực hành mà thỉnh thoảng mình vẫn dùng là đặt ý niệm biết ơn (vô điều kiện) với từng luân xa trên cơ thể, bất kì khi nào nhớ ra"}, {"n": 196, "t": "Chỉ có chính ta mới có thể đóng đinh chính mình.", "s": "It can be but myself I crucify", "d": "Đóng đinh là một hình ảnh ẩn dụ sâu sắc, lấy cảm hứng từ hình ảnh Chúa Jesus bị đóng đinh trên thập giá.\nTự đóng đinh là tự khiến bản thân đau khổ, tự làm mình tổn thương, tự giam mình trong những suy nghĩ sai lầm và niềm tin giới hạn.\nLà khi mình tự hành hạ mình bằng phán xét, sợ hãi, tội lỗi, hoặc cảm giác không xứng đáng.\nVí dụ: Khi bạn tin rằng bạn không đủ tốt, không xứng đáng được yêu, và cứ lặp đi lặp lại suy nghĩ ấy trong đầu đó chính là bạn đang \"đóng đinh\" chính mình.\nBài tập này muốn nói rằng: chỉ có chúng ta tự tấn công và làm mình đau khổ. Không có “kẻ thù” ở ngoài kia, chỉ có cơ chế bảo vệ của tâm trí đang vô tình tấn công chúng ta. Giống như thoả ước “Không vơ mọi chuyện về mình” trong cuốn Bốn Thoả Ước, việc chúng ta diễn dịch những sự kiện bên ngoài như thế nào quyết định việc chúng ta sống trong hạnh phúc hay đau khổ.\nÝ thứ 2 của bài tập này là: khi bạn “tấn công” ai đó ngoài kia dưới bất cứ hình thức nào, thực ra bạn đang tấn công chính mình, tấn công một phần nào đó bên trong bạn được phản chiếu lên người đó. Nhận thức về Nhất thể giúp bạn ngừng làm điều này.\nKhi còn là một đứa trẻ, hạnh phúc của chúng ta có thể nằm trong tay những người lớn. Nhưng khi đã trưởng thành, chỉ có chúng ta mới phải chịu trách nhiệm hoàn toàn cho hạnh phúc của mình.\nChỉ có tôi tự “đóng đinh” chính mình. Hãy luôn ý thức về điều này trong ngày hôm nay bạn nhé."}, {"n": 197, "t": "Nhờ lòng biết ơn, tôi sẽ có được.", "s": "It can be but my gratitude I earn.", "d": "Hôm nay chúng ta tiếp tục quay về bài tập biết ơn. Đôi khi chúng ta biết ơn, nhưng ẩn đằng sau là suy nghĩ: điều này thật quá lớn với mình, mình thật chưa xứng đáng với điều này, liệu may mắn này có quá lớn không, nhỡ rồi nó sẽ mất đi hay mình phải đánh đổi một điều gì đó…\nHãy tin rằng bạn xứng đáng và xứng đáng hơn thế. Đây không phải là một sự kiêu ngạo, thiếu trân trọng hay “được voi đòi tiên”. Hãy suy nghĩ rằng: những điều còn lớn lao hơn, tuyệt vời hơn đang đến với tôi.\nSuy nghĩ “mình không xứng đáng” khi bạn đạt được điều gì đó sẽ giống như việc “rút phích cắm” khỏi Nguồn trù phú. Thay đổi trong cách thực hành của bạn một chút, rất nhiều thứ sẽ thay đổi theo hướng tốt lên.\nHãy thực hành lòng biết ơn ngay hôm nay với sự ý thức hơn về nó. “Nhờ lòng biết ơn, tôi sẽ có được.”\nNhững thứ ta muốn có, ta có thể trả = lòng biết ơn.\nĐây là 1 ý rất hay, có thể áp dụng vào thực tiễn.\nBuổi zoom tiếp theo mình sẽ nói sâu hơn nhé\nTrước khi chìm vào giấc ngủ hãy tưởng tượng luồng ánh sáng vàng dịu dàng chảy xuống bao trùm lấy bạn, bạn bồng bềnh trong năng lượng biết ơn tràn đầy vô điều kiện đó."}, {"n": 198, "t": "Chỉ có lời kết tội của tôi làm tổn thương tôi.", "s": "Only my condemnation injures me.", "d": "Bài tập này tiếp nối bài tập 196 - chỉ chúng ta tự “đóng đinh” chính mình.\nDù chúng ta kết tội bản thân hay kết tội người khác, thì cũng chỉ chúng ta bị tổn thương. Giữ sự hằn học dành học dành cho người khác cũng hệt như tự uống thuốc độc. Đã đến lúc chúng ta giải phóng chính mình khỏi những chất độc hại do chính chúng ta điều chế ra.\nThực hành bao dung với chính bản thân, với cuộc sống, và hãy ghi nhớ rằng: “Chỉ có lời kết tội của tôi làm tổn thương tôi.”"}, {"n": 199, "t": "Tôi không chỉ là cơ thể này. Tôi tự do.", "s": "I am not a body. I am free.", "d": "Một lần nữa chúng ta được nhắc lại thông điệp: chúng ta không chỉ là cơ thể này, chúng ta lớn hơn thế này rất nhiều.\nCơ thể này cho chúng ta ảo tưởng rằng mình nhỏ bé, yếu đuối và chia cắt với thế giới xung quanh dù chúng ta là Một với tất cả, không có ranh giới nào giữa chúng ta với cuộc sống.\nThực tế, chúng ta tác động rất lớn đến thực tại và sở hữu quyền tăng kiến tạo. Cơ thể này chỉ là phương tiện, là “avatar” (hiện thân) của chúng ta trong cuộc sống này. Cơ thể quan trọng, nhưng ta cần học cách sử dụng nó, cải thiện nó, biến nó thành một yếu tố hỗ trợ thay vì giới hạn ta.\nTa có thể bắt đầu tin vào khả năng và quyền năng của mình bằng cách nhắc lại câu khẳng định:\n“Tôi không chỉ là cơ thể này. Tôi tự do.\nTự do kiến tạo thực tại, tự do phát triển.\nTự do lựa chọn đích đến cuộc đời.\nTự do khỏi mọi giới hạn do chính tâm trí tôi vô tình tạo ra.”"}, {"n": 200, "t": "Bình an đích thực là bình an nơi Đấng sáng tạo.", "s": "There is no peace except the peace of God.", "d": "Bài tập này muốn nói rằng, chỉ khi bạn nương vào Nhất thể, khi đó bạn mới có thể thực sự bình an.\nBạn thực sự bình an khi biết bạn thuộc về Nguồn và là Một với Nguồn, là Một với thế giới và tất cả những sinh linh quanh bạn. Bạn thực sự bình an khi biết rằng không có ranh giới nào được quy định bởi cơ thể này, bạn lớn lao và quyền năng hơn thế.\nHãy trở về với Nhất thể bằng việc ý thực về hiện tại, để sự bao dung và biết ơn được hiện diện trong mỗi hơi thở, ý nghĩ và hành động của bạn.\n“Bình an đích thực là bình an nơi Đấng sáng tạo.”\nBắt đầu ôn tập thôi @All"}, {"n": 201, "t": "Ôn tập bài 181", "s": "", "d": "Tôi tin tưởng những người anh em của tôi những người là Một với tôi.\nTất cả chúng ta đều là Một trong Đấng Sáng Tạo.\nVì vậy, cách ta nhìn người khác thực chất là cách ta đang nhìn chính mình.\nMỗi khi ta phán xét một ai đó, tức là ta đang vô tình khẳng định một hình ảnh giới hạn cho chính mình.\nVà ngược lại, khi ta có thể nhìn người khác bằng ánh mắt yêu thương, bao dung, ta cũng đang mở rộng trái tim để thấy sự thánh khiết trong chính ta.\nHôm nay, hãy để bài thực hành này trở thành nhịp thở nhẹ nhàng trong suốt cả ngày.\nBất cứ khi nào ta gặp một ai đó ngoài đời, qua mạng, hay chỉ trong tâm trí hãy dừng lại một chút và thầm nhủ:\n“Tôi tin tưởng.. [người đó]. [Người đó].. là Một với tôi.”\nDù chưa thể thật sự cảm thấy như vậy, chỉ cần lặp lại điều này trái tim ta sẽ dần được dẫn trở về với sự thật.\nTa sẽ bắt đầu thấy người khác nhẹ nhàng hơn, thế giới dịu dàng hơn, và chính ta cũng được giải phóng khỏi những lớp phòng vệ cũ kỹ.\nBởi vì…\nTin tưởng người khác chính là chọn tin vào bản chất vô tội, thuần khiết và nguyên lành vốn đã có sẵn trong tất cả chúng ta.\nVà khi ta có thể thấy điều đó trong người khác, ta đang từng bước nhìn thấy điều đó trong chính mình.\nĐó là cách thế giới bên ngoài dần phản ánh sự chữa lành bên trong một cách tự nhiên và sâu sắc."}, {"n": 202, "t": "Ôn tập bài 182", "s": "", "d": "Tôi tĩnh lặng trong một khoảnh khắc và “trở về nhà”.\nRất nhiều khi chúng ta có cảm giác xa lạ và lạc lõng trong chính thế giới này. Điều này là dễ hiểu, bởi đây không phải là nhà của chúng ta. Ngôi nhà đích thực là nơi chúng ta cảm thấy an toàn, được yêu thương vô điều kiện, được là chính mình và vun đắp, tạo ra những trải nghiệm tuyệt vời. Có bao giờ bạn bỗng có cảm giác như là đang “nhớ nhà” đó? Bởi sâu thẳm bên trong, linh hồn của bạn luôn nhớ ngôi nhà thực sự của bạn.\nĐôi khi chúng ta ở đây, lang thang trong cuộc tìm kiếm tưởng chừng như vô tận, vật lộn trong bóng tối của những xung đột, mà không biết rằng chúng ta có thể “quay trở về nhà” bất cứ lúc nào.\nDừng lại một giây, hít thở, hiện diện ngay tại đây, bây giờ và tự nhủ:\n\"TÔI TĨNH LẶNG VÀ TÔI VỀ NHÀ\"\nRồi nhắm mắt ngồi yên như thế hình dung về cảm giác bình an yêu thương đang ngập tràn quanh mình, ít nhất 1 phút hoặc lâu hơn càng tốt.\nHÔM NAY, CHÚNG TA CÙNG DÀNH NHỮNG KHOẢNH KHẮC TĨNH LẶNG để VỀ NHÀ.\n## Chương 1: Bao dung\nBạn đã được tha thứ hoàn toàn, dù bất cứ chuyện gì đã xảy đến trước đây. Câu này cũng chỉ đúng tương đối, vì với Đấng sáng tạo, bạn chẳng có tội lỗi gì để mà tha thứ. Bạn - bản chất - vẫn thuần khiết như khi linh hồn bạn được sinh ra. Nếu có ai đó chưa tha thứ cho bạn, thì chỉ có thể là bản thân bạn.\nHãy luôn nhớ điều này. Bạn đã được tha thứ hoàn toàn. Đấng sáng tạo luôn bao dung với bạn. Vì vậy, hãy dùng chức năng này của bạn, bao dung với những người anh em khác.\nThực hành bao dung, tha thứ bắt đầu bằng “buông”.\nThiếu bao dung và phán xét luôn song hành. Bởi bạn luôn phải có lý lẽ cho sự thiếu bao dung của mình. Vì vậy, còn thiếu bao dung, tâm trí còn lên tiếng, nó không thể tĩnh lặng và như thế, bạn không thể chạm đến Sự thật khi tâm trí chưa tĩnh lặng.\nBắt đầu bằng “buông”, tĩnh lặng, và sự bao dung có sẵn bên trong bạn dần hiển lộ, và bạn có thể bao dung cho chính bạn, cũng như bao dung những người khác."}, {"n": 221, "t": "Nguyện cho tâm tôi bình an. Nguyện cho tâm tôi tĩnh lặng.", "s": "Peace to my mind. Let all my thoughts be still.", "d": "“Hôm nay, con nương tựa vào bình an nơi Đấng sáng tạo. Với tâm tĩnh lặng, con lắng nghe lời yêu thương Người nói với con.”\nHôm nay chúng ta hãy khởi lên lời nguyện và giữ sự tĩnh lặng trong tâm bất cứ lúc nào chúng ta có thể. Ngay khi tâm khởi lên những lời phán xét, đơn giản là thực hành tĩnh lặng. Ngay khi tâm bất an, tĩnh lặng. Ngay cả khi bạn thiếu bao dung với chính mình, tĩnh lặng. Bạn sẽ được đáp lời."}, {"n": 222, "t": "Đấng sáng tạo hiện diện ở trong tôi, trong từng hơi thở và lẽ sống của tôi.", "s": "God is with me. I live and breathe in Him.", "d": "Đấng sáng tạo luôn hiện diện trong tôi, vừa là Nguồn sống vừa chính là sự sống. Đấng sáng tạo hiện diện trong ngôi nhà tôi ở, trong không khí tôi hít vào và thở ra, trong từng giọt nước tôi uống. Đấng sáng tạo hiện diện trong ánh nhìn của tôi, lời nói của tôi, tâm trí của tôi, mọi chuyển động của tôi. Tôi luôn được bảo vệ, che trở và yêu thương.\nKhông có điều gì bạn nhìn thấy, cảm nhận thấy, sờ chạm thấy mà không thuộc về Đấng sáng tạo. Không có điều bạn nghĩ ra, nói ra, nhìn ra mà không thuộc về Đấng sáng tạo. Hôm nay, hãy cảm nhận sự hiện diện của Đấng sáng tạo quanh bạn và trong bạn."}, {"n": 223, "t": "Hôm nay tôi dâng mình cho Đấng sáng tạo dẫn dắt.", "s": "", "d": "Tôi dâng tâm trí này cho Đấng sáng tạo sử dụng. Tôi dâng thân thể này để Đấng sáng tạo thông qua tôi hiển lộ với thế giới. Tôi dâng mục đích của tôi cho Đấng sáng tạo bởi không có mục đích nào ngoài Hợp nhất, Tình yêu và Bình an. Tôi sẽ không thắc mắc và nghi ngờ. Nếu như mọi suy nghĩ, lời nói, hành vi của tôi đều dựa trên tình yêu và bình an, tôi đang hợp nhất với Đấng sáng tạo."}, {"n": 224, "t": "Đấng sáng tạo sinh ra tôi và luôn yêu tôi.", "s": "", "d": "Danh tính thực của tôi, chân ngã của tôi là thuần khiết, bình an, sáng tạo, lớn lao và đầy quyền năng kiến tạo. Danh tính thực của tôi có thể thắp sáng thế giới và cuộc sống quanh tôi, đó là món quà và tôi được nhận.\nHôm nay tôi sẽ luôn nhắc nhở mình đích thực là ai. Trong từng hành động hay lời nói, tôi sẽ luôn nhớ mình là ai và mình có những quyền năng gì."}, {"n": 225, "t": "Thượng Đế là sinh ra tôi, và Tôi yêu Thượng Đế.", "s": "God is my Father, and His Son loves Him.", "d": "1. Thượng Đế kính yêu, con sẽ đáp lại tình yêu của Ngài dành cho con.\nBởi vì ban tặng và đón nhận là một. Ngài đã trao trọn tình yêu cho con, và con sẽ trao lại để được hoàn toàn ý thức rằng tình yêu ấy vốn là của con.\n 2. Các bạn thương mến của tôi ơi, giờ đây chúng ta đang cùng tìm thấy sự tĩnh lặng ấy.\nCánh cửa đã mở. Giờ đây, chúng ta cùng bước đi trong bình an. Bạn đã nắm lấy tay tôi, và tôi sẽ không bao giờ buông tay bạn. Chúng ta là Một, chúng ta đang đi những bước cuối cùng để trở về; nhưng sự thật là, ta chưa từng rời xa. Chỉ cần buông bỏ ảo tưởng chia cách, ta sẽ thấy mình đã ở nhà từ lúc bắt đầu.\nBản tiếng Anh.\n1 Father, I must return Your Love for me. For giving and receiving are the same, and You have given all Your Love to me. I must return it, for I want it mine in full awareness, blazing in my mind, and keeping it within its kindly light, inviolate - beloved, with fear behind and only peace ahead. How still the way Your loving Son is led along to You!\n2 Brother, we find that stillness now. The way is open. Now we follow it in peace together. You have reached your hand to me, and I will never leave you. We are one, and it is but this oneness that we seek as we accomplish these few final steps which end a journey that was not begun."}, {"n": 226, "t": "Ngôi nhà đang chờ đợi tôi quay về. Tôi sẽ tiến bước ngay bây giờ.", "s": "My home awaits me. I will hasten there.", "d": "Chỉ cần tôi lựa chọn, tôi sẽ hoàn toàn rời khỏi thế giới này. Không phải là rời đi bằng một cái chết, mà là thay đổi suy nghĩ về thế giới này và nhìn ra một thế giới thực sự.\nNếu tôi vẫn tin thế giới này có giá trị, tôi sẽ vẫn ở lại. Nếu tôi nhận ra những gì về thế giới này là những ảo tưởng về sự chia tách và xung đột, nó sẽ dần rời xa tôi. Khi đó tôi có thể sống trong thế giới thực, không còn ảo tưởng.\nĐấng sáng tạo vẫn luôn ở ngôi nhà đích thực đó dang rộng đôi tay. Tôi sẽ không nấn ná tại nơi này với những ảo mộng chỉ mang lại đau khổ. Khi tỉnh giấc, tôi thấy mình đang ở thiên đường.\n1 If I so choose, I can depart this world entirely. It is not death which makes this possible, but it is change of mind about the purpose of the world. If I believe it has a value as I see it now, so will it still remain for me. But if I see no value in the world as I behold it, nothing that I want to keep as mine or search for as a goal, it will depart from me. For I have not sought for illusions to replace the truth.\n2 Father, my home awaits my glad return. Your arms are open, and I hear Your Voice. What need have I to linger in a place of vain desires and of broken dreams when Heaven can so easily be mine?"}, {"n": 227, "t": "Đây là khoảnh khắc thiêng liêng tôi được giải thoát, được tự do.", "s": "This is my holy instant of release.", "d": "Hôm nay tôi mừng rỡ trở về thiên đường, nơi tôi chưa từng thực sự rời bỏ. Tôi trở về, cởi bỏ tấm áo hiểu lầm và mặc cảm để thấy được sự thánh thiện bên trong.\nTôi được phục hồi như lúc ban đầu. Đây là ý muốn của tôi và cũng là ý muốn của Đấng sáng tạo.\n1. Father, it is today that I am free because my will is Yours. I thought to make another will. Yet nothing that I thought apart from You exists. And I am free because I was mistaken and did not affect my own reality at all by my illusions. Now I give them up and lay them down before the feet of truth, to be removed forever from my mind. This is my holy instant of release. Father, I know my will is one with Yours.\n2. And so today we find our glad return to Heaven, which we never really left. The Son of God this day lays down his dreams. The Son of God this day comes home again, released from sin and clad in holiness, with his right mind restored to him at last."}, {"n": 228, "t": "Đấng sáng tạo chưa từng lên án tôi. Tôi cũng không còn làm vậy với bản thân mình nữa.", "s": "God has condemned me not. No more do I.", "d": "Sự thánh thiện luôn ở đó trong tôi. Tội lỗi chỉ là những ảo ảnh. Hôm nay tôi buông mọi mặc cảm, mọi tội lỗi để quay về với sự thánh thiện vốn có trong tôi.\nĐấng sáng tạo chưa từng lên án tôi. Tôi cũng không còn làm vậy với bản thân mình nữa.\nPhần này bạn chỉ cần đọc bài, tự nhắc nhở nhẹ nhàng và thả mình vào dòng chảy thực hành cùng lớp là được nhé.\nNội dung lời cầu nguyện bằng Tiếng Anh cho bạn nào muốn đọc thêm:\n1 My Father knows my holiness. Shall I deny His knowledge and believe in what His knowledge makes impossible? Shall I accept as true what He proclaims as false? Or shall I take His Word for what I am since He is my Creator and the One Who knows the true condition of His Son?\n2 Father, I was mistaken in myself because I failed to realize the Source from Which I came. I have not left that Source to enter in a body and to die. My holiness remains a part of me, as I am part of You. And my mistakes about myself are dreams. I let them go today. And I stand ready to receive Your Word alone for what I really am.\nLời cầu nguyện tạm dịch:\nThượng Đế biết sự thánh khiết của con.\nLẽ nào con lại chối bỏ sự hiểu biết của Người, và tin vào điều mà sự hiểu biết ấy cho là không thể?\nLẽ nào con lại chấp nhận là thật điều mà Thượng Đế tuyên bố là sai?\nHay con sẽ tiếp nhận Lời Người nói về con: bởi vì chính Thượng Đế là Đấng đã tạo ra con, và là Đấng duy nhất biết rõ tình trạng thật sự của Người Con của Người?\n2.\nThượng Đế kính yêu, con đã lầm về chính mình, vì con đã không nhận ra Nguồn mà con xuất phát từ đó.\nCon chưa từng rời khỏi Nguồn ấy để bước vào một thân xác và rồi chết đi.\nSự thánh khiết của con vẫn luôn là một phần trong con, cũng như con là một phần của Người.\nNhững sai lầm của con về bản thân, chỉ là những giấc mơ.\nHôm nay, con buông bỏ tất cả chúng.\nVà con sẵn sàng tiếp nhận chỉ một mình Lời của Thượng Đế, như là chân lý về con là ai."}, {"n": 229, "t": "Tình yêu tạo nên tôi, tôi là tình yêu.", "s": "Love, Which created me, is what I am.", "d": "Tôi cứ mải tìm kiếm nhân dạng của mình và rồi nhận ra đó chính là tình yêu. Tình yêu tạo nên tôi và tôi là tình yêu. Tình yêu đích thực và vô điều kiện chiến thắng tất cả. Tình yêu xua đi mọi ảo ảnh về sự chia cách và tội lỗi. Tôi là tình yêu.\nNội dung lời khẳng định và cầu nguyện bằng Tiếng Anh cho bạn nào muốn đọc thêm:\n1. I seek my own identity and find it in these words: \"Love, Which created me, is what I am.\" Now need I seek no more. Love has prevailed. So still it waited for my coming home that I will turn away no longer from the holy face of Christ. And what I look upon attests the truth of the identity I sought to lose, but which my Father has kept safe for me.\n2. Father, my thanks to You for what I am; for keeping my Identity untouched and sinless in the midst of all the thoughts of sin my foolish mind made up. And thanks to You for saving me from them."}, {"n": 230, "t": "Tôi tìm và thấy sự bình an của Đấng sáng tạo.", "s": "Now will I seek and find the peace of God.", "d": "Trong sự bình an, tôi được tạo ra. Trong sự bình an, tôi ở lại. Khi sinh ra tôi, Đấng sáng tạo đã cho tôi sự bình an muôn đời, vì vậy tôi không thể bị từ chối khi yêu cầu sự bình an.\n1 In peace I was created. And in peace do I remain. It is not given me to change my Self. How merciful is God my Father, that when He created me He gave me peace forever. Now I ask but to be what I am. And can this be denied me, when it is forever so?\n2 Father, I seek the peace You gave as mine in my creation. What was given then must be here now, for my creation was apart from time and still remains beyond all change. The peace in which Your Son was born into Your Mind is shining there unchanged. I am as You created me. I need but call on You to find the peace You gave. It is Your Will that gave it to Your Son.\n## Chương 2: Sự cứu rỗi\nSự cứu rỗi đã được định sẵn. Sự cứu rỗi là một lời hứa không thể phá bỏ, là đảm bảo rằng mọi đau khổ, xung đột và chia cắt sẽ kết thúc dù chúng ta dùng bất cứ cách thức nào, lựa chọn con đường nào… Sự cứu rỗi đã được định sẵn, không phân biệt bất cứ ai, không phân chia, không xếp hạng, không đánh giá.\nChúng ta tìm kiếm sự cứu rỗi mà không biết rằng nó nằm ngay trong sự tĩnh lặng và không cố làm gì cả. Buông bỏ, thả lỏng, hiện diện… sự cứu rỗi đã nằm ở ngay đó khi tâm trí không còn ồn ào và quẩn quanh với những ảo ảnh do nó tự tạo ra.\nMọi đau khổ này chỉ là một giấc mơ. Bạn không thể biết bạn đang mơ cho đến khi bạn tỉnh giấc."}, {"n": 231, "t": "Đấng sáng tạo, con sẽ nhớ ra Người.", "s": "Father, I will but to remember You.", "d": "Thực ra, tôi chẳng tìm kiếm thứ gì ngoài tình yêu của Đấng sáng tạo. Dù tình yêu đó có thể biểu hiện dưới nhiều hình thái, nhiều tên gọi.\nNguyện cho tôi nhớ lại sự thật về tôi. Nguyện cho tôi nhớ ra Đấng sáng tạo với tôi là Một. Nguyện cho tất cả chúng ta cùng nhớ lại.\n1 What can I seek for, Father, but Your Love? Perhaps I think I seek for something else—a something I have called by many names. Yet is Your Love the only thing I seek or ever sought. For there is nothing else that I could ever really want to find. Let me remember You. What else could I desire but the truth about myself?\n2 This is your will, my brother. And you share this will with me, and with the One as well Who is our Father. To remember Him is Heaven. This we seek. And only this is what it will be given us to find."}, {"n": 232, "t": "Nguyện cho Đấng sáng tạo luôn ngự trị nơi tâm trí con trong từng khoảnh khắc.", "s": "", "d": "Bạn là một phần của Đấng sáng tạo và đồng kiến tạo nên thế giới của bạn. Mỗi suy nghĩ, lời nói, hành động của bạn đều đang kiến tạo nên thế giới của bạn. Vì vậy hãy quên đi danh tính mà bạn tự đặt cho bản thân, gác sang một bên những mặc cảm hay niềm tin giới hạn về bản thân, bỏ qua hết cả những nuối tiếc về quá khứ và lo lắng về tương lại… hãy chỉ hiện diện trong từng khoảnh khắc, để Đấng sáng tạo: tình yêu và sự bình an ngự trị trong tâm trí bạn, lan toả trong mỗi suy nghĩ, lời nói và hành động của bạn. Khi đó bạn hợp nhất cùng Đấng sáng tạo. Bạn chính là Đấng sáng tạo."}, {"n": 233, "t": "Hôm nay tôi dâng mình cho Đấng sáng tạo dẫn dắt.", "s": "I give my life to God to run today.", "d": "Tôi dâng tâm trí này cho Đấng sáng tạo sử dụng. Tôi dâng thân thể này để Đấng sáng tạo thông qua tôi hiển lộ với thế giới. Tôi dâng mục đích của tôi cho Đấng sáng tạo bởi không có mục đích nào ngoài Hợp nhất, Tình yêu và Bình an. Tôi sẽ không thắc mắc và nghi ngờ. Nếu như mọi suy nghĩ, lời nói, hành vi của tôi đều dựa trên tình yêu và bình an, tôi đang hợp nhất với Đấng sáng tạo.\n1 Father, I give You all my thoughts today. I would have none of mine. In place of them, give me Your own. I give You all my acts as well, that I may do Your Will instead of seeking goals which cannot be obtained and wasting time in vain imaginings. Today I come to You. I will step back and merely follow You. Be You the Guide and I the follower who questions not the wisdom of the Infinite nor Love Whose tenderness I cannot comprehend but which is yet Your perfect gift to me.\n2 Today we have one Guide to lead us on. And as we walk together, we will give this day to Him with no reserve at all. This is His day. And so it is a day of countless gifts and mercies unto us."}, {"n": 234, "t": "Hôm nay, tôi trở về làm đứa con của Đấng sáng tạo.", "s": "Father, today I am Your Son again.", "d": "Hôm nay, giấc mơ về tội lỗi và mặc cảm không còn nữa. Không còn sự gián đoạn nào để tôi hợp nhất làm Một với Đấng sáng tạo. Chưa từng có sự xáo trộn nào và những ký ức về sự thật, về Nguồn, về bình an và tình yêu vô điều kiện chưa bao giờ bị mất đi. Hôm nay, tôi trở về làm đứa con của Đấng sáng tạo.\n**Ghi chú:**\nCác bài tập phần này chỉ cần nhắc nhở nhẹ nhàng với bản thân là đc nhé lớp ❤️\n1 Today we will anticipate the time when dreams of sin and guilt are gone and we have reached the holy peace we never left. Merely a tiny instant has elapsed between eternity and timelessness. So brief the interval, there was no lapse in continuity nor break in thoughts which are forever unified as one. Nothing has ever happened to disturb the peace of God the Father and the Son. This we accept as wholly true today.\n2 We thank You, Father, that we cannot lose the memory of You and of Your Love. We recognize our safety and give thanks for all the gifts You have bestowed on us, for all the loving help we have received, for Your eternal patience, and the Word which You have given us that we are saved."}, {"n": 235, "t": "Tôi được cứu rỗi là ý của Đấng sáng tạo.", "s": "God in His mercy wills that I be saved.", "d": "Những điều làm tôi tổn thương trong quá khứ đã không còn tồn tại. Ngay lúc này, những điều làm tôi tổn thương chỉ là những ảo ảnh. Tôi nhận ra và mọi tổn thương biến mất, mọi mặc cảm và tội lỗi cũng biến mất. Tôi bình an và được yêu thương trong vòng tay của Đấng sáng tạo.\n1 I need but look upon all things that seem to hurt me and with perfect certainty assure myself, \"God wills that I be saved from this,\" and merely watch them disappear. I need but keep in mind my Father's Will for me is only happiness to find that only happiness has come to me. And I need but remember that His Love surrounds His Son and keeps his sinlessness forever perfect to be sure that I am saved and safe forever in His arms. I am the Son He loves. And I am saved because God in His mercy wills it so.\n2 Father, Your holiness is mine. Your Love created me and made my sinlessness forever part of You. I have no guilt or sin in me, for there is none in You."}, {"n": 236, "t": "Tôi làm chủ tâm trí mình - chính tôi phải làm được điều đó.", "s": "", "d": "Tâm trí là công cụ của tôi, nhưng suốt một thời gian dài tâm trí đã làm chủ tôi, điều khiển tôi nghĩ gì và cảm thấy gì.\nTừ bây giờ, tôi phải làm chủ tâm trí của mình. Tôi dâng tâm trí mình cho Đấng sáng tạo và chỉ dùng nó hài hoà với sự bình an, tình yêu và sáng tạo. Tôi mở rộng tâm trí để đón nhận những thông điệp và ý tưởng từ Đấng sáng tạo. Tôi phải làm chủ tâm trí mình."}, {"n": 237, "t": "Từ nay tôi sẽ là tôi như khi được sinh ra bởi Đấng sáng tạo", "s": "", "d": "Từ nay, tôi chấp nhận sự thật về bản thân mình. Tôi để ánh sáng trong tôi được lan toả. Tôi tỉnh khỏi giấc mơ chia cắt và nhìn ra thế giới mà Đấng sáng tạo muốn tôi thấy. Đôi mắt tôi hôm nay là đôi mắt của Đấng sáng tạo, đôi tai tôi hôm nay là đôi tai của Đấng sáng tạo. Tôi đến với Đấng sáng tạo bằng bản thể chân thật của tôi: như khi tôi được Đấng sáng tạo sinh ra."}, {"n": 238, "t": "Sự cứu rỗi nằm trong tay tôi.", "s": "", "d": "Hôm nay tôi tiếp tục kiên định trên con đường của mình. Sự cứu rỗi nằm trong tay chính tôi. Tôi buông mọi ảo ảnh về tội lỗi và mặc cảm, buông mọi ảo ảnh về xung đột và chia cắt. Tôi hoà vào Nhất thể và kiến tạo nên thế giới của chính tôi.\nMỗi khi mông lung, tôi sẽ nhớ lại mình là ai và mình được yêu thương vô điều kiện bởi Đấng sáng tạo. Tôi vẫn trọn vẹn như khi Đấng sáng tạo sinh ra tôi."}, {"n": 239, "t": "Vinh quang của Đấng sáng tạo cũng là vinh quang của tôi.", "s": "", "d": "** Glory (vinh quang) là từ được nhắc đến trong Kinh thánh và các bài Thánh ca, nói về tinh thần của Chúa với tình yêu, lòng bao dung và quyền năng kiến tạo cuộc sống, đẩy lùi bóng tối…\nVới bài tập này, ACIM muốn chúng ta ngừng việc khiêm tốn giả tạo. Bạn chính là Một với Đấng sáng tạo, bên trong bạn đã có sẵn tình yêu thương, bình an và quyền năng kiến tạo. Bạn thuần khiết và không có bất cứ tội lỗi nào - bởi Đấng sáng tạo không thể có tội lỗi. Hãy hợp nhất với ánh sáng của Nguồn và kiến tạo nên thế giới của chính bạn.\nTôi hợp nhất với Đấng sáng tạo. Vinh quang của Đấng sáng tạo cũng là vinh quang của tôi."}, {"n": 240, "t": "Nỗi sợ không được biện minh dù ở bất kỳ hình thức nào.", "s": "", "d": "Không điều gì bạn thấy ở thế giới nhị nguyên là sự thực. Chia cắt, mâu thuẫn, xung đột, đau khổ, tội lỗi… đều là ảo ảnh, ảo ảnh về chính bạn. Hôm nay bạn nhận ra không có sự sợ hãi nào, bởi bạn là Một với Đấng sáng tạo.\n## Chương 3: Thế giới nhị nguyên\nThế giới nhị nguyên là thế giới bị chia cắt bởi những khái niệm tốt xấu, thiện ác, cao thấp…\nĐó là thế giới của xung đột và đau khổ, thế giới được tạo nên bởi nỗi sợ và sự lãng quên về nguồn gốc thực sự của chúng ta. Thế giới nhị nguyên chỉ là một ảo ảnh không có thực, phản chiếu tâm trí của chúng ta khi bị tách khỏi Nguồn và chúng ta đã mê đắm ở đó đủ lâu để biết rằng: không có cách nào để thoát khổ đau cho đến khi chúng ta thức tỉnh.\nChúng ta cần nhìn thế giới bằng một nhận thức khác, bằng Sự thật. Dù bạn có chiến đấu, có hành động thêm, sở hữu thêm, xây dựng nhiều kịch bản và chiến lược khác nhau… bạn vẫn sẽ chỉ quẩn quanh ở trong thế giới đầy sự bất như ý này. Quay về với Nhất thể là con đường duy nhất để bạn thấy được Thiên đường ngay ở đây, làm tan đi lớp mây mù để thấy một thế giới thực sự: nơi bạn hạnh phúc, bình an và luôn sáng tạo."}, {"n": 241, "t": "Sự cứu rỗi đến ngay trong khoảnh khắc thiêng liêng này.", "s": "", "d": "Sự cứu rỗi đến ngay trong khoảnh khắc bạn hiện diện. Bạn tách mình khỏi những ảo ảnh về quá khứ, tương lai; tách mình khỏi không gian, môi trường; và tách mình khỏi chính danh tính và lịch sử mà bạn đã tự áp đặt lên bản thân bằng nhiều cách khác nhau.\nChúng ta thường cho rằng mình bị chi phối bởi môi trường bên ngoài, bởi quá khứ chúng ta đã trải qua, bởi danh tính của chúng ta. Nhưng thực tế ngược lại, bạn mới là người tác động lên tất cả những điều đó. Ngay khoảnh khắc bạn dừng lại, hiện diện, bạn quay về Nguồn, quay về điểm 0, và từ đó, tất cả được kiến tạo từ bạn, bởi chính bạn."}, {"n": 242, "t": "Tôi dành ngày hôm nay cho Đấng sáng tạo.", "s": "", "d": "Tôi đã sống những ngày căng thẳng để vật lộn sinh tồn, những ngày luôn phòng thủ để bảo vệ cái tôi dựa trên những tổn thương xưa cũ.\nHôm nay, tôi không sống như vậy nữa. Tôi trao mình cho Đấng sáng tạo vì Người biết điều gì là tốt nhất cho tôi. Tôi hiện diện và lắng nghe thông điệp từ Đấng sáng tạo, nhìn thế giới bằng một nhận thức khác. Và tôi sẽ không trì hoãn điều này thêm nữa."}, {"n": 243, "t": "Hôm nay tôi sẽ không phán xét điều gì.", "s": "", "d": "Hôm nay, tôi thành thật với bản thân mình rằng những gì tôi đang thấy nằm ngoài khả năng hiểu thấu trọn vẹn của tôi, tôi không thể nhận thức toàn bộ, vì vậy tôi không đủ góc nhìn để phán xét.\nTôi giải phóng bản thân khỏi sự phán xét để được bình an và tự do. Tôi là Một với Đấng sáng tạo cũng như tất cả những người khác, tôi đang toả sáng cũng như họ đang toả sáng.\nKhông ai đáng bị phán xét, bao gồm cả chính mình."}, {"n": 244, "t": "Tôi an toàn dù ở bất cứ nơi đâu.", "s": "", "d": "Sao tôi có thể không an toàn khi ở trong vòng tay của Đấng sáng tạo. Sẽ không có \"cơn bão\" nào qua đây khi tôi đang ở ngôi nhà thực sự của mình, nhớ lại và nhận thức về Sự thật tôi là ai.\nTôi luôn được an toàn."}, {"n": 245, "t": "Bình an ở trong tôi. Tôi an toàn nơi đây.", "s": "", "d": "Sự bình an của Đấng sáng tạo bao bọc lấy tôi dù ở bất cứ nơi đâu. Bình an hiện diện trong tôi và tôi mang sự bình an đó đến mọi nơi tôi đến, lan toả sự bình an đó đến mọi người tôi gặp."}, {"n": 246, "t": "Yêu Đấng sáng tạo nghĩa là yêu mọi đứa con mà Người tạo ra.", "s": "", "d": "Hôm nay là một lời nhắc nhở:\n\"Tôi không thể hoà vào làm Một với Đấng sáng tạo khi còn những sân hận trong tim. Nguyện cho tôi không làm tổn thương đứa con nào của Đấng sáng tạo. Nguyện cho tôi luôn thấy tình yêu trong tim mình.\"\nBạn hãy thử ngẫm xem: bản thân có còn sân hận trong tim với một ai đó không?\nNếu không: hãy thả 1 trái tim vào tn này\nNếu có: thả like nhé.\nChỉ là 1 chút quan sát mình thôi, không vội phán xét /-heart"}, {"n": 247, "t": "Tôi sẽ vẫn mãi mù quáng nếu không có lòng bao dung.", "s": "", "d": "Lời tự nhắc hôm nay:\nCách tôi nhìn thế giới phản chiếu cách tôi nhìn nhận chính tôi. Tôi chỉ có thể bao dung với chính tôi khi bao dung với thế giới. Bao dung là con đường duy nhất để tôi mở ra nhận thức về chính mình, về sự thật, về Nhất thể."}, {"n": 248, "t": "Bất cứ điều gì đau khổ thì không phải là tôi.", "s": "", "d": "Đau khổ chỉ là ảo ảnh. Tôi vượt lên trên những giả dối đó để tìm đến Sự thật rằng tôi là con của Đấng sáng tạo. Ánh sáng, bình an, hạnh phúc và tình yêu chính là tôi."}, {"n": 249, "t": "Lòng bao dung chấm dứt mọi khổ đau và mất mát.", "s": "", "d": "Những khái niệm về tội lỗi và trừng phạt đã gây ra bao sự chia cắt, xung đột và khổ đau. Chỉ có lòng bao dung mới có thể khiến ta vượt lên thế giới Nhị nguyên để hoà vào Nhất thể.\nLòng bao dung chính là chìa khoá để ta có được hạnh phúc, bình an và biến thế giới này trở thành thiên đường.\nHôm nay hãy khởi lên một tâm nguyện:\nNGUYỆN CHO TÔI CÓ THỂ BAO DUNG VỚI TẤT CẢ MỌI NGƯỜI.\nNguyện cho tôi có thể hoan hỉ nhẹ nhàng đón nhận và tôn trọng sự khác biệt trong tư duy, quan điểm, cách nghĩ, cách nói, cách làm của người khác."}, {"n": 250, "t": "Nguyện cho tôi đừng chỉ nhìn thấy bản thân bởi những giới hạn.", "s": "", "d": "Chúng ta thường nhìn bản thân mình, định hình bản thân mình bởi những giới hạn: cơ thể của tôi, gia đình của tôi, dân tộc của tôi, niềm tin của tôi… rồi cả những giới hạn về tuổi tác, giới tính, sức khoẻ, giáo dục…\nNhưng hãy luôn nhớ rằng ta lớn lao hơn thế, ta là Một với Đấng sáng tạo và đầy đủ quyền năng kiến tạo nên thế giới của bạn.\nĐừng chỉ nhìn mình bằng những giới hạn, hãy nhìn nhận bản thân là một với toàn thể.\n## Chương 4: Tội lỗi\nTội lỗi là khái niệm gây chia rẽ và thù địch, gieo rắc nỗi sợ và sự mặc cảm.\nChỉ loài người mới ám ảnh về tội lỗi và từ đó sinh ra biết bao đau khổ và xung đột.\nTội lỗi khiến chúng ta khép mình, đóng cửa trái tim, không dám thừa nhận bản chất thật của mình.\nMột người phán xét bản thân mình sẽ luôn phát xét người khác và ngược lại. Vòng lặp này chỉ kết thúc khi chúng ta xoá bỏ mọi tội lỗi."}, {"n": 251, "t": "Tôi không cần gì ngoài Sự thật.", "s": "", "d": "Chúng ta cứ mải mê tìm kiếm nhiều thứ trong đời và kể cả khi thấy rồi vẫn tiếp tục không hài lòng, chán chường và thất vọng.\nBởi vì điều duy nhất chúng ta cần tìm kiếm chính là bản thân mình và Sự thật về mình.\nKhi đó, mọi đau khổ, mọi bất như ý sẽ chấm dứt.\nMọi thứ chúng ta cần sẽ xuất hiện khi chúng ta nhận biết Sự thật về chính mình."}, {"n": 252, "t": "“Đứa con của Đấng sáng tạo” là danh tính của tôi.", "s": "", "d": "Chân ngã của tôi thánh thiện vượt xa mọi sự thánh thiện mà tôi có thể hình dung, rực rỡ vượt xa mọi ánh sáng mà tôi có thể nhìn thấy, mạnh mẽ và quyền năng đến mức có thể lay chuyển cả thế giới này.\nĐó là cái Ngã đích thực của tôi, Sự thật về tôi, danh tính của tôi và của tất cả chúng sinh.\nĐấng Sáng Tạo thiêng liêng, con xin phó dâng những dự định, suy nghĩ, lời nói, việc làm của con.\nXin Ngài dẫn dắt mọi sự theo kế hoạch tốt đẹp hoàn hảo mà Ngài đã chuẩn bị sẵn cho con.\nCâu cầu nguyện mình thường dùng.\n2. Đấng Sáng Tạo thiêng liêng, nguyện cho bình an và trí huệ vĩ đại của Ngài tuôn chảy trong con dù con đi đến nơi đâu.\nXin cho con nối dài dòng chảy ánh sáng và tình yêu thương của Ngài để soi sáng những người xung quanh."}, {"n": 253, "t": "Bản thân tôi tác động lên cách thế giới này vận hành.", "s": "", "d": "Không có chuyện gì tự nhiên đến với tôi. Mọi chuyện đến với tôi hay không đến với tôi là bởi chính linh hồn tôi đã thiết kế cuộc sống như vậy.\nChính tôi là người nắm giữ vận mệnh của mình và giờ đây, tôi ý thức về quyền năng kiến tạo của mình để tác động lên cách thế giới của tôi vận hành.\nTôi mở rộng bản thân bằng cách mở rộng thế giới khi hoà mình làm Một với Đấng sáng tạo.\nCó một cách hiểu thế này:\nTưởng tượng bạn chính là Đấng Sáng Tạo, bạn phân tách linh hồn mình thành nhiều phân mảnh nhỏ hơn để trải nghiệm cuộc đời.\nNgay trước khi phân tách chính tay bạn (Đấng Sáng Tạo) đã thiết kế 1 hành trình trải nghiệm cho từng phân mảnh linh hồn.\nCũng chính bạn thiết kế cơ chế \"quên\" để sau khi phân mảnh, linh hồn đc trải nghiệm trọn vẹn nhất, chân thật nhất.\nHôm nay hãy thử dành chút thời gian hình dung điều này và cảm nhận quyền năng kiến thiết của chính mình."}, {"n": 254, "t": "Nguyện cho những tiếng nói của Đấng sáng tạo lấp đầy tâm tôi.", "s": "", "d": "Khi tôi phán xét, hằn học hay sợ hãi, tôi tự chia cách mình khỏi Đấng sáng tạo. Vì thế tôi tĩnh lặng để tiếng nói của Đấng sáng tạo cất lên trong tôi. Đó là tiếng nói của bình an, tình yêu và kết nối, là tiếng nói của Sự thật, của Nhất thể, của thiên đàng.\nHôm nay tôi sẽ không để những tiếng nói không thông thái dẫn dắt, tôi đơn giản lùi lại để quan sát và buông đi. Sự tĩnh tại giúp tôi nghe thấy Sự thật."}, {"n": 255, "t": "Hôm nay tôi chọn sự bình an trọn vẹn.", "s": "", "d": "Sự bình an trọn vẹn luôn sẵn có trong tôi. Hôm nay tôi lựa chọn sống với cảm giác bình an trọn vẹn đó giống như Đấng sáng tạo. Nguyện cho tôi có thể hiện diện trong sự bình an hôm nay và cả những ngày sau."}, {"n": 256, "t": "Hoà mình vào Đấng sáng tạo là mục tiêu duy nhất của tôi hôm nay.", "s": "", "d": "Con đường duy nhất để hoà mình vào Đấng sáng tạo chính là sự bao dung. Bao dung với bản thân và bao dung với thế giới. Khi bao dung với bản thân, tôi không còn tự phán xét, tự chê trách.\nNếu sự tội lỗi vẫn lẩn khuất trong tâm tôi, tôi sẽ không thể bình an, không thể hạnh phúc. Tôi vẫn luôn thuần khiết như lúc được Đấng sáng tạo sinh ra và cả những người con khác cũng vậy.\nHoà mình vào Đấng sáng tạo là mục tiêu duy nhất của tôi hôm nay.\nHôm nay chúng ta cùng tự nhắc mình:\n\"Tôi vốn dĩ tốt đẹp, tôi vốn dĩ tuyệt vời. Và bất kỳ ai cũng như vậy.\""}, {"n": 257, "t": "Nguyện cho tôi luôn nhớ lấy mục tiêu của mình.", "s": "", "d": "(Kế tiếp bài tập 256.)\nMỗi khi tôi quên mục tiêu của mình là hoà làm Một với Đấng sáng tạo, tâm trí tôi bắt đầu lo lắng và phán xét, lời nói của tôi sẽ dẫn đến tổn thương, và hành động của tôi sẽ mang tính chia cách, phá huỷ.\nNguyện cho tôi luôn nhớ về tình yêu, về lòng bao dung, nhớ về Nguồn và Nhất thể. Nguyện cho tôi luôn nhớ lấy mục tiêu của mình."}, {"n": 258, "t": "Nguyện cho tôi luôn nhớ rằng mục tiêu của mình là hoà vào cùng Đấng sáng tạo.", "s": "", "d": "(Lại một lời nhắc nhở về Mục tiêu).\nTâm trí cần được rèn luyện để không đi chệch mục tiêu thực sự. Cho dù có những nghi ngờ, phản kháng, nỗi sợ đâu đó vang lên trong tâm trí tôi… tôi hít thở, tĩnh lặng và quan sát.\nNguyện cho tôi luôn nhớ rằng mục tiêu của mình là hoà vào cùng Đấng sáng tạo."}, {"n": 259, "t": "Nguyện cho tôi luôn nhớ rằng chẳng hề có tội lỗi nào cả.", "s": "", "d": "Ý nghĩ về tội lỗi kéo tôi ra xa khỏi Nguồn. Ý nghĩ về tội lỗi gây ra chia cắt, giận dữ, đau khổ… và rồi tiếp tục lại tạo ra tội lỗi. Nguyện cho tôi luôn nhớ rằng chẳng hề có tội lỗi nào cả."}, {"n": 260, "t": "Nguyện cho tôi luôn nhớ rằng Đấng sáng tạo đã sinh ra tôi.", "s": "", "d": "Nguyện cho tôi luôn nhớ về danh tính thật của mình.\nNguyện cho tôi luôn nhớ rằng mình thuần khiết.\nNguyện cho tôi luôn nhớ rằng tôi là tình yêu và bình an.\nNguyện cho tôi luôn nhớ rằng tôi là Một với Đấng sáng tạo và chính Đấng sáng tạo đã sinh ra tôi.\n## Chương 5: Cơ thể\nCơ thể của chúng ta cũng giống như những điều ra đang nhìn thấy trong thế giới Nhị nguyên, chỉ là những ảo ảnh.\nCơ thể cho chúng ta ảo giác về giới hạn, về sự ngăn cách giữa chúng ta và thế giới bên ngoài. Cơ thể với những quy ước về đặc tính, về sự sinh ra và chết đi, về cơ chế dễ tổn thương và bệnh tật, nó vừa là “pháo đài” bảo vệ ta khỏi thế giới bên ngoài, vừa là nguồn cơn của những nỗi sợ hãi.\nChúng ta nhầm tưởng rằng mình an toàn khi thân xác này an toàn, mình được yêu khi thân xác này được yêu, nhưng thực ra không phải vậy.\nCơ thể cũng như những ảo ảnh khác: phản chiếu những gì trong thế giới nội tâm của chúng ta theo cách thức của riêng nó. Cơ thể cần phải là phương tiện phục vụ cho mục đích cao hơn của chúng ta là trở về với Nguồn, là Nhất thể.\nHãy thay đổi nhận thức về cơ thể: đó là hình hài thuần khiết và kết nối, không phải ranh giới để phòng thủ và chia cách. khi đó, cơ thể được chữa lành và là phương tiện để bạn đồng kiến tạo nên thế giới này."}, {"n": 261, "t": "Đấng sáng tạo là nơi bình an và nương tựa của tôi.", "s": "", "d": "Hôm nay, tôi sẽ không đi tìm kiếm bình yên, không tìm kiếm chỗ dựa. Tôi quay vào bên trong, nhớ lại danh tính thực sự của mình, trở lại nguyên mẫu khi tôi được sinh ra bởi Đấng sáng tạo. Tôi được nương tựa và bình an ngay lúc này."}, {"n": 262, "t": "Nguyện cho tôi không thấy sự khác biệt nào hôm nay.", "s": "", "d": "Hôm nay tôi nhìn tất cả mọi người quanh tôi và biết họ cũng giống như tôi: đều là những đứa con của Đấng sáng tạo.\nHọ phản chiếu tôi và tôi cũng phản chiếu họ. Chúng tôi là Một. Không cần đến hàng ngàn danh tính hay hàng triệu khác biệt. Tất cả đều là tôi và đều là Đấng sáng tạo. Nguyện cho tôi không thấy sự khác biệt nào hôm nay."}, {"n": 263, "t": "Nguyện cho tôi nhìn mọi thứ đều thuần khiết.", "s": "", "d": "Vạn vật đều tạo ra từ cùng một Nguồn. Không có xấu hay đẹp, thiện hay ác, không có ánh sáng hay bóng tối, tội lỗi hay thánh thiện.\nBản chất nguyên bản tất cả đều thuần khiết. Nguyện cho tôi nhìn mọi thứ đều thuần khiết như nó vốn là."}, {"n": 264, "t": "Tôi được bao bọc bởi tình yêu của Đấng sáng tạo.", "s": "", "d": "Tôi được bao bọc bởi tình yêu. Tình yêu có trong không khí tôi hít thở, trong mọi âm thanh tôi nghe, trong vạn vật tôi nhìn. Tình yêu có ở nơi tôi đã đi qua và nơi tôi đang đi đến. Dù tôi có cảm nhận được hay không, tôi luôn được bao bọc bởi tình yêu nơi Đấng sáng tạo."}, {"n": 265, "t": "Sự dịu dàng của tạo hoá là những gì tôi thấy hôm nay.", "s": "", "d": "Tôi từng thấy thế giới này đầy hiểm nguy và tội lỗi. Tôi từng đóng vai nạn nhân trong thế giới này. Chính vì vậy, tôi đã không cảm nhận được sự dịu dàng của tạo hoá, không nhìn thấy tình yêu và ánh sáng nơi Đấng sáng tạo.\nHôm nay tôi tĩnh lặng, tự nhắc mình một lần nữa rằng tất cả đều sinh ra từ một Nguồn, đều thuần khiết và dịu dàng như nhau."}, {"n": 266, "t": "Chân ngã thánh thiện trong tôi cũng có ở trong bạn.", "s": "", "d": "Chúng ta đều đến từ một Nguồn và luôn là Một, luôn kết nối và phản chiếu lẫn nhau. Hôm nay tôi sẵn sàng để thấy ánh sáng linh thiên trong tôi cũng như trong tất cả những người xung quanh tôi. Chân ngã thánh thiện trong tôi cũng có ở trong bạn."}, {"n": 267, "t": "Trái tim tôi hoà vào nhịp đập bình an nơi Đấng sáng tạo.", "s": "", "d": "Bao quanh tôi đều là những tạo vật được tạo ra bởi tình yêu và sự bình an nơi Đấng sáng tạo. Tôi hoà từng hơi thở, từng nhịp trái tim mình vào nhịp đập bình an nơi Đấng sáng tạo. Khi đó, tôi trở về Nhà và cảm nhận được sự chữa lành đang diễn ra trong tôi, cũng như trong mọi sinh linh trên thế giới này."}, {"n": 268, "t": "Nguyện cho tất cả luôn nguyên vẹn như vốn là.", "s": "", "d": "Nguyện cho tôi hôm nay sẽ không phán xét và bóp méo những gì quanh tôi. Nhìn mọi thứ luôn nguyên vẹn như vốn là mang lại cho tôi sự bình an và thức tỉnh tình yêu trong tôi. Tôi hoà làm Một với tất cả và trở nên trọn vẹn."}, {"n": 269, "t": "Tôi dùng đôi mắt tôi để nhìn thấy Đấng sáng tạo.", "s": "", "d": "Hôm nay, tôi nguyện nhìn thấy tình yêu và bình an trong vạn vật, nguyện nhìn thấy ánh sáng và sự thuần khiết trong mọi người. Bằng nhận thức mới, tôi không còn nhìn mọi thứ như những nguy cơ, những mối đe doạ và sự chia cách. Bằng nhận thức mới, tôi dùng đôi mắt này để nhìn thấy Sự thật, để nhìn thấy sự hiện diện của Đấng sáng tạo trong tất cả.\nĐấng Sáng Tạo thiêng liêng, nguyện cho bình an và trí huệ vĩ đại của Ngài tuôn chảy trong con dù con đi đến nơi đâu.\nXin cho con nối dài dòng chảy ánh sáng và tình yêu thương của Ngài để soi sáng những người xung quanh.\nNguyện cho con mở lòng tin tưởng, không soi xét hoài nghi. Con vốn tốt đẹp và đủ đầy.\nHôm nay, nguyện cho con nhìn thấy tình yêu và bình an trong vạn vật, nguyện nhìn thấy ánh sáng và sự thuần khiết trong từng người con gặp.\nHành động gợi ý:\nSáng - trưa - tối, mỗi buổi ít nhất 1 lần dành 1 phút nhìn xung quanh chọn 1 người hoặc 1 vật và thầm niệm: Tôi nhìn thấy bình an và tốt đẹp trong ...[người A/cái A này]."}, {"n": 270, "t": "Hôm nay, tôi không chỉ dùng đôi mắt vật lý để ngắm nhìn.", "s": "", "d": "Tôi được ban cho một tầm nhìn rộng mở hơn đôi mắt vật lý này. Nếu như đôi mắt vật lý chỉ nhìn mọi thứ một cách chủ quan theo chọn lọc của tâm trí, chỉ nhìn thấy những ảo ảnh về ranh giới và sự chia cách, thì tầm nhìn tôi được ban cho có khả năng nhìn thấy tình yêu và sự hợp nhất.\nBằng tầm nhìn này, tôi có khả năng chữa lành cho chính tôi và cả thế giới. Hôm nay, tôi không chỉ dùng đôi mắt vật lý để ngắm nhìn.\n## Chương 6: Chân ngã\nTheo A Course in Miracles, Chân ngã (True Self) là phần thuần khiết nhất bên trong mỗi chúng ta, phần không bị tổn thương bởi thời gian, hoàn cảnh hay cảm xúc, luôn bình an, sáng suốt và đầy yêu thương.\nChân ngã không sợ hãi, không phán xét, không bị điều kiện hóa bởi quá khứ. Đó là phần trong sáng như nguyên sơ, nơi chỉ có tình yêu thuần khiết và sự hiệp nhất với muôn loài.\nACIM dùng hình ảnh “Đấng Christ” như một biểu tượng cho tự tánh chân thật: một bản thể thức tỉnh, toàn vẹn, không phải để tôn thờ mà để nhận ra rằng ta cũng chính là như vậy.\nTrong ánh nhìn đó, mọi giấc mơ đau khổ chỉ là tạm thời. Khi ta học cách tha thứ, buông bỏ bản ngã sợ hãi và quay về với tâm thức nguyên sơ: ta sẽ trở về nhà, nơi mà ta chưa từng rời xa.\nTheo góc nhìn Phật giáo, bạn có thể hiểu Chân ngã giống như khái niệm Phật tánh: bản chất giác ngộ vốn sẵn có trong mỗi người.\nViệc nhận ra Chân ngã không phải là trở thành ai đó mới, mà là dừng lại, lặng yên, và nhìn xuyên qua mọi lớp vọng tưởng để thấy tự tánh chân như vốn đã luôn hiện diện."}, {"n": 271, "t": "Hôm nay, tôi chỉ sử dụng tầm nhìn của Đấng sáng tạo.", "s": "", "d": "Hôm nay, tôi lựa chọn nhìn thấy tình yêu, sự bình an, vẻ đẹp và những điều kỳ diệu trong vạn vật. Đó là những yếu tố tạo nên thế giới đích thực.\nBằng cách này, ký ức về danh tính thật của tôi được phục hồi, tôi hợp nhất với Đấng sáng tạo.\nNguyện cho tôi luôn nhìn thế giới bằng tầm nhìn của Đấng sáng tạo."}, {"n": 272, "t": "Những ảo ảnh chẳng thể làm hài lòng tôi.", "s": "", "d": "Nếu không nhận ra và hoà vào Nhất thể, chúng ta chỉ mãi thấy những ảo ảnh của thế giới Nhị nguyên, của sợ hãi và chia cắt. Dù cố gắng thế nào hay bằng cách nào, thế giới Nhị nguyên sẽ mãi gây ra đau khổ và những bất như ý.\nChỉ khi chúng ta nhớ lại và nhận thức về bản thể đích thực của mình, khi đó quanh ta sẽ toàn là tình yêu, bình an và sáng tạo không ngừng.\nHôm nay tôi nguyện buông bỏ ảo ảnh của đúng - sai, tốt - xấu để nhìn thấy sự thật toàn vẹn rằng mọi sự đều tốt đẹp và trọn vẹn.\nVà tôi tin rằng mọi chuyện xảy ra đều là để hỗ trợ cho hành trình của chính tôi\nCảm ơn Vũ Trụ vì tôi có đủ tiền bạc để sống một cuộc đời đủ đầy, tràn đầy năng lượng, sức sống và tình yêu. Sự đủ đầy luôn đến với tôi, từ khắp mọi nơi, dưới mọi hình thức, qua những con đường tôi mong đợi và cả những con đường đầy bất ngờ.\nCảm ơn, cảm ơn, cảm ơn!!! Điều ấy đã thành hiện thực và đang đến rất gần."}, {"n": 273, "t": "Tôi sở hữu sự tĩnh lặng bình an nơi Đấng sáng tạo.", "s": "", "d": "Hôm nay tôi sẽ không để bất cứ điều gì xâm phạm sự bình an và tĩnh lặng trong tôi.\nMỗi khi có điều gì bất như ý, tôi chỉ biết vậy và tự nhủ rằng “tôi sở hữu sự tĩnh lặng bình an nơi Đấng sáng tạo”.\nThực hành gợi ý:\nMỗi khi nhớ ra hãy dành một chút thời gian đặt mọi việc qua một bên ngồi yên không làm gì cả.\nNếu được thì nhắm mắt, không thì mở mắt. Quay về chạm vào sự tĩnh lặng bên trong tâm hồn.\nBắt đầu bằng 1 câu tự nói thầm: TÔI SỞ HỮU SỰ TĨNH LẶNG BÌNH AN NƠI ĐẤNG SÁNG TẠO.\n\"Bạn trong mắt người khác không phải là bạn.\nBạn trong mắt bạn cũng không thực sự là bạn.\nNgười khác trong mắt bạn mới thực sự là bạn.\""}, {"n": 274, "t": "Hôm nay là ngày của tình yêu, không phải là ngày của sợ hãi.", "s": "", "d": "Yêu và Sợ không phải 2 mặt đối lập. Sợ hãi là nguyên nhân dẫn tới chia cách và đối lập. Còn tình yêu sẽ hợp nhất tất cả. Tình yêu và nỗi sợ không tranh chấp nhau. Tình yêu như ánh sáng xua đi bóng tối sợ hãi mà không cần nỗ lực. Hôm nay là ngày của tình yêu, không phải là ngày của sợ hãi.\nNguyện cho tôi thấy được tình yêu trong tôi như nó vẫn ở đó chưa từng thay đổi.\nNguyện cho tôi hiểu rằng ngay cả trong nỗi sợ cũng là một tình yêu thương và chở che ẩn giấu.\nNhững thứ mà ta đang thấy đó là nỗi sợ.\nThực chất cũng là hiện thân của tình yêu thương.\nBởi nỗi sợ sinh ra là để bảo vệ ta thôi mà. Có yêu thương mới bảo vệ chứ, đúng không?\nSuy cho cùng, khi nhìn sâu vào bản chất ta sẽ thấy: tình yêu thương hiện diện ở khắp mọi nơi."}, {"n": 275, "t": "Thông điệp của Đấng sáng tạo chữa lành tất cả ngày hôm nay.", "s": "", "d": "Khi tĩnh lặng và hoà hợp, tôi lắng nghe thấy thông điệp chữa lành của Đấng sáng tạo. Thông điệp được cất lên từ trong tôi mang đầy tình yêu, bình an và sự thông tuệ.\nTôi dần nhận ra, hiểu ra và là hiện thân của những thông điệp đó."}, {"n": 276, "t": "Tôi là kênh thông điệp của Đấng sáng tạo.", "s": "", "d": "Tôi là con của Đấng sáng tạo, là Một với Đấng sáng tạo, vì vậy, tôi cũng là kênh thông điệp của Đấng sáng tạo.\nÁnh sáng, tình yêu, bình an nơi Đấng sáng tạo thông qua tôi để hiển lộ với thế giới và phản chiếu qua thế giới.\nKhông chỉ bằng lời nói, mà mỗi hơi thở, mỗi cảm nhận, mỗi suy nghĩ, mỗi ánh nhìn, mỗi hành động… tôi cần hiện hữu như chính chân ngã của tôi, hiện hữu như một Đấng sáng tạo."}, {"n": 277, "t": "Nguyện cho tôi không trói buộc những người khác bằng niềm tin và nhận định của tôi.", "s": "", "d": "Khi tôi gán những nhận định hay niềm tin của mình vào người khác, tôi đang trói buộc họ vào những nhận định và niềm tin đó giống như những lời nguyền.\nNhận ra tất cả đều giống như tôi, đều toàn vẹn và là con của Đấng sáng tạo, tôi dừng việc dán nhãn lên bất cứ ai.\nNguyện cho tôi thấy được ánh sáng và tình yêu bên trong mỗi người, cũng như trong chính tôi.\nNguyện cho tôi không trói buộc những người khác bằng niềm tin và nhận định của mình."}, {"n": 278, "t": "Nếu tôi bị trói buộc, Đấng sáng tạo cũng không được tự do.", "s": "", "d": "Nếu tôi bị trói buộc trong cơ thể này, trong thế giới này, thì Đấng sáng tạo cũng không được tự do. Sự thật ngược lại, giống như Đấng sáng tạo, tôi tự do kiến tạo nên thế giới của tôi. Tôi là con của Đấng sáng tạo và tôi được tự do kiến tạo."}, {"n": 279, "t": "Tự do đích thực là hứa hẹn dành cho tôi.", "s": "", "d": "Tôi không thể có tự do đích thực một khi còn vướng mắc vào thế giới nhị nguyên. Luôn có những sợ hãi ràng buộc tôi trong thế giới này. Nhưng nó chỉ là những ảo ảnh, là giấc mơ mà tôi chưa thức tỉnh. Một khi nhận thức được Nhất thể, tôi hoàn toàn tự do, giống như Đấng sáng tạo."}, {"n": 280, "t": "Không có giới hạn nào cho đứa con của Đấng sáng tạo.", "s": "", "d": "Là đứa con của Đấng sáng tạo, tôi tự do trải nghiệm, tự do kiến tạo… mọi thứ đều không có giới hạn. Tìm lại sự thật về mình, tôi nhận ra quyền năng lớn lao đó của bản thân và của tất cả mọi người xung quanh tôi.\n## Chương 7: Thánh Linh"}, {"n": 281, "t": "Không gì có thể làm tổn thương tôi ngoài chính suy nghĩ của tôi.", "s": "", "d": "Tôi chịu những đau khổ và tổn thương là bởi tôi quên mất mình thực sự là ai. Tôi mang bệnh tật hay mất mát là bởi tôi quên mất mình có quyền năng kiến tạo. Bằng những suy nghĩ chia cắt, tôi đã tự làm tổn thương mình.\nHôm nay tôi ngừng làm tổn thương chính mình. Tôi lớn lao hơn mọi nỗi đau hay mất mát. Tôi là Nhất thể."}, {"n": 282, "t": "Hôm nay tôi không còn e sợ tình yêu.", "s": "", "d": "Hôm nay tôi lựa chọn tình yêu, lựa chọn duy nhất có thể cứu rỗi tôi và đưa tôi hoà vào Nhất thể, lựa chọn duy nhất để tôi nhận ra Sự thật và nhận ra chính mình.\nSợ hãi chỉ là những ảo ảnh. Hôm nay tôi không còn e sợ tình yêu."}, {"n": 283, "t": "Danh tính đích thực của tôi là con của Đấng sáng tạo.", "s": "", "d": "Tôi chỉ có một danh tính duy nhất, không bao giờ thay đổi, đó là con của Đấng sáng tạo và là Một với Đấng sáng tạo.\nTôi luôn được yêu thương, bình an, thuần khiết và có quyền năng kiến tạo không giới hạn.\nTôi cũng như bạn, đều sinh là từ một Nguồn. Bằng lòng bao dung và yêu thương vô hạn, chúng ta cùng nhau phục hồi được mọi thứ trên thế giới này."}, {"n": 284, "t": "Tôi lựa chọn thay đổi mọi suy nghĩ gây tổn thương.", "s": "", "d": "Khi tôi thay đổi nhận thức, sẽ không còn đau khổ, mất mát hay tổn thương. Không có sự dữ, chỉ có sự lành. Mọi đau khổ đến từ ảo ảnh nhị nguyên chia cắt.\nHôm nay, tôi lựa chọn thay đổi mọi suy nghĩ gây tổn thương."}, {"n": 285, "t": "Hôm nay, tôi trong suốt và toả sáng rực rỡ.", "s": "", "d": "Hôm nay tôi thức dậy trong niềm hân hoan, đón nhận những phúc lành đến với tôi. Bằng những suy nghĩ trong trẻo của mình, tôi gửi đi những yêu cầu tốt đẹp bằng suy nghĩ và được Nguồn đáp ứng.\nMỗi suy nghĩ của tôi đều tạo nên thế giới của tôi, vậy thì tại sao phải tiếp tục những suy nghĩ đau khổ, chật hẹp? Tôi sẽ chỉ nghĩ đến những phúc lành.\nHôm nay, tôi trong suốt và toả sáng rực rỡ."}, {"n": 286, "t": "“Sự tĩnh lặng bình an của Thiên Đàng ôm ấp trái tim tôi hôm nay.”", "s": "", "d": "Diễn giải:\nHôm nay ta không cần phải CỐ GẮNG làm gì. Không cần CỐ gồng lên để kiểm soát.\nKhông cần cố gắng “trở thành” điều gì, cũng không cần chứng minh mình xứng đáng với bình an.\nTa được phép thả lỏng.\nTrong sự thinh lặng, ta nhớ lại: mọi cuộc chiến tôi từng nghĩ là thật -> chỉ là do tâm trí tự tạo nên.\nKhi ta buông nhu cầu phải cố “giải quyết mọi thứ” hay cố “làm cho mọi thứ tốt hơn”, ta thấy rằng:\nmọi sự đã sẵn trọn vẹn.\nTa không cần nghi ngờ kết quả, không suy diễn mọi tình huống.\nBởi vì Đấng Sáng Tạo, vì Nguồn của chúng ta đã luôn giữ bình an cho ta sẵn sàng, như một phần không thể mất đi.\nHôm nay, ta trao lại tâm trí cho sự nghỉ ngơi, không còn chống cự. Và trong không gian đó, trái tim ta được ôm ấp bởi sự tĩnh lặng êm dịu của Thiên Đàng.\nKhẳng định:\nSự tĩnh lặng bình an của Thiên Đàng ôm ấp trái tim tôi hôm nay\nTôi được phép thả lỏng thuận theo dòng chảy của sự sống.\nKhông còn xung đột nào trong tôi.\nKhông còn điều gì để tôi phải “giải quyết”.\nKhông còn việc gì tôi phải cố gắng làm, ngoài việc cho phép bản thân mình nhớ lại sự thật toàn vẹn\""}, {"n": 287, "t": "“Hòa làm Một với Đấng Sáng Tạo là mục tiêu duy nhất của tôi.”", "s": "", "d": "Diễn giải:\nTrong sâu thẳm, chúng ta không thật sự đi tìm tiền bạc, danh tiếng, thành công hay tình yêu từ người khác.\nTất cả những thứ đó, ta từng tưởng là mục tiêu, nhưng thực chất chỉ là biểu hiện bên ngoài cho nỗi khao khát trở về với một cảm giác: ta được yêu thương trọn vẹn, ta thuộc về, ta đủ đầy.\n(Theo tâm lý học: cảm giác này thưở sơ sinh ta cảm nhận rất rõ, khi đó chúng ta chưa có cái tôi tách biệt).\nVà bây giờ, cảm giác đó chỉ có thể đến từ việc kết nối trở lại với Nguồn, với Đấng đã tạo nên chính mình.\nKhi chúng ta nói:\n“Hòa làm Một với Đấng Sáng Tạo là mục tiêu duy nhất của tôi,” ta đang nhắc bản thân rằng:\nKhông có điều gì ngoài kia có thể thay thế cho sự bình an nội tại mà Tình yêu thuần khiết mang lại. Ta không cần chạy theo những điều bên ngoài nữa.\nMọi hành trình chúng ta đi, mọi lựa chọn ta đưa ra, chỉ để trở về lại với Sự Hiện Diện của Tình yêu. Vì vậy, từ nay ta có thể dừng lại. Ta không còn phải tìm kiếm lan man nữa.\nBởi mục tiêu thật sự không nằm ở tương lai mà là sự trở về, ngay trong khoảnh khắc này. Ở đây, bây giờ!"}, {"n": 288, "t": "Nguyện cho tôi quên đi quá khứ của những người anh chị em khác.", "s": "Let me forget my brother's past today.", "d": "Diễn giải:\nTrong đời sống thường nhật, chúng ta quen nhìn người khác qua lăng kính của quá khứ như là:\n\"Cô ấy từng nói tổn thương tôi.\" \"Anh ấy là người nóng tính, phản bội, kiểm soát...\" \"Họ thuộc tầng lớp ấy,
