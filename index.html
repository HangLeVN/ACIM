 dụng điều này vào cuộc sống của bạn ngay hôm nay nhé."}, {"n": 49, "t": "Đấng Sáng Tạo luôn nói với tôi", "s": "", "d": "“God's Voice speaks to me all through the day.”\n(Sắp hết chặng đầu tiên rồi lớp ơi)\nDiễn giải: Dù ta có nghe được hay không thì Đấng Sáng Tạo vẫn “nói” với ta suốt cả ngày. Vì Đấng Sáng Tạo ở ngay trong ta. Đấng Sáng Tạo bao trùm lên mọi thứ, mọi vật, mọi nơi.\nĐó có thể không phải là một âm thanh như lời thủ thỉ, mà đôi khi đến bằng một dấu hiệu, một thôi thúc mạnh mẽ bên trong, một thông điệp từ một bài viết/video/podcast… một lời nói của ai đó mà bạn thấy chạm, thấy kết nối.\nĐấng Sáng Tạo vẫn “nói” với ta suốt cả ngày vậy tại sao ta không “nghe” được?\n- Là vì tâm trí ta đang bị che lấp bởi quá nhiều tiếng ồn khác. Tâm trí ta thường bị xao lãng bởi những suy nghĩ hỗn loạn.\nMỗi ngày, hàng ngàn suy nghĩ tràn ngập trong đầu chúng ta. Nào là công việc, trách nhiệm, lo lắng, kế hoạch tương lai, chuyện đã xảy ra trong quá khứ…\nTiếng của Đấng Sáng Tạo rất nhẹ nhàng và bình an, nhưng những suy nghĩ của bản ngã (ego) lại rất ồn ào và hỗn loạn.\nGiống như sóng radio, nếu bạn không điều chỉnh đúng tần số, bạn sẽ không nghe thấy chương trình đang phát.\n📌 Ví dụ: Hãy tưởng tượng bạn đang ở trong một quán cà phê đông người, nhạc bật to, mọi người nói chuyện rôm rả. Trong lúc đó, có một người đứng ngoài cửa sổ đang gọi tên bạn, nhưng bạn không thể nghe thấy vì có quá nhiều âm thanh khác lấn át.\n➡ Tâm trí chúng ta cũng vậy. Khi bị cuốn vào những suy nghĩ hỗn loạn, ta không thể nghe được Tiếng của Đấng Sáng Tạo.\n- Chúng ta quá tin vào tiếng nói của bản ngã (ego)\nBản ngã luôn tìm cách bảo vệ cái tôi của ta, khiến ta tin rằng ta phải tự mình kiểm soát mọi thứ.\nBản ngã thích những suy nghĩ đầy sợ hãi, phán xét và lo lắng. Khi ta đặt niềm tin vào những suy nghĩ này, ta vô tình gạt bỏ Tiếng của Đấng Sáng Tạo.\nBản ngã khiến ta tin rằng sự hướng dẫn thiêng liêng không có thật, và ta phải dựa vào chính mình.\n📌 Ví dụ: Một người đang bơi giữa đại dương và có một chiếc thuyền đến gần để cứu, nhưng anh ta không tin vào nó. Anh ta cứ nghĩ rằng mình phải tự tìm cách sống sót. Trong khi đó, sự “cứu rỗi” đã ở ngay trước mắt, nhưng anh ta không nhận ra.\n➡  Đấng Sáng Tạo luôn hướng dẫn ta, nhưng bản ngã khiến ta không tin vào sự hiện diện của Ngài.\n- Chúng ta quá bận rộn để lắng nghe\nXã hội hiện đại khiến chúng ta luôn \"bận rộn\". Chúng ta chạy theo công việc, trách nhiệm, mục tiêu cá nhân mà quên dành thời gian cho sự tĩnh lặng.\nChúng ta quên thực hành sự hiện diện (chánh niệm). Tiếng của Đấng Sáng Tạo không đến từ thế giới bên ngoài, mà từ bên trong. Khi ta không dành thời gian kết nối với chính mình, ta cũng không thể kết nối với Ngài.\n📌 Ví dụ: Nếu bạn liên tục lướt điện thoại, bật nhạc và nói chuyện với người khác, bạn sẽ không nghe thấy tiếng ai đó gọi bạn ngoài cửa sổ dù tiếng gọi vẫn đang vang lên.\n➡ Tương tự, nếu ta không dành thời gian để tĩnh lặng, ta không thể nhận ra sự hướng dẫn của Đấng Sáng Tạo.\nLời khuyên: thực hành viết nhật ký cảm xúc, viết morning pages, ngồi thiền, hoặc đơn giản là cho bản thân 1 khoảng thời gian tĩnh lặng chơi cùng chính mình: tắt mọi thiết bị và làm việc lặt vặt tay chân mà không cần phải nghĩ nhiều, hoặc ngồi im ngắm vu vơ...\nKhi tĩnh lặng, bình an và yêu thương, bạn chắc chắn đang nghe thấy tiếng nói của Đấng Sáng Tạo.\nHướng dẫn thực hành\nThực hành ít nhất bốn lần mỗi ngày, mỗi lần khoảng năm phút.\nMở đầu bằng cách nhẩm lại câu chủ đề: “Đấng Sáng Tạo luôn nói với tôi”.\nNhắm mắt lại, tĩnh lặng, và cảm nhận sâu sắc tình yêu thương và sự hỗ trợ của Đấng Sáng Tạo luôn sẵn có, luôn hiện diện bên trong mình rồi. Việc này sẽ giúp bạn càng ngày càng tin tuyệt đối về sự đủ đầy và an toàn.\nHãy quan sát những suy nghĩ hỗn loạn trong tâm trí, để chúng trôi qua mà không bám víu vào chúng.\nMỗi khi có điều gì làm bạn mất bình an, hãy lập tức nhẩm lại câu này.\nBạn cũng có thể tự nhủ câu “Đấng sáng tạo luôn luôn nói với tôi.” nhiều lần trong ngày. Khuyến khích bạn gửi tin nhắn câu chủ đề vào lớp để cùng thực hành."}, {"n": 50, "t": "Tôi được nuôi dưỡng/nâng đỡ bởi Tình Yêu của Đấng Sáng Tạo.", "s": "", "d": "“I am sustained by the Love of God.”\nDiễn giải: Bấy lâu nay ta vẫn thấy rõ ràng rằng ta “sống được” là nhờ cố gắng kiếm tiền để trả cho cơm ăn áo mặc, nước uống, thuốc men, nhà ở… Còn về cảm xúc thì ổn được là nhờ cố gắng xây dựng được MQH với gia đình, bạn bè, cộng đồng….\nNhưng bài tập này khẳng định rằng: Tôi được nuôi dưỡng/nâng đỡ bởi tình yêu của Đấng Sáng Tạo, thoạt nhiên điều này dường như phủ nhận tất cả. Thật vậy sao?\nThực ra không hề mâu thuẫn nhé các bạn: Việc ta cần cơm ăn, nước uống, chỗ ở, thuốc men, gia đình và các MQH không có nghĩa là ta không được nuôi dưỡng bởi Tình Yêu của Đấng Sáng Tạo. Thực ra, chính Tình Yêu đó đang biểu hiện thông qua những điều này để duy trì sự sống và bình ổn của ta trong thế giới vật chất. Tại sao lại thế?\n1. Đấng Sáng Tạo là Nguồn Gốc của mọi thứ ta cần\n✅ Cơm ăn, nước uống, không khí để thở… – Tất cả đều đến từ thiên nhiên, từ sự vận hành hoàn hảo của vũ trụ.\n✅ Gia đình, bạn bè, cộng đồng… – Tất cả những kết nối này đều xuất phát từ tình yêu và sự sắp đặt của Đấng Sáng Tạo.\nNgẫm mà xem:\nTa có thể can thiệp vào quá trình từ 1 hạt lúa trở thành một cây lúa trĩu bông không? Không! Ta chỉ có thể chăm sóc, còn chính thiên nhiên mới làm cho cây mọc lên, ra hoa, kết hạt…\nTa có thể tạo ra không khí để thở không? Không! Nhưng nó vẫn có sẵn để ta dùng mà không phải trả phí.\nTa có thể kiểm soát việc mình sinh ra trong gia đình nào không? Không! Nhưng gia đình đó đến với ta như một món quà.\n👉 Như vậy, tất cả những thứ ta cần để sống đều được Đấng Sáng Tạo cung cấp theo nhiều cách khác nhau.\n2. Sự khác biệt giữa \"Nguồn Cung\" và \"Công Cụ\"\nTình Yêu của Đấng Sáng Tạo là Nguồn Cung thực sự. Cơm, nước, nhà cửa, gia đình là những công cụ thể hiện Nguồn Cung đó.\nNgẫm mà xem:\nĐèn điện sáng không phải vì nó tự có ánh sáng, mà vì nó được kết nối với nguồn điện.\nCây xanh không tự tạo ra nước, nhưng nó hút nước từ lòng đất.\nTa có thức ăn không phải vì ta tự tạo ra chúng, mà vì vũ trụ đã vận hành để mang chúng đến cho ta theo cách mà tâm trí ta tin được, hiểu được, lý giải được.\n👉 Ta cần cơm, nước, nhà cửa, thuốc men, gia đình... – nhưng chúng không phải là nguồn gốc của sự sống ta. Nguồn Gốc đó là Tình Yêu của Đấng Sáng Tạo, và chính nguồn yêu thương này đã tạo ra những điều kiện vật chất để ta có thể tồn tại.\nVấn đề nằm ở chỗ ta đặt niềm tin vào điều gì?\nNếu ta chỉ tin vào cơm, nước, nhà cửa, thuốc men hay một người nào đó ta sẽ bị ràng buộc bởi sự sợ hãi mất mát.\nNếu ta tin vào Nguồn Cung của Đấng Sáng Tạo, ta sẽ an tâm vì biết rằng mọi thứ luôn có cách đến với ta.\nNgẫm thử nhé:\nMột người đặt toàn bộ niềm tin vào tiền bạc sẽ sống trong lo lắng vì sợ mất tiền. Nhưng nếu họ tin vào sự đủ đầy của vũ trụ, họ sẽ thấy rằng dù mất tiền, họ vẫn có thể có những cách khác để được nuôi dưỡng.\nMột người đặt toàn bộ niềm tin vào công việc có thể bị stress khi mất việc. Nhưng nếu họ tin rằng Đấng Sáng Tạo luôn mở ra những con đường mới, họ sẽ bình tĩnh tìm ra giải pháp.\nMột người đặt niềm tin rằng bố mẹ/con cái/ người thương là nguồn sống của tôi, thì khi lỡ không may “mất” đi người đó, họ cũng sẽ trở nên mất hết năng lượng sống… (Quả thực bài học lớn nhất cuộc đời này là bài học buộc phải chấp nhận rằng: Ai rồi cũng có thể rời bỏ ta mà đi. Bài học của sự bình an trong cả lúc cô độc).\n👉 Điều này không có nghĩa là ta ngừng làm việc hay kiếm tiền…, mà là ta không còn bị nỗi sợ kiểm soát nữa.\nVậy thì có cần làm gì không?\nCó chứ! Ta vẫn phải hành động, nhưng hành động với sự tin tưởng và bình an, chứ không phải vì sợ hãi.\nVí dụ:\nTa vẫn nấu ăn, nhưng không lo lắng rằng mình sẽ thiếu tiền mua nguyên liệu nấu ăn.\nTa vẫn chữa bệnh nhưng không sợ hãi và coi bệnh tật là kẻ thù mà ta tuyệt đối tin tưởng: kể cả bệnh tật cũng là biểu hiện của tình yêu thương, là cơ hội để ta biết trân trọng từng khoảnh khắc và trao yêu thương trọn vẹn cho chính mình và cho người thương ngay khi còn có thể.\nTa vẫn làm việc đầy hứng khởi và cống hiến hết mình chứ không bị ám ảnh bởi chuyện mất việc hay làm vì sợ không được công nhận.\nTa vẫn xây dựng gia đình vì ta thực sự háo hức trải nghiệm việc kết hôn rồi sống cùng 1 người, nhưng không phụ thuộc vào người khác để cảm thấy đủ đầy hay để bù đắp cho phần ta tin là ta bị thiếu.\n👉 Khi ta sống với lòng tin vào Tình Yêu của Đấng Sáng Tạo, ta sẽ đầy hứng khởi, bớt căng thẳng, ít lo lắng hơn, và ta sẽ thấy rằng mọi thứ tự nhiên diễn ra theo cách tốt nhất cho ta."}, {"n": 51, "t": "Tổng hợp và ôn tập các bài 1-5", "s": "", "d": "Bài tập 1:\n\"Không có gì tôi thấy là có ý nghĩa.\"\nBài tập 2:\n\"Tôi đã gán ý nghĩa mà mọi thứ tôi nhìn thấy để phù hợp với tôi.\"\nBài tập 3:\n\"Tôi không hiểu bất cứ điều gì tôi nhìn thấy ở đây.\"\nBài tập 4:\n\"Những suy nghĩ này không có ý nghĩa gì. Cũng giống như những thứ tôi nhìn thấy ở đây cũng chẳng có ý nghĩa gì.\nBài tập 5:\n\"Tôi không buồn phiền vì lý do mà tôi nghĩ.\"\nCách thức thực hành: Bạn có thể chép lại câu chủ đề 3-5 lần. Hoặc tốt hơn nữa thì đọc thuộc và nhẩm lại bất kỳ khi nào có thể.\nKhuyến khích các bạn lội lại bài cũ đọc và nghiền ngẫm lại toàn bộ nội dung 5 bài tập xuyên suốt nha. Khuyến khích gõ và gửi các câu chủ đề vào lớp để cùng thực hành."}, {"n": 52, "t": "Ôn tập các bài 6-10", "s": "", "d": "Bài tập 6:\n\"Tôi muộn phiền vì tôi thấy một điều gì đó không thực sự tồn tại.\"\nBài tập 7:\n\"Tôi chỉ nhìn thấy quá khứ.\"\nBài tập 8:\n\"Tâm trí tôi đang quẩn quanh với những suy nghĩ thuộc về quá khứ.\"\nBài tập 9:\n\"Tôi không nhìn thấy bất cứ điều gì như nó đang là ở hiện tại.\"\nBài tập 10:\n\"Những suy nghĩ của tôi không có ý nghĩa gì.\"\nCách thức thực hành: Bạn có thể chép lại câu chủ đề 3-5 lần. Hoặc tốt hơn nữa thì đọc thuộc và nhẩm lại bất kỳ khi nào có thể.\nKhuyến khích các bạn lội lại bài cũ đọc và nghiền ngẫm lại toàn bộ nội dung 5 bài tập xuyên suốt nha. Khuyến khích gõ và gửi các câu chủ đề vào lớp để cùng thực hành."}, {"n": 53, "t": "Tổng hợp và ôn tập các bài 11-15", "s": "", "d": "Bài tập 11:\n\"Những suy nghĩ vô nghĩa của tôi đang cho tôi thấy một thế giới vô nghĩa.\"\nBài tập 12:\n\"Tôi muộn phiền vì tôi nhìn thấy một thế giới vô nghĩa.\"\nBài tập 13:\n\"Một thế giới vô nghĩa tạo ra những nỗi sợ.\"\nBài tập 14:\n\"Đấng Sáng Tạo không tạo ra một thế giới vô nghĩa.\"\nBài tập 15:\n\"Những suy nghĩ của tôi là những hình ảnh mà tôi đã tạo ra.\"\nCách thức thực hành: Bạn có thể chép lại câu chủ đề 3-5 lần. Hoặc tốt hơn nữa thì đọc thuộc và nhẩm lại bất kỳ khi nào có thể.\nKhuyến khích các bạn lội lại bài cũ đọc và nghiền ngẫm lại toàn bộ nội dung 5 bài tập xuyên suốt nha. Khuyến khích gõ và gửi các câu chủ đề vào lớp để cùng thực hành."}, {"n": 54, "t": "Tổng hợp và ôn tập các bài 16-20", "s": "", "d": "Bài tập 16:\n\"Tôi không có suy nghĩ nào của tôi là trung lập/trung tính.\"\nBài tập 17:\n\"Không có gì tôi nhìn thấy là trung lập/trung tính.\"\nBài tập 18:\n\"Không chỉ mình tôi chịu tác động bởi cách tôi nhìn.\"\nBài tập 19:\n\"Không chỉ mình tôi chịu tác động bởi suy nghĩ của tôi”.\nBài tập 20: \"Tôi quyết tâm nhìn thấy.\"\nCách thức thực hành: Bạn có thể chép lại câu chủ đề 3-5 lần. Hoặc tốt hơn nữa thì đọc thuộc và nhẩm lại bất kỳ khi nào có thể.\nKhuyến khích các bạn lội lại bài cũ đọc và nghiền ngẫm lại toàn bộ nội dung 5 bài tập xuyên suốt nha. Khuyến khích gõ và gửi các câu chủ đề vào lớp để cùng thực hành."}, {"n": 55, "t": "Tổng hợp và ôn tập các bài 20-25", "s": "", "d": "Bài tập 20: Tôi nhất định nhìn thấy.\nBài tập 21. Tôi nhất định nhìn mọi thứ khác đi.\nBài tập 22. Những gì tôi thấy đều biểu hiện cho nỗi sợ\nBài tập 23. Tôi có thể thoát khỏi thế giới mà tôi thấy bằng cách dừng những ý nghĩ tấn công.\nBài tập 24. Tôi không nhận thức được những điều tốt nhất cho mình.\nBài tập 25. Tôi không biết mọi thứ để làm gì.\nCách thức thực hành: Bạn có thể chép lại câu chủ đề 3-5 lần. Hoặc tốt hơn nữa thì đọc thuộc và nhẩm lại bất kỳ khi nào có thể.\nKhuyến khích các bạn lội lại bài cũ đọc và nghiền ngẫm lại toàn bộ nội dung các bài tập xuyên suốt nha. Khuyến khích gõ và gửi các câu chủ đề vào lớp để cùng thực hành."}, {"n": 56, "t": "Tổng hợp và ôn tập các bài 26-30", "s": "", "d": "Bài tập 26. Những ý nghĩ tấn công của tôi đang tấn công chính sự bất khả xâm phạm của tôi.\nBài tập 27. Trên tất cả, tôi muốn được thấy.\nBài tập 28. Trên tất cả, tôi muốn nhìn mọi thứ khác đi.\nBài tập 29. Thượng Đế hiện diện trong mọi thứ tôi nhìn thấy.\nBài tập 30. Thượng Đế hiện diện trong mọi thứ tôi nhìn thấy, vì Thượng Đế ở trong tâm tôi.\nCách thức thực hành: Bạn có thể chép lại câu chủ đề 3-5 lần. Hoặc tốt hơn nữa thì đọc thuộc và nhẩm lại bất kỳ khi nào có thể.\nKhuyến khích các bạn lội lại bài cũ đọc và nghiền ngẫm lại toàn bộ nội dung các bài tập xuyên suốt nha. Khuyến khích gõ và gửi các câu chủ đề vào lớp để cùng thực hành."}, {"n": 57, "t": "Tổng hợp và ôn tập các bài 31-34", "s": "", "d": "31. Tôi không phải là nạn nhân của thế giới tôi thấy.\n32. Tôi kiến tạo nên thế giới tôi thấy.\n33. Có cách khác để nhìn thế giới.\n34. Tôi có thể thấy bình an thay vì điều này.\nCách thức thực hành: Bạn có thể chép lại câu chủ đề 3-5 lần. Hoặc tốt hơn nữa thì đọc thuộc và nhẩm lại bất kỳ khi nào có thể.\nKhuyến khích các bạn lội lại bài cũ đọc và nghiền ngẫm lại toàn bộ nội dung các bài tập xuyên suốt nha. Khuyến khích gõ và gửi các câu chủ đề vào lớp để cùng thực hành."}, {"n": 58, "t": "Tổng hợp và ôn tập các bài 35-39", "s": "", "d": "35. Tâm trí tôi là một phần của Đấng sáng tạo. Tôi đầy tính thánh linh.\n36. Tính thánh linh của tôi bao trùm lên những thứ tôi thấy.\n37. Tính thánh linh từ tôi mang phúc lành đến thế giới.\n38. Không có điều gì mà sự thánh linh trong tôi không thể làm.\n39. Tính thánh linh là sự cứu rỗi của tôi.\nCách thức thực hành: Bạn có thể chép lại câu chủ đề 3-5 lần. Hoặc tốt hơn nữa thì đọc thuộc và nhẩm lại bất kỳ khi nào có thể.\nKhuyến khích các bạn lội lại bài cũ đọc và nghiền ngẫm lại toàn bộ nội dung các bài tập xuyên suốt nha. Khuyến khích gõ và gửi các câu chủ đề vào lớp để cùng thực hành."}, {"n": 59, "t": "Tổng hợp và ôn tập các bài 40-43", "s": "", "d": "40. Tôi có diễm phúc làm con của Đấng sáng tạo.\n41. Đấng sáng tạo luôn hiện diện bên tôi (dù cho tôi ở bất cứ nơi đâu).\n42. Đấng sáng tạo là sức mạnh của tôi. Khả năng nhìn thấu là một món quà.\n43. Đấng sáng tạo là Nguồn cội của tôi. Tôi không thể thấy điều gì tách rời khỏi Nguồn.\nCách thức thực hành: Bạn có thể chép lại câu chủ đề 3-5 lần. Hoặc tốt hơn nữa thì đọc thuộc và nhẩm lại bất kỳ khi nào có thể.\nKhuyến khích các bạn lội lại bài cũ đọc và nghiền ngẫm lại toàn bộ nội dung các bài tập xuyên suốt nha. Khuyến khích gõ và gửi các câu chủ đề vào lớp để cùng thực hành."}, {"n": 60, "t": "Tổng hợp và ôn tập các bài 44-50", "s": "", "d": "44. Đấng sáng tạo là ánh sáng cho tôi nhìn thấy.\n45. Tôi tư duy với tâm trí vĩ đại của Đấng sáng tạo.\n46. Đấng sáng tạo trao tình yêu để tôi tha thứ/bao dung.\n47. Đấng sáng tạo là sức mạnh để tôi vững tin.\n48. Không có gì phải sợ.\n49. Đấng sáng tạo luôn luôn nói với tôi.\n50. Tôi được nâng đỡ bởi tình yêu của Đấng sáng tạo.\nCách thức thực hành: Bạn có thể chép lại câu chủ đề 3-5 lần. Hoặc tốt hơn nữa thì đọc thuộc và nhẩm lại bất kỳ khi nào có thể.\nKhuyến khích các bạn lội lại bài cũ đọc và nghiền ngẫm lại toàn bộ nội dung các bài tập xuyên suốt nha. Khuyến khích gõ và gửi các câu chủ đề vào lớp để cùng thực hành."}, {"n": 61, "t": "Tôi là ánh sáng của thế giới.", "s": "", "d": "“I am the light of the world.”\nDiễn giải: Hôm nay, chúng ta khẳng định sự thật về bản chất thật của mình: rằng tôi là ánh sáng của thế giới.\nĐiều này không phải là một tuyên bố kiêu ngạo hay tự huyễn hoặc, mà là sự chấp nhận khiêm nhường về vai trò mà Thượng Đế đã trao cho chúng ta.\n1️⃣ Đây là sự thật về bạn\nKhông ai khác ngoài Con của Thượng Đế mới có thể là ánh sáng của thế giới.\nCâu khẳng định này không phải là sự kiêu ngạo hay ảo tưởng, mà đơn giản là sự thật về bản chất thật của bạn.\nĐiều này không liên quan đến những gì bạn nghĩ rằng mình là: mà liên quan đến con người mà Thượng Đế đã tạo ra bạn.\n2️⃣ Bản ngã (ego) sẽ chống lại ý tưởng này\nBản ngã sẽ nghĩ rằng tuyên bố này là quá tự cao tự đại, nhưng thực ra nó không hiểu thế nào là khiêm nhường.\nKhiêm nhường thực sự không phải là tự hạ thấp mình, mà là chấp nhận vai trò mình được giao phó.\nChối bỏ sự thật này mới là sự ngạo mạn của bản ngã, vì nó phủ nhận kế hoạch của Thượng Đế dành cho bạn.\n3️⃣ Chấp nhận vai trò của bạn\nKhi bạn chấp nhận sự thật này, bạn đang thực hiện bước đầu tiên trong việc nhận ra chức năng thật sự của mình trên Trái Đất.\nĐây là một bước nhảy lượng tử trên hành trình phát triển của bạn và của thế giới.\nĐiều này không chỉ giúp bạn được phát triển, mà còn trao cho bạn sức mạnh để giúp đỡ, hỗ trợ những người khác xung quanh bạn.\n📌 Cách thực hành:\nBắt đầu mỗi lần thực hành bằng cách nói với chính mình:\n👉 “Tôi là ánh sáng của thế giới. Đó là chức năng duy nhất của tôi. Đó là lý do tôi có mặt ở đây.”\nNhắm mắt lại, để cho những suy nghĩ liên quan đến ý tưởng này xuất hiện.\nNếu tâm trí bạn lang thang, nhẹ nhàng đưa nó trở lại và nhắc lại câu khẳng định trên.\n📌 Thực hành vào sáng và tối:\nKhi thức dậy, nhắc nhở bản thân sự thật về con người bạn.\nTrong ngày, nhắc lại nhiều lần nhất có thể.\nTrước khi ngủ, củng cố nhận thức về chức năng thật sự của mình.\n📌 👉 Câu hỏi áp dụng thực tế:\nMình đang sống như một người có ánh sáng, hay mình đang che giấu ánh sáng của mình?\nNếu mình thật sự tin rằng mình là ánh sáng của thế giới, mình sẽ đối xử với bản thân và với người khác như thế nào?\nHôm nay, mình có thể làm gì để giúp lan tỏa ánh sáng này đến thế giới xung quanh?\n🔥 👉 Nhận ra ánh sáng bên trong bạn, và để nó chiếu rọi ra thế giới!"}, {"n": 62, "t": "Bao dung là chức năng của tôi với tư cách là ánh sáng của thế giới.", "s": "", "d": "“Forgiveness is my function as the light of the world.”\nDiễn giải: Forgiveness ở đây được hiểu là bao dung, là sự dung chứa toàn bộ. Sự bao dung này được biểu hiện bằng việc chúng ta sẽ không phân biệt tốt xấu, đúng sai, hay dở. Mà chúng ta đón nhận mọi sự đến với ta luôn là đúng việc đúng người đúng thời điểm rồi.\nHướng dẫn thực hành: Lặp lại câu “Tha thứ/bao dung là chức năng của tôi, với tư cách là ánh sáng của thế giới.” càng nhiều càng tốt. Nói với chính mình và nói với thế giới ngoài kia, khi nhắm mắt và khi mở mắt, thả lỏng và cảm nhận. Ghi nhận sự phản kháng bên trong bạn (nếu có) và tiếp tục thực hành.\nPhiên bản dài hơn của bài tập này để bạn thực hành là: “Tha thứ/bao dung là chức năng của tôi, với tư cách là ánh sáng của thế giới. Tôi hoàn thành chức năng của mình để đạt tới hạnh phúc. Tôi ghi nhớ điều này vì tôi muốn hạnh phúc.”\nBao dung và tha thứ là một chủ đề rất quan trọng trong thực hành ACIM nha các bạn.\nLưu ý: Bạn cũng có thể áp dụng bài tập này để thực hành tha thứ cho một ai đó mà bạn vẫn còn giận họ."}, {"n": 63, "t": "Ánh sáng của thế giới mang bình an đến mọi tâm trí thông qua sự bao dung của tôi.", "s": "", "d": "“The light of the world brings peace to every mind through my forgiveness.”\nDiễn giải:  Ngôn từ khó mô tả nên mình cố gắng dùng 1 hình ảnh tưởng tượng để các bạn dễ hình dùng hơn: Hãy tưởng tượng trên trời cao có một quả cầu ánh sáng rực rỡ, Ánh sáng đó chứa đựng tình yêu thương, sự đủ đầy, cảm giác an toàn và bình an. Và bên dưới mặt đất là một thế giới vẫn còn những hỗn loạn, bất an và khổ đau được tạo nên bởi nỗi sợ, những nỗi sợ đó có thể xuất phát từ quá khứ đã qua từ lâu, cũng có thể là là những nỗi sợ về một tương lai chưa tới.\nVà chỉ cần ánh sáng ở quả cầu rực rỡ đó chiếu rọi thì bóng tối của những nỗi sợ đó sẽ được xua tan. Dù bạn biết hay không biết thì điều đặc biệt là bạn đang sở hữu đường dẫn để dẫn ánh sáng đó đến với thế giới dưới mặt đất. Đó chính là đường dẫn được dệt nên bởi lòng bao dung. Lòng bao dung của bạn mở rộng tới đâu thì bình an được mở rộng tới đó.\nBài tập hôm nay khẳng định và nhắc nhở bản thân mỗi người về điều này.\nLưu ý: đây chỉ là đang cố gắng hình tượng hoá để các bạn dễ hình dung bài tập này hơn, ngôn từ vẫn khó để mô tả hết ý hết các khía cạnh. Bạn hãy cứ vô tri thực hành theo thôi là được.\nHướng dẫn thực hành: Lặp lại nội dung chủ đề “Ánh sáng của thế giới mang bình an đến mọi tâm trí thông qua sự bao dung/tha thứ của tôi.” càng nhiều càng tốt trong ngày. Thực hành khi nhắm mắt và mở mắt, nói ra miệng hoặc nhẩm trong đầu đều được, thực hành chậm rãi và cảm nhận.\nPhiên bản dài của bài tập: “Ánh sáng của thế giới mang bình an đến mọi tâm trí thông qua sự bao dung/tha thứ của tôi. Tôi là phương tiện mà Đấng sáng tạo đã chỉ định để cứu rỗi thế giới.”"}, {"n": 64, "t": "Nguyện cho tôi không quên chức năng của mình.", "s": "", "d": "“Let me not forget my function.”\nDiễn giải:\nHãy tưởng tượng rằng bạn đang sống trong một thế giới mà ai cũng có một vai trò đặc biệt để làm cho thế giới tốt đẹp hơn, nhưng nhiều người đã quên mất vai trò của mình.\nBạn cũng vậy, bạn đã quên mất chức năng thật sự của mình, bởi vì có quá nhiều thứ gây sao nhãng xung quanh.\nThế giới mà bạn nhìn thấy hàng ngày: những tin tức tiêu cực, những tranh chấp, sự tổn thương, những nỗi đau cá nhân. tất cả những điều này chỉ là một ảo tưởng, khiến bạn quên đi chức năng thật sự của mình: Bao dung và mang ánh sáng đến thế giới.\nMỗi khi bạn tức giận, mỗi khi bạn cảm thấy bị tổn thương, hoặc mỗi khi bạn phán xét ai đó, bạn đang đánh mất chức năng của mình và quên đi rằng hạnh phúc cho tất cả sẽ đến khi bạn bao dung.\nChìa khóa ở đây là: Bạn có thể chọn lại bất cứ lúc nào!\nThực hành bài học hôm nay giúp bạn nhớ rằng mọi quyết định mà bạn đưa ra đều chỉ có một sự lựa chọn duy nhất:\n👉 Hoặc là chọn bao dung và hạnh phúc, hoặc là chọn đau khổ.\nBạn không cần thay đổi thế giới bên ngoài, nhưng bạn có thể thay đổi cách mình nhìn thế giới. Và khi bạn thay đổi, thế giới xung quanh bạn cũng thay đổi theo.\nHướng dẫn thực hành:\n- Dành 10-15 phút nhắm mắt để khởi nguyện “Nguyện cho tôi không quên chức năng của mình. Nguyện cho tôi mở lòng và bao dung. Nguyện cho tôi luôn hạnh phúc. Nguyện cho tôi luôn bình an”\n- Trong ngày, nhiều nhất có thể, lặp lại câu chủ đề của bài tập “Nguyện cho tôi không quên chức năng của mình. Nguyện cho tôi biết bao dung và tha thứ.”\n- Yêu cầu thứ 3 đòi hỏi cao hơn và không chỉ làm trong ngày hôm nay: Khởi lên lời nguyện trước khi bạn ra một quyết định hoặc có một hành động, hay nói một điều gì đó - quan sát xem quyết định/hành động/lời nói đó có thiếu đi sự bao dung hay đang có mặt sự bao dung ở đó hay không.\nĐơn giản là quan sát mà không phán xét gì cả. \"Thấy\" và \"Biết\" là được!"}, {"n": 65, "t": "Chức năng duy nhất của tôi được trao bởi Đấng sáng tạo.", "s": "", "d": "“My only function is the one God gave me.”\nDiễn giải: Như các bài tập trước: Chức năng duy nhất của bạn là mang bình an đến mọi tâm trí thông qua sự bao dung của mình. Tuy nhiên đôi khi bạn sẽ quên mất chức năng đó mà mải chạy theo Tham Sân Si Mạn Nghi. Từ đó vô tình tự tạo nên xung đột nội tâm.\nHãy thử tưởng tượng bạn là một ngọn hải đăng trên biển, và chức năng của bạn là tỏa sáng để dẫn đường cho những con tàu lạc lối trở về bờ. Nhưng thay vì làm đúng chức năng của mình, bạn lại quên mất điều đó và nghĩ rằng mình cần phải làm rất nhiều thứ khác—chẳng hạn như cạnh tranh với những ngọn hải đăng khác, trang trí cho mình đẹp hơn, hoặc lo lắng về việc ánh sáng của mình có đủ mạnh hay không.\nSự tỏa sáng bằng tình yêu và lòng bao dung chính là chức năng thật sự của bạn. Và điều khiến bạn quên đi ánh sáng của mình là bạn bị phân tâm bởi những mục tiêu nhỏ nhặt khác mà bản ngã đã bày ra.\n💡 Khi bạn nhớ lại chức năng thật của mình, tất cả những lo lắng, áp lực và xung đột sẽ biến mất.\nBản chất của bạn là ánh sáng. Và ánh sáng thì chỉ cần làm một điều: Tỏa sáng bằng lòng bao dung của chính bạn.\nBài học hôm nay giúp bạn dừng lại và nhớ rằng:\n✅ Bạn không cần phải làm quá nhiều thứ khác nhau để tìm kiếm giá trị bản thân.\n✅ Chỉ cần thực hiện chức năng bao dung của mình, bình an, đủ đầy, mạnh khoẻ, thịnh vượng, hạnh phúc sẽ tự nhiên đến.\n✅ Mọi xung đột trong bạn sẽ chấm dứt khi bạn không còn chạy theo những mục tiêu do bản ngã tạo ra.\nHướng dẫn thực hành đơn giản\n✅ Buổi sáng và buổi tối (10-15 phút):\nNhắm mắt lại và nhắc nhở bản thân:\n“Chức năng duy nhất của tôi được trao bởi Đấng sáng tạo.”\nChậm rãi cảm nhận và thấm đẫm điều này.\n✅ Trong ngày (khoảng mỗi giờ một lần):\nDừng lại một chút và tự nhủ:\n“Chức năng duy nhất của tôi được trao bởi Đấng sáng tạo. Đó là sống với tình yêu và lòng bao dung.\nĐôi lúc nhắm mắt lại khi thực hành, đôi lúc mở mắt ra và nhìn xung quanh."}, {"n": 66, "t": "Hạnh phúc và chức năng của tôi là một.", "s": "", "d": "“My happiness and my function are one.”\nDiễn giải: Các bài tập trước chúng ta đã biết rằng: Chức năng của chúng ta là bao dung. Và chức năng đó được trao bởi Đấng Sáng Tạo. Bài tập này nhấn mạnh: Hạnh phúc và chức năng của tôi là một.\nĐiều này có nghĩa là Tôi hạnh phúc, TTôi bao dung. Hai điều này là một. Nó không phải một dạng điều kiện kiểu: “Chỉ khi tôi bao dung thì tôi mới có hạnh phúc”. Mà ngay khoảnh khắc bạn bao dung, chấp nhận mọi sự khác biệt vô điều kiện. Thì bạn nghiễm nhiên hạnh phúc.\nHãy tưởng tượng bạn có một chiếc chìa khóa mở ra cánh cửa hạnh phúc chính là lòng bao dung, nhưng thay vì dùng nó, bạn lại cố gắng bẻ khóa bằng đủ mọi cách khác—công việc, nhan sắc, tiền bạc, mối quan hệ, danh vọng... Nhưng cánh cửa không bao giờ thực sự mở.\nBản ngã luôn hứa hẹn về hạnh phúc, nhưng những gì nó mang lại chỉ là sự lo lắng, sợ hãi và cảm giác không bao giờ đủ. Ngược lại, Đấng Sáng Tạo biết rõ rằng hạnh phúc không đến từ bên ngoài, mà đến từ việc sống đúng với chức năng thật của bạn—mang ánh sáng và bình an đến thế giới bằng lòng bao dung và yêu thương.\nMỗi khi bạn thực hiện chức năng của mình bằng cách bao dung, yêu thương, và nhìn mọi thứ với đôi mắt của sự thật, bạn sẽ nhận ra rằng hạnh phúc không phải thứ bạn phải tìm kiếm, mà là thứ bạn đã có sẵn ở đây bây giờ.\nHướng dẫn thực hành:\n✅ Buổi sáng và buổi tối (10-15 phút):\nNhắm mắt lại và nhắc nhở bản thân:\n“Hạnh phúc và chức năng của tôi là một.”\nChậm rãi cảm nhận và thấm đẫm điều này.\n✅ Trong ngày (khoảng mỗi giờ một lần):\nDừng lại một chút và tự nhủ:\n\"Hạnh phúc của tôi và chức năng của tôi là một, vì Đấng Sáng Tạo đã ban cho tôi cả hai.\"\nĐôi lúc nhắm mắt lại khi thực hành, đôi lúc mở mắt ra và nhìn xung quanh.\nThực hành trong cuộc sống hằng ngày:\nMỗi khi cảm thấy căng thẳng, lo lắng hay bất mãn, hãy dừng lại và nhắc nhở bản thân:\n\"Tôi đang cố tìm kiếm hạnh phúc ở nơi sai lầm sao? Hạnh phúc thật sự đến từ chức năng của tôi.\"\nMỗi khi bạn cảm thấy bình an sau khi giúp đỡ ai đó, sau khi thực hành bao dung, hoặc sau khi buông bỏ một sự phán xét, hãy dành chút lắng lại để nhận ra đây là hạnh phúc thật sự mà bạn luôn tìm kiếm."}, {"n": 67, "t": "Tình yêu tạo nên tôi, tôi là tình yêu.", "s": "", "d": "“Love created me like Itself.”\nDiễn giải: Bài tập này giúp bạn dỡ bỏ mọi lớp màn che phủ bản chất thật của bạn. Bạn không cần phải trở nên tốt đẹp hơn, bạn chỉ cần nhận ra rằng bạn đã được tạo ra từ tình yêu, và bạn đã luôn là như thế.\nBất cứ khi nào bạn quên điều này, chỉ cần nhắc nhở bản thân:\n “Tình yêu tạo nên tôi, tôi là tình yêu”.\n \"Tình yêu đã tạo nên tôi theo chính bản chất của Tình yêu.\"\nThực hành ngắn càng nhiều càng tốt (ít nhất vài ba lần mỗi giờ):\nNhắc nhở bản thân:\n “Tình yêu tạo nên tôi, tôi là tình yêu”.\nCảm nhận ý nghĩa của câu này trong tâm trí. Cứ cảm nhận thôi, bất kỳ suy nghĩ gì nổi lên đều đón nhận mà ko cần phân tích.\n Ứng dụng trong cuộc sống hằng ngày:\nNếu bạn cảm thấy bị chỉ trích hoặc nghi ngờ về bản thân, hãy dừng lại và nói:\n\"Đây không phải là sự thật về tôi. Tình yêu đã tạo nên tôi theo chính bản chất của Tình yêu.\" Nếu bạn cảm thấy mất kiên nhẫn, tức giận hoặc lo lắng, hãy nhớ rằng đó chỉ là những ảo tưởng mà bản ngã tạo nên, chứ bản chất thật của bạn là tình yêu và bình an."}, {"n": 68, "t": "Tình yêu không ôm lấy/giữ lại sự bất bình.", "s": "", "d": "“Love holds no grievances.”\nDiễn giải:\nCác bài tập trước, chúng ta đã biết rằng: Ta là tình yêu. Hãy tưởng tượng tâm trí ta như một bầu trời rộng lớn.\nKhi ta nuôi dưỡng sự bất bình, đó giống như những đám mây đen dày đặc che khuất mặt trời.\nTa sẽ không thể thấy ánh sáng, và thế giới của ta trở nên ảm đạm, nặng nề.\nBây giờ, hãy hình dung ta thổi bay những đám mây đen đó bằng lòng bao dung và tình thương.\nKhi ta tha thứ, ta cho phép ánh sáng của chính mình toả sáng trở lại.\nTa không làm điều đó vì người khác, mà vì chính mình.\nVí dụ:\nNếu ai đó làm tổn thương ta, việc ta giữ sự bực tức không khiến họ thay đổi, nhưng nó lại làm ta khổ sở.\nKhi ta bao dung, ta giải phóng bản thân khỏi sự đau khổ đó.\nTa không nhất thiết phải quên hay chấp nhận những gì họ đã làm, nhưng ta chọn cách không để nó kiểm soát cảm xúc và cuộc sống của mình nữa.\nBản chất thật của ta là bình an là bao dung là tình yêu, không phải bất bình. Khi ta buông bỏ bất bình, ta quay về với bản chất thật của mình.\nHướng dẫn thực hành\n⏳ Thực hành càng nhiều càng tốt:\n👉 Khi cảm thấy bực bội hay khó chịu, hãy nhắc nhở bản thân:\n\"Tình yêu không nuôi dưỡng sự bất bình. Mình sẽ không vô tình che mất ánh sáng của chính mình.\"\n👉 Khi nhìn thấy ai đó đang bực bội hãy thử cảm nhận cảm xúc của họ và tự niệm:\n\"Tình yêu không nuôi dưỡng sự bất bình. Nguyện cho bạn nhớ lại chức năng của mình.”\n👉 Nếu bạn nhớ lại và cảm thấy bị tổn thương vì quá khứ, hãy nhớ rằng giữ oán giận không giúp bạn tiến về phía trước và niệm:\n\"Tình yêu không nuôi dưỡng sự bất bình. Mình sẽ không vô tình che mất ánh sáng của chính mình.\""}, {"n": 69, "t": "Sự bất bình che khuất ánh sáng từ tôi", "s": "", "d": "“My grievances hide the light of the world in me.”\nDiễn giải:\n💭 Bạn có bao giờ cảm thấy tâm trí mình nặng nề, mệt mỏi bởi những cảm xúc tiêu cực không?\nKhi bạn giữ sự bất bình, bạn giống như phải chịu đựng một bầu trời đầy mây đen, không thấy được ánh sáng mặt trời.\nBạn cảm thấy thế giới tăm tối, nặng nề và bế tắc.\n🌤 Nhưng mặt trời luôn ở đó!\nChỉ cần những đám mây tan đi, ánh sáng sẽ tỏa chiếu.\nTương tự, chỉ cần bạn buông bỏ bất bình, ánh sáng bên trong bạn sẽ tỏa rạng.\n📌 Ví dụ thực tế:\nBạn cảm thấy tức giận với ai đó vì họ đã làm bạn tổn thương.\nBạn nghĩ rằng nếu mình không tức giận, họ sẽ không bị \"trừng phạt\".\nNhưng thực tế, người bị tổn thương nhất chính là bạn.\nCơn giận chỉ làm che mờ ánh sáng trong bạn, khiến bạn mất đi bình an.\nKhi bạn chọn không giữ lấy sự oán giận, bạn không làm điều đó vì họ, mà vì chính bạn.\nBạn cho phép ánh sáng bên trong mình tỏa sáng trở lại.\nNhớ rằng: cảm giác nào rồi cũng qua hết cả. Cảm xúc, suy nghĩ chỉ như đám mây thôi, chúng cứ lởn vởn cứ bay qua, có lúc ở lại lâu, có lúc trôi tuột rất nhanh, kệ nó. Bạn không phải đám mây đó.\nBẠN LÀ BẦU TRỜI! AN TĨNH, MÁT DỊU, XANH TRONG, ĐẦY BAO DUNG CHỨA ĐỰNG TẤT CẢ, CHO PHÉP TẤT CẢ ĐƯỢC DIỄN RA mà không cần can thiệp.\nĐừng quên rằng: Bạn không cần phải tạo ra ánh sáng, vì nó luôn ở trong bạn.\nHướng dẫn thực hành:\n⏳Thực hành dài (10-15 phút):\nNhắm mắt lại, tưởng tượng tâm trí mình như một khoảng không rộng lớn bị bao phủ bởi mây đen.\nNhận ra rằng ánh sáng vẫn ở đó, chỉ là bị che khuất bởi những oán giận của bạn.\nTưởng tượng bạn vươn tay ra chạm vào những đám mây, nhẹ nhàng đẩy chúng sang một bên.\nCảm nhận mình đang được nâng lên, đi qua bóng tối để đến với ánh sáng.\nNhắc lại câu khẳng định:\n👉 \"\"Sự bất bình che khuất ánh sáng từ tôi. Nhưng hôm nay, tôi sẽ để ánh sáng ấy tỏa rạng.\"\nThực hành ngắn\n👉 Khi cảm thấy bực bội hay khó chịu, hãy nhắc nhở bản thân:\n\"Sự bất bình che khuất ánh sáng từ tôi. Nhưng hôm nay, tôi sẽ để ánh sáng ấy tỏa rạng.\"\nHãy tưởng tượng bản thân đang đẩy một đám mây đen ra xa, và để ánh sáng chiếu xuống.\nCảm nhận sự nhẹ nhàng, thanh thản mà điều đó mang lại."}, {"n": 70, "t": "Sự cứu rỗi đến từ chính tôi.", "s": "", "d": "“My salvation comes from me.”\nDiễn giải:\nTrong bối cảnh của A Course in Miracles, \"sự cứu rỗi\" (salvation) không chỉ đề cập đến sự giải thoát khỏi tội lỗi hay hậu quả tiêu cực, mà còn ám chỉ sự nhận thức lại chân thực về bản thân. Đó là quá trình giải phóng tâm trí khỏi những niềm tin sai lầm, những oán giận và những ảo tưởng mà chúng ta tự tạo ra, để khám phá ánh sáng và tình yêu vốn có bên trong.\n“Salvation” là một từ thường dùng trong Kinh Thánh, nó tương đương với từ “thoát khổ” trong Đạo Phật.\nCụ thể, sự cứu rỗi ở đây là việc nhận ra rằng nguồn gốc của bình an và hạnh phúc không nằm ở ngoại cảnh, mà xuất phát từ chính nội tâm của chúng ta. Khi hiểu rằng mọi cảm giác tội lỗi hay đau khổ đều do tâm trí tạo ra, chúng ta cũng nhận ra rằng chìa khóa để giải thoát khỏi những cảm xúc tiêu cực đó nằm trong chính chúng ta.\nĐiều này đồng nghĩa với việc chúng ta có khả năng tự chữa lành, tự tìm thấy bình an và hạnh phúc thực sự mà không phụ thuộc vào bất kỳ yếu tố bên ngoài nào.\n🍀 Như vậy, sự cứu rỗi trong ngữ cảnh này là sự thức tỉnh tâm linh, sự trở về nhận ra bản chất thật sự của mình và nhận ra mối liên kết sâu sắc với Nguồn, với tình yêu vô điều kiện.\n⏳Thực hành dài (10-15 phút):\nBắt đầu bằng cách lặp lại câu: \"Sự cứu rỗi đến từ chính tôi. Nó không thể đến từ bất kỳ nơi nào khác.\"\nNhắm mắt lại và suy ngẫm về những nơi bạn đã tìm kiếm sự cứu rỗi trong quá khứ: ở người khác, tài sản, tình huống hoặc các khái niệm về bản thân. Nhận ra rằng sự cứu rỗi không nằm ở đó. Tự nhủ: \"Sự cứu rỗi của tôi không thể đến từ bất kỳ điều nào trong số này. Sự cứu rỗi của tôi đến từ tôi, và chỉ từ tôi.\"\n- Phiên bản khác: “Bình an không thể đến từ bất cứ điều gì ngoài kia. Bình an đến từ chính tôi và chỉ tôi mà thôi.”\n- Hoặc: “Không gì ngoài kia giúp tôi thoát khổ. Chỉ tôi và chính tôi mới có thể giúp tôi thoát khổ.”\nTiếp tục bằng cách cố gắng vượt qua những \"đám mây\" của suy nghĩ tiêu cực hoặc phiền nhiễu để đạt đến \"ánh sáng\" bên trong bạn, nơi chứa đựng sự cứu rỗi và bình an.\nThực hành ngắn:\nTrong ngày, lặp lại câu chủ đề này thường xuyên nhất có thể. Cảm nhận sự nhẹ nhàng, thanh thản, bình an đầy tự tin vào chính mình.\nBài tập 61 đến Bài tập 70:\nBài 61: \"Tôi là ánh sáng của thế giới.\"\nBài 62: \"Bao dung là chức năng của tôi với tư cách là ánh sáng của thế giới.\"\nBài 63: \"Ánh sáng của thế giới mang lại bình an cho mọi tâm trí thông qua sự bao dung của tôi.\"\nBài 64: \"Đừng để tôi quên mất chức năng của mình.\"\nBài 65: \"Chức năng duy nhất của tôi được trao bởi Đấng sáng tạo.\"\nBài 66:  Hạnh phúc và chức năng của tôi là một.\nBài 67: Tình yêu tạo nên tôi, tôi là tình yêu.\nBài 68: Tình yêu không ôm lấy/giữ lại sự bất bình.\nBài 69: Sự bất bình che khuất ánh sáng từ tôi\nBài 70: Sự cứu rỗi đến từ chính tôi.\""}, {"n": 71, "t": "Chỉ kế hoạch cứu rỗi/thoát khổ của Thượng Đế mới hiệu quả.", "s": "", "d": "“Only God's plan for salvation will work.”\nDiễn giải:\nNhắc lại: Trong bối cảnh của \"A Course in Miracles\", \"sự cứu rỗi\" (salvation) không chỉ đề cập đến sự giải thoát khỏi tội lỗi hay hậu quả tiêu cực, mà còn ám chỉ sự nhận thức lại chân thực về bản thân. Đó là quá trình giải phóng tâm trí khỏi những niềm tin sai lầm, những oán giận và những ảo tưởng mà chúng ta tự tạo ra, để khám phá ánh sáng và tình yêu vốn có bên trong.\"\nBạn có nhận ra rằng chúng ta thường đổ lỗi cho hoàn cảnh hoặc người khác về sự bất hạnh của mình không?\n\"Nếu người đó đối xử tốt hơn, tôi đã không đau khổ.\"\n\"Nếu tôi có nhiều tiền hơn, tôi đã được an toàn.\"\n\"Nếu thế giới này công bằng hơn, tôi đã được hạnh phúc.\"\nNhững suy nghĩ này đến từ bản ngã. Nó làm chúng ta tin rằng sự cứu rỗi để đạt đến trạng thái hạnh phúc, bình an đến từ bên ngoài. Nó khiến chúng ta dồn năng lượng vào việc thay đổi thế giới bên ngoài thay vì thay đổi nhận thức bên trong. Nhưng thực tế, mọi thứ nằm trong tâm trí chúng ta—khi chúng ta thay đổi cách nhìn, chúng ta sẽ thay đổi chính trải nghiệm của mình.\nBài học này mời bạn từ bỏ niềm tin sai lầm rằng người khác hoặc hoàn cảnh phải thay đổi để bạn được bình an. Sự bình an thực sự nằm trong bạn, vì Thượng Đế đã đặt kế hoạch cứu rỗi ngay bên trong bạn.\nKhi bạn thực sự hiểu và chấp nhận điều này, bạn sẽ không còn phải lo lắng, oán trách hay cố gắng thay đổi người khác để cảm thấy tốt hơn. Sự giải thoát thực sự nằm ngay trong bạn.\nHướng dẫn thực hành\nBuổi sáng và buổi tối (10-15 phút mỗi lần)\nHãy nhắm mắt lại, suy ngẫm về ý tưởng:\n“Chỉ kế hoạch cứu rỗi của Thượng Đế mới hiệu quả.”\nỞ các bài tập trước, chúng ta đã được biết “Đấng sáng tạo luôn nói với tôi, Đấng sáng tạo luôn nâng đỡ tôi…” Vậy thì từ hôm nay chúng ta hãy thực hành đặt câu hỏi và lắng nghe, cảm nhận, hỏi Thượng Đế một cách chân thành:\nNgài muốn con làm gì trong tình huống này?\nNgài muốn con đi đâu?\nNgài muốn con nói gì, và với ai?\nHãy tĩnh lặng lắng nghe. Câu trả lời có thể đến ngay lập tức hoặc dần dần sau đó không quan trọng. Hãy khởi lên câu hỏi là đủ.\nThực hành ngắn trong ngày (6-7 lần mỗi giờ, hoặc bất cứ khi nào nhớ đến)\nKhi cảm thấy khó chịu, bất an, tức giận, hoặc giữ oán giận với ai đó, hãy nhắc nhở bản thân:\n“Giữ sự oán giận là đi ngược với kế hoạch cứu rỗi của Thượng Đế. Và chỉ kế hoạch của Ngài mới hiệu quả.”\nHHoặc đơn giản là lặp lại ý tưởng bài học:\n“Chỉ có kế hoạch của Thượng Đế mới hiệu quả”\nỨng dụng trong các tình huống cụ thể\nKhi bạn cảm thấy muốn trách móc hoặc đổ lỗi, hãy dừng lại và tự hỏi:\n“Mình đang đặt sự cứu rỗi vào đâu? Mình có đang nghĩ rằng nếu ai đó thay đổi, mình sẽ hạnh phúc hơn không?”\nNếu câu trả lời là có, hãy nhẹ nhàng điều chỉnh suy nghĩ:\n\"Sự cứu rỗi không đến từ bên ngoài. Nó nằm trong tâm trí mình, nơi Thượng Đế đã đặt nó.\"\nLưu ý: Sự cứu rỗi ở đây được hiểu là sự tự nhận thức đúng đắn và chân thực về bản thân mình. Là sự khám phá ra rằng mình là tình yêu, mình là ánh sáng. Không phải các nỗi sợ kia"}, {"n": 72, "t": "Bám chấp vào những bất bình là đi ngược lại kế hoạch của Đấng sáng tạo.", "s": "", "d": "“Holding grievances is an attack on God's plan for salvation.”\nDiễn giải: Hãy tưởng tượng một ngọn đèn bị bao phủ bởi một tấm màn dày. Ánh sáng vẫn ở đó, nhưng bạn không thể nhìn thấy nó vì tấm màn đã che mất. Những sự bất bình, oán giận bạn giữ lại chính là tấm màn đó. Khi bạn giữ bất bình, bạn không thể thấy ánh sáng của Thượng Đế trong người khác (và trong chính mình).\nHôm nay, chúng ta thực hành để vén màn che, để nhìn vượt qua những hành động của bề mặt và thấy được sự thật: rằng tất cả chúng ta đều là ánh sáng của Thượng Đế.\nHướng dẫn thực hành:\nTrong ngày, bạn có thể lặp lại nhiều lần câu chủ đề của bài tập hôm nay: “Bám chấp vào những bất bình là đi ngược lại kế hoạch của Đấng sáng tạo.”"}, {"n": 73, "t": "Không có ý chí nào ngoài Ý Chí của Thượng Đế.", "s": "", "d": "“There is no will but God’s..”\nDiễn giải: Ở đây có nhắc đến Ý Chí của Thượng Đế. Ý chí này ở đây không có nghĩa là một \"quyết định\" hay một \"mong muốn\" theo kiểu con người, mà là bản chất của chính thực tại, là sự thật không thể thay đổi.\nÝ Chí của Thượng Đế là sự mở rộng vô hạn của tình yêu, sự thống nhất và sự viên mãn. Nó không có sự chia rẽ, không có đau khổ, không có xung đột.\nNếu có gì đó không phải là tình yêu, bình an, niềm vui và sự trọn vẹn, thì đó không thể là Ý Chí của Thượng Đế. Nếu bạn đang cảm thấy đau khổ, đó không phải vì Thượng Đế muốn thế. Đó là vì bạn đang tin vào một điều không thật—tin vào bản ngã, tin vào sự chia rẽ, tin vào nỗi sợ hãi.\nÝ Chí của Thượng Đế không ép buộc bạn phải tin vào điều gì. Ngài cho bạn tự do hoàn toàn, nhưng sự tự do thực sự chứ không phải sự tự do của bản ngã.\nBạn không cần phải “tìm kiếm” Ý Chí của Thượng Đế ở đâu xa. Nó đã luôn ở trong bạn. Bạn chỉ cần buông bỏ những ảo tưởng về bản ngã để nhận ra điều đó.Ý Chí của Thượng Đế là cứu rỗi—trở về với sự thật. Từ \"cứu rỗi\" không có nghĩa là được \"cứu\" khỏi tội lỗi, mà là sự giải phóng khỏi những niềm tin sai lầm.\nHướng dẫn thực hành:\nHôm nay, hãy tự nhủ: “Không có ý chí nào ngoài ý chí của Thượng Đế/Đấng Sáng Tạo. Tôi nguyện hoà mình vào sự yêu thương/bình an/phúc lành/viên mãn/hợp nhất… nơi Đấng Sáng Tạo.”\nBất cứ tình huống nào thiếu yêu thương, bình an, phúc lành… hãy tự nhủ: “Đây không phải ý chí của Đấng Sáng Tạo.”\nNếu bạn có những suy nghĩ thiếu yêu thương, xung đột, giận dữ, sợ hãi… hãy biết là mình đang có những suy nghĩ và cảm xúc đó, nhưng một mặt khác, hãy tự nhủ: “Mình đang xung đột với ý chí của Đấng sáng tạo. Đây không phải là ý chí của Đấng sáng tạo.”"}, {"n": 74, "t": "Tôi để ánh sáng soi chiếu.", "s": "", "d": "“I will there be light.”\nDiễn giải: Ý tưởng của bài tập hôm nay là hãy để ý chí của bạn đồng nhất với ý chí của Đấng sáng tạo.\nBạn có ánh sáng và hãy để ánh sáng đó xua tan bóng tối, để ánh sáng đó xua tan những gì không phải là tình yêu và sự bình an trên thế giới này (thế giới được phóng chiếu từ bạn).\nĐừng ở đó đau khổ vì bóng tối, ước gì bóng tối thay đổi, ước gì bóng tối biến đi… đơn giản là hãy thắp lên ánh sáng trong chính bạn, khi đó bóng tối tự khắc không còn nữa. Ngay lúc bạn ra quyết định dùng ánh sáng của mình để soi chiếu lên thế giới, ý chí của bạn hợp nhất với ý chí của Đấng sáng tạo - bạn chính là đứa con của Đấng sáng tạo.\nHướng dẫn thực hành:\nHôm nay, nhiều nhất có thể trong ngày, hình dung luôn có ánh sáng từ bạn đang toả ra bên ngoài, tự nhủ: “Tôi để ánh sáng soi chiếu. Ý chí của tôi đồng nhất với ý chí của Đấng sáng tạo.”\nVới bất cứ tình huống nào không phải là tình yêu, không phải là sự bình an… (đó cũng chính là phản chiếu từ tâm trí bạn), hãy tự nhủ “Tôi để ánh sáng soi chiếu. Bóng tối không phải ý chí của tôi.”\nThả lỏng và quan sát, bởi với thực hành này, bạn sẽ thấy mình dễ dàng buông xuống những bất bình, khó chịu, hoang mang… và trở lại với sự bình an rất nhanh chóng."}, {"n": 75, "t": "Ánh sáng đã đến.", "s": "", "d": "“The light has come.”\nHôm nay là ngày để ăn mừng!\n1️⃣ Ánh sáng đã đến. Ta đã được chữa lành và ta có thể chữa lành. Ánh sáng đã đến. Ta đã được cứu rỗi và ta có thể cứu rỗi. Ta đang trong bình an, và ta mang bình an đến bất cứ nơi đâu ta đến. Bóng tối, hỗn loạn và sự ngăn cách đã biến mất. Ánh sáng đã đến.\n2️⃣ Hôm nay, chúng ta ăn mừng kết thúc hạnh phúc của giấc mơ đầy khổ đau mà ta đã đeo mang quá lâu. Không còn những giấc mơ đen tối nữa. Ánh sáng đã đến. Hôm nay, thời đại của ánh sáng bắt đầu với ta và tất cả mọi người. Một thế giới mới được sinh ra. Thế giới cũ đã qua đi mà không để lại dấu vết nào. Hôm nay, chúng ta thấy một thế giới khác, bởi vì ánh sáng đã đến.\n3️⃣ Các bài thực hành hôm nay sẽ là những bài tập vui vẻ, trong đó chúng ta biết ơn cho sự ra đi của thế giới cũ và sự khởi đầu của thế giới mới. Không còn bóng tối từ quá khứ để che mờ tầm nhìn của chúng ta và che giấu thế giới mà lòng bao dung đã ban tặng. Hôm nay, chúng ta chấp nhận thế giới mới như những gì chúng ta muốn thấy. Và chúng ta sẽ nhận được điều mà chúng ta mong muốn. Chúng ta muốn nhìn thấy ánh sáng, và ánh sáng đã đến.\n4️⃣ Những giai đoạn thực hành dài hôm nay sẽ dành để nhìn vào thế giới qua lăng kính của lòng bao dung. Đây là thế giới mà chúng ta muốn thấy, và chỉ có thế giới này thôi. Khi chúng ta có một mục tiêu duy nhất, kết quả là không thể tránh khỏi. Hôm nay, thế giới thực tại xuất hiện trước chúng ta trong sự vui sướng, hạnh phúc, dư dả, đủ đầy cuối cùng để được nhìn thấy. Nhận thức thật sự đã được trao cho chúng ta, vì ánh sáng đã đến.\n5️⃣ Hôm nay, chúng ta không nhìn thấy bóng tối của bản ngã phủ lên thế giới. Chúng ta nhìn thấy ánh sáng, và trong ánh sáng đó, chúng ta thấy phản chiếu của Hạnh Phúc Viên Mãn phủ lên thế gian này. Hãy bắt đầu các bài thực hành bằng cách nhắc nhở bản thân về tin vui rằng bạn đã được giải thoát: Ánh sáng đã đến. Tôi đã bao dung thế giới.\n6️⃣ Đừng bận tâm đến quá khứ hôm nay. Hãy giữ cho tâm trí hoàn toàn cởi mở, được gột rửa khỏi những suy nghĩ cũ kỹ và sạch sẽ khỏi mọi quan niệm mà ta đã tạo ra. Hôm nay, ta đã bao dung thế giới. Ta có thể nhìn nó như thể bạn chưa từng thấy nó trước đây. Ta chưa biết nó thực sự trông như thế nào. Hãy kiên nhẫn chờ đợi để nó tự bộc lộ với ta. Trong khi chờ đợi, hãy lặp lại nhiều lần với sự kiên nhẫn trọn vẹn: Ánh sáng đã đến. Tôi đã bao dung thế giới.\n7️⃣ Hãy nhận ra rằng lòng bao dung của ta mở đường cho sự nhận thức chân thật. Hãy hiểu rằng Thánh Linh không bao giờ thất bại trong việc trao tặng nhận thức thật sự cho những người bao dung. Hãy tin rằng hôm nay, Thượng Đế sẽ không khiến ta thất vọng. Ta đã bao dung thế giới. Thượng Đế sẽ ở bên bạn khi ta quan sát và chờ đợi. Ngài sẽ cho ta thấy thế giới mà nhận thức thật sự có thể thấy. Đó là Ý Chí của Ngài, và ta đã hòa hợp với Ngài. Hãy kiên nhẫn chờ đợi Ngài. Ngài sẽ ở đó. Ánh sáng đã đến. Bạn đã bao dung thế giới.\n8️⃣ Hãy nói với Thượng Đế rằng bạn biết mình không thể thất bại bởi vì bạn đặt niềm tin vào Ngài. Hãy nói với bản thân rằng bạn đang chờ đợi với sự chắc chắn để nhìn thấy thế giới mà Ngài đã hứa. Từ nay trở đi, ta sẽ nhìn thế giới theo cách khác. Hôm nay, ánh sáng đã đến. Và bạn sẽ nhìn thấy thế giới đã được hứa hẹn với bạn từ thuở ban đầu—một thế giới nơi thời gian chấm dứt.\n9️⃣ Nếu có ai đó làm bạn muốn quay lại “bóng tối”, hãy nói với họ: Ánh sáng đã đến. Tôi đã bao dung bạn.\n🔟Chúng ta dành ngày hôm nay để sống trong sự thanh thản mà Đấng Sáng Tạo muốn ta có. Hãy giữ điều đó trong nhận thức của ta và thấy điều đó ở khắp nơi trong ngày hôm nay, khi chúng ta ăn mừng sự khởi đầu của nhận thức thật sự và nhìn thấy thế giới thật sự, thứ đã đến để thay thế thế giới chưa được bao dung mà bạn từng nghĩ là thực.\nNhiệm vụ của chúng ta hôm nay là vui vẻ. Biết ơn vì những điều cũ đã qua và hân hoan với những điều tốt đẹp đang đến. Ngày hôm nay, ta và cuộc đời quyết định sẽ tha thứ cho nhau.\nBây giờ, ta có thể nhìn cuộc đời như chưa bao giờ được thấy trước đây. Ta bắt đầu thấy ngày càng nhiều hơn những phản chiếu của phần thánh linh trong bạn ra thế giới bên ngoài. Dù có thể ta chưa biết nó sẽ thế nào, nhưng chắc chắn rồi nó sẽ hiển lộ.\nNhiệm vụ hôm nay của ta đơn giản là an trú ở thời khắc hiện tại, hạnh phúc ở thời khắc hiện tại.\nHãy tự nhủ: “Ánh sáng đã đến. Tôi và cuộc đời đã tha thứ cho nhau.”\n\"Ánh sáng đã đến. Tôi bao dung thế giới.\"\nNếu muốn bạn có thể làm một điều gì đó thật đặc biệt, thật khác những ngày thường để ĂN MỪNG niềm vui lớn này nhé.\nÁnh sáng đã đến. Từ nay tôi và cuộc đời bao dung cho nhau 🌈🌈💫💫🌟✨✨✨🌥️⛅️🌤️☀️\nHôm nay hãy để câu chủ đề vang vang bên trong:\nÁnh Sáng Đã Đến. Ánh Sáng Đã Đến.\nYeppp. Tôi mở toang cho ánh sáng soi rọi mọi góc \"chưa sáng\", mọi ảo tưởng sẽ không còn.\nBản chất bình an - yêu thương - bao dung - dư dả của tất cả mọi người được soi rọi.\nChẳng có gì đáng sợ cả, chẳng có gì thiếu thốn cả. Tôi hân hoan, tôi đầy hứng khởi như dòng suối hồn nhiên chảy róc rách reo vui mọi ngày."}, {"n": 76, "t": "Tôi không bị ràng buộc bởi bất kỳ luật lệ nào ngoài luật của Đấng Sáng Tạo", "s": "", "d": "“I am under no laws but God's.”\nLuật của Đấng Sáng Tạo là gì?\nLuật của Đấng Sáng Tạo không giống với những quy tắc nhân tạo mà con người đặt ra trong thế giới này. Đó không phải là những luật lệ mang tính ép buộc, ràng buộc, hay trừng phạt, mà là những nguyên tắc bất biến của Tình Yêu, Sự Thật, và Bình An.\nKhi sống với luật của ĐST bạn sẽ nhận ra: Tôi vốn dĩ đã tốt đẹp rồi, tôi vốn dĩ đã đủ dầy dư dả mọi sự rồi, tôi vốn dĩ đang rất an toàn rồi. Mọi sự đến với tôi với bất kỳ hình thái nào dù là như ý hay bất như ý thì vốn dĩ cũng đang là một sự HỖ TRỢ cho hành trình của tôi mà thôi. Mọi thứ đều là cơ hội, đều là sự hỗ trợ, nâng đỡ tôi mà thôi.\nSỐNG THEO LUẬT CỦA ĐST GIÚP BẠN…\nAn toàn tuyệt đối: Không có gì có thể làm tổn thương bạn về bản chất, vì bạn không phải là một cơ thể dễ bị hủy hoại, mà là một linh hồn vĩnh cửu được tạo ra từ tình yêu.\nĐủ đầy và không lo lắng: Biết rằng bạn đã luôn đủ đầy, sự đủ đầy không đến từ nỗ lực cá nhân mà đến từ bản chất thiêng liêng của bạn.\nYêu thương và bao dung: Bạn nhận ra rằng bạn và tất cả mọi người đều là Một. Không có sự chia rẽ thực sự, không có ai là “kẻ thù” cả. Và ẩn sau mỗi hành vi đều là tình thương.  Kể cả là hành vi có vẻ tấn công bạn thì thực chất là vì họ đang bảo vệ chính họ hoặc bảo vệ 1 ai đó khỏi tổn thương mà thôi. Mẹ Cám hại Tấm cũng vì tình thương sai lệch của người mẹ.\nTự do thật sự: Bạn vốn đã hoàn hảo, không có gì cần chứng minh. Không còn sợ phán xét hay thất bại. Hãy tự do trải nghiệm trò chơi cuộc đời.\nHạnh phúc vô điều kiện: Bạn có quyền chọn hạnh phúc mà không phụ thuộc vào hoàn cảnh bên ngoài. Trước đây bạn cần có thành công trong sự nghiệp mới cảm thấy tự hào, nhưng giờ bạn cảm thấy vui vẻ và mãn nguyện ngay trong hiện tại, dù chưa đạt được những thứ trước đây bạn TƯỞNG là cần thiết.\nBạn không cần phải \"cố gắng\" đạt được những điều này: chúng đã luôn ở trong bạn! Khi bạn buông bỏ luật lệ của thế gian và chấp nhận Luật của Đấng Sáng Tạo, bạn sẽ nhớ lại con người thật của mình.\nĐây là một số \"luật\" tự tạo mà nhiều người vô thức tin vào và vận vào bản thân, dù chúng thực sự chỉ là niềm tin giới hạn chứ không phải sự thật tuyệt đối:\n🌿 \"LUẬT\" VỀ TIỀN BẠC\nMuốn giàu phải cực khổ. (Nếu không vất vả, lao lực thì không xứng đáng có nhiều tiền.)\nNhiều tiền mất công giữ. (Nếu có nhiều tiền thì giữ tiền cũng mệt lắm.)\nTiền bạc dễ đến cũng dễ đi. (Nếu kiếm tiền quá nhanh, chắc chắn sẽ mất đi nhanh chóng.)\nMình không giỏi giữ tiền. (Thôi thôi thôi, ai đó quản lý tiền giúp tôi đi. Tôi không biết giữ tiền. Giữ tiền thì nhiều trách nhiệm lắm. Mệt lắm.)\nCó tiền là mất tình cảm. (Người giàu thường cô đơn, hoặc bị ghen ghét, lợi dụng.)\nMình sinh ra đã không có số giàu. (Mình không có duyên với tiền bạc, có cố cũng khó.)\nMuốn giàu thì phải làm việc thật nhiều. (Nghỉ ngơi là lười biếng, không kiếm được tiền.)\nTiền không mua được hạnh phúc. (Có nhiều tiền chưa chắc vui, nên không cần giàu.)\nNgười giàu thường xấu tính, mua gian bán lận, keo kiệt…. (Giàu thường đi kèm với thủ đoạn, không chính đáng.)\nĐây là một số \"luật\" tự tạo mà nhiều người vô thức tin vào và vận vào bản thân, dù chúng thực sự chỉ là niềm tin giới hạn chứ không phải sự thật tuyệt đối:\n💖 \"LUẬT\" VỀ TÌNH YÊU VÀ MỐI QUAN HỆ\nYêu vào là khổ vì tình. (Càng yêu nhiều càng đau khổ, tình yêu luôn đi kèm đau đớn.)\nPhụ nữ đẹp thì sẽ bị phản bội. (Đẹp quá thì bị nhiều người dòm ngó, dễ bị lừa dối.)\nMình không đủ tốt để có một tình yêu hạnh phúc.\nTình yêu đích thực chỉ có trong phim. (Ngoài đời ai cũng thực dụng, không có chuyện yêu vô điều kiện.)\nHôn nhân là nấm mồ của tình yêu. (Cưới nhau xong thì tình cảm sẽ nhạt dần.)\nMình có tướng số lận đận đường tình. (Tử vi, nhân tướng học nói thế nên không thể thay đổi.)\nKhông ai thực sự yêu mình cả. (Mọi người chỉ đến với mình vì lợi ích nào đó.)\nĐàn ông ai rồi cũng ngoại tình. (Sớm muộn gì cũng phản bội, chỉ là chưa có cơ hội thôi.)\nMình không xứng đáng được yêu….\nĐây là một số \"luật\" tự tạo mà nhiều người vô thức tin vào và vận vào bản thân, dù chúng thực sự chỉ là niềm tin giới hạn chứ không phải sự thật tuyệt đối:\n🧠 \"LUẬT\" VỀ BẢN THÂN VÀ NĂNG LỰC\nMình sinh ra đã không thông minh. (Người ta có năng khiếu bẩm sinh, mình thì không.)\nMình là kiểu người dễ thất bại. (Không làm được chuyện lớn, cứ thử là hỏng.)\nMình hay trì hoãn, đó là bản chất rồi. (Không thể thay đổi, chỉ biết chấp nhận.)\nMình không giỏi ăn nói. (Giao tiếp kém là tính cách cố định, không học được.)\nMình không có sự kiên trì. (Cứ bắt đầu rồi lại bỏ giữa chừng, mình là vậy rồi.)\nMình sinh ra đã không có may mắn.\nMình không có duyên với cơ hội tốt. (Cơ hội chỉ đến với người khác, không đến với mình.)\n...\nĐây là một số \"luật\" tự tạo mà nhiều người vô thức tin vào và vận vào bản thân, dù chúng thực sự chỉ là niềm tin giới hạn chứ không phải sự thật tuyệt đối:\n🏥 \"LUẬT\" VỀ SỨC KHỎE VÀ CƠ THỂ\nMình là kiểu người dễ bị bệnh. (Dễ cảm, dễ đau lưng, dễ nhức đầu… từ nhỏ đã vậy.)\nCơ thể mình yếu sẵn rồi, không cải thiện được.\nTuổi càng cao thì sức khỏe càng kém. (Không thể trẻ khỏe khi có tuổi.)\nGiảm cân rất khó, đặc biệt là với mình.\nMình có tạng người dễ béo, ăn ít cũng mập.\nMình có tạng người gầy. Ăn thế nào cũng gầy không lên cân được.\nGia đình mình có gen bệnh, chắc mình cũng sẽ bị. (Ba mẹ bị tiểu đường/huyết áp thì mình cũng bị.)\nTrời lạnh là dễ bị cảm.\nMình dễ dị ứng với nhiều thứ.\nMỗi lần thức khuya là hôm sau sẽ mệt lả.\n...\nĐây là một số \"luật\" tự tạo mà nhiều người vô thức tin vào và vận vào bản thân, dù chúng thực sự chỉ là niềm tin giới hạn chứ không phải sự thật tuyệt đối:\n💼 \"LUẬT\" VỀ CÔNG VIỆC VÀ SỰ NGHIỆP\nMình không có duyên với thành công.\nMình không có duyên bán hàng\nMuốn thành công phải đánh đổi sức khỏe. (Người giàu toàn bị stress, sống không vui.)\nLàm nghệ thuật thì nghèo, làm kinh doanh thì vất vả.\nMình không giỏi kinh doanh, sinh ra không có máu làm ăn.\nChỉ có bằng cấp cao mới có sự nghiệp tốt.\nMình không thể lãnh đạo ai, chỉ hợp làm nhân viên.\nThị trường bây giờ cạnh tranh khốc liệt, mình không thể trụ nổi.\nNgười ta có xuất phát điểm tốt hơn, mình sao so được.\n...\nĐây là một số \"luật\" tự tạo mà nhiều người vô thức tin vào và vận vào bản thân, dù chúng thực sự chỉ là niềm tin giới hạn chứ không phải sự thật tuyệt đối:\n🔮 \"LUẬT\" VỀ SỐ PHẬN\nSố mình lận đận từ nhỏ.\nMình không có duyên với sự giàu có. Số nghèo đành chịu\nAi sinh ra cũng có số, không thể thay đổi.\nKiếp trước mình mắc nợ nên kiếp này phải trả nghiệp.\nCó những người sinh ra đã may mắn, có những người thì không.\nSố mình vất vả, không thể giàu lên dễ dàng được.\nMình bị sao xấu chiếu mệnh nên hay gặp xui xẻo.\nTử vi mình không tốt...\nBẠN TIN GÌ THÌ BẠN SẼ CÓ ĐÓ. Đây vừa là tin xấu vừa là tin tốt. Tin xấu là: Bạn đang chính là \"thủ phạm\" tạo nên kết quả cuộc sống CHƯA như ý của bạn hôm nay.\nVà tin tốt là BẠN HOÀN TOÀN CÓ QUYỀN NĂNG THAY ĐỔI NÓ.\nChỉ bằng cách chuyển đổi từ niềm tin chưa đem lại kết quả như bạn muốn thành niềm tin khác giúp bạn đạt kết qủa mới.\nVà bài tập hôm nay là một trong số những cách đó.\nHướng dẫn thực hành:\nBài tập hôm nay (và sẽ không chỉ làm trong hôm nay): hãy ngẫm nghĩ lại những “luật” mà bạn đã thường tự đặt cho bản thân mình, tin rằng mình bị chi phối bởi luật đó.\nLiệt kê ra (trên giấy hoặc máy tính/điện thoại…).\nXoá từng luật đó đi bằng câu: Tôi không bị ràng buộc bởi bất kỳ luật lệ nào ngoài luật của Đấng Sáng Tạo\n“I am under no laws but God's.”\nThực hành cho đến khi bạn xoá được tất cả những Luật gây bất lợi cho bản thân."}, {"n": 77, "t": "Tôi vốn dĩ luôn xứng đáng nhận phép màu.", "s": "", "d": "Bạn cũng có thể nói: “Được trao điều kỳ diệu là quyền lợi hiển nhiên của tôi.”\n“I am entitled to miracles.”\nDiễn giải:\nBạn xứng đáng nhận phép màu đơn giản vì bạn là ai. Bạn sẽ nhận được phép màu vì Đấng Sáng Tạo là ai. Bạn sẽ mang phép màu đến cho người khác vì bạn hợp nhất với Ngài. Một lần nữa, sự cứu rỗi thật đơn giản! Nó chỉ là sự công nhận về bản chất thật sự của bạn.\nBạn không cần bất kỳ nghi thức hay phép thuật nào để xứng đáng với phép màu. Bạn không cần phải làm điều gì đặc biệt để xứng đáng với nó, bởi vì phép màu vốn đã thuộc về bạn ngay từ khi bạn được tạo ra. Nó không dựa trên năng lực hay thành tích, mà nằm trong bản chất thật sự của bạn – một phần của Đấng Sáng Tạo.\nHôm nay, chúng ta khẳng định quyền sở hữu phép màu của mình. Bạn không cần xin xỏ hay chứng minh điều gì để xứng đáng. Bạn chỉ đơn giản là chấp nhận nó. Thế giới của bạn sẽ được giải thoát, vì Vương Quốc của Đấng Sáng Tạo đã luôn nằm trong bạn và không bao giờ có thể mất đi.\n💫 Phép màu ở đây không phải là những điều phi thường, siêu nhiên, mà chính là sự thay đổi trong nhận thức. Nó là khả năng nhìn thấy sự thật, khả năng buông bỏ những giới hạn cũ và cảm nhận ánh sáng, bình an và tình yêu thay vì sợ hãi, phán xét hay thiếu thốn.\nHãy nhớ: Bất kỳ ai cũng có khả năng này, họ sẽ tự nhiên chạm đến khi họ thực sự sẵn sàng đón nhận nó.\nHướng dẫn thực hành:\nHôm nay, hãy tĩnh lặng 5-15 phút để khẳng định quyền lợi của bạn là được trao những điều kỳ diệu trong cuộc sống. Hãy nhắc nhở bản thân với sự tự tin:\n\"Tôi vốn dĩ luôn xứng đáng nhận phép màu.\"\nNhắm mắt lại và nhớ rằng bạn đang yêu cầu điều hoàn toàn thuộc về bạn.\nPhép màu không bị lấy đi từ ai để trao cho bạn, mà thuộc về tất cả mọi người.\nPhép màu không tuân theo luật thế gian, nó chỉ tuân theo luật của Đấng Sáng Tạo.\nĐừng lo vũ trụ có đáp ứng hay không, vũ trụ đã đáp ứng rồi, chỉ là bạn có mở lòng mà nhận thấy và nhận lấy hay không thôi.  Trong Kinh Thánh có ý rằng: \"Ngay khi con chưa xin, Ta đã ban cho rồi.\"\nĐấng Sáng Tạo đã biết rõ mọi nhu cầu sâu thẳm phù hợp nhất với hành trình của bạn. Việc xác lập mong muốn một cách rõ ràng không phải để báo cho Ngài biết, mà là một cách để bạn kết nối với Ngài và xác nhận rằng bạn đã mở lòng đón nhận những gì đã có sẵn dành riêng phù hợp và thuận lợi nhất cho bạn.\nTrong ngày, hãy lặp lại câu chủ để càng nhiều càng tốt và quan sát nữa nhé, những điều kỳ diệu sẽ đến nhanh hơn bạn nghĩ."}, {"n": 78, "t": "Hãy để phép màu thay thế mọi bất bình.", "s": "", "d": "“Let miracles replace all grievances.”\nDiễn giải:\nNhớ lại bài cũ: Phép màu ở đây không phải là những điều phi thường, siêu nhiên, mà chính là sự thay đổi trong nhận thức. Nó là khả năng nhìn thấy sự thật, khả năng buông bỏ những giới hạn cũ và cảm nhận ánh sáng, bình an và tình yêu thay vì sợ hãi, phán xét hay thiếu thốn.\nHãy nhớ: Bất kỳ ai cũng có khả năng này, họ sẽ tự nhiên chạm đến khi họ thực sự sẵn sàng đón nhận nó.\nCó thể bạn chưa hoàn toàn nhận ra rằng mỗi quyết định bạn đưa ra thực chất là chọn giữa giữ lấy sự bất bình và cho phép phép màu diễn ra.\nMỗi sự bất bình giống như một tấm khiên đen tối che giấu phép màu mà nó đang che đậy.\nKhi bạn giơ tấm khiên đó lên trước mắt, bạn sẽ không thể nhìn thấy phép màu đằng sau nó. Thế nhưng, phép màu vẫn ở đó, tỏa sáng rực rỡ, nhưng bạn chỉ chăm chú vào sự bất bình của mình.\nBạn có hai lựa chọn: sự bất bình hoặc phép màu.\nKhi giữ sự bất bình, bạn chỉ thấy lỗi lầm của người khác.\nKhi buông bỏ, bạn sẽ thấy phép màu của tình yêu trong họ.\nSự bất bình là rào chắn che đi phép màu.\nKhi bạn trách móc ai đó, bạn chỉ nhìn thấy bóng tối thay vì ánh sáng của Đấng Sáng Tạo trong họ.\nNhưng khi bạn buông bỏ sự bất bình, bạn có thể nhìn thấy sự thật: người ấy không phải kẻ thù của bạn mà là một phần của ánh sáng thiêng liêng.\nBạn có thể thực hành với bất kỳ ai\nHãy chọn một người mà bạn đang có mâu thuẫn.\nHãy nghĩ về mọi điều bạn trách móc họ.\nSau đó, hãy buông bỏ những suy nghĩ đó và yêu cầu thấy ánh sáng trong họ thay vì những lỗi lầm.\nKhi bạn tha thứ, bạn cũng được giải phóng.\nKhi bạn nhìn thấy ánh sáng trong họ, bạn đang nhìn thấy ánh sáng trong chính mình.\nHướng dẫn thực hành:\nBước 1: Hãy chọn một người mà bạn đã từng trách móc hoặc mang lòng khó chịu.\nĐó có thể là một người bạn sợ hãi hoặc thậm chí ghét bỏ;\nhoặc một người mà bạn nghĩ rằng mình yêu thương nhưng lại thường xuyên làm bạn tức giận;\nhoặc một người bạn coi là bạn bè nhưng lại cảm thấy khó chịu khi tiếp xúc: một người bạn cho là hay đòi hỏi, khó chịu hoặc không đáng tin cậy;\nhoặc thậm chí là một người nào đó không quá quan trọng nhưng vẫn gợi lên khó chịu trong bạn.\nBước 2: “Nguyện cho tôi nhìn thấy ánh sáng từ người này.”\nKhông cần phải liệt kê điểm tốt, điểm xấu, hay phải cố gắng, gồng mình nhận ra điểm tốt ở người đó. Điều bạn cần làm chỉ là tâm niệm “tôi muốn nhìn thấy ánh sáng ở người này” và cảm nhận. Nếu sự bất bình có xuất hiện, biết thế, nhẹ nhàng buông xuống. Quan sát và trải nghiệm tiếp.\nTrong ngày, bạn cũng có thể tâm nguyện nhiều lần rằng: Nguyện cho những phép màu thay thế mọi bất bình trong tôi."}, {"n": 79, "t": "Nguyện cho tôi nhận ra bản chất vấn đề, để nó được tháo gỡ.", "s": "", "d": "“Let me recognize the problem so it can be solved.”\nDiễn giải:\nChúng ta thường nghĩ về cuộc đời mình là một chuỗi các vấn đề cần giải quyết. Vấn đề tình cảm, vấn đề sự nghiệp, vấn đề tiền bạc, vấn đề sức khoẻ, vấn đề phát triển bản thân… Và thế là chúng ta cứ hết giải quyết vấn đề này rồi lại đến vấn đề khác, không thể ngừng lại.\nTheo ACIM thì chỉ có 1 vấn đề thôi, đó là vấn đề “tách rời”. Khi bạn tách rời khỏi Nhất thể (Oneness), khi bạn mất kết nối với Nguồn, thì mọi vấn đề khác phát sinh.\nTrở về với Nhất thể, trở về kết nối với Nguồn, với The Self, với tình yêu thương, lòng bao dung và thế là chẳng còn vấn đề gì nữa. Chỉ còn lại sự hạnh phúc, sáng tạo, bình an, phúc lành TỰ NHIÊN ĐẾN.\nTHỰC HÀNH:\nBài tập hôm nay, bạn hãy dành thời gian 5-15 phút để khởi lên nguyện ước: “Nguyện cho tôi nhận ra bản chất vấn đề, để nó được tháo gỡ.”\nTrong ngày, lặp lại nhiều lần và quan sát trong các tình huống thực tế của bạn."}, {"n": 80, "t": "Nguyện cho tôi nhận ra rằng mọi vấn đề của mình đều được đã tháo gỡ.", "s": "", "d": "“Let me recognize my problems have been solved.”\nDiễn giải:\nTrong cuộc sống, ta thường nghĩ mình có hàng chục, thậm chí hàng trăm vấn đề: tài chính, sức khỏe, mối quan hệ, công việc, tương lai...\nNhưng như bài hôm trước đã nói: thật ra, chỉ có một vấn đề duy nhất:\nTa tin rằng mình tách rời khỏi Tình Yêu, khỏi Thượng Đế, khỏi Nguồn cội.\nMọi hình thức của vấn đề đều chỉ là những cái bóng của niềm tin sai lệch này.\nVà tin tốt là: vấn đề đó đã được giải! Không phải bằng sức con người, mà bằng sự hiện diện liên tục của Tình Yêu và sự hợp nhất.\nKhi ta nhận ra điều này, những “vấn đề nhỏ” kia sẽ rơi rụng dần như những ảo ảnh.\nMình thường nói: Vũ Trụ cho bài toán, chắc chắn Vũ Trụ sẽ cho lời giải đúng lúc.\nBạn chỉ cần chánh niệm trong hiện tại, vấn đề đã qua, vấn đề chưa tới, tự dưng đều sẽ có cách giải mà thậm chí bạn chẳng cần nhúng tay vào.\nHướng dẫn thực hành:\nHôm nay, hãy khởi lên nguyện ước và lặp lại thường xuyên: “Nguyện cho tôi nhận ra rằng mọi vấn đề của mình đều đã được tháo gỡ.”"}, {"n": 81, "t": "Ôn tập bài 61-62", "s": "", "d": "Bài 61: \"Tôi là ánh sáng của thế giới.\"\nBài 62: \"Bao dung là chức năng của tôi với tư cách là ánh sáng của thế giới.\"\nCách thức thực hành: Bạn có thể chép lại câu chủ đề 3-5 lần. Hoặc tốt hơn nữa thì đọc thuộc và nhẩm lại bất kỳ khi nào có thể.\nKhuyến khích các bạn lội lại bài cũ đọc và nghiền ngẫm lại toàn bộ nội dung các bài tập xuyên suốt nha. Khuyến khích gõ và gửi các câu chủ đề vào lớp để cùng thực hành."}, {"n": 82, "t": "Ôn tập bài 63-64", "s": "", "d": "Bài 63: \"Ánh sáng của thế giới mang lại bình an cho mọi tâm trí thông qua sự bao dung của tôi.\"\nBài 64: \"Đừng để tôi quên mất chức năng của mình.\"\nCách thức thực hành: Bạn có thể chép lại câu chủ đề 3-5 lần. Hoặc tốt hơn nữa thì đọc thuộc và nhẩm lại bất kỳ khi nào có thể.\nKhuyến khích các bạn lội lại bài cũ đọc và nghiền ngẫm lại toàn bộ nội dung các bài tập xuyên suốt nha. Khuyến khích gõ và gửi các câu chủ đề vào lớp để cùng thực hành."}, {"n": 83, "t": "Ôn tập bài 65-66", "s": "", "d": "Bài 65: \"Chức năng duy nhất của tôi được trao bởi Đấng sáng tạo.\"\nBài 66: \"Hạnh phúc và chức năng của tôi là một.\"\nCách thức thực hành: Bạn có thể chép lại câu chủ đề 3-5 lần. Hoặc tốt hơn nữa thì đọc thuộc và nhẩm lại bất kỳ khi nào có thể.\nKhuyến khích các bạn lội lại bài cũ đọc và nghiền ngẫm lại toàn bộ nội dung các bài tập xuyên suốt nha. Khuyến khích gõ và gửi các câu chủ đề vào lớp để cùng thực hành."}, {"n": 84, "t": "Ôn tập bài 67-68", "s": "", "d": "Bài 67: Tình yêu tạo nên tôi, tôi là tình yêu.\nBài 68: Tình yêu không ôm lấy/giữ lại sự bất bình.\nCách thức thực hành: Bạn có thể chép lại câu chủ đề 3-5 lần. Hoặc tốt hơn nữa thì đọc thuộc và nhẩm lại bất kỳ khi nào có thể.\nKhuyến khích các bạn lội lại bài cũ đọc và nghiền ngẫm lại toàn bộ nội dung các bài tập xuyên suốt nha. Khuyến khích gõ và gửi các câu chủ đề vào lớp để cùng thực hành."}, {"n": 85, "t": "Ôn tập bài 69-70", "s": "", "d": "• Bài 69: Sự bất bình che khuất ánh sáng từ tôi\n • Bài 70: Sự cứu rỗi đến từ chính tôi.\"\nCách thức thực hành: Bạn có thể chép lại câu chủ đề 3-5 lần. Hoặc tốt hơn nữa thì đọc thuộc và nhẩm lại bất kỳ khi nào có thể.\nKhuyến khích các bạn lội lại bài cũ đọc và nghiền ngẫm lại toàn bộ nội dung các bài tập xuyên suốt nha. Khuyến khích gõ và gửi các câu chủ đề vào lớp để cùng thực hành."}, {"n": 86, "t": "Ôn tập bài 71-72", "s": "", "d": "Bài tập 71: Câu chủ đề: Chỉ kế hoạch cứu rỗi/thoát khổ của Thượng Đế mới hiệu quả.\n“Only God's plan for salvation will work.”\nBài tập 72: Câu chủ đề: Bám chấp vào sự bất bình là đi ngược với kế hoạch của Đấng Sáng Tạo.\n“Holding grievances is an attack on God's plan for salvation.”"}, {"n": 87, "t": "Ôn tập bài 73-74", "s": "", "d": "Bài tập 73: Câu chủ đề: Tôi để ánh sáng soi chiếu.\n“I will there be light.”\nBài tập 74: Câu chủ đề: Không có ý chí nào ngoài Ý Chí của Thượng Đế.\n“There is no will but God’s..”"}, {"n": 88, "t": "Ôn tập bài 75-76", "s": "", "d": "Bài tập 75: Câu chủ đề: Ánh sáng đã đến.\n“The light has come.”\nBài tập 76: Câu chủ đề: Tôi không bị ràng buộc bởi bất kỳ luật lệ nào ngoài luật của Đấng Sáng Tạo\n“I am under no laws but God's.”"}, {"n": 89, "t": "Ôn tập bài 77-78", "s": "", "d": "Bài tập 77: Câu chủ đề: “Được trao điều kỳ diệu là quyền lợi hiển nhiên của tôi.” Bạn cũng có thể nói: “Tôi vốn dĩ luôn xứng đáng nhận phép màu.”\n“I am entitled to miracles.”\nBài tập 78: Câu chủ đề: Hãy để phép màu thay thế mọi bất bình.\n“Let miracles replace all grievances.”"}, {"n": 90, "t": "Ôn tập bài 79-80", "s": "", "d": "Bài tập 79: Câu chủ đề: Nguyện cho tôi nhận ra bản chất vấn đề, để nó được tháo gỡ.\n“Let me recognize the problem so it can be solved.”\nBài tập 80: Câu chủ đề: Nguyện cho tôi nhận ra rằng mọi vấn đề của mình đều được tháo gỡ.\n“Let me recognize my problems have been solved.”"}, {"n": 91, "t": "Những điều kỳ diệu sẽ được nhìn thấy khi có ánh sáng.", "s": "", "d": "“Miracles are seen in light.”\nDiễn giải: Chào mừng các bạn đến với chặng mới. Chặng về những câu khẳng định về việc “Ta không chỉ giới hạn trong cơ thể này. Ta lớn lao hơn những gì ta nghĩ về mình rất nhiều”.\nNhững điều kỳ diệu sẽ được nhìn thấy khi có ánh sáng.\nĐiều này có nghĩa là:\nKhi bạn trở nên tỉnh thức – trong sự sáng rõ, nhẹ nhàng, và buông xả, bạn sẽ nhìn ra những điều kỳ diệu vốn luôn hiện hữu xung quanh mình.\nTâm trí chúng ta thường mang tâm phân biệt TỐT XẤU. Nên nó tin rằng điều kỳ diệu cứ phải điều gì đó lớn lao, to tát hay mang tính bước ngoặt hoặc là khi mình đạt được 1 điều bất ngờ ĐÚNG Ý đó mới là kỳ diệu. ^^\nKhông phải nhé các bạn. Một bông hoa nở: vốn dĩ đã là một chuỗi hành trình điều kỳ diệu. Một hơi thở của bạn thôi: vốn dĩ cũng là 1 điều kỳ diệu rồi.\nVà khi tâm ta vẫn còn chưa thoát khỏi Nhị Nguyên phân biệt thì ta vẫn chưa “cho phép ánh sát tràn vào”. Ta sẽ ít thấy những điều kỳ diệu.\nCâu khẳng định này như một lời nhắc nhở và mời gọi chính ta hãy chú tâm để nhìn thấy điều kỳ diệu trong từng khoảnh khắc nhỏ. Đó là minh chứng cho việc có những khoảnh khắc ánh sáng đã rọi vào tâm ta. Bởi vì: Ta đã thấy điều kỳ diệu mà, đúng không? Trong khi: Những điều kỳ diệu sẽ được nhìn thấy khi có ánh sáng.\nVậy nghĩa là: Ta đã có ánh sáng bên trong rồi.\nHướng dẫn thực hành:\nDành ra 3 lần 10 phút trong ngày để ngồi tĩnh lặng. Trong lúc tĩnh lặng đó, bạn hãy tự nhủ:\n“Tôi không chỉ giới hạn trong cơ thể này, tôi lớn lao hơn thế.\nTôi là một phần của Đấng sáng tạo và đồng sáng tạo nên thế giới này.\nTôi không yếu đuối, tôi đầy quyền năng.\nTôi không bị giới hạn, tôi là vô hạn.\nTôi không nghi ngờ, tôi chắc chắn.\nTôi không phải là một ảo ảnh, tôi là sự thật.\nTôi không ở trong bóng tối, tôi là ánh sáng.”\nLặp lại chậm rãi trong 10 phút và cảm nhận.\nTrong ngày, tthường xuyên lặp lại câu: “Điều kỳ điệu được nhìn thấy khi có ánh sáng, nguyện cho tôi không nhắm mắt trước những điều kỳ diệu.”"}, {"n": 92, "t": "Điều kỳ diệu sẽ được nhìn thấy khi có ánh sáng. Và ánh sáng với sức mạnh là một", "s": "", "d": "“Miracles are seen in light, and light and strength are one.”\nDiễn giải: Vì sao “Ánh sáng và Sức mạnh là Một”?\n1. Ánh sáng là biểu tượng của sự thật, mà sự thật là mạnh mẽ\nTrong  A Course in Miracles, “ánh sáng” không chỉ là ánh sáng vật lý mà bạn thấy bằng mắt.\nMà “ánh sáng” ở đây là: ánh sáng của nhận thức đúng, ánh sáng của sự thức tỉnh tinh thần, ánh sáng của sự thật, của Tình Yêu và Thượng Đế\nVà sự thật thì hiển nhiên và mạnh mẽ.\nGiống như ánh mặt trời, mặt trời không cần hét to “Tôi là mặt trời!” mà Mặt trời cứ tự nhiên toả sáng thôi\n2. Chỉ khi bạn ở trong ánh sáng, bạn mới mạnh mẽ thật sự\nKhi bạn ở trong bóng tối (vô minh, sợ hãi, chia cách), bạn:\ndễ bị tổn thương; dễ yếu lòng, lo lắng; dễ phản ứng thay vì chủ động lựa chọn\nKhi ấy, bạn tưởng rằng mình mạnh mẽ, nhưng thực chất đang bị kéo đi bởi những điều bên ngoài.\nChỉ khi bạn bước vào ánh sáng, tức là trở về với cái biết đúng, cái thấy rõ, với tình yêu vô điều kiện thì: bạn bình an vững vàng và bạn có sức mạnh thật sự để chữa lành, tha thứ, yêu thương, tạo ra điều tốt lành\nĐó là sức mạnh của ánh sáng nội tâm vốn có của bạn\n3. Ánh sáng và sức mạnh là một vì ánh sáng luôn đến từ nguồn mạnh mẽ nhất: Thượng Đế\nBạn không thể có ánh sáng thật sự mà thiếu niềm tin vào Thượng Đế vì ánh sáng tinh thần chính là Ngài.\nVà bạn cũng không thể có sức mạnh thực sự nếu cắt lìa khỏi nguồn sức mạnh ấy.\nNên khi bạn nhận ra ánh sáng đang ở trong bạn, là ta đang kết nối với Nguồn.\nVà khi bạn nhớ mình không phải cái thân thể giới hạn này, mà là một phần của Nguồn thì mọi sức mạnh bạn cần đã sẵn có trong bạn rồi."}, {"n": 93, "t": "Ánh sáng, niềm vui và bình an ngụ tại nơi tôi.", "s": "", "d": "“Light and joy and peace abide in me.”\nDiễn giải: Đây là giai đoạn thực hành khẳng định những sự thật hiển nhiên. Nên vẫn là những câu khẳng định nhé.\nBài học này đến để gỡ bỏ những niềm tin sai lầm sâu sắc nhất mà ta từng mang theo:\n- Rằng ta yếu kém\n- Rằng ta đầy mặt tối, thiếu sót, tội lỗi…\n- Rằng nếu ai đó biết “con người thật” của mình, họ sẽ bỏ chạy.\nNhưng đó chỉ là con người do bản ngã chúng ta tạo ra, đó không phải chúng ta thực sự.\nVà Thượng Đế không bao giờ nhìn thấy ta như vậy.\nThượng Đế nhìn thấy ánh sáng, niềm vui, bình an trong ta vì Ngài đã đặt những điều đó trong ta từ khi ta được tạo ra.\nVà ta không cần làm gì để xứng đáng với điều đó. Chỉ cần buông bỏ những hình ảnh méo mó về chính mình, và trở về với sự thật.\nTừ nay chỉ cần đặt tay lên ngực là chạm ngay vào trung tâm ánh sáng của chính mình nhé các nàng"}, {"n": 94, "t": "Tôi vẫn là thế, như khi Đấng sáng tạo sinh ra tôi.", "s": "I am as God created me.", "d": "Có thể bạn từng tin rằng mình thật tệ…\nRằng nếu ai đó nhìn thấy “con người thật” của bạn, họ sẽ rời bỏ bạn.\nBạn từng nghĩ mình đã làm sai quá nhiều thứ để có thể được yêu thương trở lại.\nNhưng hôm nay, bạn được nhắc lại một sự thật không thể thay đổi:\nBạn là như Đấng Sáng Tạo đã tạo ra bạn.\nVà Ngài không hề mắc sai lầm.\nDù bạn từng vấp ngã, từng tin vào những điều sai lạc về chính mình,\ndù bạn từng sống dưới bóng của mặc cảm, sợ hãi, tội lỗi…\nthì ánh sáng nguyên vẹn trong bạn: The Self vẫn luôn ở đó:\nthuần khiết, mạnh mẽ, yêu thương và vĩnh cửu\nSo sánh hình ảnh dễ hiểu hơn nhé\nHãy hình dung:\nMột chiếc gương bị bám đầy bụi.\nBạn không còn thấy khuôn mặt mình trong đó.\nBạn nghĩ mình đã biến mất, đã xấu xí, đã không còn là mình nữa.\nNhưng thật ra, bạn chỉ cần lau lớp bụi đi, ánh sáng và hình ảnh chân thật vẫn còn nguyên vẹn bên dưới.\nBài học hôm nay chính là động tác lau bụi ấy!\nHướng dẫn thực hành\n1. Mỗi giờ, hãy dành ít nhất 1 phút (hoặc nếu được: 5 phút đầu mỗi giờ) để:\n • Nhắm mắt lại.\n • Hít thở thư giãn\n • Và nói trong thầm lặng với sự tin tưởng:\nTôi vốn dĩ luôn là thế, như khi Đấng Sáng Tạo tạo nên tôi.\nTôi là Con của Ngài, đời đời.\n2. Khi có ai đó khiến bạn khó chịu, hãy nghĩ thầm trong lòng:\nBạn vẫn là thế, như khi Đấng Sáng Tạo tạo nên bạn.\nBạn cũng là Con của Ngài, đời đời.\n3. Nếu bạn cảm thấy khó tin điều này, cũng không sao cả.\nChỉ cần lặng lẽ đặt tay lên tim, và nói:\n“Xin cho con được cảm nhận điều này.\nCon mở lòng để nhớ lại mình là ai.”\nNhớ rằng\n • Bạn không cần phải “trở nên xứng đáng”.\n • Bạn vốn dĩ đã luôn xứng đáng, vì bạn được tạo ra từ Tình Yêu và Ánh Sáng.\n • Không điều gì bạn từng làm có thể xóa đi điều đó.\nÁnh sáng, niềm vui, bình an luôn có sẵn trong bạn.\nBạn chỉ cần nhớ lại điều này"}, {"n": 95, "t": "Tôi là Nhất Thể, tôi hợp nhất cùng Đấng Sáng Tạo.", "s": "", "d": "“I am One Self, united with my Creator.”\nDiễn giải: Hôm nay chúng ta lại tiếp tục chuỗi câu khẳng định ta là Một với Đấng sáng tạo và luôn có một sự kết nối với tất cả vũ trụ này, mọi sinh linh, mọi tinh thần, mọi cấu trúc, mọi khía cạnh… Đúng vậy, ta không chỉ là cơ thể này, mà ta là tất cả.\nTrong sự kiên nhẫn và niềm tin, hôm nay ta lại thử lần nữa. Chỉ đơn giản là khẳng định. Không cần hiểu hết, không cần cảm thấy được.\nTheo ACIM, bài tập này không chỉ mang lại lợi lạc cho bạn, chính lời nguyện hợp nhất đến từ mỗi người sẽ mang lại bình an cho cả thế giới. Khi thực hành, dù bạn đã cảm nhận được hay chưa, đã ở mức độ mà bạn thấy hài lòng hay chưa, đừng quên bao dung với chính mình nhé.\nHướng dẫn thực hành:\n1. Mỗi giờ, hãy dành ít nhất 1 phút (hoặc nếu được: 5 phút đầu mỗi giờ) để:\n• Nhắm mắt lại.\n• Thở nhẹ.\n• Và nói trong thầm lặng với sự tin tưởng:\n“Tôi là Nhất thể, tôi hợp nhất với Đấng Sáng Tạo.”\n2. Phiên bản dài hơn bạn có thể sử dụng: “Tôi là Nhất thể, tôi hợp nhất với Đấng sáng tạo. Tôi là Một với mọi khía cạnh của tạo hoá, và vô hạn trong quyền năng cùng sự bình an.”\n3. Bạn cũng có thể hướng tới người khác và tự nhủ: “Bạn với tôi là Một, cùng hợp nhất với Đấng sáng tạo trong bản thể này. Tôi trân trọng bạn như trân trọng chính tôi và trân trọng Đấng sáng tạo - Người yêu cả tôi và bạn như Một.”"}, {"n": 96, "t": "Sự cứu rỗi đến từ Nhất thể.", "s": "", "d": "“Salvation comes from my One Self.”\nDiễn giải:\nThế giới chúng ta đang thấy là một thế giới Nhị nguyên, mọi thứ luôn tồn tại 2 mặt đối lập: tốt-xấu, đúng-sai, thiện-ác, âm-dương… vì vậy mà nó sẽ luôn luôn và mãi mãi có xung đột.\nKhi bạn hoà vào Nhất thể, bạn đứng trên Nhị nguyên, đứng trên mọi xung đột đó. Nếu bạn không hoà vào Nhất thể, bạn không thể thoát khỏi những cái vòng luẩn quẩn của xung đột trong và ngoài nội tâm của bạn. Hoà vào Nhất thể là con đường duy nhất để chúng ta được cứu rỗi, được thoát khổ.\nHướng dẫn thực hành:\nHôm nay, mỗi tiếng dành ra 5 phút để khẳng định điều này:\n“Sự cứu rỗi đến từ Nhất thể.\nTôi là Một với tất cả.\nTôi là Một với [vật hay người cụ thể, cả người bạn thích hay không].”\nVí dụ:\nSự cứu rỗi đến từ Nhất thể.\nTôi là Một với tất cả.\nTôi là Một với cái cây này.\nTôi là Một với bầu trời này.\nTôi là Một với người A.\nTôi là Một với người B.\nViệc thực hành của bạn mang phúc lành đến cả thế giới.\nNhớ rằng: Bạn không cần gồng mình để “trở thành” gì cả.\nBạn chỉ cần nhớ lại bạn là ai.\nÁnh sáng và sự kết nối với Thượng Đế chưa từng rời khỏi bạn – chỉ là bạn đã tạm quên.\nChúc bạn hôm nay bình an quay về,\nvà lan tỏa ánh sáng ấy như một lời mời dịu dàng đến cả thế giới.\nGợi ý thực hành:\nTôi là một với Bạn A. Điều đó thật kỳ diệu và thiêng liêng. Tôi cảm nhận được dòng chảy linh thiêng khi là một với tất cả mọi thứ ngay trước mắt tôi và là một với tất cả những gì xuất hiện trong suy nghĩ tôi lúc này."}, {"n": 97, "t": "Tôi là Thần Trí Thiêng Liêng.", "s": "free of all limits, safe and healed and whole,", "d": "“I am Spirit.”\nDiễn giải: Có thể dịch Spirit = Thần trí thiêng liêng/ Linh hồn/ Tâm hồn (hãy dùng từ bạn cảm thấy chạm). Điều này có nghĩa là:\nTa không chỉ là thân xác này, không giới hạn trong hình hài, tên tuổi, quá khứ ta đã làm gì hay hoàn cảnh ta đang thế nào. Mà về bản chất ta là một phân mảnh linh hồn của Thượng Đế đang trải nghiệm cuộc đời của một cô [...tên bạn], Ta thực ra là một “thần trí thiêng liêng” đang ngụ tại nơi thân xác này.\nBản chất thật của ta là Thượng Đế, là ánh sáng, là bình an, là tình yêu.\nBình thường, ta thường tin rằng: “Tôi là một con người có đầy vấn đề, phải cố gắng để tốt hơn, được yêu hơn, xứng đáng hơn.”\nNhưng khi ta nhớ mình là Linh hồn là Thần trí thiêng liêng, ta không cần cố gắng để trở nên xứng đáng, vì ta đã là xứng đáng rồi. Ta không cần chứng minh, ta chỉ cần nhớ lại mình là ai.\nKhi sống như một Linh hồn, ta sẽ cảm thấy:\nNhẹ nhàng, tự do như được buông bỏ gánh nặng “phải trở thành”.\nBình an sâu thẳm dù hoàn cảnh xung quanh có thế nào.\nTình yêu thương tự nhiên tuôn chảy không phán xét, không sợ hãi. Một cảm giác vững vàng, như được bao bọc bởi điều gì đó rất lớn, rất thật, và rất an toàn.\nHãy nhớ:\nBạn không cần trở nên gì cả.\nBạn chỉ cần nhớ lại mình là ai.\nBạn là Linh hồn ánh sáng thuần khiết của Đấng Sáng Tạo.\nBạn không bị \"giam giữ\" trong lỗi lầm, nỗi đau hay giới hạn nào cả.\nBạn được tự do và ánh sáng của bạn đang chờ được chiếu ra.\nChữa lành không đến từ nỗ lực, mà đến từ sự cho phép từ bạn.\nHôm nay, hãy cho phép ánh sáng bên trong bạn được dẫn đường.\nVà khi bạn nhớ mình là ai, cả thế giới sẽ được chiếu sáng theo.\n3. Hướng dẫn thực hành đơn giản\nSáng, Trưa, Chiều, Tối:\nDành 5 phút mỗi giờ (hoặc ít nhất vài lần mỗi ngày).\nNhắm mắt, hít sâu, và thầm nhủ:\n“Spirit am I a holy Daugter of God,\nfree to forgive, and free to save the world.”\n(Tôi là Linh hồn, Thánh Tử của Thượng Đế, tự do không giới hạn, được chữa lành, vốn dĩ trọn vẹn, và tự do bao dung, chữa lành thế giới.)\nCảm nhận: Một làn sáng màu vàng nhẹ lan tỏa trong tim bạn, bao trùm khắp thân thể, rồi lan sang thế giới.\nHình dung bạn là một “điểm ánh sáng” nối với hàng triệu linh hồn tuyệt đẹp khác trong Nhất Thể.\nTrong ngày:\nKhi lo âu, giận dữ, mệt mỏi… hãy lặp lại:\n“Tôi là Thần trí thiêng liêng. Tôi được tự do và được chữa lành.”\nNote: Các bài tập dạng tự khẳng định (affirmation) thế này. Đôi khi tâm trí có thể sẽ lên tiếng nhiều hơn, nghi ngờ và phản kháng nhiều hơn. Hãy kiên định thực hành mọi người nhé!\nGiống như Pam Grout đã nói “Tôi không cần phải hiểu nó (ACIM). Tôi thậm chí không cần phải thích nội dung của nó. Tôi chỉ thực hành, phần còn lại Đấng sáng tạo sẽ lo nốt.”"}, {"n": 98, "t": "Tôi sẽ đón nhận vai trò của mình trong Kế hoạch cứu rỗi của Thượng Đế.", "s": "", "d": "“I will accept my part in God’s plan for salvation”\nDiễn giải:\nCâu khẳng định này giống như một lời cam kết nhẹ nhàng nhưng đầy sức mạnh:\n“Tôi không lang thang nữa. Tôi chọn trở về đúng vai trò mà Thượng Đế đã giao cho tôi trong bức tranh lớn của Tình yêu và Bình an.”\nBạn không cần biết chi tiết kế hoạch đó là gì.\nChỉ cần tin rằng: Bạn có một vị trí không ai thay thế được trong bản giao hưởng mà Đấng Sáng Tạo đang viết nên.\nHãy hình dung:\nCả vũ trụ là một bản nhạc thiêng liêng.\nVà bạn chính là một nốt nhạc độc nhất.\nNếu bạn không cất tiếng, bản nhạc sẽ thiếu trọn vẹn.\nChấp nhận phần của mình không có nghĩa là “phải làm điều gì lớn lao”, mà chỉ đơn giản là:\nBạn sẵn sàng hiện diện với tình yêu, lắng nghe tiếng gọi bên trong, và để cho mình được sử dụng như một khí cụ yêu thương.\nHướng dẫn thực hành:\nMỗi giờ, dành 5 phút thật trọn vẹn. Bắt đầu bằng câu khẳng định:\n“I will accept my part in God’s plan for salvation.”\n(Tôi sẽ đón nhận vai trò của mình trong Kế hoạch cứu rỗi của Thượng Đế.)\n • Nhắm mắt lại.\n • Buông hết mọi việc đang làm, mọi suy nghĩ đang có.\n • Hãy nói với Thượng Đế bằng lòng biết ơn:\n“Con sẵn sàng. Con đón nhận vai trò của mình. Con không cần biết trước điều gì. Chỉ cần biết Ngài đang đi cùng con.”\nGiữa các giờ, hãy lặp lại câu khẳng định này thường xuyên.\nMỗi lần nhắc lại là một lần bạn kết nối lại với nhiệm vụ thiêng liêng của mình: điều đã được an bài từ trước khi bạn đến với thế giới này."}, {"n": 99, "t": "Sự cứu rỗi là chức năng duy nhất của tôi tại nơi đây.", "s": "Salvation is my only function here\":", "d": "Diễn giải:\nỞ bài 62, mình đã từng học rằng:\n“Tha thứ là chức năng của tôi vì tôi là ánh sáng của thế giới.”\nTới bài này, mình hiểu thêm một lớp sâu sắc hơn:\n“Sự cứu rỗi (thoát khổ) và sự tha thứ thực chất là một.”\nNghĩa là gì?\nKhi mình thấy đau khổ, tổn thương, hay thấy bản thân hoặc người khác “đã sai”\n, tức là mình đang tin rằng có điều gì đó đã đi lệch khỏi Ý chí của Đấng Sáng Tạo. Có cái gì đó sai, cần phải được sửa chữa.\nNhưng thực ra không có gì sai cả.\nSự thật vẫn nguyên vẹn. Chỉ là tâm trí mình đã tạo ra một giấc mơ chia cắt, rồi tự tin rằng nó là thật. Mình thấy lỗi, thấy đau, thấy sợ, và tin rằng mình phải trốn tránh, chịu phạt, hoặc tìm cách sửa sai.\nCứu rỗi không phải là “được tha thứ vì đã làm sai”, mà là sự tỉnh thức khỏi giấc mơ sai lầm đó. Tha thứ chính là nhìn lại mọi thứ
